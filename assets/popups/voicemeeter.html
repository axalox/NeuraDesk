<!doctype html>
<!--
  win32::cef_voicemeeter (icône Voicemeeter) — reproduit en CSS le contenu
  de win32::popup_menu::render_voicemeeter : gain/mute par strip d'entrée
  et par bus de sortie, assignation de bus par strip, masquage de canal.

  C'est le popup qui a motivé toute cette migration : la table à 5 colonnes
  alignées (libellé/curseur/mute/assignation de bus/masquer) souffrait de
  plusieurs bugs RÉELS d'`egui_extras::TableBuilder` documentés en détail
  dans win32::popup_menu.rs (Column::auto qui ne grandit jamais,
  Column::remainder qui ne se recalcule qu'à la création...). CSS Grid
  (voir .table ci-dessous) aligne les colonnes nativement, sans aucun des
  contournements que la version egui a dû accumuler.

  Rust pousse `window.setState({installed, running, strips, buses})` (voir
  win32::cef_voicemeeter::push_state) À CHAQUE FRAME tant que ce popup est
  visible (pas seulement à l'ouverture, contrairement à network.html/
  sound.html) : l'état Voicemeeter peut changer depuis Voicemeeter lui-même
  ou une autre application connectée à son API, pas seulement depuis ce
  popup — même garantie que la version egui d'origine.

  Canal JS→Rust : `neuradesk://voicemeeter/<segments>` (voir `go()` plus
  bas), même mécanisme que les autres popups.

  PAS de `background` sur `<html>`/`<body>` : transparent par défaut en
  rendu hors-écran CEF.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<script src="menu_contextuel.js"></script>
<link rel="stylesheet" href="menu.css">
<style>
  .menu {
    padding: 14px;
    box-sizing: border-box;
    height: auto;
    width: fit-content;
    max-width: 100vw;
    max-height: 100vh;
    overflow-y: auto;
  }
  .message {
    opacity: calc(0.85 * max(1, var(--popup-alpha, 1)));
  }
  button.launch {
    all: unset;
    display: block;
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: var(--nd-rayon-surface);
    cursor: pointer;
    text-align: center;
    /* 0.12 → 0.18 → 0.28 → 0.4 — voir assets/popups/clipboard_menu.html,
       `.row:hover`, pour le pourquoi. Contrairement aux survols, ce fond
       reste affiché EN PERMANENCE (pas seulement sous le curseur) tant que
       Voicemeeter n'est pas lancé — DEMANDE EXPLICITE de suite ("le fond de
       certains éléments ne sont pas assez contrastés") : 0.28 le rendait
       trop proche d'un simple survol au repos. */
    background: rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.4 * var(--popup-fond-alpha, 1)));
  }
  button.launch:hover {
    /* +0.10, même bump que `.icon-button:hover` ci-dessous — garder l'écart
       avec le fond au repos (0.28) nettement plus marqué. */
    background: rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.52 * var(--popup-fond-alpha, 1)));
  }
  .table {
    display: grid;
    grid-template-columns: minmax(70px, auto) 1fr auto auto auto;
    column-gap: 10px;
    row-gap: 4px;
    align-items: center;
  }
  .section-title {
    grid-column: 1 / -1;
    font-weight: 600;
    opacity: calc(0.9 * max(1, var(--popup-alpha, 1)));
    margin-top: 6px;
  }
  .separator {
    grid-column: 1 / -1;
    border: none;
    /* 0.2 → 0.3 — même demande de contraste que ci-dessus : un séparateur à
       0.2 se distinguait à peine du fond flouté. */
    border-top: 1px solid rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.3 * var(--popup-fond-alpha, 1)));
    margin: 6px 0;
  }
  .label {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
  }
  .gain-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .gain-row input[type="range"] {
    flex: 1;
    min-width: 60px;
    /* Aplat plein (pas un survol/fond translucide) — voir menu.css,
       `--menu-accent-rgb`. */
    accent-color: rgba(var(--menu-accent-rgb, 255, 255, 255), calc(0.85 * var(--popup-fond-alpha, 1)));
  }
  .gain-value {
    min-width: 60px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    opacity: calc(0.9 * max(1, var(--popup-alpha, 1)));
  }
  .icon-button {
    all: unset;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: var(--nd-rayon-controle);
    text-align: center;
  }
  .icon-button:hover {
    /* 0.15 → 0.26 → 0.36 → 0.46 — même raison, voir assets/popups/
       clipboard_menu.html, `.row:hover`. */
    background: rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.46 * var(--popup-fond-alpha, 1)));
  }
  .bus-assignments {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
  }
  .bus-toggle {
    all: unset;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: var(--nd-rayon-controle);
    font-size: 12px;
    /* 0.3 → 0.4 — même demande de contraste que `.separator` ci-dessus. */
    border: 1px solid rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.4 * var(--popup-fond-alpha, 1)));
  }
  .bus-toggle.active {
    /* `--bus-toggle-color` était un point d'extension prévu mais JAMAIS
       poussé depuis Rust ni JS (grep du dépôt) — trace directe de ce même
       manque de câblage. Remplacé par `--menu-active-rgb` (voir menu.css) :
       même rôle "sélectionné" que `.volumes button.active` de sound.html.
       0.35 → 0.45 → 0.58, même raison que les survols ci-dessus (DEMANDE
       EXPLICITE, répétée après le premier passage à 0.45 encore jugé
       insuffisant). */
    background: rgba(var(--menu-active-rgb, 255, 255, 255), calc(0.58 * var(--popup-fond-alpha, 1)));
    border-color: transparent;
  }
  details {
    margin-top: 10px;
  }
  summary {
    cursor: pointer;
    opacity: calc(0.85 * max(1, var(--popup-alpha, 1)));
  }
  .hidden-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3px 0;
  }
</style>
</head>
<body>
  <div class="menu" id="menu"></div>
  <script>
    function go(...segments) {
      location.href = "neuradesk://voicemeeter/" + segments.map(encodeURIComponent).join("/");
    }

    function el(tag, attrs, children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs || {})) {
        if (key === "class") node.className = value;
        else if (key === "style") node.style.cssText = value;
        // ⛔ **TOUT `on…` PASSE PAR `addEventListener`.** Ce helper ne traitait que
        // `onclick`, et renvoyait tout le reste à `setAttribute` — donc
        // `onchange: (e) => …` devenait une CHAÎNE jamais exécutée. Corrigé ici AVANT
        // d'en avoir besoin : ce défaut a frappé deux fois le 2026-09-24 (`notes.html`,
        // puis `settings.html` où il a tué les deux sélecteurs de son des rappels), et
        // chaque fois parce que le correctif avait été appliqué LÀ OÙ IL S'ÉTAIT
        // MANIFESTÉ, pas à la classe.
        else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
        else node.setAttribute(key, value);
      }
      for (const child of children || []) {
        node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
      }
      return node;
    }

    function formatGain(db) {
      return db.toFixed(2) + " dB";
    }

    // Une ligne de la table (strip OU bus, voir win32::popup_menu::
    // render_voicemeeter_row) — `busAssignments` vide pour un bus (même
    // convention que côté Rust).
    // `data-kind`/`data-index` (et `data-strip`/`data-bus` pour les cases
    // d'assignation) sur chaque élément dynamique — voir `updateValues` :
    // le seul moyen de retrouver CET élément précis pour un rafraîchissement
    // EN PLACE (pas de reconstruction du DOM), sans quoi glisser un curseur
    // pendant qu'un `setState` arrive (voir la doc d'en-tête de
    // `window.setState`, jusqu'à 60 fois/seconde tant que le popup est
    // visible) le remplacerait par un ÉLÉMENT DIFFÉRENT en plein
    // glissement — un `<input type="range">` natif perd la capture souris
    // dès que le nœud DOM sous le curseur est retiré, interrompant le
    // glissement au milieu du geste.
    function channelRow(kind, row) {
      const cells = [];
      cells.push(el("div", { class: "label" }, [row.label]));

      const slider = el("input", {
        type: "range", min: "-60", max: "12", step: "0.1", value: String(row.gain),
        "data-kind": kind, "data-index": String(row.index),
      });
      const value = el("span", { class: "gain-value", "data-kind": kind, "data-index": String(row.index) }, [
        formatGain(row.gain),
      ]);
      slider.addEventListener("input", () => {
        value.textContent = formatGain(parseFloat(slider.value));
        go(kind, row.index, "gain", slider.value);
      });
      cells.push(el("div", { class: "gain-row" }, [slider, value]));

      cells.push(
        el(
          "button",
          { class: "icon-button mute-btn", "data-kind": kind, "data-index": String(row.index), onclick: () => go(kind, row.index, "mute") },
          [el("span", { class: "ico ico-" + (row.muted ? "speaker-slash" : "speaker-high") })],
        ),
      );

      const busCell = el("div", { class: "bus-assignments" });
      for (const [busName, active] of row.busAssignments || []) {
        busCell.appendChild(
          el(
            "button",
            {
              class: "bus-toggle" + (active ? " active" : ""),
              "data-strip": String(row.index),
              "data-bus": busName,
              onclick: () => go(kind, row.index, "bus", busName),
            },
            [busName],
          ),
        );
      }
      cells.push(busCell);

      cells.push(
        el("button", { class: "icon-button", title: "Masquer ce canal", onclick: () => go(kind, row.index, "hidden") }, [
          "🙈",
        ]),
      );

      return cells;
    }

    // Identité de la STRUCTURE affichée (quels canaux visibles/masqués, pas
    // leurs valeurs) — voir `render`/`updateValues` : reconstruire le DOM
    // seulement quand cette clé change (un canal apparaît/disparaît/passe
    // masqué), jamais pour une simple variation de gain — voir la doc de
    // `channelRow` sur pourquoi une reconstruction pendant un glissement
    // casserait le geste en cours.
    function structureKey(state) {
      if (!state.installed) return "not-installed";
      if (!state.running) return "not-running";
      const ids = (rows, hidden) => rows.filter((r) => r.hidden === hidden).map((r) => r.index).join(",");
      return [
        "strips:", ids(state.strips, false),
        "|buses:", ids(state.buses, false),
        "|hstrips:", ids(state.strips, true),
        "|hbuses:", ids(state.buses, true),
      ].join("");
    }

    // Rafraîchit les valeurs EN PLACE (gain/mute/assignations de bus) sans
    // toucher au DOM lui-même — voir `render`, appelée quand la structure
    // n'a PAS changé depuis le dernier `setState`. Un curseur de gain avec
    // le focus (l'utilisateur est en train de le glisser) n'est JAMAIS
    // réécrit : la valeur qu'il envoie déjà lui-même via `input` (voir
    // `channelRow`) prime sur l'écho, encore possiblement en retard d'une
    // frame ou deux, que Rust renvoie.
    function updateValues(state) {
      for (const [kind, rows] of [["strip", state.strips], ["bus", state.buses]]) {
        for (const row of rows) {
          if (row.hidden) continue;
          const slider = document.querySelector(`input[data-kind="${kind}"][data-index="${row.index}"]`);
          if (slider && document.activeElement !== slider) {
            slider.value = String(row.gain);
          }
          const valueEl = document.querySelector(`.gain-value[data-kind="${kind}"][data-index="${row.index}"]`);
          if (valueEl) valueEl.textContent = formatGain(row.gain);
          const muteBtn = document.querySelector(`.mute-btn[data-kind="${kind}"][data-index="${row.index}"]`);
          if (muteBtn) muteBtn.innerHTML = row.muted ? '<span class="ico ico-speaker-slash"></span>' : '<span class="ico ico-speaker-high"></span>';
          for (const [busName, active] of row.busAssignments || []) {
            const busBtn = document.querySelector(`.bus-toggle[data-strip="${row.index}"][data-bus="${busName}"]`);
            if (busBtn) busBtn.classList.toggle("active", active);
          }
        }
      }
    }

    let lastStructureKey = null;

    function render(state) {
      const key = structureKey(state);
      if (key === lastStructureKey) {
        updateValues(state);
        return;
      }
      lastStructureKey = key;
      rebuild(state);
    }

    function rebuild(state) {
      const menu = document.getElementById("menu");
      menu.replaceChildren();

      if (!state.installed) {
        menu.appendChild(el("div", { class: "message" }, ["Voicemeeter n'est pas installé sur cette machine."]));
        return;
      }
      if (!state.running) {
        menu.appendChild(el("div", { class: "message" }, ["Voicemeeter est installé mais n'est pas lancé."]));
        menu.appendChild(el("button", { class: "launch", onclick: () => go("launch") }, ["Lancer Voicemeeter"]));
        return;
      }

      const table = el("div", { class: "table" });
      const visibleStrips = state.strips.filter((r) => !r.hidden);
      const visibleBuses = state.buses.filter((r) => !r.hidden);

      table.appendChild(el("div", { class: "section-title" }, ["Entrées"]));
      for (const row of visibleStrips) {
        for (const cell of channelRow("strip", row)) table.appendChild(cell);
      }
      table.appendChild(el("hr", { class: "separator" }));
      table.appendChild(el("div", { class: "section-title" }, ["Sorties"]));
      for (const row of visibleBuses) {
        for (const cell of channelRow("bus", row)) table.appendChild(cell);
      }
      menu.appendChild(table);

      const hiddenStrips = state.strips.filter((r) => r.hidden);
      const hiddenBuses = state.buses.filter((r) => r.hidden);
      const hiddenCount = hiddenStrips.length + hiddenBuses.length;
      if (hiddenCount > 0) {
        const details = el("details", {});
        details.appendChild(el("summary", {}, [`Canaux masqués (${hiddenCount})`]));
        for (const row of hiddenStrips.concat(hiddenBuses)) {
          const kind = hiddenStrips.includes(row) ? "strip" : "bus";
          details.appendChild(
            el("div", { class: "hidden-row" }, [
              el("span", {}, [row.label]),
              el("button", { class: "icon-button", onclick: () => go(kind, row.index, "hidden") }, [el("span", { class: "ico ico-eye" }), " Afficher"]),
            ]),
          );
        }
        menu.appendChild(details);
      }
    }

    // Appelée depuis Rust (win32::cef_voicemeeter::push_state) À CHAQUE
    // FRAME tant que ce popup est visible — voir le commentaire d'en-tête.
    // `render` (voir sa doc) ne reconstruit le DOM QUE si la structure
    // affichée a changé ; sinon, `updateValues` met juste les nombres/états
    // à jour en place, sans jamais couper un glissement de curseur en
    // cours ni réinitialiser le défilement/"canaux masqués ouvert" à
    // chaque frame.
    window.setState = function (state) {
      render(state);
    };
  </script>
<script src="menu.js"></script>
</body>
</html>
