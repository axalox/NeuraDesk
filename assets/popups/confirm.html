<!doctype html>
<!--
  win32::cef_confirm — confirmation d'une action destructive (voir sa doc de
  module). Même famille que context.html (une liste de boutons), à deux
  différences près : un TITRE qui dit ce qu'on s'apprête à faire, et DEUX
  boutons dont un n'engage rien.

  DÉFAUT RÉEL QUI A MOTIVÉ CETTE FENÊTRE (voir ui::dock::Dock::add_spacer_at_end,
  doc) : un espace créé dans le vide d'une barre se pose EXACTEMENT là où on
  vient de cliquer, donc le Ctrl + clic droit suivant, au même endroit, le
  SUPPRIMAIT au lieu d'en créer un autre. L'utilisateur ne pouvait pas poser
  deux espaces côte à côte, et chaque aller-retour laissait derrière lui une
  entrée d'espace orpheline (remove_spacer ne retire que de l'ordre, jamais du
  vecteur d'icônes) — vingt et une s'étaient accumulées.

  Le texte affiché vient de Rust (`window.setState`, voir
  `win32::cef_confirm::push_state`) et les libellés des boutons sont
  GÉNÉRIQUES : c'est une confirmation RÉUTILISABLE, pas un dialogue écrit pour
  la suppression d'un espace. Le jour où une deuxième action destructive
  arrivera, elle n'aura qu'à appeler `ask`.

  Commandes envoyées : `neuradesk://confirm/yes` (l'action s'exécute) et
  `neuradesk://confirm/no` (elle est oubliée) — même canal JS→Rust que tous les
  autres popups (voir win32::cef_app::NeuraDeskRequestHandler).

  PAS de `background` sur `<html>`/`<body>` : transparent par défaut en rendu
  hors-écran CEF.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="menu.css">
<style>
  .menu {
    display: flex;
    flex-direction: column;
    padding: 12px;
    box-sizing: border-box;
    /* LA BOÎTE PREND LA HAUTEUR DE SON CONTENU — c'est ce qui rend la hauteur
       MESURABLE : en `height: 100vh`, elle vaut toujours la fenêtre, donc la page
       ne peut rien annoncer de plus court qu'elle, et le backend ne peut rien
       apprendre. Le `max-height` garde le défilement possible pour un contenu plus
       haut que l'écran, et SOUS ce plafond `scrollHeight` rend toujours la vraie
       hauteur de contenu. */
    height: auto;
    width: fit-content;
    max-width: 100vw;
    max-height: 100vh;
    /* Indispensable AVEC le `max-height` : sans lui, l'excédent serait rogné sans
       recours par `html, body { overflow: hidden }` — pire qu'un rail, et muet. */
    overflow-y: auto;
  }
  .title {
    /* Le TITRE dit ce qui va se passer — c'est lui qui distingue cette fenêtre
       d'un menu : sans lui, deux boutons ne veulent rien dire. */
    padding: 6px 14px 12px 14px;
    font-weight: 600;
    font-size: 15px;
    opacity: calc(0.9 * max(1, var(--popup-alpha, 1)));
  }
  button {
    all: unset;
    display: block;
    padding: 10px 14px;
    border-radius: var(--nd-rayon-surface);
    cursor: pointer;
    /* PAS de `color` ici : hérite de `menu.css` (`--menu-text-rgb`), même
       remarque que context.html. */
    font: inherit;
  }
  button:hover {
    /* Même valeur que context.html (0.46) — voir sa doc pour la suite de
       réglages qui y a mené. */
    background: rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.46 * var(--popup-fond-alpha, 1)));
  }
  /* L'action qui ENGAGE est distinguée de celle qui n'engage rien : c'est la
     seule information que la couleur ajoute ici, et elle compte — les deux
     boutons se ressemblent trop sans elle. */
  #yes {
    color: rgba(var(--menu-accent-solid-rgb, 255, 255, 255), 1);
    font-weight: 600;
  }
  #yes:hover {
    background: rgba(var(--menu-accent-solid-rgb, 255, 255, 255), calc(0.22 * var(--popup-fond-alpha, 1)));
  }
</style>
</head>
<body>
  <div class="menu">
    <div class="title" id="message">…</div>
    <button id="yes">Confirmer</button>
    <button id="no">Annuler</button>
  </div>
  <script>
    const message = document.getElementById("message");

    document.getElementById("yes").addEventListener("click", () => {
      location.href = "neuradesk://confirm/yes";
    });
    document.getElementById("no").addEventListener("click", () => {
      location.href = "neuradesk://confirm/no";
    });

    // La HAUTEUR de cette fenêtre est mesurée par `menu.js` (chargé plus bas) —
    // étape 0 du chantier, PROUVÉE sur cette page : « 143 px CSS, facteur=2.7000
    // -> cible 387 ».

    // Numéro d'ouverture DÉJÀ APPLIQUÉ — voir win32::cef_confirm, doc de
    // `OPEN_COUNT`, et spacer_size.html qui porte le même remède : Rust
    // repousse l'état à CHAQUE frame (nécessaire, la poussée faite à
    // l'ouverture pouvant arriver avant que ce <script> n'ait tourné), mais un
    // état ne s'applique qu'UNE fois par ouverture.
    let appliedOpen = null;

    window.setState = function (next) {
      if (next.open === appliedOpen) {
        return;
      }
      appliedOpen = next.open;
      if (typeof next.message === "string") {
        message.textContent = next.message;
      }
    };
  </script>
<script src="menu.js"></script>
</body>
</html>
