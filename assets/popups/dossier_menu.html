<!doctype html>
<!--
  win32::cef_dossier_menu (clic droit sur une vignette de dossier de la barre
  du bas) — changer la vignette, renommer, retirer.

  CE MENU REMPLACE le clic droit qui OUIVRAIT le dossier : ouvrir reste au clic
  gauche, qui le fait déjà, et c'est la convention du dépôt (tous les autres
  clics droits d'une icône du dock ouvrent un menu). Voir win32::cef_dossier_menu,
  doc de module.

  ⛔ **CE MENU EST LE PREMIER DU DÉPÔT À PORTER UN CHAMP DE SAISIE LIBRE**, et
  c'est ce qui a décidé sa forme. Les autres menus (`context.html`,
  `spacer_size.html`…) n'ont que des boutons, des cases et des curseurs. La
  question « PANNEAU ou MENU » (voir la mémoire du projet) ne se pose pourtant
  pas ici : cette page CHARGE `menu.js` — donc elle est mesurée, et un menu doit
  rester « muet » au sens où il ne doit pas changer sa TAILLE dans la même tâche
  qu'une émission. Taper dans un champ ne change NI le contenu NI la taille, et
  `change` n'arrive qu'au relâchement (Entrée ou clic ailleurs) : il n'y a donc
  aucune mesure fraîche à télescoper. C'est la même raison qui rend `bar_size.html`
  et `spacer_size.html` sûrs depuis un `<input>`.

  ⚠️ **`change` ET NON `input`** — renommer à chaque frappe ferait un
  enregistrement (et un `diag!`) par caractère tapé. Même règle que les zones et
  les dossiers des Réglages, juste au-dessus dans `settings.html`.

  ⛔ **UN CHAMP VIDÉ PASSE PAR UN VERBE SÉPARÉ** : `go(…)` joint les segments par
  `/` et `cef_app` retire le `/` final, donc un DERNIER segment vide DISPARAÎT —
  envoyer `renommer/` deviendrait `renommer`, qui ne correspond à AUCUN bras et
  échouerait EN SILENCE. C'est la règle documentée du dépôt (« jamais `""` en
  dernier segment »), et `cef_settings` a exactement la même paire de verbes.

  PAS de chemin dans les actions émises : `win32::cef_dossier_menu` retient
  CÔTÉ RUST pour quel dossier le menu est ouvert (fixé par `toggle`, exactement
  comme `cef_spacer_size` retient son index). Cette page ne connaît que ce
  qu'elle affiche — même garantie, et un chemin n'a pas à faire l'aller-retour.

  PAS de `background` sur `<html>`/`<body>` : transparent par défaut en rendu
  hors-écran CEF.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<!-- Le menu du clic droit DANS le champ de saisie (copier/coller/annuler) —
     c'est ce que `menu_contextuel.js` fournit gratuitement à tout `<input>`.
     Il ouvre SON menu ; celui du dock est une fenêtre Win32 à part, il n'y a
     donc aucun conflit. Voir `assets/popups/menu_contextuel.js`, doc d'en-tête. -->
<script src="menu_contextuel.js"></script>
<link rel="stylesheet" href="menu.css">
<style>
  .menu {
    display: flex;
    flex-direction: column;
    padding: 12px;
    box-sizing: border-box;
    height: auto;
    width: fit-content;
    max-width: 100vw;
    max-height: 100vh;
    /* Voir power.html — sans ça, un rail de défilement fantôme sur html/body. */
    overflow-y: auto;
  }
  .title {
    font-weight: 600;
    padding: 0 2px 2px;
  }
  /* Le chemin EN CLAIR sous le nom : c'est ce que l'utilisateur a épinglé, et
     le seul moyen de distinguer deux dossiers homonymes (même choix que la
     liste des Réglages, voir settings.html). Coupé plutôt qu'étalé — un chemin
     long élargirait tout le menu. */
  .hint {
    opacity: calc(0.6 * max(1, var(--popup-alpha, 1)));
    font-size: 12px;
    max-width: 340px;
    overflow-wrap: anywhere;
    padding: 0 2px 4px;
  }
  button {
    all: unset;
    display: block;
    padding: 10px 14px;
    border-radius: var(--nd-rayon-surface);
    cursor: pointer;
    /* PAS de `color` : hérite de `menu.css` (`--menu-text-rgb`, voir sa doc). */
    font: inherit;
  }
  button:hover {
    background: rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.46 * var(--popup-fond-alpha, 1)));
  }
  .separator {
    border: none;
    border-top: 1px solid rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.3 * var(--popup-fond-alpha, 1)));
    margin: 6px 0;
  }
  .champ {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 2px;
  }
  /* ⚠️ **PAS D'`opacity` SUR CES INTITULÉS, ET LA RAISON EST MESURÉE.** À 80 % sur
     le fond translucide du menu, un intitulé de section se lit comme du texte
     DÉSACTIVÉ — et c'est exactement ce qu'on a rapporté le jour où les deux
     galeries étaient vides : deux titres gris, sans rien dessous, dont on ne
     savait pas s'ils étaient grisés ou simplement vides. Un intitulé se
     distingue par sa GRAISSE, jamais par sa pâleur. */
  .champ span {
    font-weight: 600;
  }
  /* Le champ suit le style du menu (fond translucide, texte hérité) plutôt que
     l'apparence native de Windows, qui jurerait sur le fond flouté. */
  input[type="text"] {
    font: inherit;
    color: inherit;
    width: 260px;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.3 * var(--popup-fond-alpha, 1)));
    border-radius: var(--nd-rayon-surface);
    background: rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.08 * var(--popup-fond-alpha, 1)));
    outline: none;
  }
  input[type="text"]:focus {
    border-color: rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.6 * var(--popup-fond-alpha, 1)));
    background: rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.16 * var(--popup-fond-alpha, 1)));
  }
  /* LA GALERIE DES VIGNETTES PRÊTES — une tuile par catégorie, chacune portant
     SON glyphe et SA couleur (poussés par Rust, voir
     win32::cef_dossier_menu::push_state). Le glyphe est un CARACTÈRE de la police
     d'icônes, pas une image : la page n'a aucun accès au système de fichiers, et
     un point de code suffit là où dix fichiers seraient à embarquer. */
  .galerie {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 2px;
    max-width: 300px;
  }
  .tuile {
    all: unset;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: var(--nd-rayon-surface);
    background: rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.08 * var(--popup-fond-alpha, 1)));
    cursor: pointer;
    font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets";
    font-size: 24px;
    /* La couleur vient de Rust, une par catégorie (`style.color` dans le script). */
  }
  .tuile:hover {
    background: rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.26 * var(--popup-fond-alpha, 1)));
  }
  /* LA RANGÉE DE PASTILLES — la couleur qui REMPLACE celle des trois galeries.
     La pastille choisie porte un anneau (`aria-pressed`) : sans lui, rien ne
     dirait quelle teinte partira au prochain clic sur une tuile. */
  .pastilles {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 2px;
    max-width: 300px;
  }
  .pastille {
    all: unset;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    box-sizing: border-box;
    border: 1px solid rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.35 * var(--popup-fond-alpha, 1)));
  }
  /* « Couleur d'origine » : un disque barré, qui ne ressemble à aucune teinte. */
  .pastille.origine {
    background: linear-gradient(135deg, transparent 45%, #E5484D 45%, #E5484D 55%, transparent 55%);
  }
  .pastille[aria-pressed="true"] {
    outline: 2px solid rgb(var(--menu-text-rgb, 255, 255, 255));
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div class="menu" data-menu-root>
    <div class="title" id="titre"></div>
    <div class="hint" id="chemin"></div>
    <hr class="separator">
    <label class="champ">
      <span>Nom affiché</span>
      <input id="nom" type="text" placeholder="Nom du dossier" autocomplete="off" spellcheck="false">
    </label>
    <hr class="separator">
    <!-- LA TEINTE DES TROIS GALERIES CI-DESSOUS : elle reteint leurs aperçus, et
         part avec le clic sur une tuile (voir `ui::vignettes_dossiers::TEINTES`).
         Remplie par `setState`, comme les galeries. -->
    <div class="champ">
      <span>Couleur</span>
      <div class="pastilles" id="pastilles"></div>
    </div>
    <div class="champ">
      <span>Vignette prête</span>
      <!-- Remplie par `setState` — jamais gravée ici : la liste vit dans
           `ui::vignettes_dossiers::CATEGORIES`, et deux listes à tenir
           divergeraient à la première catégorie ajoutée d'un seul côté. -->
      <div class="galerie" id="galerie"></div>
    </div>
    <!-- UNE SECONDE RANGÉE, ET PAS LA MÊME MÊLÉE : « Dossier rouge » ne dit rien
         de ce que le dossier CONTIENT, là où « Musique » le dit. Ce sont deux
         questions différentes, donc deux groupes — et deux verbes, pour que le
         journal dise du premier coup d'œil quelle rangée a été cliquée. -->
    <div class="champ">
      <span>Dossier coloré</span>
      <div class="galerie" id="galerie-couleurs"></div>
    </div>
    <!-- UNE TROISIÈME RANGÉE, ET ELLE N'EST PAS FAITE DE GLYPHES : ces vignettes sont
         DESSINÉES par Rust (voir `ui::dessins_vignettes`), parce que la police
         d'icônes n'a ni serveur, ni base de données, ni conteneur — trois plages
         balayées en entier l'ont montré. La page reçoit leur DESCRIPTION et la
         reconstruit en SVG : un aperçu dessiné autrement montrerait autre chose que
         ce qu'il pose. -->
    <div class="champ">
      <span>Dessin</span>
      <div class="galerie" id="galerie-dessins"></div>
    </div>
    <button id="vignette">Changer la vignette…</button>
    <!-- DEUX FAÇONS DE DÉFAIRE UNE VIGNETTE, ET ELLES NE MÈNENT PAS AU MÊME
         ENDROIT — décision utilisateur : « les deux entrées ».
         · « Revenir à l'icône du dossier » RÉGÉNÈRE depuis le shell : c'est ce
           qu'un dossier fraîchement épinglé reçoit, donc on ne perd rien.
         · « Retirer la vignette » n'en met AUCUNE : la case montre le glyphe de
           dossier (ou l'initiale du nom). C'est le seul moyen d'obtenir ce rendu,
           et le seul qui ne se distingue pas d'une icône qui n'a pas pu se
           résoudre — d'où deux verbes plutôt qu'un. -->
    <button id="revenir">Revenir à l'icône du dossier</button>
    <button id="retirer-vignette">Retirer la vignette</button>
    <hr class="separator">
    <button id="retirer">Retirer de la barre</button>
  </div>
  <script>
    const titre = document.getElementById("titre");
    const cheminAffiche = document.getElementById("chemin");
    const nom = document.getElementById("nom");
    const vignette = document.getElementById("vignette");
    const retirer = document.getElementById("retirer");
    const revenir = document.getElementById("revenir");
    const retirerVignette = document.getElementById("retirer-vignette");
    const galerie = document.getElementById("galerie");
    const galerieCouleurs = document.getElementById("galerie-couleurs");
    const galerieDessins = document.getElementById("galerie-dessins");
    const pastilles = document.getElementById("pastilles");

    // LA TEINTE CHOISIE : un INDEX dans `next.teintes`, `null` = couleur
    // d'origine. Elle survit d'une ouverture à l'autre — c'est ce qui permet de
    // colorer plusieurs dossiers de la même teinte sans la rechoisir.
    let teinteChoisie = null;
    // Ce que la dernière ouverture a poussé : une pastille cliquée redessine les
    // galeries à partir de LUI, sans attendre de nouvel état.
    let etat = null;

    // Numéro d'ouverture DÉJÀ APPLIQUÉ, `null` au départ — voir
    // win32::cef_dossier_menu, doc de `OPEN_COUNT`, et spacer_size.html dont
    // ceci est la copie exacte.
    //
    // Rust repousse l'état à CHAQUE frame tant que ce menu est visible, et
    // c'est nécessaire : la poussée faite à l'ouverture peut arriver avant que
    // ce `<script>` n'ait tourné, et `window.setState` n'existe alors pas
    // encore. Mais un état ne s'applique qu'UNE fois par ouverture — le
    // réappliquer à chaque frame RÉÉCRIRAIT le champ que l'utilisateur est en
    // train de taper, en le ramenant au nom enregistré à chaque frappe. C'est
    // la règle du projet : « ne jamais réécrire ce que l'utilisateur règle à
    // la main ».
    let appliedOpen = null;

    window.setState = function (next) {
      if (next.open === appliedOpen) {
        return;
      }
      appliedOpen = next.open;
      titre.textContent = next.titre || "";
      cheminAffiche.textContent = next.chemin || "";
      // Le champ reçoit le nom AFFICHÉ — celui que l'utilisateur a donné s'il
      // y en a un, sinon celui du dossier (voir `nom_affiche`, côté Rust).
      nom.value = next.nom || "";
      etat = next;
      if (teinteChoisie !== null && teinteChoisie >= (next.teintes || []).length) {
        teinteChoisie = null;
      }
      rendreTout();
    };

    function rendreTout() {
      rendrePastilles(etat.teintes || []);
      rendreGalerie(galerie, etat.categories || [], VERBES.categorie);
      rendreGalerieBicolore(galerieCouleurs, etat.couleurs || [], etat.bicolore, VERBES.couleur);
      rendreGalerieDessins(galerieDessins, etat.dessins || [], VERBES.dessin);
    }

    // Une pastille cliquée REDESSINE les galeries, mais n'émet rien : la teinte
    // ne part qu'avec la tuile. Les tuiles recréées ne sont pas celles qu'on
    // vise à cet instant (on vise la pastille) — la leçon de `context.html` ne
    // s'applique donc pas.
    function rendrePastilles(teintes) {
      pastilles.replaceChildren();
      const origine = document.createElement("button");
      origine.className = "pastille origine";
      origine.title = "Couleur d'origine";
      origine.setAttribute("aria-pressed", String(teinteChoisie === null));
      origine.addEventListener("click", () => { teinteChoisie = null; rendreTout(); });
      pastilles.appendChild(origine);
      teintes.forEach((teinte, rang) => {
        const pastille = document.createElement("button");
        pastille.className = "pastille";
        pastille.title = teinte.nom;
        pastille.style.background = teinte.couleur;
        pastille.setAttribute("aria-pressed", String(teinteChoisie === rang));
        pastille.addEventListener("click", () => { teinteChoisie = rang; rendreTout(); });
        pastilles.appendChild(pastille);
      });
    }

    // LE MODÈLE TEL QU'IL SERA POSÉ — même règle que `vignettes_dossiers::teinte`
    // côté Rust : une teinte choisie est un APLAT, elle efface aussi le fondu.
    function teinte(modele) {
      if (teinteChoisie === null) return modele;
      return { ...modele, couleur: etat.teintes[teinteChoisie].couleur, degrade: null };
    }

    // ⚠️ **DEUX APPELS EXPLICITES** — même raison que pour `renommer` plus bas : un
    // dernier segment ne doit jamais être vide, et la teinte n'en ajoute un que
    // lorsqu'il y en a une.
    function poser(verbe, rang) {
      if (teinteChoisie === null) {
        go(verbe, String(rang));
      } else {
        go(verbe, String(rang), String(teinteChoisie));
      }
    }

    // LES TUILES SONT RECONSTRUITES UNE FOIS PAR OUVERTURE, jamais à chaque
    // poussée : `setState` est déjà gardé par `appliedOpen` (voir ci-dessus),
    // donc ceci ne tourne pas pendant que l'utilisateur vise. C'est la leçon de
    // `context.html`, où des boutons recréés entre `mousedown` et `mouseup`
    // avalaient le clic.
    //
    // `verbe` : la RANGÉE d'où vient le clic (« categorie » ou « couleur ») —
    // deux familles, deux verbes, pour que le journal dise laquelle a servi.
    function rendreGalerie(conteneur, modeles, verbe) {
      conteneur.replaceChildren();
      modeles.forEach((original, rang) => {
        const modele = teinte(original);
        const tuile = document.createElement("button");
        tuile.className = "tuile";
        tuile.title = modele.nom;
        // ⛔ **LE FONDU SE POSE SUR L'ENCRE, PAS SUR LA TUILE** — et c'est ce qui
        // oblige à un `<span>` : `background-clip: text` peint le glyphe avec un
        // dégradé, mais il lui faut le `background` de l'élément qui PORTE le texte.
        // Appliqué à la tuile elle-même, il mangerait aussi son fond de survol
        // (`.tuile:hover`), qui disparaîtrait — un détail qu'on ne voit qu'en
        // survolant, donc jamais pendant qu'on écrit le code.
        const encre = document.createElement("span");
        encre.textContent = String.fromCodePoint(modele.glyphe);
        if (modele.degrade) {
          // **LE MÊME FONDU QUE LA VIGNETTE RÉELLE** (voir
          // `vignettes_dossiers::rendre`, qui interpole du haut vers le bas) : une
          // tuile qui montrerait autre chose que ce qu'elle pose serait un aperçu
          // menteur.
          encre.style.background = `linear-gradient(to bottom, ${modele.couleur}, ${modele.degrade})`;
          encre.style.webkitBackgroundClip = "text";
          encre.style.backgroundClip = "text";
          encre.style.color = "transparent";
        } else {
          encre.style.color = modele.couleur;
        }
        tuile.appendChild(encre);
        tuile.addEventListener("click", () => poser(verbe, rang));
        conteneur.appendChild(tuile);
      });
    }

    // =====================================================================
    // LES VIGNETTES DESSINÉES — LA PAGE LES RECONSTRUIT, ELLE NE LES REÇOIT PAS
    // =====================================================================
    //
    // ⛔ **POURQUOI UN RENDU SÉPARÉ, ET POURQUOI IL DOIT ÊTRE FIDÈLE.** Rust envoie la
    // DESCRIPTION des formes (voir `ui::dessins_vignettes::pour_la_page`), pas une
    // image : un data-URI par tuile traverserait le canal pour rien, et surtout il
    // pourrait être PÉRIMÉ. Ici, la page et le dock partent de la même description —
    // l'aperçu ne peut donc pas montrer autre chose que ce qui sera posé.
    //
    // ⚠️ **LE MASQUE EST CE QUI PORTE LE RETRAIT, ET IL EST ORDONNÉ.** En SVG, deux
    // formes se composent par LUMINANCE : du blanc sur du noir AJOUTE, du noir sur du
    // blanc RETIRE — exactement la sémantique du rasteriseur (qui prend le maximum
    // pour un ajout et soustrait pour un retrait). Un `fill-rule` ou un groupe de
    // chemins ne l'aurait pas reproduite : c'est l'ORDRE qui compte, pas
    // l'appartenance — et c'est l'ordre qui fait lire un cylindre de base de données
    // ou un anneau de clé.
    const SVG_NS = "http://www.w3.org/2000/svg";

    function elementSvg(nom, attributs) {
      const element = document.createElementNS(SVG_NS, nom);
      for (const [cle, valeur] of Object.entries(attributs)) {
        element.setAttribute(cle, String(valeur));
      }
      return element;
    }

    // Une FORME de la description devient UN élément SVG. Les coordonnées arrivent
    // déjà à l'échelle du `viewBox` (voir `forme_decrite`, côté Rust).
    function formeEnSvg(trace) {
      switch (trace.type) {
        case "disque":
          return elementSvg("circle", { cx: trace.cx, cy: trace.cy, r: trace.r });
        case "boite":
          return elementSvg("rect", { x: trace.x, y: trace.y, width: trace.l, height: trace.h, rx: trace.rayon });
        case "trait":
          return elementSvg("line", {
            x1: trace.x1, y1: trace.y1, x2: trace.x2, y2: trace.y2,
            "stroke-width": trace.epaisseur, "stroke-linecap": "round",
          });
        case "polygone":
          return elementSvg("polygon", { points: trace.points.map((point) => point.join(",")).join(" ") });
        default:
          return null;
      }
    }

    // Chaque vignette dessinée consomme un identifiant de masque : les masques d'un
    // même document doivent porter des noms DISTINCTS, sinon la dernière tuile
    // imposerait son masque à toutes les autres.
    let numeroDeMasque = 0;

    function vignetteDessinee(modele) {
      const svg = elementSvg("svg", { viewBox: "0 0 100 100", width: "100%", height: "100%" });
      const identifiant = `dessin-masque-${numeroDeMasque++}`;

      // LE MASQUE : noir = rien, et chaque forme l'éclaircit (ajout) ou l'assombrit
      // (retrait), DANS L'ORDRE de la description.
      const masque = elementSvg("mask", { id: identifiant });
      masque.appendChild(elementSvg("rect", { x: 0, y: 0, width: 100, height: 100, fill: "black" }));
      for (const forme of modele.formes) {
        const element = formeEnSvg(forme.trace);
        if (!element) continue;
        const encre = forme.op === "plus" ? "white" : "black";
        if (forme.trace.type === "trait") element.setAttribute("stroke", encre);
        else element.setAttribute("fill", encre);
        masque.appendChild(element);
      }

      // L'ENCRE : un carré plein, masqué par ce qui précède, et teinté — d'un aplat,
      // ou d'un dégradé VERTICAL du haut vers le bas, comme la vignette réelle.
      const encre = elementSvg("rect", { x: 0, y: 0, width: 100, height: 100, mask: `url(#${identifiant})` });
      if (modele.degrade) {
        const idDegrade = `dessin-degrade-${identifiant}`;
        const degrade = elementSvg("linearGradient", { id: idDegrade, x1: 0, y1: 0, x2: 0, y2: 1 });
        for (const [offset, couleur] of [["0%", modele.couleur], ["100%", modele.degrade]]) {
          degrade.appendChild(elementSvg("stop", { offset, "stop-color": couleur }));
        }
        svg.appendChild(degrade);
        encre.setAttribute("fill", `url(#${idDegrade})`);
      } else {
        encre.setAttribute("fill", modele.couleur);
      }

      svg.appendChild(masque);
      svg.appendChild(encre);
      return svg;
    }

    // Même forme que `rendreGalerie` : une tuile par modèle, reconstruite UNE fois par
    // ouverture. La seule différence est ce qu'on met DEDANS — un SVG au lieu d'un
    // caractère de police.
    function rendreGalerieDessins(conteneur, modeles, verbe) {
      conteneur.replaceChildren();
      modeles.forEach((modele, rang) => {
        const tuile = document.createElement("button");
        tuile.className = "tuile";
        tuile.title = modele.nom;
        tuile.appendChild(vignetteDessinee(teinte(modele)));
        tuile.addEventListener("click", () => poser(verbe, rang));
        conteneur.appendChild(tuile);
      });
    }

    // LE DOSSIER COLORÉ — DEUX COUCHES, DEUX TEINTES (voir
    // `vignettes_dossiers::rendre_dossier_colore`) : l'arrière dans la teinte
    // `sombre`, l'avant par-dessus dans la teinte choisie. Les deux viennent de
    // Rust — la teinte sombre n'est jamais calculée ici.
    function rendreGalerieBicolore(conteneur, modeles, bicolore, verbe) {
      conteneur.replaceChildren();
      if (!bicolore) return;
      modeles.forEach((modele, rang) => {
        const choisie = teinteChoisie === null ? null : etat.teintes[teinteChoisie];
        const couleur = choisie ? choisie.couleur : modele.couleur;
        const sombre = choisie ? choisie.sombre : bicolore.sombre;
        const tuile = document.createElement("button");
        tuile.className = "tuile";
        tuile.title = modele.nom;
        const svg = elementSvg("svg", { viewBox: "0 0 100 100", width: "100%", height: "100%" });
        svg.appendChild(vignetteDessinee({ formes: bicolore.arriere, couleur: sombre, degrade: null }));
        svg.appendChild(vignetteDessinee({ formes: bicolore.avant, couleur, degrade: null }));
        tuile.appendChild(svg);
        tuile.addEventListener("click", () => poser(verbe, rang));
        conteneur.appendChild(tuile);
      });
    }

    // ⛔ **LE VOCABULAIRE DE CETTE PAGE, DÉCLARÉ UNE SEULE FOIS.** Un verbe est
    // une commande envoyée à Rust ; écrit en clair au fond d'un gestionnaire, il
    // échappe au contrôle qui compare cette page aux bras du `match` Rust
    // (`cef_dossier_menu::tests::la_page_et_le_dispatch_acceptent_les_memes_verbes`)
    // — et un verbe qu'un seul côté connaît est une commande **MUETTE**. Le test
    // lit ce bloc, ET vérifie qu'aucun verbe n'est écrit en clair ailleurs : sans
    // cette seconde vérification, ce registre serait contournable.
    const VERBES = {
      renommer: "renommer",
      effacerNom: "renommer-effacer",
      categorie: "categorie",
      couleur: "couleur",
      dessin: "dessin",
      vignette: "vignette",
      revenirALIcone: "revenir-a-l-icone",
      retirerLaVignette: "retirer-la-vignette",
      retirer: "retirer",
    };

    function go(...segments) {
      location.href = "neuradesk://dossier-menu/" + segments.map(encodeURIComponent).join("/");
    }

    // ⚠️ **DEUX APPELS EXPLICITES, PAS UN TERNAIRE DANS LES ARGUMENTS** — et ce
    // n'est pas une question de goût : le test Rust
    // `cef_dossier_menu::tests::la_page_et_le_dispatch_acceptent_les_memes_verbes`
    // relève les verbes en cherchant les appels `go(` de cette page, et un
    // ternaire lui CACHE le second. Or c'est le seul garde-fou contre un verbe
    // émis d'un
    // seul côté — c'est-à-dire contre une commande MUETTE. La forme explicite
    // garde le contrôle exact.
    nom.addEventListener("change", () => {
      const valeur = nom.value.trim();
      if (valeur) {
        go(VERBES.renommer, valeur);
      } else {
        // Un champ VIDÉ a son propre verbe : `go(…)` joint les segments par `/`
        // et `cef_app` retire le `/` final, donc un DERNIER segment vide
        // DISPARAÎT — un nom vide deviendrait `renommer`, qui ne correspond à
        // aucun bras et échouerait en silence.
        go(VERBES.effacerNom);
      }
    });

    // Entrée valide le champ : `change` ne se déclenche qu'au BLUR, donc sans
    // ça il faudrait cliquer ailleurs dans le menu pour que le renommage parte.
    nom.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        nom.blur();
      }
    });

    vignette.onclick = () => go(VERBES.vignette);
    revenir.onclick = () => go(VERBES.revenirALIcone);
    retirerVignette.onclick = () => go(VERBES.retirerLaVignette);
    retirer.onclick = () => go(VERBES.retirer);
  </script>
  <!-- EN DERNIER, et APRÈS le script de la page — voir context.html:204, même
       ordre : `menu.js` définit `window.__ndMeasure` et pose l'observateur sur
       `[data-menu-root]`, qui doit déjà exister. -->
  <script src="menu.js"></script>
</body>
