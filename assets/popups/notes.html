        if (!libre(debut, debut + url.length)) continue;
        zones.push({
          debut,
          fin: debut + url.length,
          rendre: () => {
            const ancre = el("a", { class: "lien", title: "Ouvrir dans le navigateur — " + url }, []);
            ancre.appendChild(noeudTexte(url, debut));
            ancre.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); go("ouvrir-lien", url); });
            return ancre;
          },
        });
      }
      return zones.sort((a, b) => a.debut - b.debut);
    }

    // Le texte d'une note, mis en forme. `surTache(rang)` : le clic sur une case.
    //
    // ⚠️ **TOUT SE FAIT DANS LES POSITIONS DU TEXTE D'ORIGINE** : les zones
    // protégées (voir `zonesProtegees`) sont relevées d'abord, et l'analyse SAUTE
    // leur intérieur — un `==` ou une `*` dans une adresse ou du code ne met rien
    // en forme, et aucune marque ne s'y ferme.
    function formaterNote(texte, surTache) {
      const zones = zonesProtegees(texte, surTache);
      const lienEn = (j) => zones.find((z) => j >= z.debut && j < z.fin);

      // **CE QUE LA RECHERCHE A TROUVÉ, SURLIGNÉ** — DEMANDE EXPLICITE
      // (2026-10-11), d'après memos. Chaque morceau garde sa place (`ndDebut`),
      // la barre de mise en forme d'une sélection marche donc aussi dessus.
      function ajouterSurligne(parent, de, a) {
        const q = query.trim();
        const morceau = texte.slice(de, a);
        if (!q) {
          parent.appendChild(noeudTexte(morceau, de));
          return;
        }
        const motif = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
        let k = 0;
        for (const m of morceau.matchAll(motif)) {
          if (m.index > k) parent.appendChild(noeudTexte(morceau.slice(k, m.index), de + k));
          const trouve = el("mark", { class: "trouve" }, []);
          trouve.appendChild(noeudTexte(m[0], de + m.index));
          parent.appendChild(trouve);
          k = m.index + m[0].length;
        }
        if (k < morceau.length) parent.appendChild(noeudTexte(morceau.slice(k), de + k));
      }

      function ajouterTexte(parent, de, a) {
        let j = de;
        while (j < a) {
          const zone = zones.find((z) => z.debut >= j && z.debut < a);
          const finTexte = zone ? zone.debut : a;
          if (finTexte > j) ajouterSurligne(parent, j, finTexte);
          if (!zone) return;
          parent.appendChild(zone.rendre());
          j = zone.fin;
        }
      }

      // Où se ferme la marque `m` ouverte avant `depuis`, sans dépasser `a` —
      // `-1` si nulle part. Une `*` seule ne se ferme pas sur une `**`.
      function fermeture(m, depuis, a) {
        let j = texte.indexOf(m, depuis);
        while (j !== -1 && j + m.length <= a) {
          const collee = m === "*" && (texte[j + 1] === "*" || texte[j - 1] === "*");
          if (!collee && !lienEn(j)) return j;
          j = texte.indexOf(m, j + 1);
        }
        return -1;
      }

      // La fin de la couleur ouverte avant `depuis` — les couleurs s'emboîtent,
      // donc chaque `{nom}` rencontré en route demande un `{/}` de plus.
      function finDeCouleur(depuis, a) {
        let profondeur = 1;
        for (let j = depuis; j + FIN_COULEUR.length <= a; j += 1) {
          if (lienEn(j)) continue;
          if (texte.startsWith(FIN_COULEUR, j)) {
            profondeur -= 1;
            if (profondeur === 0) return j;
          } else if (OUVRE_COULEUR.test(texte.slice(j, j + 9))) {
            profondeur += 1;
          }
        }
        return -1;
      }

      // La marque qui s'ouvre en `i` : `{ ouvre, ferme, noeud, fin }`, ou `null`.
      function marqueEn(i, a) {
        const couleur = texte[i] === "{" ? OUVRE_COULEUR.exec(texte.slice(i, i + 9)) : null;
        if (couleur) {
          const dedans = i + couleur[0].length;
          const fin = finDeCouleur(dedans, a);
          return fin > dedans ? { ouvre: couleur[0].length, ferme: FIN_COULEUR.length, noeud: () => el("span", { class: "c-" + couleur[1] }, []), fin } : null;
        }
        for (const [m, balise] of MARQUES) {
          if (!texte.startsWith(m, i)) continue;
          const dedans = i + m.length;
          const fin = fermeture(m, dedans, a);
          const serree = fin > dedans && !/\s/.test(texte[dedans]) && !/\s/.test(texte[fin - 1]);
          return serree ? { ouvre: m.length, ferme: m.length, noeud: () => document.createElement(balise), fin } : null;
        }
        return null;
      }

      function analyser(de, a, parent) {
        let i = de;
        let debut = de;
        while (i < a) {
          const lien = lienEn(i);
          if (lien) { i = lien.fin; continue; }
          const marque = marqueEn(i, a);
          if (!marque) { i += 1; continue; }
          ajouterTexte(parent, debut, i);
          const noeud = marque.noeud();
          analyser(i + marque.ouvre, marque.fin, noeud);
          parent.appendChild(noeud);
          i = marque.fin + marque.ferme;
          debut = i;
        }
        ajouterTexte(parent, debut, a);
      }

      const fragment = document.createDocumentFragment();
      analyser(0, texte.length, fragment);
      return fragment;
    }

    // **UNE POSITION DE SÉLECTION → UNE POSITION DANS LE TEXTE DE LA NOTE.** Dans
    // un nœud texte, c'est sa place plus le décalage ; sur un bord d'élément, c'est
    // le début du texte qui suit, ou à défaut la fin de celui qui précède.
    function versSource(noeud, decalage) {
      if (noeud.nodeType === Node.TEXT_NODE) return noeud.ndDebut === undefined ? null : noeud.ndDebut + decalage;
      const premier = (n) => n.nodeType === Node.TEXT_NODE ? (n.ndDebut === undefined ? null : n) : [...n.childNodes].map(premier).find(Boolean) || null;
      const dernier = (n) => n.nodeType === Node.TEXT_NODE ? (n.ndDebut === undefined ? null : n) : [...n.childNodes].reverse().map(dernier).find(Boolean) || null;
      const apres = noeud.childNodes[decalage] && premier(noeud.childNodes[decalage]);
      if (apres) return apres.ndDebut;
      const avant = decalage > 0 && dernier(noeud.childNodes[decalage - 1]);
      return avant ? avant.ndDebut + avant.length : null;
    }

    // Le brouillon de rappel d'une note telle qu'elle est — pour que la modifier
    // sans passer par « Modifier » garde son rappel (voir `quandDeLAlarme`).
    function brouillonDeLAlarme(note) {
      return {
        actif: !!note.alarme,
        date: note.alarme && note.alarme.date ? dateDeLAlarme(note.alarme.date) : "",
        heure: note.alarme && note.alarme.heure ? heureDeLAlarme(note.alarme.heure) : "",
        jours: note.alarme && note.alarme.jours ? note.alarme.jours : 0,
      };
    }

    // **LA SÉLECTION DANS UNE NOTE AFFICHÉE, VUE COMME UNE ZONE DE SAISIE** —
    // `basculerFormat` et `basculerCouleur` travaillent dessus comme sur un
    // `<textarea>`, et son `input` ENREGISTRE la note. `null` hors d'une note.
    function zoneDeLaSelection() {
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount || selection.isCollapsed) return null;
      const plage = selection.getRangeAt(0);
      const commun = plage.commonAncestorContainer;
      const corps = (commun.nodeType === Node.TEXT_NODE ? commun.parentElement : commun).closest(".card-body");
      if (!corps || !corps.ndNote) return null;
      const a = versSource(plage.startContainer, plage.startOffset);
      const b = versSource(plage.endContainer, plage.endOffset);
      if (a === null || b === null || b <= a) return null;
      const note = corps.ndNote;
      return {
        value: note.content,
        selectionStart: a,
        selectionEnd: b,
        focus() {},
        setSelectionRange() {},
        dispatchEvent() {
          if (this.value === note.content) return;
          window.getSelection().removeAllRanges();
          go("update", note.id, this.value, quandDeLAlarme(brouillonDeLAlarme(note)));
        },
      };
    }

    // **ENTOURE OU DÉPOUILLE LA SÉLECTION** de la marque `m`. Les espaces aux
    // bords de la sélection restent dehors — un double-clic sous Windows prend
    // l'espace qui suit le mot, et `**mot **` ne serait pas du gras.
    function basculerFormat(zone, m) {
      const v = zone.value;
      let a = zone.selectionStart ?? v.length;
      let b = zone.selectionEnd ?? a;
      while (a < b && /\s/.test(v[a])) a += 1;
      while (b > a && /\s/.test(v[b - 1])) b -= 1;
      let nouveau, na, nb;
      if (a >= m.length && v.slice(a - m.length, a) === m && v.slice(b, b + m.length) === m) {
        nouveau = v.slice(0, a - m.length) + v.slice(a, b) + v.slice(b + m.length);
        na = a - m.length; nb = b - m.length;
      } else if (b - a >= 2 * m.length && v.slice(a, a + m.length) === m && v.slice(b - m.length, b) === m) {
        nouveau = v.slice(0, a) + v.slice(a + m.length, b - m.length) + v.slice(b);
        na = a; nb = b - 2 * m.length;
      } else {
        nouveau = v.slice(0, a) + m + v.slice(a, b) + m + v.slice(b);
        na = a + m.length; nb = b + m.length;
      }
      poserLaSaisie(zone, nouveau, na, nb);
    }

    function poserLaSaisie(zone, nouveau, na, nb) {
      if (nouveau.length > maxChars) return;
      zone.value = nouveau;
      zone.focus();
      zone.setSelectionRange(na, nb);
      // Le brouillon d'édition suit `input` (voir `renderCard`).
      zone.dispatchEvent(new Event("input"));
    }

    // **MET LA SÉLECTION EN COULEUR** — la même couleur une seconde fois la
    // retire, une autre la REMPLACE (pas d'emboîtement par accident).
    function basculerCouleur(zone, nom) {
      const v = zone.value;
      let a = zone.selectionStart ?? v.length;
      let b = zone.selectionEnd ?? a;
      while (a < b && /\s/.test(v[a])) a += 1;
      while (b > a && /\s/.test(v[b - 1])) b -= 1;
      // La couleur qui entoure déjà la sélection, marques hors sélection.
      const avant = COULEURS.map((c) => "{" + c + "}").find((o) => v.slice(a - o.length, a) === o);
      if (avant && v.slice(b, b + FIN_COULEUR.length) === FIN_COULEUR) {
        const retire = avant === "{" + nom + "}";
        const ouvre = retire ? "" : "{" + nom + "}";
        const ferme = retire ? "" : FIN_COULEUR;
        const debut = a - avant.length;
        const nouveau = v.slice(0, debut) + ouvre + v.slice(a, b) + ferme + v.slice(b + FIN_COULEUR.length);
        poserLaSaisie(zone, nouveau, debut + ouvre.length, debut + ouvre.length + (b - a));
        return;
      }
      const ouvre = "{" + nom + "}";
      poserLaSaisie(zone, v.slice(0, a) + ouvre + v.slice(a, b) + FIN_COULEUR + v.slice(b), a + ouvre.length, b + ouvre.length);
    }

    const FORMATS = [
      { m: "**", libelle: "G", classe: "f-gras", titre: "Gras (Ctrl+B)", touche: "b", maj: false },
      { m: "*", libelle: "I", classe: "f-italique", titre: "Italique (Ctrl+I)", touche: "i", maj: false },
      { m: "~~", libelle: "S", classe: "f-barre", titre: "Barré (Ctrl+Maj+X)", touche: "x", maj: true },
      { m: "==", libelle: "A", classe: "f-surligne", titre: "Surligner (Ctrl+Maj+H)", touche: "h", maj: true },
      { m: "`", libelle: "</>", classe: "f-code", titre: "Code (Ctrl+E) — pour un bloc, une ligne ``` avant et après", touche: "e", maj: false },
    ];

    // **TRANSFORME LES LIGNES DE LA SÉLECTION EN TÂCHES**, ou les rend à du texte
    // si elles en sont TOUTES déjà — le bouton ☐ de la barre.
    function basculerTache(zone) {
      const v = zone.value;
      const a = zone.selectionStart ?? v.length;
      const b = zone.selectionEnd ?? a;
      const debut = a === 0 ? 0 : v.lastIndexOf("\n", a - 1) + 1;
      // Une sélection qui finit juste APRÈS un saut de ligne ne prend pas la
      // ligne suivante.
      const dernier = b > a && v[b - 1] === "\n" ? b - 1 : b;
      let fin = v.indexOf("\n", dernier);
      if (fin === -1) fin = v.length;
      const TACHE = /^([ \t]*)[-*] \[[ xX]\] ?/;
      const lignes = v.slice(debut, fin).split("\n");
      const toutes = lignes.every((l) => TACHE.test(l));
      const bloc = lignes
        .map((l) => (toutes ? l.replace(TACHE, "$1") : TACHE.test(l) ? l : l.replace(/^([ \t]*)/, "$1- [ ] ")))
        .join("\n");
      poserLaSaisie(zone, v.slice(0, debut) + bloc + v.slice(fin), debut + bloc.length, debut + bloc.length);
    }

    // Un bouton de la barre. `mousedown` est retenu : sans lui, le clic ôte le
    // focus à la zone et sa sélection avec.
    function boutonDeFormat(classe, titre, libelle, agir) {
      const bouton = el("button", { class: classe, title: titre }, [libelle]);
      bouton.addEventListener("mousedown", (e) => e.preventDefault());
      bouton.addEventListener("click", agir);
      return bouton;
    }

    // Les boutons, pour la zone que `zone()` désigne. Les pastilles de couleur
    // s'ouvrent au clic sur le bouton de couleur — six pastilles en permanence
    // chargeraient la ligne du compositeur.
    function barreDeFormat(zone) {
      const pastilles = el("div", { class: "pastilles" }, COULEURS.map((nom) =>
        boutonDeFormat("pastille c-fond-" + nom, nom[0].toUpperCase() + nom.slice(1), "", () => {
          const z = zone();
          if (z) basculerCouleur(z, nom);
          pastilles.classList.remove("ouvertes");
        })));
      return el("div", { class: "format" }, [
        ...FORMATS.map((f) => boutonDeFormat(f.classe, f.titre, f.libelle, () => { const z = zone(); if (z) basculerFormat(z, f.m); })),
        boutonDeFormat("f-tache", "Liste de tâches — une case à cocher par ligne", "☐", () => { const z = zone(); if (z) basculerTache(z); }),
        boutonDeFormat("f-couleur", "Couleur du texte", "A", () => pastilles.classList.toggle("ouvertes")),
        pastilles,
      ]);
    }

    // Les raccourcis, sur les deux zones de saisie.
    function raccourcisDeFormat(event) {
      if (!event.ctrlKey || event.altKey) return;
      const f = FORMATS.find((f) => f.touche === event.key.toLowerCase() && f.maj === event.shiftKey);
      if (!f) return;
      event.preventDefault();
      basculerFormat(event.target, f.m);
    }

    function renderCard(note) {
      const card = el("div", { class: "card" + (note.pinned ? " pinned" : "") }, []);
      // Le bouton "Modifier" est créé à part (plutôt que dans le tableau
      // passé à `el` ci-dessous) pour y attacher sa poignée par référence
      // directe — indexer `actions.children[N]` serait fragile au moindre
      // réordonnancement futur des boutons.
      const editButton = el("button", {}, ["Modifier"]);
      editButton.addEventListener("click", () => startEdit(note));
      const actions = el("div", { class: "actions" }, [
        el("button", { class: "pin-btn" + (note.pinned ? " active" : ""), title: note.pinned ? "Désépingler" : "Épingler", onclick: () => go("toggle-pin", note.id) }, [el("span", { class: "ico ico-" + (note.pinned ? "push-pin-fill" : "push-pin") })]),
        ...renderAlarme(note),
        // Colle une image du presse-papiers directement dans CETTE note
        // (voir win32::cef_notes::handle_paste_into) — distinct du bouton
        // "Coller" du compositeur, qui ne peut que créer une note neuve.
        el("button", { title: "Coller une image ici", onclick: () => go("paste-into", note.id) }, [el("span", { class: "ico ico-image" }), "+"]),
        // **EXPORTER** — ouvre la fenêtre « Enregistrer sous » de Windows (voir
        // `cef_notes::handle_exporter_md`). C'est une action de la NOTE, donc
        // elle est ici et non dans le clic droit — lequel sert déjà aux
        // couleurs d'étiquettes.
        el("button", { title: "Exporter la note en Markdown", onclick: () => go("exporter-md", note.id) }, ["Exporter"]),
        // **ARCHIVER** — sortir la note de la liste sans la supprimer ; elle ne se
        // voit plus que dans « Archives », et son rappel se tait.
        el("button", {
          title: note.archived ? "Désarchiver — la remettre dans la liste" : "Archiver — la sortir de la liste sans la supprimer",
          onclick: () => go("archiver", note.id),
        }, [note.archived ? "📤" : "🗄️"]),
        editButton,
        el("button", { onclick: () => go("delete", note.id) }, ["Supprimer"]),
      ]);

      card.appendChild(el("div", { class: "card-head" }, [
        el("span", { class: "date" }, [formatDate(note.updatedAt)]),
        actions,
      ]));

      if (editingId === note.id) {
        const textarea = el("textarea", { class: "edit-area", maxlength: String(maxChars) }, []);
        textarea.value = editDraft;
        textarea.addEventListener("input", (e) => { editDraft = e.target.value; });
        textarea.addEventListener("keydown", raccourcisDeFormat);
        // ⛔ **LA BARRE N'EST PAS DANS `.edit-actions`** — défaut réel signalé
        // (« je ne vois rien pour mettre de la couleur… en mode édition ») : la
        // règle `.card .edit-actions button` y repeignait tous les boutons, ce qui
        // effaçait le dégradé du bouton de couleur (texte transparent : bouton
        // INVISIBLE) et donnait aux six pastilles la même teinte.
        card.appendChild(el("div", { class: "edit-format" }, [barreDeFormat(() => document.querySelector(".edit-area"))]));
        card.appendChild(textarea);
        card.appendChild(el("div", { class: "edit-actions" }, [
          el("button", { onclick: () => saveEdit(note.id, note.images && note.images.length > 0) }, ["Enregistrer"]),
          el("button", { onclick: () => cancelEdit() }, ["Annuler"]),
        ]));
      } else {
        // **UNE NOTE LONGUE SE REPLIE** — DEMANDE EXPLICITE (2026-10-11), d'après
        // memos. Pas pendant une recherche : ce qu'elle a trouvé doit se voir.
        // Elle n'est que REPLIABLE ici : `ajusterReplis` mesure si elle déborde.
        const replier = !depliees.has(note.id) && query.trim() === "";
        const corps = el("div", { class: "card-body" }, [
          formaterNote(note.content, (rang) => go("cocher", note.id, rang)),
        ]);
        if (replier) corps.dataset.repliable = "1";
        corps.ndNote = note;
        card.appendChild(corps);
        if (replier) {
          card.appendChild(el("button", { class: "voir-plus", onclick: () => { depliees.add(note.id); renderList(); } }, ["Voir plus ▾"]));
        } else if (depliees.has(note.id)) {
          card.appendChild(el("button", { class: "voir-plus", onclick: () => { depliees.delete(note.id); renderList(); } }, ["Réduire ▴"]));
        }
        const chips = renderChips(note);
        if (chips) card.appendChild(chips);
      }
      // Affichées dans les deux modes (édition ou non) : retirer une image
      // n'a rien à voir avec l'édition du texte, voir handle_remove_image.
      const images = renderImages(note);
      if (images) card.appendChild(images);
      return card;
    }

    function renderList() {
      const list = document.getElementById("list");
      const ouvertes = notesDuMode().reduce((total, note) => total + tachesOuvertes(note.content), 0);
      document.getElementById("a-faire-libelle").textContent = ouvertes ? "Tâches à faire (" + ouvertes + ")" : "Tâches à faire";
      // Préserve le focus + la position du curseur dans la zone d'édition à
      // travers un re-rendu déclenché par un changement SANS RAPPORT avec
      // l'édition en cours (ex. : épingler une AUTRE note, ou une frame
      // `setState` pendant qu'on tape) — sinon `list.replaceChildren()`
      // détruit le <textarea> en cours d'édition et le focus/curseur sont
      // perdus (le texte tapé, lui, survit toujours via `editDraft`). Ne
      // touche à rien si le focus était ailleurs (ex. la zone de recherche)
      // : on ne veut pas voler le focus à un champ que l'utilisateur est
      // en train d'utiliser.
      const editingHadFocus = document.activeElement && document.activeElement.classList.contains("edit-area");
      const caretPos = editingHadFocus ? document.activeElement.selectionStart : null;
      // ⚠️ **LES CHAMPS DU RAPPEL N'ONT PAS BESOIN DE LA RESTAURATION CI-DESSUS,
      // ET C'EST VOULU** : ils n'envoient plus rien tant qu'on les édite (voir
      // `alarmeDraft`), donc aucun état n'est poussé, donc plus rien ne les
      // détruit en pleine saisie. La restauration de focus a été essayée ici
      // même (79d2854) et abandonnée : elle ne peut pas rendre le SEGMENT actif
      // — `focus()` sur un nœud neuf repose le curseur sur le premier, donc
      // « le champ a le focus » était vrai et la saisie était perdue quand même.
      list.replaceChildren();
      const visible = filteredNotes();
      if (visible.length === 0) {
        // ⛔ **LE MESSAGE NOMME LES FILTRES ACTIFS, ET C'EST UN VRAI CORRECTIF.**
        // « Aucune note ne correspond au filtre » etait exact et SANS SECOURS : avec
        // DEUX filtres en jeu -- une etiquette cliquee dans la colonne, et
        // « epinglees seulement » --, rien ne dit lequel retire quoi. MESURE le
        // 2026-09-24 : une etiquette active PLUS « epinglees seulement » donne ZERO
        // note quand la note etiquetee n'est pas epinglee. C'est juste, et
        // l'utilisateur en a conclu que la case ne marchait plus.
        //
        // ⚠️ **LES FILTRES SE COMBINENT, ET C'EST LA COMBINAISON QU'IL FAUT DIRE** :
        // nommer un seul d'entre eux aurait laisse croire que c'est lui le coupable.
        const filtres = [];
        if (activeTag !== null) filtres.push("l'etiquette #" + activeTag);
        if (pinnedOnly) filtres.push("« epinglees seulement »");
        if (aFaireSeulement) filtres.push("« tâches à faire »");
        if (query.trim() !== "") filtres.push("la recherche");
        if (activeDay !== null) filtres.push("le jour du " + activeDay.split("-").reverse().join("/") + " (re-cliquer le jour le retire)");
        const message = notesDuMode().length === 0
          ? (showArchived ? "Aucune note archivée" : "Aucune note pour l'instant")
          : filtres.length === 0
            ? "Aucune note ne correspond au filtre"
            : "Aucune note ne correspond a " + filtres.join(" et a ")
              + (activeTag !== null ? " -- re-cliquer l'etiquette active la retire" : "");
        list.appendChild(el("div", { class: "empty" }, [message]));
        return;
      }
      for (const note of visible) {
        list.appendChild(renderCard(note));
      }
      ajusterReplis();
      if (editingHadFocus) focusEditArea(caretPos);
    }

    // **REPLIE LES NOTES QUI DÉBORDENT, ET SEULEMENT ELLES** — ce qui ne se sait
    // qu'en MESURANT, avec la largeur réelle de la liste.
    //
    // ⛔ **PAS UNE SEULE FOIS AU RENDU** : c'était la première version, et une
    // note de six lignes s'affichait repliée (capture du 2026-10-11). Le premier
    // rendu a lieu dans la fenêtre PRÉCHARGÉE, avant qu'elle ait sa taille : le
    // texte y passe à la ligne bien plus tôt, tout déborde, et rien ne remesurait
    // ensuite — l'état n'ayant pas changé, la liste n'était pas reconstruite.
    // D'où la mesure à chaque changement de taille de la liste (voir
    // l'observateur plus bas).
    function ajusterReplis() {
      for (const corps of document.querySelectorAll(".card-body[data-repliable]")) {
        corps.classList.add("repliee");
        const deborde = corps.scrollHeight > corps.clientHeight + 1;
        corps.classList.toggle("repliee", deborde);
        const bouton = corps.parentElement.querySelector(".voir-plus");
        if (bouton) bouton.style.display = deborde ? "" : "none";
      }
    }
    new ResizeObserver(ajusterReplis).observe(document.getElementById("list"));

    function submitCompose() {
      const textarea = document.getElementById("compose");
      const content = textarea.value.trim();
      if (content === "") return;
      go("create", content);
      textarea.value = "";
    }

    // Appelée depuis Rust (win32::cef_notes::handle_paste) quand le
    // presse-papiers contenait du TEXTE — insérée à la position du curseur
    // plutôt qu'ajoutée à la fin, pour se comporter comme un vrai collage.
    window.insertIntoCompose = function (text) {
      const textarea = document.getElementById("compose");
      const start = textarea.selectionStart ?? textarea.value.length;
      const end = textarea.selectionEnd ?? textarea.value.length;
      const combined = textarea.value.slice(0, start) + text + textarea.value.slice(end);
      textarea.value = combined.length > maxChars ? combined.slice(0, maxChars) : combined;
      const caret = Math.min(start + text.length, textarea.value.length);
      textarea.focus();
      textarea.setSelectionRange(caret, caret);
    };

    // Appelée depuis Rust (win32::cef_notes::handle_paste) après la création
    // d'une note à partir d'une IMAGE collée : le contenu de la zone de
    // composition vient d'être "consommé" comme légende de cette note.
    window.clearCompose = function () {
      document.getElementById("compose").value = "";
    };

    // Appelée depuis Rust (win32::cef_notes::handle_paste_into_active)
    // quand un collage TEXTE arrive alors qu'une note est en cours
    // d'édition — pendant de window.insertIntoCompose ci-dessus, mais pour
    // la zone d'édition (`.edit-area`) plutôt que le compositeur. Ignorée si
    // l'édition a été annulée/refermée entre le clic sur "Coller" et la
    // réponse de Rust (la zone n'existe alors plus). `editDraft` est mis à
    // jour explicitement (pas seulement `textarea.value`) : c'est LUI que
    // `saveEdit` lit au moment d'enregistrer, voir `startEdit`/`saveEdit`.
    window.insertIntoEditArea = function (text) {
      const textarea = document.querySelector(".edit-area");
      if (!textarea) return;
      const start = textarea.selectionStart ?? textarea.value.length;
      const end = textarea.selectionEnd ?? textarea.value.length;
      const combined = textarea.value.slice(0, start) + text + textarea.value.slice(end);
      textarea.value = combined.length > maxChars ? combined.slice(0, maxChars) : combined;
      editDraft = textarea.value;
      const caret = Math.min(start + text.length, textarea.value.length);
      textarea.focus();
      textarea.setSelectionRange(caret, caret);
    };

    // Appelée depuis Rust (win32::cef_notes::handle_full_image) une fois la
    // pleine résolution d'une image de note chargée depuis le disque —
    // ignorée si la visionneuse a été fermée ou pointe déjà vers une autre
    // image entre-temps (voir lightboxTarget).
    window.setFullImage = function (id, index, dataUri) {
      if (!lightboxTarget || lightboxTarget.id !== id || lightboxTarget.index !== index) return;
      document.getElementById("lightbox-img").src = dataUri;
    };

    // **LA BARRE AU-DESSUS D'UNE SÉLECTION DANS UNE NOTE AFFICHÉE** — DEMANDE
    // EXPLICITE (2026-10-10) : « je ne vois pas de boutons pour appliquer une
    // couleur au texte sélectionné dans une note ». Hors de `.root` : le `zoom` de
    // .root ne la touche pas, et les rectangles de la sélection, mesurés dans la
    // fenêtre, la placent directement.
    const barreSelection = el("div", { class: "barre-selection" }, [barreDeFormat(zoneDeLaSelection)]);
    document.body.appendChild(barreSelection);
    document.addEventListener("selectionchange", () => {
      if (!zoneDeLaSelection()) {
        barreSelection.classList.remove("visible");
        return;
      }
      const cadre = window.getSelection().getRangeAt(0).getBoundingClientRect();
      barreSelection.classList.add("visible");
      const largeur = barreSelection.offsetWidth;
      const hauteur = barreSelection.offsetHeight;
      const gauche = Math.max(4, Math.min(cadre.left, window.innerWidth - largeur - 4));
      const haut = cadre.top - hauteur - 6 >= 4 ? cadre.top - hauteur - 6 : cadre.bottom + 6;
      barreSelection.style.left = gauche + "px";
      barreSelection.style.top = haut + "px";
    });
    document.getElementById("format-compose").replaceWith(barreDeFormat(() => document.getElementById("compose")));
    document.getElementById("compose").addEventListener("keydown", raccourcisDeFormat);
    document.getElementById("compose").addEventListener("keydown", (event) => {
      if (event.ctrlKey && event.key === "Enter") {
        event.preventDefault();
        submitCompose();
      }
    });
    document.getElementById("search").addEventListener("input", (event) => {
      query = event.target.value;
      renderVues();
      renderList();
    });
    document.getElementById("annuler").addEventListener("click", () => go("annuler"));
    document.getElementById("refaire").addEventListener("click", () => go("refaire"));

    document.getElementById("pinned-only").addEventListener("change", (event) => {
      pinnedOnly = event.target.checked;
      renderVues();
      renderList();
    });
    document.getElementById("a-faire").addEventListener("change", (event) => {
      aFaireSeulement = event.target.checked;
      renderVues();
      renderList();
    });
    document.getElementById("archives").addEventListener("change", (event) => {
      showArchived = event.target.checked;
      renderTout();
    });

    // Appelée depuis Rust (win32::cef_notes::push_state) — à l'ouverture ET
    // à chaque frame tant que la fenêtre reste ouverte (voir
    // win32::cef_notes::refresh_if_visible, doc de fonction) : ignorée si
    // identique à l'état déjà appliqué, voir `lastStateJson`.
    window.setState = function (state) {
      // **LES TAILLES SONT REPOSÉES ICI, AVANT TOUT LE RESTE.** L'ordre
      // précédent les posait plus bas, APRÈS le garde d'état et après du code
      // susceptible de lever — deux fragilités qui se conjuguaient :
      //
      //  1. `lastStateJson` était marqué AVANT que quoi que ce soit soit
      //     appliqué. Si une seule ligne levait entre les deux, l'état était
      //     tenu pour « déjà appliqué » sans l'être, et TOUTES les poussées
      //     suivantes du même état sortaient en avance (le `return` ci-dessous) ;
      //  2. les variables étaient posées après `getElementById("compose")`, qui
      //     peut renvoyer `null` pendant une reconstruction du DOM.
      //
      // Le panneau gardait alors l'échelle par défaut de la feuille de style —
      // 100 % — et ROUVRIR NE RÉPARAIT RIEN, puisque l'état, lui, n'avait pas
      // changé : c'est ce qui rendait le défaut si déroutant à reproduire.
      //
      // Deux `setProperty` sont idempotents et ne coûtent rien : rien ne
      // justifie de les soumettre au garde. Ils le sont donc plus.
      const root = document.documentElement.style;
      root.setProperty("--text-scale", state.textScalePercent / 100);
      root.setProperty("--image-scale", state.imageScalePercent / 100);
      // Le bandeau est repose AVANT le garde d'etat, comme les deux tailles
      // ci-dessus, et pour la meme raison : il doit s'appliquer meme si le reste
      // de l'etat est identique a la poussee precedente.
      rendreAvertissement(state.avertissement);
      // L'etat des deux boutons d'historique vient de Rust, comme le reste : la
      // page ne devine jamais s'il reste quelque chose a annuler.
      document.getElementById("annuler").disabled = !state.peutAnnuler;
      document.getElementById("refaire").disabled = !state.peutRefaire;

      const json = JSON.stringify(state);
      if (json === lastStateJson) return;
      notes = state.notes;
      allTags = state.allTags;
      // La couleur de chaque etiquette, indexee par son nom en minuscules (la
      // meme cle que celle employee par les pastilles et par `activeTag`).
      couleursEtiquettes = {};
      for (const [nom, couleur] of Object.entries(state.couleursEtiquettes || {})) {
        if (couleur) couleursEtiquettes[nom.toLowerCase()] = couleur;
      }
      vues = state.vues || [];
      maxChars = state.maxChars;
      document.getElementById("compose").setAttribute("maxlength", String(maxChars));
      // Les couleurs d'accent ne passent PLUS par ici : elles sont poussées par
      // `win32::cef_popup::push_window_palette`, à chaque frame où la fenêtre
      // est visible, exactement comme pour les menus. Un seul mécanisme pour
      // les quatre panneaux, au lieu d'un transport par l'état ici et d'un
      // `setProperty` ailleurs.
      // La note en cours d'édition a disparu (supprimée, p. ex. via le
      // bouton "Supprimer" du header pendant qu'on l'éditait) : on efface
      // le brouillon plutôt que de le laisser traîner. Sans ça, un id
      // supprimé qui était le max courant serait réattribué à la PROCHAINE
      // note créée (voir `notes::next_id`), et cette note fraîche
      // hériterait par erreur du mode édition + du contenu de l'ancienne
      // note supprimée.
      if (editingId !== null && !notes.some((n) => n.id === editingId)) {
        editingId = null;
        editDraft = "";
      }
      if (activeTag !== null && !arbreEtiquettes().noeuds.has(activeTag)) {
        activeTag = null;
      }
      renderTout();
      // Marqué EN DERNIER, et c'est la seconde moitié du correctif : tant que
      // tout n'a pas été appliqué, l'état ne doit pas être tenu pour tel. Une
      // exception en cours de route doit provoquer un NOUVEL ESSAI à la poussée
      // suivante, et non un abandon définitif — c'est exactement ce que
      // produisait l'ordre inverse.
      lastStateJson = json;
    };

    renderTout();

    // Signale à Rust que cette page a fini de s'initialiser (voir
    // win32::cef_notes::handle_ready, doc de READY) — dernière ligne du
    // script à dessein : ne peut arriver qu'UNE SEULE fois par lancement de
    // NeuraDesk (cette page n'est jamais rechargée après sa toute première
    // création, voir doc de win32::cef_popup::toggle_with).
    go("ready");
  </script>
</body>
</html>
