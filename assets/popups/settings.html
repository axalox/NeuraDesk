        rendreMenu();
      });
      // **SAUVEGARDE DE LA CONFIGURATION** — voir `sauvegarde_config` côté Rust.
      // L'import se fait en deux clics : choisir l'archive (vérifiée, rien ne
      // change), puis confirmer ce qu'elle contient.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Sauvegarde de la configuration"]));
        box.appendChild(
          el("p", { class: "hint" }, [
            "Une archive .zip de tous les réglages, des zones, des notes, du calendrier et des automatisations. L'historique du presse-papiers n'y est pas. Les mots de passe SSH ne se relisent que sur cette session Windows.",
          ]),
        );
        box.appendChild(
          el("p", { class: "hint" }, [
            "« Exporter l'apparence » ne garde que l'aspect : couleurs, thème, style, icônes, tailles, ombres, lueurs, textures, dégradé, flou et effets. Son import ne touche ni aux notes, ni au calendrier, ni aux zones, ni aux barres.",
          ]),
        );
        const sauvegarde = state.sauvegarde || {};
        const boutons = el("div", { class: "row" });
        boutons.appendChild(el("button", { class: "action", onclick: () => go("config-exporter") }, ["Exporter…"]));
        boutons.appendChild(el("button", { class: "action", onclick: () => go("config-exporter-apparence") }, ["Exporter l'apparence…"]));
        boutons.appendChild(el("button", { class: "action", onclick: () => go("config-importer") }, ["Importer…"]));
        box.appendChild(boutons);
        if (sauvegarde.apercu) {
          const apparence = !!sauvegarde.apercu.apparence;
          const quand = sauvegarde.apercu.date ? `, exportée le ${sauvegarde.apercu.date}` : "";
          const quoi = apparence ? "Archive d'apparence" : "Configuration complète";
          const rangee = apparence ? "L'apparence actuelle (et elle seule)" : "La configuration actuelle";
          box.appendChild(
            el("p", { class: "hint" }, [
              `${quoi} : ${sauvegarde.apercu.fichiers} fichiers${quand}. ${rangee} sera rangée dans un dossier « avant-import » du dossier de configuration, puis NeuraDesk redémarrera.`,
            ]),
          );
          const choix = el("div", { class: "row" });
          choix.appendChild(
            el("button", { class: "action", onclick: () => go("config-importer-confirmer") }, [
              apparence ? "Remplacer mon apparence" : "Remplacer ma configuration",
            ]),
          );
          choix.appendChild(el("button", { class: "action", onclick: () => go("config-importer-annuler") }, ["Annuler"]));
          box.appendChild(choix);
        }
        if (sauvegarde.message) {
          box.appendChild(el("p", { class: "hint" }, [sauvegarde.message]));
        }
      });
    }

    // Réglages d'UN SEUL écran secondaire — celui de l'onglet "Écran N"
    // actif (voir `renderMainTabs`/`activeMainTab`). Épaisseur/transparence/
    // couleur PAR ÉCRAN (voir `win32::cef_settings::SettingsRefs::
    // secondary_screen_thicknesses`/`_tint`/`_colors`, DEMANDE EXPLICITE :
    // "que les réglages de hauteur, largeur, couleurs soient séparés entre
    // chaque écran") — chaque réglage a sa propre case "Automatique" :
    // cochée, l'écran suit le comportement d'origine (épaisseur dérivée de
    // sa propre taskbar Windows/son DPI, couleur/transparence de la barre
    // PRIMAIRE) ; décochée, les curseurs/champs dessous s'appliquent à CET
    // écran seul. Chaque copie RÉSERVE réellement l'espace occupé par ses
    // bandes sur cet écran (AppBar Win32, voir `win32::window::
    // SecondaryWindow`).
    function renderSecondaryScreenSection(scroll, deviceName) {
      const screen = (state.secondaryScreens || []).find((s) => s.deviceName === deviceName);
      if (!screen) return;
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, [screen.label]));
        box.appendChild(el("p", { class: "hint" }, ["Affiche une copie du dock sur cet écran — réserve l'espace occupé par ses bandes sur cet écran, comme la barre principale."]));
        const choices = el("div", { class: "size-choices" });
        // Mode "Application complète" retiré (simplification : un écran
        // secondaire n'affiche plus jamais que sa barre du haut, voir la
        // doc de `SecondaryWindow` côté Rust).
        for (const [mode, label] of [["off", "Désactivé"], ["top", "Barre du haut seule"]]) {
          choices.appendChild(
            el("button", { class: screen.mode === mode ? "selected" : "", onclick: () => go("secondary-screen", screen.deviceName, mode) }, [label]),
          );
        }
        box.appendChild(choices);
      });
      if (screen.mode === "off") return;
      // Une `.section` par groupe (au lieu de tout empiler dans la section
      // ci-dessus) — DEMANDE EXPLICITE ("ajoute une colonne avec les
      // catégories de réglages [...] dans écran 1") : `section()` ne
      // détecte une catégorie que via le `<h2>` de CHAQUE section, donc
      // sans ce découpage la colonne de catégories n'aurait listé que le
      // nom de l'écran, une seule entrée pour tout l'onglet — inutile
      // comme sommaire.
      section(scroll, (box) => { box.appendChild(el("h2", {}, ["Épaisseur des barres"])); secondaryScreenThickness(box, screen); });
      section(scroll, (box) => { box.appendChild(el("h2", {}, ["Transparence des barres"])); secondaryScreenTint(box, screen); });
      section(scroll, (box) => { box.appendChild(el("h2", {}, ["Couleur des barres"])); secondaryScreenColors(box, screen); });
      section(scroll, (box) => { box.appendChild(el("h2", {}, ["Couleur du texte de la barre du haut"])); secondaryScreenTopbarText(box, screen); });
      section(scroll, (box) => { box.appendChild(el("h2", {}, ["Fonctionnalités"])); secondaryScreenFeatures(box, screen); });
      section(scroll, (box) => { box.appendChild(el("h2", {}, ["Horloge plein écran"])); secondaryScreenFullscreenClock(box, screen); });
      section(scroll, (box) => { box.appendChild(el("h2", {}, ["Taille du contenu"])); secondaryScreenScales(box, screen); });
      section(scroll, (box) => { box.appendChild(el("h2", {}, ["Pastilles de bureaux virtuels"])); secondaryScreenDesktopDotSize(box, screen); });
      section(scroll, (box) => { box.appendChild(el("h2", {}, ["Taille du texte de la barre du haut"])); secondaryScreenTopbarTextSize(box, screen); });
      section(scroll, (box) => { box.appendChild(el("h2", {}, ["Ombres"])); secondaryScreenOmbre(box, screen); });
      section(scroll, (box) => { box.appendChild(el("h2", {}, ["Coins arrondis"])); secondaryScreenCoins(box, screen); });
      section(scroll, (box) => { box.appendChild(el("h2", {}, ["Écartement des icônes"])); secondaryScreenIconGap(box, screen); });
      section(scroll, (box) => { box.appendChild(el("h2", {}, ["Couleur des séparateurs"])); secondaryScreenSeparatorColor(box, screen); });
      section(scroll, (box) => { box.appendChild(el("h2", {}, ["Taille des séparateurs"])); secondaryScreenSeparatorSize(box, screen); });
    }

    function themeSwatch(name, hex, removable, index) {
      const node = el("div", { class: "theme-swatch", onclick: () => go("theme", "apply", hex) });
      const chip = el("div", { class: "chip" });
      chip.style.background = "#" + hex;
      node.appendChild(chip);
      if (removable) {
        node.appendChild(
          el("button", { class: "del cible-24", title: "Retirer", onclick: (e) => { e.stopPropagation(); go("theme", "delete", String(index)); } }, [el("span", { class: "ico ico-x" })]),
        );
      }
      node.appendChild(el("div", { class: "name" }, [name]));
      node.title = name + " — #" + hex;
      return node;
    }

    // Une variante d'une famille : la surface, et dans le coin la couleur
    // d'accentuation propre à la famille (aucune pour « Windows », qui prend
    // celle du système).
    function windowsThemeSwatch(famille, mode) {
      const surface = famille[mode];
      const nom = famille.nom + (!famille.clair ? "" : mode === "clair" ? " clair" : " sombre");
      const node = el("div", { class: "theme-swatch", onclick: () => go("theme", "famille", famille.id, mode) });
      const chip = el("div", { class: "chip" });
      chip.style.background = famille.accent
        ? `linear-gradient(135deg, #${surface} 62%, #${famille.accent} 62%)`
        : "#" + surface;
      node.appendChild(chip);
      node.appendChild(el("div", { class: "name" }, [nom]));
      node.title = nom + (famille.accent
        ? " — surface #" + surface + ", accentuation #" + famille.accent
        : " — surfaces et couleur d'accentuation de Windows");
      return node;
    }

    // Rafraîchit les valeurs des curseurs/champs EN PLACE sans reconstruire
    // le DOM — voir la doc d'en-tête (même technique que voicemeeter.html).
    function updateValues() {
      updateSlider("icon-gap", state.iconGap, (v) => v + "px");
      ICON_GAP_BARRES.forEach(([cle], i) => updateSlider(`icon-gap-${cle}`, state.iconGapsBarres[i], (v) => v + "px"));
      // Les deux bornes du theme. ⚠️ **EN POURCENTAGE DES DEUX COTES** : la page
      // glisse des pourcentages, la config stocke des fractions — la conversion
      // se fait ICI et dans `onInput`, jamais ailleurs.
      const forcesTheme = state.themeForces || { saturation: 1, luminosite: 1 };
      updateSlider("theme-saturation", Math.round(forcesTheme.saturation * 100), (v) => v + "%");
      updateSlider("theme-luminosite", Math.round(forcesTheme.luminosite * 100), (v) => v + "%");
      updateSlider("desktop-dot-size", state.desktopDotSize, (v) => v + "px");
      updateSlider("topbar-text-size", state.topbarTextSize, (v) => v + "px");
      // LE MAXIMUM DU CURSEUR DE TEXTE SUIT L'ÉPAISSEUR DE LA BARRE (voir
      // ui::topbar::topbar_text_font_px_max) : il doit donc être remis à jour
      // ici, `updateSlider` ne touchant que la valeur et l'étiquette. Sans ces
      // lignes, épaissir la barre du haut laisserait le curseur buter sur
      // l'ancien plafond — et l'amincir le laisserait proposer une taille qui
      // déborde. Pas de garde « champ focalisé » ici : ce n'est pas une valeur
      // que l'utilisateur règle, mais une BORNE, et la retarder d'une frame
      // ferait clignoter le curseur pendant qu'on glisse l'épaisseur.
      const bornes = [
        ['topbar-text-size', state.topbarTextMaxPx],
        ...(state.secondaryScreens || []).map((s) => [`secondary-screen-topbar-text-size-${s.deviceName}`, s.topbarTextMaxPx]),
      ];
      for (const [dataKey, max] of bornes) {
        const inputEl = document.querySelector(`input[data-key="${dataKey}"]`);
        if (inputEl && max != null) inputEl.max = String(max);
      }
      updateSlider("zone-cell-margin", state.zoneCellMargin, (v) => v + "px");
      // Les curseurs PAR ZONE — leur `data-key` porte la CLÉ de la zone (voir la
      // section « Zones »), donc il faut les parcourir. Sans ces lignes, régler
      // une zone laisserait les valeurs des AUTRES figées à l'écran jusqu'au
      // prochain changement de structure.
      (state.zones || []).forEach((zone) => {
        updateSlider(`zone-cote-${zone.key}`, Math.round(zone.cote), (v) => (v === 0 ? "défait la zone" : v + "px"));
        updateSlider(`zone-columns-${zone.key}`, zone.columns, (v) => String(v));
      });
      updateSlider("separator-size", state.separatorSize, (v) => v + "px");
      updateSlider("preview-thumb-width", state.previewThumbWidth, (v) => v + "px");
      updateSlider("preview-fade-ms", state.previewFadeMs, (v) => v + " ms");
      updateSlider("desktop-preview-width", state.desktopPreviewWidth, (v) => v + "px");
      updateSlider("desktop-preview-fade-ms", state.desktopPreviewFadeMs, (v) => v + " ms");
      updateSlider("desktop-preview-hover-delay-ms", state.desktopPreviewHoverDelayMs, (v) => v + " ms");
      updateSlider("logo-fade-ms", state.logoFadeMs, (v) => v + " ms");
      updateSlider("logo-color-ms", state.logoColorMs, (v) => v + " ms");
      updateSlider("logo-turn-ms", state.logoTurnMs, (v) => (v / 1000).toFixed(1) + " s");
      updateSlider("logo-size", state.logoSizePct, (v) => v + " %");
      updateSlider("logo-zoom-amplitude", state.logoZoomAmplitudePct, (v) => "+" + v + " %");
      updateSlider("logo-zoom-ms", state.logoZoomMs, (v) => (v / 1000).toFixed(1) + " s");
      updateSlider("logo-zoom-interval-ms", state.logoZoomIntervalMs, (v) => (v / 1000).toFixed(1) + " s");
      updateSlider("running-dot-size", state.runningDotSize, (v) => v + "px");
      updateSlider("running-dot-offset", state.runningDotOffset, (v) => (v > 0 ? "+" : "") + v + "px");
      updateSlider("icon-margin", state.iconMargin, (v) => v + "px");
      for (const quel of ["saturation", "luminosite", "transparence"]) {
        updateSlider("running-dot-" + quel, state.runningDotReglages[quel], (v) => v + " %");
      }
      updateSlider("fondu-haut-gauche", state.fonduHautGauche, (v) => (Number(v) === 0 ? "aucun" : v + "px"));
      updateSlider("fondu-haut-droite", state.fonduHautDroite, (v) => (Number(v) === 0 ? "aucun" : v + "px"));
      updateSlider("ombre-barre-haut", state.ombreBarreHaut, (v) => (Number(v) === 0 ? "aucune" : v + "px"));
      updateSlider("ombre-barre-haut-force", state.ombreBarreHautForce, (v) => v + " %");
      updateSlider("ombre-couleur-intensite", state.ombreCouleurIntensite, (v) => v + " %");
      updateSlider("ombre-noire-intensite", state.ombreNoireIntensite, (v) => v + " %");
      updateSlider("ombre-couleur-haut", state.ombreCouleur.largeurHaut, (v) => (Number(v) === 0 ? "aucune" : v + "px"));
      updateSlider("ombre-couleur-haut-force", state.ombreCouleur.forceHaut, (v) => v + " %");
      for (const [route, o] of [["ombre-cotes", state.ombreCotes], ["ombre-couleur-cotes", state.ombreCouleur.cotes]]) {
        updateSlider(route + "-largeur", o.largeur, (v) => (Number(v) === 0 ? "aucune" : v + "px"));
        updateSlider(route + "-force", o.force, (v) => v + " %");
        updateSlider(route + "-largeur-bas", o.largeurBas, (v) => (Number(v) === 0 ? "aucune" : v + "px"));
        updateSlider(route + "-force-bas", o.forceBas, (v) => v + " %");
      }
      updateSlider("top-icon-scale", state.topIconScale, (v) => v + "%");
      updateSlider("bottom-icon-scale", state.bottomIconScale, (v) => v + "%");
      updateSlider("left-icon-scale", state.leftIconScale, (v) => v + "%");
      if (state.coinsEcran) updateSlider("coins-ecran-rayon", state.coinsEcranRayon, (v) => v + "px");
      updateSegmented("running-dot-shape", state.runningDotShape);
      updateSegmented("ombre-couleur-affichee", state.ombreCouleurAffichee ? "affichee" : "reglee");
      if (state.ombreCentreHaut) {
        const c = state.ombreCentreHaut;
        updateSlider("ombre-centre-haut-largeur", c.largeur, (v) => v + " %");
        updateSlider("ombre-centre-haut-transparence", c.transparence, (v) => v + " %");
        updateSegmented("ombre-centre-haut-arrondi", c.arrondi ? "1" : "0");
        for (const quel of ["coloree", "noire"]) {
          updateSlider("ombre-centre-haut-" + quel + "-largeur", c[quel].largeur, (v) => v + " %");
          updateSlider("ombre-centre-haut-" + quel + "-force", c[quel].force, (v) => v + " %");
        }
      }
      {
        const m = state.runningDotColor.mode;
        updateSegmented("running-dot-color-mode", m === "auto" || m === "degrade" ? m : "perso");
      }
      updateSegmented("lueurs-effet", state.lueur ? state.lueursEffet : null);
      // La FORME de chaque moment animé (voir `effets::Effet`) : sans ces
      // lignes, le bouton surligné resterait l'ancien — le défaut déjà payé sur
      // le thème d'icônes.
      updateSegmented("effet-ouverture-style", state.effetOuvertureStyle);
      updateSegmented("effet-fermeture-style", state.effetFermetureStyle);
      updateSegmented("effet-reduction-style", state.effetReductionStyle);
      updateSegmented("effet-agrandissement-style", state.effetAgrandissementStyle);
      // ⭐ Choisir une forme ALLUME l'effet (voir l'action `effet-…-style`) :
      // la case au-dessus doit le montrer sans reconstruire la page.
      updateCheckbox("effet-ouverture", state.effetOuverture);
      updateCheckbox("effet-fermeture", state.effetFermeture);
      updateCheckbox("effet-bascule", state.effetBascule);
      updateSegmented("style", state.style);
      updateSegmented("police", state.police);
      const policeDuStyle = document.getElementById("police-du-style");
      if (policeDuStyle) policeDuStyle.textContent = "Police du style (" + state.policeDuStyle + ")";
      // La police des TERMINAUX : sa surbrillance, comme celle de l'interface.
      // Sans cette ligne le bouton surligné resterait l'ancien — le défaut déjà
      // payé sur le thème d'icônes deux lignes plus bas.
      updateSegmented("terminal-police", state.policeTerminal || "");
      // ⛔ Oubliée jusqu'au 2026-10-11 : le thème d'icônes changeait, mais le
      // bouton surligné restait l'ancien (défaut signalé).
      updateSegmented("icones", state.icones);
      updateSegmented("texture-nature", state.textureNature);
      updateSlider("texture-force", state.textureForce, (v) => v + " %");
      updateSlider("texture-echelle", state.textureEchelle, (v) => v + " %");
      updateSlider("texture-clarte", state.textureClarte, libelleClarteTexture);
      updateSlider("texture-teinte", state.textureTeinte, libelleTeinteTexture);
      updateSegmented("texture-terminaux-nature", state.textureTerminaux.nature);
      updateSlider("texture-terminaux-force", state.textureTerminaux.force, (v) => v + " %");
      updateSlider("texture-terminaux-echelle", state.textureTerminaux.echelle, (v) => v + " %");
      updateSlider("texture-terminaux-clarte", state.textureTerminaux.clarte, libelleClarteTexture);
      updateSlider("texture-terminaux-teinte", state.textureTerminaux.teinte, libelleTeinteTexture);
      // La zone de destination des ajouts du Dash — même rôle que ci-dessus : le
      // DOM n'est pas reconstruit quand seule la SÉLECTION change.
      updateSegmented(
        "dash-add-zone",
        state.dashAddZone === null || state.dashAddZone === undefined ? "none" : String(state.dashAddZone),
      );
      updateSlider("blur-passes", state.blurPasses, (v) => String(v));
      // Pas d'entrée pour "blur-material" ici : c'est un sélecteur
      // multi-boutons, pas un curseur — sa classe `selected` est couverte
      // par `computeStructureKey` (voir plus haut) qui déclenche un
      // `rebuild()` complet à chaque changement de matériau.
      updateSlider("dash-icon-scale", state.dashIconScalePercent, (v) => v + "%");
      updateSlider("dash-label-scale", state.dashLabelScalePercent, (v) => v + "%");
      updateSlider("dash-category-scale", state.dashCategoryScalePercent, (v) => v + "%");
      updateSlider("clipboard-thumb-scale", state.clipboardThumbScalePercent, (v) => v + "%");
      updateSlider("clipboard-text-scale", state.clipboardTextScalePercent, (v) => v + "%");
      updateSlider("notes-text-scale", state.notesTextScalePercent, (v) => v + "%");
      updateSlider("notes-image-scale", state.notesImageScalePercent, (v) => v + "%");
      updateSlider("settings-content-scale", state.settingsContentScalePercent, (v) => v + "%");
      updateSlider("settings-content-width", state.settingsContentWidthPercent ?? 100, (v) => v + "%");
      updateSlider("taille-textes", state.tailleTextesPercent, (v) => v + "%");
      updateSlider("taille-notifications", state.tailleNotificationsPercent, (v) => v + "%");
      for (const [, panneau] of PANEL_SCALE_TARGETS) {
        updateSlider("panel-content-scale-" + panneau, state.panelContentScalePercents[panneau], (v) => v + "%");
      }
      // Section « Transparence et flou » (voir sa `section`). L'ordre de ces
      // appels n'est qu'une lisibilité : chacun retrouve son curseur par sa `data-key`.
      updateSlider("dash-tint", state.dashTintPercent, (v) => v + "%");
      updateSlider("popup-alpha", state.popupAlphaPercent, (v) => v + "%");
      updateSlider("popup-fond-alpha", state.popupFondAlphaPercent ?? 100, (v) => v + "%");
      updateSlider("menu-fade-ms", state.menuFadeMs, (v) => v + " ms");
      updateSlider("menu-scale", state.menuScalePercent, (v) => v + "%");
      updateSlider("menu-corner-radius", state.menuCornerRadius, (v) => v + "px");
      updateSlider("menu-tint", state.menuTintPercent, (v) => v + "%");
      // Ordre du DOM : "Animation au survol" se place juste après "Apparence
      // des menus" ci-dessus (voir sa `section`).
      updateSlider("hover-scale", state.hoverScalePercent, (v) => v + "%");
      updateSlider("hover-ease-speed", state.hoverEaseSpeed, (v) => String(v));
      const tirages = state.tiragesPercent || [100, 100, 100];
      TIRAGES.forEach(([cle], rang) => updateSlider("tirage-" + cle, tirages[rang], (v) => v + "%"));
      updateSlider("clock-hover-scale", state.clockHoverScalePercent, (v) => v + "%");
      // Le fond au survol des icônes fermées (voir sa case dans la même
      // section). ⚠️ `updateSlider` sur un curseur ABSENT (case décochée) ne
      // fait rien — la section n'est reconstruite qu'au changement de
      // structure, et c'est `survolFondActif` qui la déclenche.
      updateSlider("survol-fond-opacite", state.survolFondOpacitePercent, (v) => v + "%");
      // La pression sur le processeur et le GPU (voir sa section). Le profil
      // peut devenir "" quand un curseur est déplacé : `updateSegmented` éteint
      // alors tous les boutons, ce qui est exactement ce qu'il faut dire.
      updateSegmented("performances-preset", state.performancesPreset);
      updateSlider("performances-cadence", state.performancesCadence || 144, (v) => v + " i/s");
      updateSlider("tooltip-scale", state.tooltipScalePercent, (v) => v + "%");
      updateSlider("tooltip-fade-ms", state.tooltipFadeMs, (v) => v + " ms");
      updateSlider("tooltip-delay", state.tooltipDelaySecs, (v) => v + " s");
      updateSlider("scroll-step-left", state.scrollStepLeftPx, (v) => v + " px");
      updateSlider("scroll-step-right", state.scrollStepRightPx, (v) => v + " px");
      if (state.empilement) {
        updateSlider("empilement-duree", state.empilement.duree, (v) => v + " ms");
      }
      updateSlider("fullscreen-clock-bar-scale", state.fullscreenClockBarScalePercent, (v) => v + "%");
      updateSlider("fullscreen-clock-text-scale", state.fullscreenClockTextScalePercent, (v) => v + "%");
      updateSlider("fullscreen-clock-decalage-x", state.fullscreenClockDecalage[0], (v) => (v > 0 ? "+" : "") + v + " px");
      updateSlider("fullscreen-clock-decalage-y", state.fullscreenClockDecalage[1], (v) => v + " px");
      ["top", "left", "right"].forEach((bar, i) => {
        updateSlider(`bar-tint-${bar}`, state.barTintPercent[i], (v) => v + "%");
        updateSlider(`bar-size-${bar}`, state.barSizes[i], (v) => v + "px");
      });
      if (state.degradeEnabled) {
        for (const entree of DEGRADE_REGLAGES) updateSlider("degrade-" + entree[0], state.degradeReglages[entree[0]], degradeValeur(entree));
        for (const b of document.querySelectorAll("[data-degrade-couleur]")) {
          b.style.background = "#" + state.degradeCouleurs[Number(b.getAttribute("data-degrade-couleur"))];
        }
      }
      // Champs hexadécimaux : mêmes garanties que les curseurs (jamais
      // réécrits pendant que l'utilisateur tape dedans).
      for (const input of document.querySelectorAll("input.hex")) {
        if (document.activeElement === input) continue;
        const target = input.getAttribute("data-hex-target");
        const value = hexForTarget(target);
        if (value !== null && input.value !== value) input.value = value;
      }
      // Dégradés teinte/saturation/valeur (voir `gradientPicker`) — même
      // garantie, via `draggingGradientTarget` plutôt que `activeElement`
      // (un `<div>` glissé n'est jamais le focus DOM).
      for (const [target, sync] of Object.entries(gradientSyncers)) {
        if (target === draggingGradientTarget) continue;
        const value = hexForTarget(target);
        if (value !== null) sync(value);
      }
      // Cases à cocher simples — reconstruites seulement si leur PRÉSENCE
      // change (voir structureKey), sinon juste synchronisées ici.
      // (Les cases de ce panneau n'ont pas d'identifiant dédié : un
      // rafraîchissement structurel les couvre déjà dans la quasi-totalité
      // des cas réels — un clic sur une case DÉCLENCHE lui-même le nouvel
      // état affiché côté JS avant même l'aller-retour Rust.)
    }

    // Cible dynamique `"secondary:<device_name>:<bar>"` (voir
    // `apply_secondary_color_target` côté Rust) — résout vers la couleur
    // ACTUELLE de cet écran/cette barre dans `state.secondaryScreens`, ou
    // `null` si absente (`hexForTarget` gère déjà ce cas : pas de
    // synchronisation tant qu'aucune valeur connue).
    function secondaryHexForTarget(deviceName, bar) {
      const screen = (state.secondaryScreens || []).find((s) => s.deviceName === deviceName);
      if (!screen) return null;
      if (bar === "topbar_text") return screen.topbarTextColor;
      // `bar === "separator"` — MANQUAIT ici (BUG RÉEL CORRIGÉ : "la couleur
      // ... bugguent pour les barres secondaires"). Sans ce cas, le dernier
      // `return` ci-dessous exécutait `screen.colors[undefined]` (car
      // `barIndex` valait `undefined` pour "separator", absent de la table
      // `bar_top`/`bar_left`/`bar_right`) — `undefined`, PAS `null`, ce qui
      // passait quand même le test `value !== null` de `updateValues()` et
      // écrasait le `colorPicker`/champ hex du séparateur secondaire avec
      // une valeur invalide À CHAQUE frame (curseur du dégradé qui saute,
      // champ hex qui affiche littéralement "undefined") — alors que côté
      // barre PRIMAIRE (voir `hexForTarget` plus bas, même défaut) le même
      // cas manquant retombait sur `null` (pas de case "separator" du tout),
      // qui LUI passe le test en échec et n'écrase donc rien : d'où un bug
      // visible seulement sur les écrans secondaires. Ne renvoie une couleur
      // que si un réglage manuel "custom" existe pour cet écran (sinon
      // `null`, même convention que `bar_top`/... ci-dessus) — voir
      // `secondaryScreenSeparatorColor`.
      if (bar === "separator") {
        return screen.separatorColor && screen.separatorColor.mode === "custom" ? screen.separatorColor.hex : null;
      }
      const barIndex = { bar_top: 0, bar_left: 1, bar_right: 2 }[bar];
      return screen.colors ? screen.colors[barIndex] : null;
    }

    function hexForTarget(target) {
      if (target.startsWith("degrade:")) return state.degradeCouleurs[Number(target.slice(8))] ?? null;
      if (target.startsWith("secondary:")) {
        const [, deviceName, bar] = target.split(":");
        return secondaryHexForTarget(deviceName, bar);
      }
      if (target === "theme_base_color") return state.themeBaseColor;
      if (target === "topbar_text") return state.topbarTextColor;
      if (target === "popup") return state.menuColor;
      if (target === "bar_top") return state.barColors[0];
      if (target === "bar_left") return state.barColors[1];
      if (target === "bar_right") return state.barColors[2];
      // Voir la doc de `secondaryHexForTarget` ci-dessus, même correctif —
      // manquait ici aussi pour la barre PRIMAIRE : `colorPicker`/champ hex
      // du séparateur ne se resynchronisaient jamais (p.ex. après "Couleur
      // d'accentuation Windows") faute de ce cas (repli silencieux sur
      // `null` en bout de fonction, qui évitait le crash visible mais
      // laissait quand même le widget figé sur une valeur périmée).
      if (target === "separator") return state.separatorColor.mode === "custom" ? state.separatorColor.hex : null;
      // Indicateur d'application ouverte : le selecteur n'existant qu'en mode
      // personnalise (voir `primaryRunningDotColor`), il n'a de valeur a
      // resoudre que dans ce cas.
      if (target === "centre_haut") return state.ombreCentreHaut ? state.ombreCentreHaut.hex : null;
      if (target === "verr_num") return state.verrous.num;
      if (target === "verr_maj") return state.verrous.maj;
      if (target === "running_dot") return state.runningDotColor.mode === "custom" ? state.runningDotColor.hex : null;
      // Le fond au survol des icônes fermées — cible dédiée, sans préfixe :
      // elle n'appartient à aucun panneau (voir `apply_color_to_target`).
      if (target === "survol") return state.survolFondColor;
      if (target === "dash") return state.accents.dash.background;
      if (target === "settings") return state.accents.settings.background;
      if (target === "clipboard") return state.accents.clipboard.background;
      if (target === "notes") return state.accents.notes.background;
      if (target === "calendar") return state.accents.calendar.background;
      if (state.accents[target]) return state.accents[target].background;
      if (target === "dash_palette") return state.accents.dash.palette;
      if (target === "settings_palette") return state.accents.settings.palette;
      if (target === "clipboard_palette") return state.accents.clipboard.palette;
      if (target === "notes_palette") return state.accents.notes.palette;
      if (target === "calendar_palette") return state.accents.calendar.palette;
      if (target.endsWith("_palette") && state.accents[target.slice(0, -8)]) return state.accents[target.slice(0, -8)].palette;
      if (target.endsWith("_palette") && state.accents[target.slice(0, -8)]) return state.accents[target.slice(0, -8)].palette;
      return null;
    }

    // `catalog` arrive maintenant DANS `next.catalog`, à chaque appel de
    // `setState` (voir `win32::cef_settings::push_state`, doc de champ) —
    // BUG RÉEL CORRIGÉ : un ancien `window.setCatalog` séparé, appelé une
    // seule fois à l'ouverture côté Rust, arrivait parfois AVANT que ce
    // script ait fini de s'exécuter (chargement de page asynchrone), donc
    // avant même que cette fonction existe — l'appel échouait
    // silencieusement et `catalog` restait vide pour toujours (les 48
    // couleurs Windows et les 120 thèmes n'apparaissaient jamais).
    window.setState = function (next) {
      state = next;
      catalog = next.catalog;
      // Voir --content-scale (en-tête <style>) et win32::cef_settings::
      // push_state — curseur "Contenu" de la sous-section "Réglages (ce
      // panneau)". Poussé à chaque frame comme le reste de `state` (voir la
      // doc d'en-tête), donc pris en compte dès le prochain relâchement du
      // curseur sans logique séparée.
      //
      // `settingsContentScaleEffectivePercent` et NON `...ScalePercent` : le
      // premier est l'échelle RÉELLEMENT rendue (celle de l'écran quand il a la
      // sienne, voir win32::cef_settings::SCREEN_SCALE_OVERRIDE), le second est
      // le réglage GLOBAL qu'édite le curseur "Contenu". Un seul champ portait
      // les deux sens — DÉFAUT RÉEL : sur un écran à échelle manuelle, le
      // curseur affichait la valeur de l'écran et ne pouvait donc jamais tenir
      // celle qu'on venait de glisser.
      //
      // Le repli `??` couvre une page servie avec un binaire plus ancien (les
      // deux vivent dans le même dossier mais rien ne le garantit au
      // démarrage) : sans lui, `undefined / 100` écrirait « NaN », `zoom:
      // NaN` serait purement ignoré et le panneau s'afficherait à l'échelle 1
      // — une panne silencieuse, sans erreur nulle part.
      const effectiveScalePercent = next.settingsContentScaleEffectivePercent ?? next.settingsContentScalePercent;
      document.documentElement.style.setProperty("--content-scale", effectiveScalePercent / 100);
      document.documentElement.style.setProperty("--page-scale", next.pageScale ?? 1);
      // Le repli `?? 100` : même raison que celui de l'échelle juste au-dessus.
      document.documentElement.style.setProperty("--zone-largeur", (next.settingsContentWidthPercent ?? 100) / 100);
      render();
    };
  </script>
</body>
</html>
