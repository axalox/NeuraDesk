          .formatToParts(new Date()).find((p) => p.type === "timeZoneName");
        return part ? part.value : zone;
      } catch (e) { return zone; }
    }
    function heureDuFuseau(zone) {
      try {
        return new Intl.DateTimeFormat("fr-FR", { timeZone: zone, hour: "2-digit", minute: "2-digit" }).format(new Date());
      } catch (e) { return "?"; }
    }
    function sansAccents(texte) {
      return texte.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }
    function filtrerLesReglages() {
      const champ = document.getElementById("category-search");
      const mots = sansAccents(champ.value).split(/\s+/).filter(Boolean);
      const variantes = mots.map((m) => {
        const famille = SYNONYMES.find((f) => f.some((s) => s.startsWith(m) || m.startsWith(s)));
        return famille ? [m, ...famille] : [m];
      });
      const sections = document.querySelectorAll("#scroll > .section");
      // Le FILTRE DE GROUPE (sous-onglet) ne s'applique qu'à l'onglet « Interface »
      // et S'EFFACE dès qu'on cherche : la recherche traverse alors tous les
      // groupes. Une section sans groupe (rare : pas de `<h2>`) reste toujours là.
      const filtreGroupe = activeMainTab === "interface" && mots.length === 0;
      let visibles = 0;
      for (const box of sections) {
        // Les INFOBULLES comptent aussi : le curseur de transparence d'une barre
        // n'a pas d'autre texte que la sienne.
        const infobulles = [...box.querySelectorAll("[title]")].map((n) => n.title).join(" ");
        const texte = sansAccents(box.textContent + " " + infobulles);
        const dansLeGroupe = !filtreGroupe || !box.dataset.groupe || box.dataset.groupe === activeGroup;
        const garde = dansLeGroupe && variantes.every((v) => v.some((m) => texte.includes(m)));
        box.style.display = garde ? "" : "none";
        const bouton = box.id && document.querySelector(`#category-nav button[data-section="${box.id}"]`);
        if (bouton) bouton.style.display = garde ? "" : "none";
        if (garde) visibles++;
      }
      const vide = document.getElementById("category-vide");
      if (vide) vide.style.display = mots.length && !visibles ? "" : "none";
    }
    {
      const champ = document.getElementById("category-search");
      champ.addEventListener("input", () => {
        filtrerLesReglages();
        document.getElementById("scroll").scrollTop = 0;
      });
      champ.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && champ.value) {
          champ.value = "";
          filtrerLesReglages();
          e.stopPropagation();
        }
      });
    }

    function renderScroll() {
      const scroll = document.getElementById("scroll");
      scroll.replaceChildren();
      sectionCategories = [];
      sectionIdCounter = 0;
      if (activeMainTab === "interface") {
        renderInterfaceSections(scroll);
        // Réordonne par groupe puis ordre cartésien (voir `ordonnerCartesien`) —
        // seulement l'onglet Interface ; les sections d'écran gardent leur ordre.
        ordonnerCartesien(scroll);
      } else {
        renderSecondaryScreenSection(scroll, activeMainTab);
      }
      renderCategoryNav();
    }

    function renderInterfaceSections(scroll) {
      // Fonctionnalités
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Fonctionnalités"]));
        box.appendChild(
          el("p", { class: "hint" }, [
            "Active ou désactive individuellement chaque icône de la barre du haut et chaque dash.",
          ]),
        );
        // `TOPBAR_FEATURES`/`DASH_FEATURES` : voir leur déclaration à portée
        // de module plus haut — `TOPBAR_FEATURES` sert aussi de base à
        // `SECONDARY_TOPBAR_FEATURES` (voir `secondaryScreenFeatures`), un
        // sous-ensemble filtré pour les écrans secondaires ; `DASH_FEATURES`,
        // elle, n'est plus utilisée QUE ci-dessous, pour la barre PRIMAIRE
        // (voir la doc de `secondaryScreenFeatures`).
        const cols = el("div", { class: "feature-columns" });
        const topBar = el("div");
        topBar.appendChild(el("h3", {}, ["Barre du haut"]));
        for (const [name, label] of TOPBAR_FEATURES) {
          if (name === "recherche" && !state.everythingInstalle) continue;
          // ⛔ **PAS DE NAPS2, PAS DE SCANNER** : proposer la case serait
          // proposer un applet dont tous les boutons échouent. Même règle
          // que la Recherche juste au-dessus.
          if (name === "scanner" && !state.naps2) continue;
          checkboxRow(topBar, state.features[name], label, (checked) => go("feature", name, checked ? "1" : "0"));
        }
        const dashes = el("div");
        dashes.appendChild(el("h3", {}, ["Dashs"]));
        for (const [name, label] of DASH_FEATURES) {
          checkboxRow(dashes, state.features[name], label, (checked) => go("feature", name, checked ? "1" : "0"));
        }
        // ⛔ **LES LOGICIELS QUI MANQUENT À NOS APPLETS** (voir
        // `win32::outils_applets`, qui porte la table ET les URL).
        //
        // ⚠️ **UN `<button>`, PAS UN `<a href>`** : un lien ferait NAVIGUER cette
        // page vers le web — le panneau Réglages disparaîtrait, remplacé par une
        // page rendue HORS ÉCRAN, sans barre d'adresse pour revenir. Le bouton
        // émet un rang, et Rust ouvre le navigateur.
        //
        // ⚠️ **LE RANG, JAMAIS L'URL** : l'adresse vient de la table Rust, donc
        // une page qui divergerait ne peut pas faire ouvrir ce qu'elle veut.
        const manquants = state.outilsManquants || [];
        if (manquants.length > 0) {
          const suggestions = el("div");
          suggestions.appendChild(el("h3", {}, ["Suggestions"]));
          for (let rang = 0; rang < manquants.length; rang++) {
            const ligne = el("div", { class: "suggestion" });
            ligne.appendChild(el("span", {}, [
              manquants[rang].applet + " : il manque " + manquants[rang].logiciel + ".",
            ]));
            const bouton = el("button", {}, ["Où le trouver"]);
            bouton.addEventListener("click", () => go("ouvrir-lien", String(rang)));
            ligne.appendChild(bouton);
            suggestions.appendChild(ligne);
          }
          cols.appendChild(suggestions);
        }
        cols.appendChild(topBar);
        cols.appendChild(dashes);
        box.appendChild(cols);
      });

      // ⭐ TRANSPARENCE ET FLOU — DEMANDE EXPLICITE (2026-10-15) : « regroupe
      // opacité et flou dans une catégorie plus haut ». Ils étaient éparpillés en
      // QUATRE endroits, au milieu d'une soixantaine de catégories : « Flou »,
      // « Transparence des panneaux », la « Transparence » d'« Apparence des
      // menus », et un curseur SANS ÉTIQUETTE dans le titre de chaque « Couleur de
      // la barre … ». Chacun est DÉPLACÉ ici, jamais copié : `updateSlider` ne
      // renseigne que le PREMIER curseur d'une `data-key` (le bug des quatre
      // copies de « Fond », voir plus bas).
      //
      // Les verbes et les clés sont ceux d'avant :
      // - Flou : `blur-passes` (profondeur de la pyramide, pour les deux
      //   algorithmes de gfx::material) et `blur-material` — des BOUTONS : les
      //   matériaux ne forment pas un continuum, et chaque cran d'un curseur
      //   reconstruirait une pyramide GPU (voir gfx::material::MATERIALS).
      // - Panneaux : « Fond » = `dash_tint` (la teinte floutée du bureau derrière
      //   les quatre panneaux « fenêtre », voir win32::app) ; « Éléments » =
      //   `POPUP_ALPHA` (voir win32::cef_popup), un POURCENTAGE d'un
      //   multiplicateur : chaque alpha de chaque page est multiplié
      //   (`calc(<valeur> * var(--popup-alpha))`), donc la hiérarchie entre un
      //   survol et le repos reste lisible à tous les réglages. Plafond à 400 % —
      //   DEMANDE EXPLICITE, voir `win32::cef_popup::MAX_POPUP_ALPHA`.
      // - Menus : `menu-tint`, l'autre moitié de « Fond » — même sens de lecture
      //   (100 % = le plus transparent), voir win32::cef_settings, actions
      //   "dash-tint" (`1.0 - percent/100`) et "menu-tint".
      // - Barres : `bar-tint`, une par barre (les écrans secondaires ont la leur,
      //   onglet « Écran(s) »).
      //
      // BUG RÉEL SIGNALÉ, à ne pas refaire : « Fond » existait d'abord construit
      // à la main dans les QUATRE sections « Couleur de mise en avant », sans
      // étiquette ; `updateValues` ne renseignait que le premier
      // (`document.querySelector`).
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Transparence et flou"]));
        box.appendChild(el("div", { class: "small-label" }, ["Flou"]));
        slider(box, { label: "Intensité du flou", min: 1, max: 8, value: state.blurPasses, valueLabel: (v) => String(v), dataKey: "blur-passes", onInput: (v) => go("blur-passes", v) });
        box.appendChild(el("div", { class: "small-label" }, ["Matériau"]));
        const choices = el("div", { class: "size-choices" });
        state.blurMaterialLabels.forEach((label, i) => {
          choices.appendChild(el("button", {
            class: state.blurMaterialIndex === i ? "selected" : "",
            onclick: () => go("blur-material", String(i)),
          }, [label]));
        });
        box.appendChild(choices);
        box.appendChild(el("p", { class: "hint" }, [
          "Mica et Givré sont les plus sobres ; Verre liquide et Frutiger Aero ajoutent reflets et brillance. Le matériau module aussi légèrement l'opacité, sans modifier les réglages de transparence ci-dessous.",
        ]));
        box.appendChild(el("div", { class: "small-label" }, ["Panneaux (Dash, Réglages, Presse-papiers, Notes)"]));
        slider(box, { label: "Fond", min: 0, max: 100, step: 5, value: state.dashTintPercent, valueLabel: (v) => v + "%", dataKey: "dash-tint", onInput: (v) => go("dash-tint", v) });
        box.appendChild(el("div", { class: "small-label" }, ["Éléments de toutes les pages (panneaux, applets, menus)"]));
        slider(box, { label: "Opacité des textes", min: 20, max: 400, value: state.popupAlphaPercent, valueLabel: (v) => v + "%", dataKey: "popup-alpha", onInput: (v) => go("popup-alpha", v) });
        // Second curseur — DEMANDE EXPLICITE (2026-10-23) : « gérer le fond des
        // zones indépendamment du texte » (voir `cef_popup::POPUP_FOND_ALPHA`).
        // Descend jusqu'à 0 : un fond peut disparaître, son texte reste.
        slider(box, { label: "Fond des zones", min: 0, max: 400, value: state.popupFondAlphaPercent ?? 100, valueLabel: (v) => v + "%", dataKey: "popup-fond-alpha", onInput: (v) => go("popup-fond-alpha", v) });
        box.appendChild(el("p", { class: "hint" }, ["« Fond » porte sur la teinte du bureau floutée derrière les panneaux (à 100 %, elle disparaît). « Opacité des textes » règle tous les textes ; « Fond des zones » règle les aplats, les bords et les boutons, indépendamment du texte. À 100 %, le rendu est celui d'origine ; plus bas, tout s'efface ensemble en gardant ses écarts. La COULEUR du fond se règle panneau par panneau, dans la section « Couleur de mise en avant »."]));
        box.appendChild(el("div", { class: "small-label" }, ["Menus"]));
        slider(box, { label: "Transparence des menus", min: 0, max: 100, step: 5, value: state.menuTintPercent, valueLabel: (v) => v + "%", dataKey: "menu-tint", onInput: (v) => go("menu-tint", v) });
        box.appendChild(el("div", { class: "small-label" }, ["Barres"]));
        [["top", "du haut"], ["left", "de gauche"], ["right", "de droite"], ["bottom", "du bas"]].forEach(([bar, label], i) => {
          slider(box, { label: `Barre ${label}`, min: 0, max: 100, step: 5, value: state.barTintPercent[i], valueLabel: (v) => v + "%", dataKey: `bar-tint-${bar}`, onInput: (v) => go("bar-tint", bar, v) });
        });
        box.appendChild(el("p", { class: "hint" }, ["Fond, menus et barres : 100 % = le plus transparent. « Opacité des textes » et « Fond des zones » vont dans l'autre sens : plus haut, plus opaque. La transparence des barres d'un écran secondaire se règle dans son onglet."]));
      });

      // Sons des rappels — DEMANDE EXPLICITE (2026-09-24) : « j'aimerais pouvoir
      // choisir les alarmes pour les rappels de notes et les rappels de dates ».
      //
      // ⚠️ **UN SON PAR FAMILLE, ET LE RÉGLAGE VIT ICI** — il vivait au-dessus du
      // panneau Notes, où il n'y en avait qu'un pour tout. Depuis que les deux
      // familles ont chacune leur icône et leur clignotement, on doit pouvoir
      // reconnaître à l'oreille laquelle sonne (voir `config::FamilleRappel`).
      //
      // ⚠️ **LA PAGE NE CONNAÎT QUE LE RANG** dans la liste poussée par Rust —
      // jamais un chemin, qui contient le dossier de l'utilisateur (voir
      // `cef_settings::sons_json`, même motif que les sons du Dash).
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Sons des rappels"]));
        box.appendChild(
          el("p", { class: "hint" }, [
            "Le son joué tant qu'un rappel attend d'être acquitté — un réglage par famille : les rappels de notes (l'icône à gauche de l'horloge) et les rappels de dates et de fêtes (la cloche, à droite).",
          ]),
        );
        const sons = state.sons || [];
        if (!sons.length) {
          box.appendChild(
            el("p", { class: "hint" }, [
              "Aucun son dans le dossier « son », à côté de l'exécutable : déposez-y des .mp3 ou des .wav.",
            ]),
          );
          return;
        }
        // ⛔ **PAS DE `<select>` ICI, ET C'EST UNE CORRECTION.** La première version
        // en utilisait un, et l'utilisateur a rapporté : « je ne peux pas interagir
        // avec les sélecteurs de sons ni les boutons de lecture ». La cause est
        // STRUCTURELLE : en rendu hors écran, un `<select>` n'a pas de fenêtre où
        // dérouler sa liste. CEF le demande à l'hôte par `OnPopupShow` /
        // `OnPopupSize`, puis peint la liste à part (`OnPaint`, `PET_POPUP`) —
        // **et ce dépôt n'implémente AUCUN de ces trois rappels** (vérifié : rien
        // dans `src/`). Le contrôle ne s'ouvre donc jamais, et paraît mort.
        //
        // ⚠️ **C'est aussi pourquoi le `<select>` qui vivait au-dessus du panneau
        // Notes n'a jamais pu servir** — son gestionnaire était mort lui aussi
        // (voir `el()` ci-dessus), ce qui a masqué le problème deux fois.
        //
        // On emploie donc ce que cette application utilise pour TOUS ses choix :
        // des boutons, marqués `selected` (mêmes idiomes que les thèmes et les
        // préréglages Windows).
        //
        // **ET L'ÉCOUTE EST PAR SON, PAS SUR LE CHOIX COURANT** — DEMANDE
        // EXPLICITE : « un bouton de lecture à côté de chaque sélecteur de son pour
        // les écouter ». Avec un `▶` sur chaque ligne, on écoute avant de choisir,
        // et on compare deux fichiers sans rien changer.
        // ⚠️ **LA PASTILLE DE CHOIX, ET C'EST ELLE QUI FAIT LE SÉLECTEUR.**
        // Signalé par l'utilisateur : « il n'y a plus de sélecteur de son ». La
        // première version listait les noms en boutons SANS bordure ni fond, donc
        // **ils ressemblaient à du texte** : la section n'annonçait plus rien qui se
        // choisisse. Un rond vide ou plein (voir `.son-pastille`) dit « on choisit
        // UNE ligne », ce qu'un `<select>` disait par sa forme et qu'un nom nu ne
        // dit pas.
        const famille = (cle, libelle, verbe) => {
          box.appendChild(el("h3", {}, [libelle]));
          const liste = el("div", { class: "son-liste" }, []);
          for (const son of sons) {
            const choisi = !!son[cle];
            // La pastille ET le nom dans le MÊME bouton : cliquer l'un ou l'autre
            // choisit, ce qui évite de viser un rond de douze pixels.
            const nom = el("button", {
              class: "son-nom" + (choisi ? " choisi" : ""),
              title: choisi ? "Son choisi" : "Choisir ce son",
              onclick: () => go(verbe, String(son.index)),
            }, [
              el("span", { class: "son-pastille" + (choisi ? " choisi" : "") }, []),
              son.nom,
            ]);
            const ecouter = el("button", {
              class: "action son-ecouter",
              title: "Écouter",
              onclick: () => go("ecouter-son", String(son.index)),
            }, ["▶"]);
            liste.appendChild(el("div", { class: "son-ligne" }, [nom, ecouter]));
          }
          box.appendChild(liste);
        };
        famille("notes", "Rappels de notes", "son-notes");
        famille("dates", "Rappels de dates et de fêtes", "son-dates");
      });

      // Éditeur d'image — l'hébergeur de « Envoyer en ligne », DEMANDE EXPLICITE
      // (2026-09-25) : « un choix dans les Réglages ». La liste vient de Rust
      // (`Hebergeur::ALL`, voir `cef_settings::envoi_json`). ⚠️ La clé n'est
      // JAMAIS renvoyée à la page : seul `cleDefinie` dit qu'elle existe, d'où un
      // champ toujours vide, et `change` (pas `input`) pour ne l'écrire qu'une fois.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Éditeur d'image"]));
        // La fenêtre des actions après une capture (voir `win32::cef_capture`).
        checkboxRow(box, state.captureCarte !== false, "Après une capture, proposer les actions dans une fenêtre (sinon, ouvrir l'éditeur)", (checked) => go("capture-carte", checked ? "1" : "0"));
        box.appendChild(
          el("p", { class: "hint" }, [
            "Une vignette au coin de l'écran : copier, enregistrer, annoter, épingler, ou la glisser dans une autre application. Décoché, la capture s'ouvre directement dans l'éditeur.",
          ]),
        );
        const envoi = state.envoi;
        if (!envoi) return;
        box.appendChild(
          el("p", { class: "hint" }, [
            "Où part l'image quand on clique « Envoyer en ligne » dans l'éditeur. Envoyer, c'est PUBLIER : quiconque a le lien voit l'image. Le lien est copié dans le presse-papiers.",
          ]),
        );
        segmented(box, {
          label: "Hébergeur",
          options: envoi.services,
          value: envoi.service,
          dataKey: "envoi-service",
          onSelect: (v) => go("envoi-service", v),
        });
        const choisi = envoi.services.find((h) => h.value === envoi.service);
        if (!choisi) return;
        box.appendChild(el("p", { class: "hint" }, [choisi.description]));
        if (choisi.value === "litterbox") {
          segmented(box, {
            label: "Durée avant suppression",
            options: envoi.durees.map((d) => ({ value: d, label: d.replace("h", " h") })),
            value: envoi.duree,
            dataKey: "envoi-duree",
            onSelect: (v) => go("envoi-duree", v),
          });
        }
        if (choisi.cle) {
          box.appendChild(el("div", { class: "label" }, [choisi.cle + (choisi.cleDefinie ? " — enregistrée" : " — requise")]));
          const champ = el("input", {
            type: "password", class: "zone-name", autocomplete: "off",
            placeholder: choisi.cleDefinie ? "Coller une nouvelle clé pour la remplacer" : "Coller la clé ici",
          });
          champ.addEventListener("change", () => {
            if (champ.value.trim()) go("envoi-cle", choisi.value, champ.value.trim());
          });
          box.appendChild(champ);
          if (choisi.cleDefinie) {
            box.appendChild(el("button", { class: "action", onclick: () => go("envoi-cle", choisi.value, "") }, ["Effacer la clé"]));
          }
        }
        if (choisi.value === "perso") serveurPerso(box, envoi.perso);
      });

      // Le SERVEUR PERSONNALISÉ, DEMANDE EXPLICITE (2026-09-25) : « la
      // possibilité d'utiliser un serveur personnalisé » — un « custom uploader »
      // de ShareX (voir `envoi_image::ServeurPerso`). L'adresse, le champ et le
      // lien se relisent ; les en-têtes, champs et paramètres NON : Rust n'envoie
      // que leurs NOMS (un jeton y vit en général), d'où des zones toujours vides
      // qui REMPLACENT tout à l'enregistrement.
      function serveurPerso(box, perso) {
        // `.zone-name` est taillé pour renommer une zone (indenté, 320 px) : une
        // adresse ou un en-tête y serait tronqué — ici, toute la largeur.
        const pleineLargeur = (champ) => {
          champ.style.margin = "2px 0 10px 0";
          champ.style.maxWidth = "none";
          champ.style.width = "100%";
          champ.style.boxSizing = "border-box";
        };
        const texte = (label, valeur, placeholder, action) => {
          box.appendChild(el("div", { class: "label" }, [label]));
          const champ = el("input", { type: "text", class: "zone-name", autocomplete: "off", spellcheck: "false", placeholder });
          champ.value = valeur;
          pleineLargeur(champ);
          champ.addEventListener("change", () => go(action, champ.value.trim()));
          box.appendChild(champ);
        };
        const zone = (label, noms, placeholder, action, bouton) => {
          const connus = noms.length ? " — enregistrés : " + noms.join(", ") : "";
          box.appendChild(el("div", { class: "label" }, [label + connus]));
          const champ = el("textarea", { class: "zone-name", rows: "3", spellcheck: "false", placeholder });
          pleineLargeur(champ);
          champ.style.resize = "vertical";
          champ.style.fontFamily = "Consolas, monospace";
          box.appendChild(champ);
          const ligne = el("div", { class: "row" }, [
            el("button", { class: "action", onclick: () => go(action, champ.value) }, [bouton]),
          ]);
          if (noms.length && action !== "envoi-perso-sxcu") {
            ligne.appendChild(el("button", { class: "action", onclick: () => go(action, "") }, ["Tout effacer"]));
          }
          box.appendChild(ligne);
        };
        zone("Importer un fichier ShareX (.sxcu)", [], "Coller ici le contenu du fichier .sxcu fourni par le serveur", "envoi-perso-sxcu", "Importer");
        texte("Adresse d'envoi (POST)", perso.url, "https://images.exemple.fr/api/upload", "envoi-perso-url");
        if (perso.url.startsWith("http://")) {
          box.appendChild(el("p", { class: "hint" }, ["⚠️ Adresse en http:// : l'image et le jeton circulent EN CLAIR. À réserver au réseau local."]));
        }
        if (perso.parametres.length) {
          box.appendChild(el("p", { class: "hint" }, ["Paramètres d'URL enregistrés : " + perso.parametres.join(", ") + " (ressaisir l'adresse les remplace)."]));
        }
        texte("Nom du champ du fichier", perso.champ, "file", "envoi-perso-champ");
        texte("Lien dans la réponse", perso.lien, "vide = réponse en texte ; data.link ; {json:files[0].url}", "envoi-perso-lien");
        zone("En-têtes", perso.entetes, "Authorization: votre-jeton\n(un par ligne)", "envoi-perso-entetes", "Enregistrer les en-têtes");
        zone("Champs du formulaire", perso.champs, "nom=valeur\n(un par ligne)", "envoi-perso-champs", "Enregistrer les champs");
        if (perso.message) {
          const p = el("p", { class: "hint" }, [(perso.message.erreur ? "⛔ " : "✓ ") + perso.message.texte]);
          if (perso.message.erreur) p.style.color = "#ff8a80";
          box.appendChild(p);
        }
      }

      // Style : les FORMES de l'interface (coins, contours, police), un axe
      // indépendant des couleurs — comme « Style d'application » sous KDE.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Style"]));
        box.appendChild(
          el("p", { class: "hint" }, ["La forme des éléments de l'interface. Les couleurs se choisissent dans Thèmes, juste en dessous."]),
        );
        segmented(box, {
          options: state.styles,
          value: state.style,
          dataKey: "style",
          onSelect: (v) => go("style", v),
        });
        // ⭐ LES COINS ARRONDIS DE LA ZONE PRINCIPALE — DEMANDE EXPLICITE
        // (2026-10-12). Leur rayon suit le style (voir `ui::dock::rayon_conge`).
        checkboxRow(box, state.coinsZone, "Arrondir les coins de la zone principale (suivent le style)", (checked) => go("coins-zone", checked ? "1" : "0"));
        // ⭐ LES COINS NOIRS DES ÉCRANS — DEMANDE EXPLICITE (2026-10-14) : « des
        // coins arrondis noirs permanents [...] avec une option pour les
        // désactiver ». Actifs par défaut (voir `win32::coins_ecran`).
        checkboxRow(box, state.coinsEcran, "Coins arrondis noirs aux coins de chaque écran", (checked) => go("coins-ecran", checked ? "1" : "0"));
        if (state.coinsEcran) {
          slider(box, {
            label: "Rayon des coins d'écran",
            min: state.coinsEcranRayonBounds.min, max: state.coinsEcranRayonBounds.max,
            value: state.coinsEcranRayon,
            valueLabel: (v) => v + "px",
            dataKey: "coins-ecran-rayon",
            onChange: (v) => go("coins-ecran-rayon", v),
          });
        }
        policeChooser(box);
        // La police des TERMINAUX, juste sous celle de l'interface : deux
        // surfaces de texte réglables, côte à côte (voir `policeTerminaleChooser`).
        policeTerminaleChooser(box);
      });

      // Icônes : le dessin des applets de la barre — comme « Icônes » sous KDE.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Icônes"]));
        box.appendChild(el("p", { class: "hint" }, ["Le dessin des applets de la barre (réglages, son, réseau…). Fluent reprend les icônes de Windows 11 ; les deux thèmes Fluent Emoji gardent leur propre couleur — les seules icônes de la barre dans ce cas."]));
        segmented(box, {
          options: state.themesIcones,
          value: state.icones,
          dataKey: "icones",
          onSelect: (v) => go("icones", v),
        });
      });

      // Thèmes
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Thèmes"]));
        // « Colorisation automatique » EN TÊTE DES THÈMES — DEMANDE EXPLICITE
        // (2026-10-12). Elle était épinglée au-dessus des onglets ; elle vit
        // désormais ici, avec les réglages de couleur qu'elle gouverne.
        checkboxRow(box, state.autoColorScheme, "Colorisation automatique", (checked) => go("auto-color-scheme", checked ? "1" : "0"));
        box.appendChild(
          el("p", { class: "hint" }, [
            "Adapte automatiquement le texte et les zones de chaque fenêtre à sa couleur de mise en avant. Décoche pour régler chaque couleur toi-même.",
          ]),
        );
        box.appendChild(
          el("p", { class: "hint" }, [
            "Applique une couleur harmonieuse à toute l'application en un clic : barres, Dash, Réglages, Presse-papiers et menus contextuels.",
          ]),
        );

        // **LUMINOSITÉ ET SATURATION EN AVANT** — DEMANDE EXPLICITE (2026-11-06) :
        // « dans Thèmes, mettre luminosité et saturation en avant ». Remontées ICI,
        // juste sous la colorisation automatique et AVANT les pastilles, pour être
        // vues d'emblée. DEMANDE D'ORIGINE (2026-10-10) : « luminosité et saturation
        // paramétrables ». ⛔ CE SONT DES FORCES, pas des bornes : 100 % = la couleur
        // telle quelle ; en dessous on la retire, au-dessus on la pousse (voir
        // `color::ajuster_theme`). La saturation plafonne à 100 % (`FORCE_SATURATION_MAX`,
        // au-dessus une couleur déjà saturée ne bougeait plus). ⚠️ `input`, pas
        // `change` : on veut voir le thème bouger EN GLISSANT. ⛔ `slider()` porte le
        // `data-key` que lit `updateSlider` — sans quoi la poignée serait recréée sous
        // le doigt à chaque état reçu.
        const forces = state.themeForces || { saturation: 1, luminosite: 1 };
        box.appendChild(el("p", { class: "hint" }, [
          "Luminosité et saturation s'appliquent au thème choisi ci-dessous : une couleur de la liste ou une famille (Material You, Windows…). À 100 %, il est appliqué tel quel.",
        ]));
        slider(box, {
          label: "Saturation",
          valueLabel: (v) => v + "%",
          min: 0, max: 100, step: 5,
          value: Math.round(forces.saturation * 100),
          dataKey: "theme-saturation",
          onInput: (v) => go("force-theme", "saturation", String(v / 100)),
        });
        slider(box, {
          label: "Luminosité",
          valueLabel: (v) => v + "%",
          min: 0, max: 200, step: 5,
          value: Math.round(forces.luminosite * 100),
          dataKey: "theme-luminosite",
          onInput: (v) => go("force-theme", "luminosite", String(v / 100)),
        });
        // ⭐ **LES FAMILLES CLAIR / SOMBRE** (voir `color::FAMILLES_THEMES`) —
        // DEMANDE EXPLICITE (2026-10-11) : des variantes des thèmes clair et
        // sombre, chacune avec sa couleur d'accentuation. La bascule du thème de
        // Windows passe à l'autre variante de la famille choisie. Les SEULS
        // thèmes à texte sombre sont les variantes claires.
        const familles = [];
        for (const f of catalog.familles || []) {
          if (f.clair) familles.push(windowsThemeSwatch(f, "clair"));
          familles.push(windowsThemeSwatch(f, "sombre"));
        }
        box.appendChild(el("div", { class: "theme-grid" }, familles));
        const actions = el("div", { class: "row" }, [
          el("button", { class: "action", onclick: () => go("theme", "random") }, [el("span", { class: "ico ico-dice-five" }), " Thème aléatoire"]),
          el("button", { class: "action", onclick: () => go("theme", "wallpaper") }, [el("span", { class: "ico ico-image" }), " Couleur automatique (fond d'écran)"]),
        ]);
        box.appendChild(actions);
        box.appendChild(el("p", { class: "hint" }, ["Ou choisis une couleur de base : le thème sombre correspondant est appliqué automatiquement."]));
        colorPicker(box, "theme_base_color", state.themeBaseColor);
        box.appendChild(
          el("button", { class: "action", onclick: () => go("theme", "save", state.themeBaseColor) }, ["Enregistrer ce thème"]),
        );

        const grid = el("div", { class: "theme-grid" });
        for (const { name, rgb } of catalog.themes) {
          grid.appendChild(themeSwatch(name, rgbToHex(rgb), false, -1));
        }
        state.customThemes.forEach((hex, index) => {
          grid.appendChild(themeSwatch("#" + hex, hex, true, index));
        });
        box.appendChild(grid);
      });

      // ⭐ LA TEXTURE DE L'INTERFACE (voir `gfx::texture_interface`) — DEMANDE
      // EXPLICITE (2026-10-15) : « une option dans les thèmes pour ajouter des
      // effets de textures à l'interface ». Générée par le shader sous les barres
      // et les panneaux ; ni les icônes ni le texte ne sont touchés.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Texture de l'interface"]));
        box.appendChild(el("p", { class: "hint" }, ["Une matière posée sur le fond des barres et des panneaux, générée à la volée. Les icônes et le texte n'en reçoivent pas."]));
        segmented(box, {
          options: state.texturesInterface,
          value: state.textureNature,
          dataKey: "texture-nature",
          onSelect: (v) => go("texture-nature", v),
        });
        slider(box, {
          label: "Force",
          valueLabel: (v) => v + " %",
          min: 0, max: 100, step: 5,
          value: state.textureForce,
          dataKey: "texture-force",
          onInput: (v) => go("texture-force", v),
        });
        slider(box, {
          label: "Échelle",
          valueLabel: (v) => v + " %",
          min: state.textureEchelleBounds.min,
          max: state.textureEchelleBounds.max,
          step: 25,
          value: state.textureEchelle,
          dataKey: "texture-echelle",
          onInput: (v) => go("texture-echelle", v),
        });
        // ⭐ DEMANDE EXPLICITE (2026-10-15) : éclaircir ou assombrir la texture,
        // et régler sa teinte. À 0 : la texture reste neutre.
        slider(box, {
          label: "Clarté",
          valueLabel: libelleClarteTexture,
          min: -100, max: 100, step: 5,
          value: state.textureClarte,
          dataKey: "texture-clarte",
          onInput: (v) => go("texture-clarte", v),
        });
        slider(box, {
          label: "Teinte",
          valueLabel: libelleTeinteTexture,
          min: 0, max: 360, step: 5,
          value: state.textureTeinte,
          dataKey: "texture-teinte",
          onInput: (v) => go("texture-teinte", v),
        });
        box.appendChild(el("p", { class: "hint" }, ["La clarté décale la texture vers le clair ou le sombre ; la teinte la colore. Teinte à 0 : sans couleur."]));
        // ⭐ DEMANDE EXPLICITE (2026-10-15) : composer sa propre texture, avec des
        // cases et des curseurs — l'éditeur des textures (« Personnalisée »).
        box.appendChild(el("button", { class: "action", onclick: () => go("textures-editeur") }, ["Composer une texture…"]));
      });

      // ⭐ LA TEXTURE DES TERMINAUX (voir `win32::texture_terminaux`) — DEMANDE
      // EXPLICITE (2026-10-15) : « appliquer des textures au fond des terminaux mais
      // pas forcément la même texture que pour le reste de l'app ».
      section(scroll, (box) => {
        const t = state.textureTerminaux;
        const poser = (reglage) => (v) => go("texture-terminaux", reglage, v);
        box.appendChild(el("h2", {}, ["Texture des terminaux"]));
        box.appendChild(el("p", { class: "hint" }, ["Une matière à part pour le fond du Terminal et des serveurs SSH, posée sur leur couleur. Le texte n'en reçoit pas."]));
        segmented(box, { options: state.texturesInterface, value: t.nature, dataKey: "texture-terminaux-nature", onSelect: poser("nature") });
        slider(box, { label: "Force", valueLabel: (v) => v + " %", min: 0, max: 100, step: 5, value: t.force, dataKey: "texture-terminaux-force", onInput: poser("force") });
        slider(box, {
          label: "Échelle", valueLabel: (v) => v + " %",
          min: state.textureEchelleBounds.min, max: state.textureEchelleBounds.max, step: 25,
          value: t.echelle, dataKey: "texture-terminaux-echelle", onInput: poser("echelle"),
        });
        slider(box, { label: "Clarté", valueLabel: libelleClarteTexture, min: -100, max: 100, step: 5, value: t.clarte, dataKey: "texture-terminaux-clarte", onInput: poser("clarte") });
        slider(box, { label: "Teinte", valueLabel: libelleTeinteTexture, min: 0, max: 360, step: 5, value: t.teinte, dataKey: "texture-terminaux-teinte", onInput: poser("teinte") });
        box.appendChild(el("p", { class: "hint" }, ["« Personnalisée » est composée dans l'éditeur des textures, à part de celle de l'interface."]));
        box.appendChild(el("button", { class: "action", onclick: () => go("textures-editeur-terminaux") }, ["Composer une texture…"]));
      });

      // LA VUE SPHÈRE des terminaux (voir `sphere_vue.js`) : la vitesse du zoom
      // à la molette (demande du 2026-11-01), puis — demande du 2026-11-04 —
      // les MÊMES réglages que la sphère des programmes : distance d'ouverture,
      // recadrage automatique, fondu du panneau.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Vue sphère des terminaux"]));
        box.appendChild(el("p", { class: "hint" }, ["Le Terminal et les serveurs SSH, posés sur une sphère (clic molette dans un panneau). 100 % : la vitesse d'origine."]));
        slider(box, {
          label: "Vitesse du zoom à la molette", valueLabel: (v) => v + " %",
          min: state.sphereZoomBounds.min, max: state.sphereZoomBounds.max, step: 25,
          value: state.sphereZoom, dataKey: "sphere-zoom", onChange: (v) => go("sphere-zoom", v),
        });
        checkboxRow(box, state.sphereTerminauxZoomAuto, "Recadrer automatiquement toutes les sessions dans l'espace disponible",
          (checked) => go("sphere-terminaux-zoom-auto", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, ["Coché, la caméra recule juste assez pour que toutes les cartes tiennent dans le panneau, quel que soit leur nombre ; le curseur ci-dessous reste la distance normale quand tout tient déjà."]));
        slider(box, {
          label: "Zoom par défaut", valueLabel: (v) => v + " %",
          min: state.sphereTerminauxZoomBounds.min, max: state.sphereTerminauxZoomBounds.max, step: 5,
          value: state.sphereTerminauxZoom, dataKey: "sphere-terminaux-zoom", onChange: (v) => go("sphere-terminaux-zoom", v),
        });
        box.appendChild(el("p", { class: "hint" }, ["Le fondu de la sphère quand elle prend la place du panneau — 0 ms : aucun fondu, la sphère apparaît d'un coup."]));
        slider(box, { label: "Durée de l'apparition", min: state.sphereTerminauxFonduBounds.min, max: state.sphereTerminauxFonduBounds.max, step: 10, value: state.sphereTerminauxFonduOuverture, valueLabel: (v) => v + " ms", dataKey: "sphere-terminaux-fondu-ouverture", onInput: (v) => go("sphere-terminaux-fondu", "ouverture", v) });
        slider(box, { label: "Durée de la disparition", min: state.sphereTerminauxFonduBounds.min, max: state.sphereTerminauxFonduBounds.max, step: 10, value: state.sphereTerminauxFonduFermeture, valueLabel: (v) => v + " ms", dataKey: "sphere-terminaux-fondu-fermeture", onInput: (v) => go("sphere-terminaux-fondu", "fermeture", v) });
      });

      // LA SPHÈRE DES PROGRAMMES (clic molette sur une barre) : son zoom par
      // défaut et le fondu qui lui est PROPRE — voir `win32::cef_fenetres`.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Sphère des programmes"]));
        box.appendChild(el("p", { class: "hint" }, ["Les fenêtres ouvertes posées sur une sphère (clic molette sur une barre du haut ou du bas). 100 % : le niveau d'ouverture d'origine."]));
        checkboxRow(box, state.sphereFenetresZoomAuto, "Recadrer automatiquement toutes les fenêtres dans l'espace disponible",
          (checked) => go("sphere-fenetres-zoom-auto", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, ["Coché, la caméra recule juste assez pour que toutes les cartes tiennent dans la fenêtre, quel que soit leur nombre ; le curseur ci-dessous reste la distance normale quand tout tient déjà."]));
        slider(box, {
          label: "Zoom par défaut", valueLabel: (v) => v + " %",
          min: state.sphereFenetresZoomBounds.min, max: state.sphereFenetresZoomBounds.max, step: 5,
          value: state.sphereFenetresZoom, dataKey: "sphere-fenetres-zoom", onChange: (v) => go("sphere-fenetres-zoom", v),
        });
        slider(box, {
          label: "Vitesse du zoom à la molette", valueLabel: (v) => v + " %",
          min: state.sphereFenetresVitesseBounds.min, max: state.sphereFenetresVitesseBounds.max, step: 25,
          value: state.sphereFenetresVitesseZoom, dataKey: "sphere-fenetres-vitesse-zoom", onChange: (v) => go("sphere-fenetres-vitesse-zoom", v),
        });
        box.appendChild(el("p", { class: "hint" }, ["Fondu PROPRE à cette sphère — les autres fenêtres de NeuraDesk gardent « Fondu des fenêtres de NeuraDesk »."]));
        slider(box, { label: "Durée de l'apparition", min: state.sphereFenetresFonduBounds.min, max: state.sphereFenetresFonduBounds.max, step: 10, value: state.sphereFenetresFonduOuverture, valueLabel: (v) => v + " ms", dataKey: "sphere-fenetres-fondu-ouverture", onInput: (v) => go("sphere-fenetres-fondu", "ouverture", v) });
        slider(box, { label: "Durée de la disparition", min: state.sphereFenetresFonduBounds.min, max: state.sphereFenetresFonduBounds.max, step: 10, value: state.sphereFenetresFonduFermeture, valueLabel: (v) => v + " ms", dataKey: "sphere-fenetres-fondu-fermeture", onInput: (v) => go("sphere-fenetres-fondu", "fermeture", v) });
      });

      // Couleur des trois barres
      const BARS = [["top", "du haut"], ["left", "de gauche"], ["right", "de droite"], ["bottom", "du bas"]];
      BARS.forEach(([bar, label], i) => {
        section(scroll, (box) => {
          // Sa TRANSPARENCE vit dans « Transparence et flou » (voir plus haut).
          box.appendChild(el("h2", {}, [`Couleur de la barre ${label}`]));
          colorPicker(box, `bar_${bar}`, state.barColors[i]);
        });
      });

      // Couleur du texte de la barre du haut
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Couleur du texte de la barre du haut"]));
        if (state.autoColorScheme) {
          box.appendChild(el("p", { class: "hint" }, ["Suit automatiquement la couleur de la barre du haut. Décoche « Colorisation automatique » plus haut pour régler cette couleur toi-même."]));
        } else {
          colorPicker(box, "topbar_text", state.topbarTextColor);
        }
      });

      // Écartement des icônes
      section(scroll, (box) => {
        // Une barre à la fois — DEMANDE EXPLICITE (2026-10-18) : « que
        // l'écartement des icônes puisse être réglé individuellement pour chaque
        // barre ». Le curseur général remet les quatre sur sa valeur.
        box.appendChild(el("h2", {}, ["Écartement des icônes"]));
        slider(box, { label: "Toutes les barres", min: 0, max: 40, value: state.iconGap, valueLabel: (v) => v + "px", dataKey: "icon-gap", onInput: (v) => go("icon-gap", v) });
        ICON_GAP_BARRES.forEach(([cle, label], i) => {
          slider(box, { label, min: 0, max: 40, value: state.iconGapsBarres[i], valueLabel: (v) => v + "px", dataKey: `icon-gap-${cle}`, onInput: (v) => go("icon-gap-barre", cle, v) });
        });
      });

      // Taille des pastilles de bureaux virtuels (barre PRIMAIRE) — DEMANDE
      // EXPLICITE ("je voudrais que les pastilles des bureaux virtuels
      // soient redimensionnables dans le dash réglage, en ayant chacune
      // leur propre réglage dans la barre correspondante"). Le réglage par
      // écran secondaire se trouve dans la section de CET écran, plus bas.
      // PLAFOND TRIPLÉ (36 -> 108) — DEMANDE EXPLICITE (2026-09-23) : « la taille
      // maximale réglable de la taille des pastilles de bureaux virtuels soit
      // triplée ». Le MINIMUM ne bouge pas : c'est le plancher de lisibilité des
      // numéros (voir ui::desktop_labels::MIN_DOT_SIZE_WITH_LABEL), et le
      // descendre ne donnerait que des pastilles sans chiffre.
      section(scroll, (box) => {
        slider(box, { label: "Taille des pastilles de bureaux virtuels", min: 8, max: 108, value: state.desktopDotSize, valueLabel: (v) => v + "px", dataKey: "desktop-dot-size", onInput: (v) => go("desktop-dot-size", v) });
      });

      // Taille des icônes de la barre du haut — DEMANDE EXPLICITE (2026-10-14).
      // En % de la taille dérivée de l'épaisseur ; bornes POUSSÉES par Rust. Hors
      // de la clé de structure : voie rapide `updateSlider`.
      section(scroll, (box) => {
        slider(box, {
          label: "Taille des icônes de la barre du haut",
          min: state.topIconScaleBounds.min, max: state.topIconScaleBounds.max,
          value: state.topIconScale,
          valueLabel: (v) => v + "%",
          dataKey: "top-icon-scale",
          onInput: (v) => go("top-icon-scale", v),
        });
        // Même curseur pour la barre du BAS — DEMANDE EXPLICITE (2026-10-14).
        // Ses bornes à elle : la haute est le TRIPLE (demande du 2026-10-23).
        slider(box, {
          label: "Taille des icônes de la barre du bas",
          min: state.bottomIconScaleBounds.min, max: state.bottomIconScaleBounds.max,
          value: state.bottomIconScale,
          valueLabel: (v) => v + "%",
          dataKey: "bottom-icon-scale",
          onInput: (v) => go("bottom-icon-scale", v),
        });
        // Et pour la barre de GAUCHE — DEMANDE EXPLICITE (2026-10-18).
        slider(box, {
          label: "Taille des icônes de la barre de gauche",
          min: state.topIconScaleBounds.min, max: state.topIconScaleBounds.max,
          value: state.leftIconScale,
          valueLabel: (v) => v + "%",
          dataKey: "left-icon-scale",
          onInput: (v) => go("left-icon-scale", v),
        });
        box.appendChild(el("p", { class: "hint" }, ["100 % : la taille déduite de l'épaisseur de la barre. Agrandie, une icône ne dépasse jamais la barre."]));
      });

      // Taille du texte des applets de la barre du haut (barre PRIMAIRE) —
      // DEMANDE EXPLICITE (2026-09-23) : « le texte des applets de la barre du
      // haut soit configurable aussi en laissant le choix du réglage
      // automatique ou de la taille personnalisée ». Le réglage par écran
      // secondaire se trouve dans la section de CET écran, plus bas — même
      // structure que la taille des pastilles ci-dessus.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Taille du texte de la barre du haut"]));
        const auto = state.topbarTextSize === null;
        // La valeur AUTOMATIQUE est AFFICHÉE, et elle vient de Rust — qui seul
        // connaît la formule (voir ui::topbar::topbar_text_font_px_auto) :
        // régler une taille sans savoir de quoi on s'écarte n'a pas de sens, et
        // la recalculer ici ferait une seconde vérité à tenir à jour.
        box.appendChild(el("p", { class: "hint" }, [
          auto
            ? `Suit l'épaisseur de la barre : ${state.topbarTextAutoPx}px. L'horloge est deux crans au-dessus, le moniteur système, la fréquence et le titre média un cran en dessous.`
            : `Taille de RÉFÉRENCE : l'horloge est deux crans au-dessus, le moniteur système, la fréquence et le titre média un cran en dessous. En automatique, elle vaudrait ${state.topbarTextAutoPx}px.`,
        ]));
        // Valeur de départ en repassant en manuel : la taille AUTOMATIQUE, pas
        // une valeur arbitraire — le texte ne doit pas sauter au moment précis
        // où l'on prend la main, et le curseur s'ouvre là où l'on regardait.
        checkboxRow(box, auto, "Taille automatique", (checked) => {
          go("topbar-text-size", checked ? "auto" : String(state.topbarTextAutoPx));
        });
        if (auto) return;
        slider(box, {
          label: "Taille de référence",
          // Le MAXIMUM suit l'épaisseur de la barre (voir
          // ui::topbar::topbar_text_font_px_max) : il est donc poussé par Rust
          // et remis à jour à chaque frame (voir `updateValues`), pas figé ici.
          min: 8, max: state.topbarTextMaxPx,
          value: state.topbarTextSize,
          valueLabel: (v) => v + "px",
          dataKey: "topbar-text-size",
          onInput: (v) => go("topbar-text-size", v),
        });
      });

      // MARGE dans la case d'une icône de zone — le curseur vit dans la section
      // « Zones de la barre de droite » (voir plus bas), avec les autres réglages
      // de zone : une section à part l'aurait rangée sous un titre qui ne parlait
      // que d'elle, loin de ce qu'elle règle.


      // Couleur des séparateurs (voir `ui::dock::Dock::separator_color`) —
      // DEMANDE EXPLICITE ("fais en sorte que les séparateurs d'icones soit
      // de la couleur principale du texte de la barre à laquelle ils sont
      // ratachés et donnes la possibilité de choisir leur couleur ou de les
      // rendre transparent"). Le réglage par écran secondaire se trouve
      // dans la section de CET écran, plus bas — même structure que
      // `desktop-dot-size`/`icon-gap` ci-dessus.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Couleur des séparateurs"]));
        primarySeparatorColor(box);
      });

      // Taille des séparateurs (voir `ui::dock::Dock::separator_size`) —
      // DEMANDE EXPLICITE ("ajoute la possibilité de modifier la taille des
      // séparateurs par interface"). Le réglage par écran secondaire se
      // trouve dans la section de CET écran, plus bas — même structure que
      // la couleur juste au-dessus.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Taille des séparateurs"]));
        primarySeparatorSize(box);
      });

      // Taille des vignettes d'aperçu des fenêtres (voir
      // `win32::window_previews`) — DEMANDE EXPLICITE : « une taille ajustable
      // dans les réglages ».
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Aperçus de fenêtres"]));
        primaryPreviewThumbWidth(box);
        primaryPreviewFade(box);
        box.appendChild(el("p", { class: "hint" }, ["Le panneau commence à apparaître dès que vous survolez une icône, et met cette durée à être pleinement visible. Elle vaut aussi pour sa disparition."]));
      });

      // Aperçu d'un BUREAU VIRTUEL (voir `win32::desktop_previews`) — DEMANDE
      // EXPLICITE : « des réglages pour les fenêtres de prévisualisation des
      // bureaux comme pour les programmes ». Volontairement JUSTE APRÈS les
      // aperçus de fenêtres : les deux familles se règlent au même endroit, mais
      // chacune avec ses propres curseurs.
      // Fond animé du logo NeuraDesk (voir `ui::dock`) — DEMANDE EXPLICITE.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Logo"]));
        primaryLogoSize(box);
        primaryLogoZoom(box);
        primaryLogoCircle(box);
        primaryLogoSpinDirection(box);
        primaryLogoTurn(box);
        primaryLogoAnimation(box);
        primaryLogoFade(box);
        primaryLogoColor(box);
        box.appendChild(el("p", { class: "hint" }, ["L'icône carrée porte un fond qui respire — de pleinement opaque à invisible, en passant par les couleurs de votre palette d'accent. Le logo lui-même ne s'efface jamais, seul son fond, qui ne déborde que de peu autour de l'icône."]));
        box.appendChild(el("p", { class: "hint" }, ["L'icône circulaire tourne indéfiniment, dans le sens et à la vitesse choisis. Le fond animé vaut pour les deux : un carré arrondi autour de l'icône carrée, un disque sous l'icône circulaire."]));
      });

      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Aperçu des bureaux virtuels"]));
        primaryDesktopPreviewWidth(box);
        primaryDesktopPreviewFade(box);
        primaryDesktopPreviewHoverDelay(box);
        box.appendChild(el("p", { class: "hint" }, ["La miniature qui apparaît au survol d'une pastille de bureau virtuel. Sa hauteur n'est pas réglable : elle suit le rapport de votre écran, faute de quoi chaque fenêtre serait placée ailleurs que là où elle est. Un fondu à 0 ms la fait apparaître et disparaître d'un coup."]));
        box.appendChild(el("p", { class: "hint" }, ["Le délai ne vaut que pour la PREMIÈRE apparition — il s'ajoute alors au fondu. Une fois la miniature ouverte, passer d'un bureau à l'autre au fil des pastilles reste instantané, sans clignotement."]));
      });

      // Indicateur « en cours d'execution » (voir `Dock::running_dot_size`) —
      // DEMANDE EXPLICITE : taille, forme ET couleur.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Indicateur d'application ouverte"]));
        primaryRunningDotSize(box);
        primaryRunningDotOffset(box);
        primaryRunningDotShape(box);
        primaryRunningDotColor(box);
        primaryIconMargin(box);
        box.appendChild(el("p", { class: "hint" }, ["Pour la forme « Anneau », la taille règle l'ÉPAISSEUR du cadre — le quart de la valeur affichée — et non une dimension. Elle est plafonnée par l'écartement des icônes et par la marge haute de la barre. Le décalage déplace l'indicateur vers la droite (+) ou la gauche (−). La marge autour des icônes vaut pour toutes les barres : plus elle est grande, plus les icônes sont petites."]));
      });

      // Taille des quatre barres
      const BAR_SIZE_LABELS = [["top", "Épaisseur barre du haut"], ["left", "Largeur barre gauche"], ["right", "Largeur barre droite"], ["bottom", "Épaisseur barre du bas"]];
      BAR_SIZE_LABELS.forEach(([bar, label], i) => {
        section(scroll, (box) => {
          // `onChange` : voir la doc de `slider()` — dégèle le
          // redimensionnement du panneau Réglages lui-même, gelé au premier
          // `onInput` (voir `win32::cef_settings::SettingsRefs::
          // bar_size_dragging`), sans quoi ce panneau (qui vit dans la zone
          // libre entre les trois barres, voir `app::dash_rect`) se
          // redimensionnerait lui-même à chaque pixel glissé sur CE
          // curseur précis.
          // `step: 2` — DEMANDE EXPLICITE : un pas de 1px (défaut de
          // `slider()`) est plus fin que ce qui a un effet perceptible sur
          // l'épaisseur d'une barre.
          // `min` : 16 pour la barre du HAUT uniquement — DEMANDE EXPLICITE
          // ("la valeur minimale pour l'épaisseur de la barre supérieure
          // soit de 16 pixels") — gauche/droite gardent 40.
          // `min`/`max` : POUSSÉS par Rust (`state.barSizeMin`/`barSizeMax`,
          // voir `ui::dock::bar_thickness_bounds`, SEULE AUTORITÉ) — la même
          // fonction dont le curseur du CLIC DROIT sur une barre tire les
          // siennes (voir assets/popups/bar_size.html). DEMANDE EXPLICITE :
          // « il faudrait que l'on puisse aller à 250 dans les 2 cas ».
          //
          // **SANS REPLI, et c'est délibéré** : deux littéraux recopiés de part
          // et d'autre sont exactement ce qui a fait diverger les deux écrans
          // (160 ici, 500 là-bas) sans que rien ne le signale. L'état et la page
          // étant livrés par le même binaire, un champ manquant est un défaut
          // qu'il vaut mieux voir que masquer.
          slider(box, {
            label, min: state.barSizeMin[i], max: state.barSizeMax[i], step: 2, value: state.barSizes[i], valueLabel: (v) => v + "px", dataKey: `bar-size-${bar}`,
            onInput: (v) => go("bar-size", bar, v), onChange: () => go("bar-size-commit"),
          });
          if (bar === "right") {
            primaryFonduHautDroite(box);
            box.appendChild(el("p", { class: "hint" }, ["Sur cette hauteur, en haut de la barre de droite, les icônes se floutent puis disparaissent contre la barre du haut — elles restent cliquables. 0 : aucun fondu."]));
          }
          if (bar === "left") {
            primaryFonduHautGauche(box);
            box.appendChild(el("p", { class: "hint" }, ["Sur cette hauteur, en haut de la barre de gauche, les icônes se floutent puis disparaissent contre la barre du haut — elles restent cliquables. 0 : aucun fondu."]));
          }
        });
      });

      // ---- OMBRES --------------------------------------------------------
      //
      // DEMANDE EXPLICITE (2026-10-19) : « il faut une section dédiée aux
      // ombrages ». Elles vivaient sous « Épaisseur barre du haut », où la colonne
      // de catégories ne les annonçait pas (elle se bâtit sur le premier `<h2>`,
      // voir `renderCategoryNav`).
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Ombres"]));
        box.appendChild(el("p", { class: "hint" }, ["Deux ombres réglées chacune à part, sur toutes les barres. Sous la barre du haut, elles sont jetées vers le bas ; le long des autres barres, vers l'intérieur par les barres de gauche, de droite et du bas. Largeur 0 ou intensité 0 % : pas d'ombre."]));
        box.appendChild(el("div", { class: "small-label" }, ["Ombre noire"]));
        primaryOmbreNoire(box);
        box.appendChild(el("div", { class: "small-label" }, ["Ombre de couleur"]));
        primaryOmbreCouleur(box);
        box.appendChild(el("div", { class: "small-label" }, ["Centre de la barre du haut"]));
        primaryOmbreCentreHaut(box);
        box.appendChild(el("p", { class: "hint" }, ["L'ombre de couleur prend la couleur AFFICHÉE de chaque barre — lueurs et dégradé compris — et la suit quand elle change ; elle ne tombe que sur les barres et les coins arrondis. L'ombre noire est posée PAR-DESSUS : pour ne voir que la couleur, mettez l'ombre noire à 0 %."]));
      });

      // ---- VERROUS -------------------------------------------------------
      //
      // DEMANDE EXPLICITE : « les deux, réunis au même endroit ». Cette section
      // réunit ce qui EMPÊCHE de modifier la disposition — les trois barres, et
      // VERROUS DES BARRES — et EUX SEULS. Les réglages de ZONE qui vivaient
      // ici sont partis dans leur propre section juste en dessous (voir
      // « Zones ») : rangés sous ce titre, la colonne de catégories ne les
      // annonçait nulle part, puisque elle se bâtit sur le PREMIER `<h2>` de la
      // section (voir `renderCategoryNav`).
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Verrous"]));
        // Les quatre barres. Le libellé ne reprend PAS celui du curseur de taille
        // (« Épaisseur barre du haut ») : ici on dit ce que la case FAIT.
        [["top", "la barre du haut"], ["left", "la barre de gauche"], ["right", "la barre de droite"], ["bottom", "la barre du bas"]].forEach(([bar, quoi], i) => {
          checkboxRow(box, (state.barLocks || [])[i] === true, `Verrouiller ${quoi}`, (checked) => {
            go("bar-lock", bar, checked ? "1" : "0");
          });
        });
      });

      // ---- DOSSIERS DE LA BARRE DU BAS ------------------------------------
      //
      // DEMANDE EXPLICITE (2026-09-28) : « une barre du bas pour pouvoir épingler
      // des chemins vers des dossiers [...] j'aimerais qu'il soit possible
      // d'ajouter une vignette sur les dossiers pour les repérer plus
      // facilement ».
      //
      // ⚠️ **CETTE SECTION EST LE SEUL ENDROIT OÙ LES TROIS GESTES VIVENT** — et ce
      // commentaire a dit le contraire. Il annonçait « ici **et** au clic droit sur la
      // vignette dans la barre », or le clic droit sur un dossier de la barre du bas
      // l'OUVRE : le menu contextuel dédié (vignette, renommer, retirer) **reste à
      // faire**, et c'est écrit noir sur blanc dans `app.rs` (« LE MENU CONTEXTUEL DÉDIÉ
      // RESTE À FAIRE »). Un commentaire qui envoie chercher un geste inexistant coûte
      // au prochain lecteur exactement ce qu'il a coûté ici.
      //
      // ⛔ **LE TEXTE D'AIDE A ANNONCÉ UN REDÉMARRAGE QUI N'EXISTE PLUS.** Il disait
      // « Chaque changement redémarre NeuraDesk », et c'était vrai : `dossiers_ecrits`
      // appelait `request_reload()`, qui fait redémarrer le PROCESSUS. **C'est faux
      // depuis l'étape 4** (`docs/plans/dock-identites-stables.md`) : les cinq gestes de
      // cette section s'appliquent tout de suite, comme ceux du sous-dock.
      //
      // ⚠️ **Un texte d'aide qui ment est pire qu'une absence de texte** : celui-ci
      // faisait renoncer à un geste qui marche, ou chercher un redémarrage qui n'a pas
      // eu lieu. Il est corrigé AVEC le code, jamais après.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Barre du bas — dossiers épinglés"]));
        box.appendChild(el("p", { class: "hint" }, [
          "Ces dossiers occupent la barre du bas, dans cet ordre. Chaque changement s'applique tout de suite — aucun redémarrage.",
        ]));
        const ajout = el("div", { class: "size-choices" });
        ajout.appendChild(el("button", { onclick: () => go("dossier-ajouter") }, ["+ Ajouter un dossier…"]));
        box.appendChild(ajout);
        const liste = state.dossiers || [];
        if (liste.length === 0) {
          box.appendChild(el("p", { class: "hint" }, ["Aucun dossier épinglé pour l'instant."]));
        }
        liste.forEach((d) => {
          const ligne = el("div", { class: "row" });
          // La vignette : l'image choisie, ou un carré en pointillés qui DIT
          // qu'il n'y en a pas — un vide indistinct ne se distinguerait pas d'un
          // échec de chargement.
          //
          // ⛔ **LE STYLE SE POSE PAR PROPRIÉTÉ, JAMAIS PAR UN OBJET DANS `el`.**
          // `el()` fait `setAttribute` pour tout ce qui n'est ni `class` ni un
          // `on…` (voir sa doc) : un `style: {…}` deviendrait l'attribut
          // `style="[object Object]"`, donc un carré de taille nulle — et sans
          // le moindre message. C'est la même famille de défaut que `onchange`
          // passé en attribut-chaîne.
          const vignette = d.vignette ? el("img", { src: d.vignette }) : el("span", {});
          if (!d.vignette) {
            vignette.style.border = "1px dashed currentColor";
            vignette.style.opacity = ".5";
          }
          vignette.style.width = "32px";
          vignette.style.height = "32px";
          vignette.style.objectFit = "cover";
          vignette.style.borderRadius = "4px";
          vignette.style.flex = "0 0 auto";
          ligne.appendChild(vignette);
          const champ = el("input", { type: "text", class: "zone-name", value: d.nom || "", placeholder: "Nom affiché" });
          // `change` et NON `input` : renommer à chaque frappe ferait un
          // redémarrage par caractère tapé (même règle que le renommage des
          // zones, juste au-dessus).
          champ.addEventListener("change", () => {
            // ⛔ Un champ VIDÉ passe par un verbe SÉPARÉ : `go(…)` joint les
            // segments par `/` et un DERNIER segment vide disparaît (voir
            // `cef_settings`, action `dossier-renommer-effacer`) — l'envoyer
            // comme un nom échouerait en silence.
            const valeur = champ.value.trim();
            go(valeur ? "dossier-renommer" : "dossier-renommer-effacer", d.chemin, ...(valeur ? [valeur] : []));
          });
          ligne.appendChild(champ);
          ligne.appendChild(el("button", { title: "Choisir l'image de cette vignette", onclick: () => go("dossier-vignette", d.chemin) }, ["Vignette…"]));
          ligne.appendChild(el("button", { onclick: () => go("dossier-retirer", d.chemin) }, ["Retirer"]));
          box.appendChild(ligne);
          // Le chemin EN CLAIR sous la ligne : c'est ce que l'utilisateur a
          // épinglé, et le seul moyen de distinguer deux dossiers homonymes.
          box.appendChild(el("p", { class: "hint" }, [d.chemin]));
        });
      });

      // DASH DOSSIER — LE DOSSIER PERSONNEL
      //
      // ⚠️ **CE RÉGLAGE N'APPARTIENT PAS À LA BARRE DU BAS**, contrairement à
      // tout ce qui l'entoure : il règle le dossier sur lequel s'ouvre la moitié
      // DROITE du dash dossier (le panneau qui montre deux dossiers côte à côte).
      // Il vit ici parce que la page Réglages est le seul endroit où l'on cherche
      // un réglage — pas parce qu'il serait de la même famille.
      //
      // ⛔ **LE CONTRÔLE EST UN BOUTON QUI OUVRE LE SÉLECTEUR NATIF**, jamais un
      // champ de texte : la page n'a aucun accès au disque, et demander à
      // l'utilisateur de taper un chemin juste est une façon de lui faire rater.
      // C'est le motif exact des dossiers épinglés, juste au-dessus.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Dash dossier — dossier personnel"]));
        const personnel = state.dossierPersonnel || {};
        const choisi = personnel.ecrit || "";
        const actif = personnel.chemin || "";
        box.appendChild(el("p", { class: "hint" }, [
          "La moitié DROITE du dash dossier s'ouvre sur ce dossier AU LANCEMENT ; ensuite elle garde le dossier où tu l'as laissée. Un changement ne se verra donc qu'au prochain lancement. — L'autre moitié montre le dossier de la vignette que tu survoles dans la barre du bas.",
        ]));
        const choix = el("div", { class: "size-choices" });
        choix.appendChild(el("button", { onclick: () => go("dossier-personnel-choisir") }, ["Choisir un dossier…"]));
        // ⚠️ **« RÉTABLIR » N'EST PROPOSÉ QUE SI QUELQUE CHOSE A ÉTÉ CHOISI.**
        // Sinon le bouton serait un geste qui ne fait rien — et l'utilisateur
        // chercherait pourquoi. C'est le même souci que le « + » du dash dossier,
        // qui doit DIRE dans quel sens il bascule.
        // ⛔ **LE TEST PORTE SUR LE CHOIX, PAS SUR LE CHEMIN APPLIQUÉ.** Les
        // confondre ferait disparaître la seule trace d'un choix encore valable
        // mais momentanément introuvable (partage réseau injoignable, clé
        // retirée) : le bouton s'afficherait, et le clic effacerait le réglage.
        if (choisi) {
          choix.appendChild(el("button", { onclick: () => go("dossier-personnel-defaut") }, ["Rétablir mon profil"]));
        }
        box.appendChild(choix);
        // ⛔ **LES TROIS ÉTATS SONT DITS, ET LE TROISIÈME EST LE PLUS IMPORTANT.**
        // Quand le chemin CHOISI n'est plus un dossier, Rust applique le profil à
        // sa place — et taire cette substitution ferait croire que le profil est
        // le choix de l'utilisateur. Un texte d'aide qui ment est pire qu'une
        // absence de texte (règle du dépôt, déjà payée ici).
        if (!choisi) {
          box.appendChild(el("p", { class: "hint" }, ["Mon profil (par défaut) : " + actif]));
        } else if (choisi === actif) {
          box.appendChild(el("p", { class: "hint" }, ["Mon choix : " + actif]));
        } else {
          box.appendChild(el("p", { class: "hint" }, ["Réglage introuvable : " + choisi]));
          box.appendChild(el("p", { class: "hint" }, ["Le profil est utilisé à la place : " + actif]));
        }
      });

      // ZONES DE LA BARRE DE DROITE — DEMANDE EXPLICITE : « tous les paramétrages
      // qui sont dans le menu du clic droit sur un séparateur de zone se trouvent
      // groupés dans une section spécifique dans les réglages avec les autres
      // réglages de ces zones ».
      //
      // **CE QUE LE MENU PROPOSE, ET RIEN DE MOINS** : le clic droit sur un
      // séparateur de zone offre `Cote`, `Columns` et `Locked` (voir
      // `win32::cef_spacer_size::SpacerEdit` — `Size` ne concerne que les espaces
      // ORDINAIRES, dont le blanc veut dire quelque chose). Les trois sont donc
      // ici, à côté des réglages de zone qui n'existaient QUE dans ce panneau :
      // le nom, l'affichage du nom, et les deux réglages GLOBAUX — la taille du
      // nom et la marge de case des icônes.
      //
      // ⚠️ **LES BORNES DES CURSEURS DE COTE ET DE COLONNES SONT STATIQUES ICI**,
      // alors que le menu, lui, les reçoit de Rust (`Dock::zone_cote_max`,
      // `Dock::max_zone_columns` — ils dépendent de la largeur RÉELLE de la
      // barre). C'est sans conséquence : le plafond effectif est appliqué à la
      // LECTURE (`effective_zone_columns`, et la disposition borne la cote), donc
      // une valeur trop grande est CONSERVÉE puis ramenée — jamais refusée.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Zones de la barre de droite"]));
        // **LA BANNIÈRE DE MIGRATION — EN TÊTE, ET SEULEMENT S'IL Y EN A EU UNE.**
        // La conversion depuis les six anciens fichiers de zone (voir
        // `config::ZONES_MIGRATION_FILE`) s'annonce ICI et pas seulement dans le
        // journal : c'est une décision de l'utilisateur, et un changement de format
        // de configuration qui ne se dit pas est un changement qu'on subit.
        //
        // Elle s'ACQUITTE — le bouton supprime le fichier de rapport, et la
        // bannière disparaît. Le champ est dans la clé d'état, donc la voie rapide
        // la retire aussi (sinon elle resterait à l'écran jusqu'au prochain
        // rechargement complet — même piège que `barLocks` et `zones`).
        if (state.zonesMigration) {
          const rapport = state.zonesMigration;
          const bandeau = el("div", { class: "migration-banner" });
          bandeau.appendChild(el("strong", {}, ["Vos zones ont changé de format"]));
          bandeau.appendChild(el("span", {}, [
            "Elles sont désormais désignées par leur barre et leur rang (D3, par exemple), " +
            "et ne bougent plus quand vous ajoutez une épingle. Vos anciens fichiers sont " +
            "conservés à côté, avec le suffixe .avant-zones-toml.",
          ]));
          const liste = el("ul", {});
          const resume = (titre, table) => {
            const cles = Object.keys(table || {});
            if (cles.length === 0) return;
            liste.appendChild(el("li", {}, [
              `${titre} : ${cles.map((cle) => `${cle} (ex-${table[cle]})`).join(", ")}`,
            ]));
          };
          resume("Conservées à leur place", rapport.conservees);
          resume("Recréées à la fin de la barre de droite", rapport.recreees);
          const perdues = rapport.perdues || [];
          if (perdues.length > 0) {
            liste.appendChild(el("li", { class: "warn" }, [
              `Non converties (un réglage sans hauteur ne se recrée pas) : ${perdues.map((p) => p.index).join(", ")}`,
            ]));
          }
          if (rapport.tailles_abandonnees > 0) {
            liste.appendChild(el("li", {}, [
              `${rapport.tailles_abandonnees} tailles d'espaces abandonnées : elles ne désignaient aucun espace de barre.`,
            ]));
          }
          bandeau.appendChild(liste);
          bandeau.appendChild(el("button", {
            class: "action", onclick: () => go("zones-migration-ack"),
          }, ["Compris"]));
          box.appendChild(bandeau);
        }
        // Les DEUX réglages GLOBAUX d'abord : ils concernent toutes les zones.
        slider(box, {
          label: "Taille du nom des zones", min: 10, max: 48, value: state.zoneLabelFontPx,
          valueLabel: (v) => v + "px", dataKey: "zone-label-font",
          onInput: (v) => go("zone-label-font", v),
        });
        slider(box, { label: "Marge des icônes dans leur case", min: 0, max: 24, value: state.zoneCellMargin, valueLabel: (v) => v + "px", dataKey: "zone-cell-margin", onInput: (v) => go("zone-cell-margin", v) });
        const zones = state.zones || [];
        zoneRemovePending = null;
        retraitEnAttente = null;
        // **AJOUTER UNE ZONE** — DEMANDE EXPLICITE : « je voudrais dans les réglages
        // pour ajouter et supprimer des zones ». Placé AVANT le cas « aucune zone » :
        // sans cela la section sortait tôt (le `return` ci-dessous), et il n'y aurait
        // eu AUCUN moyen de créer la première zone depuis ici.
        //
        // Elle naît EN FIN DE BARRE, et ce n'est pas un détail : le miroir de la zone
        // de notification vit APRÈS tout ce qui est persisté (voir
        // `Dock::set_tray_count`), donc c'est la DERNIÈRE zone de la barre qui le
        // reçoit — exactement ce que veut qui crée une zone « Notifications ».
        box.appendChild(el("button", { class: "action", onclick: () => go("zone-add-at-end") }, ["＋ Ajouter une zone en fin de barre"]));
        if (zones.length === 0) {
          box.appendChild(el("p", { class: "hint" }, ["Aucune zone pour l'instant. Le bouton ci-dessus en crée une en fin de barre ; Maj + clic droit sur une barre en crée une là où vous voulez."]));
          return;
        }
        box.appendChild(el("p", { class: "hint" }, ["Une zone par bloc. Verrouiller une zone fige sa hauteur ET son contenu. Pour la faire disparaître, cochez « Cacher cette zone » : elle reste une zone, et revient au même endroit."]));
        // **LE BUDGET DE HAUTEUR** — la seule information qui manquait pour comprendre pourquoi une
        // zone « est écrasée et ne réagit pas ». Une cote est une RÉSERVATION FIXE : une zone ne
        // rétrécit pas pour tenir à son contenu (choix du modèle, figé par un test), donc la SOMME
        // des cotes peut dépasser la barre — et rien ne le disait. Mesuré chez l'utilisateur :
        // 3481 px réservés pour une barre de 2016. C'est une ADDITION, pas un défaut.
        //
        // Le total est calculé ICI, sur les valeurs que la page affiche déjà : c'est la somme de ce
        // que l'utilisateur voit, donc elle ne peut pas diverger de ce qu'il lit zone par zone.
        const reserve = zones.reduce((total, zone) => total + zone.cote, 0);
        const disponible = state.rightBarHeight;
        if (disponible) {
          const trop = Math.round(reserve - disponible);
          // La couleur est EN DUR, et c'est délibéré : ce texte est posé sur le BUREAU FLOUTÉ,
          // dont dépend toute la lisibilité — une teinte dérivée de l'accent ne garantirait rien
          // (même raison que `--popup-fg-rgb`, voir `cef_popup::push_window_palette`).
          box.appendChild(el("p", { class: "hint", style: trop > 0 ? "color:#ff9a9a;font-weight:600" : "" }, [
            trop > 0
              ? `${Math.round(reserve)} px réservés sur ${Math.round(disponible)} disponibles — ${trop} px de TROP : les dernières zones sortent de la barre.`
              : `${Math.round(reserve)} px réservés sur ${Math.round(disponible)} disponibles.`,
          ]));
        }
        // **LA ZONE QUI REÇOIT LES APPLICATIONS AJOUTÉES DEPUIS LE DASH** — voir
        // `cef_dash::handle_add_to_zone`. Ce n'est pas un réglage d'une zone mais
        // un choix PARMI elles, d'où sa place ici, avant la liste.
        //
        // **Seules les zones NOMMÉES sont proposées**, et c'est une contrainte,
        // pas un oubli : l'entrée du clic droit affiche le nom choisi, or un
        // libellé « Zone 3 » se renumérote tout seul dès qu'une zone au-dessus
        // change de nom — l'utilisateur verrait alors autre chose que ce qu'il a
        // choisi ici. « Aucune » retire simplement l'entrée du menu du Dash.
        const zonesNommees = zones.filter((zone) => zone.name);
        if (zonesNommees.length > 0) {
          segmented(box, {
            label: "Zone qui reçoit les applications ajoutées depuis le Dash",
            options: [{ label: "Aucune", value: "none" }].concat(
              zonesNommees.map((zone) => ({ label: zone.name, value: String(zone.key) })),
            ),
            value: state.dashAddZone === null || state.dashAddZone === undefined ? "none" : String(state.dashAddZone),
            dataKey: "dash-add-zone",
            onSelect: (v) => go("dash-add-zone", v),
          });
        }
        zones.forEach((zone) => {
          // LE NOM REMPLACE LE NUMÉRO — DEMANDE EXPLICITE : « que dans ce cas son
          // nom ne soit plus un nombre ». Le numéro vient de Rust et suit la
          // POSITION dans la barre (voir `ZoneSummary::number`, doc), donc il se
          // renumérote tout seul quand on déplace une zone ; une zone renommée,
          // elle, ne consomme plus de numéro et les suivantes se renumérotent
          // sans trou.
          const titre = zone.name ? zone.name : `Zone ${zone.number}`;
          box.appendChild(el("h3", {}, [titre]));
          // L'INDICE NE RÉPÈTE PLUS LA COTE, et c'est délibéré : elle a
          // maintenant son CURSEUR juste en dessous, qui la montre en
          // permanence — et un texte recopiant une valeur en cours de glissement
          // resterait figé (les curseurs ne sont pas dans `computeStructureKey`,
          // voir la distinction curseur/forme). Le nombre d'icônes, lui, ne
          // change pas au glissement.
          box.appendChild(el("p", { class: "hint" }, [`${zone.content} icône${zone.content > 1 ? "s" : ""}`]));
          // **CE QU'ELLE CONTIENT, EN CLAIR** — DEMANDE EXPLICITE : « dans les
          // réglages de zones je voudrais voir ce qui se trouve dedans, et avoir la
          // possibilité de la cacher quand c'est une applet et de le retirer quand
          // c'est un raccourci ».
          //
          // ⚠️ **LA LISTE, ET NON LE COMPTE CI-DESSUS**, qui reste tel quel : le
          // compte écarte les espaces ET les icônes masquées, parce qu'il sert à
          // reconnaître la zone à l'œil. La liste, elle, montre tout — sans quoi on
          // ne pourrait ni voir un espace, ni réafficher une applet cachée.
          //
          // **L'ACTION EST DÉJÀ DÉCIDÉE PAR RUST** (voir `ZoneRow`) : la page ne
          // choisit que le bouton à dessiner, et n'invente jamais d'action.
          (zone.contents || []).forEach((ligne) => {
            const rang = el("div", { class: "zone-row" });
            rang.appendChild(el("span", { class: "zone-row-label" }, [ligne.label]));
            if (ligne.spacer !== null && ligne.spacer !== undefined) {
              rang.appendChild(el("span", { class: "hint" }, [`${Math.round(ligne.spacer)} px`]));
            }
            if (ligne.action === "hide") {
              // **LE MÊME INTERRUPTEUR QUE LA SECTION FONCTIONNALITÉS**, et c'est une
              // contrainte, pas un choix : une applet est UNE icône pour tout le dock,
              // il n'existe pas de masquage par zone. Cacher ici décoche donc là-bas.
              checkboxRow(rang, ligne.hidden !== true, "Afficher", (checked) => {
                go("feature", ligne.arg, checked ? "1" : "0");
              });
            } else if (ligne.action === "remove") {
              const bouton = el("button", { class: "action" }, ["－ Retirer"]);
              // Même confirmation EN DEUX TEMPS que « Supprimer cette zone » : le
              // premier clic arme, le second exécute.
              bouton.addEventListener("click", () => {
                if (retraitEnAttente !== ligne.arg) {
                  retraitEnAttente = ligne.arg;
                  bouton.textContent = "Confirmer le retrait ?";
                  return;
                }
                retraitEnAttente = null;
                go("launcher-remove", ligne.arg);
              });
              rang.appendChild(bouton);
            } else if (ligne.note) {
              // Pas d'action, mais une RAISON — écrite par Rust, affichée telle
              // quelle. Une épingle de `config.toml` en a une.
              rang.appendChild(el("span", { class: "hint" }, [ligne.note]));
            }
            box.appendChild(rang);
          });
          checkboxRow(box, zone.locked === true, "Verrouiller la zone", (checked) => {
            go("zone-lock", String(zone.key), checked ? "1" : "0");
          });
          // LA COTE — le premier des deux réglages du menu qui n'existait pas ici.
          // ⛔ **`min: 1`, JAMAIS `0` — BUG RÉEL SIGNALÉ LE 2026-10-08 : « j'ai
          // réduit la hauteur de la zone de notification à zéro et ses réglages
          // ont disparu ainsi que la zone ». La cote 0 DÉFAIT la zone
          // (`set_zone_height`), donc sur ce curseur elle la DÉTRUISAIT — alors
          // qu'un `0` de hauteur se lit « pas de hauteur », c'est-à-dire
          // « cachée ». Le libellé « défait la zone » n'apparaissait qu'UNE FOIS
          // ARRIVÉ à 0 : trop tard.
          // ⭐ **CE QU'IL FALLAIT : la case « Cacher cette zone »**, ajoutée le
          // 2026-09-23 sur demande explicite (« ne puissent pas être supprimées
          // mais seulement cachées »). Elle fait exactement ce que l'utilisateur
          // croyait faire, et elle est RÉVERSIBLE.
          // ⚠️ Les GESTES gardent le 0 délibérément — le glisser d'un bord et
          // Maj + clic droit ; on y VOIT la zone se défaire sous la main. Le
          // contrôle discret, lui, ne pardonne pas l'aller-retour.
          slider(box, {
            label: "Hauteur déclarée (cote)", min: 1, max: 1600, value: Math.round(zone.cote),
            valueLabel: (v) => v + "px",
            dataKey: `zone-cote-${zone.key}`, onInput: (v) => go("zone-cote", String(zone.key), v),
          });
          // ...et LES COLONNES, le second.
          slider(box, {
            label: "Colonnes de la grille", min: 1, max: 8, value: zone.columns,
            valueLabel: (v) => String(v),
            dataKey: `zone-columns-${zone.key}`, onInput: (v) => go("zone-columns", String(zone.key), v),
          });
          // ...et de quoi la RENOMMER. `change` et NON `input` : renommer à
          // chaque frappe ferait un aller-retour CEF et une écriture de fichier
          // par caractère tapé. Vider le champ rend son numéro à la zone (voir
          // `win32::cef_settings`, action `zone-name`).
          const champ = el("input", {
