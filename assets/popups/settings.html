<!doctype html>
<!--
  win32::cef_settings (icône Réglages) — reproduit en CSS le contenu de
  win32::settings_dash::build_ui : ~20 sections (thèmes, couleurs des
  barres, transparence, taille des barres, teinte de la barre des tâches
  Windows, flou, apparence des menus, couleur de mise en avant des trois
  fenêtres CEF).

  Rust pousse l'état COMPLET (window.setState) À CHAQUE FRAME tant que ce
  popup est visible (voir win32::cef_settings::poll, doc de module) — un
  thème complet touche huit réglages à la fois, un rafraîchissement total
  est plus simple à garder correct qu'un suivi fin de "qu'est-ce qui a
  changé". Comme voicemeeter.html, la structure du DOM n'est reconstruite
  QUE si elle a changé (peu de cas ici : la liste des couleurs
  personnalisées/thèmes personnalisés, ou l'apparition d'un sélecteur de
  palette) ; sinon les valeurs sont mises à jour EN PLACE, en sautant tout
  champ/curseur qui a actuellement le focus — même raison que
  voicemeeter.html (un curseur natif perd sa capture souris si son nœud DOM
  est retiré en plein glissement).

  Deux catalogues STATIQUES (120 thèmes, 48 préréglages Windows) arrivent
  UNE FOIS par window.setCatalog, à l'ouverture — pas à chaque frame comme
  window.setState (voir win32::cef_settings::toggle).

  PAS de sélecteur de couleur natif (<input type="color">) — voir
  win32::cef_settings, doc de module, pour la raison détaillée (la même
  classe de bug de focus qui a fait migrer ce panneau loin de WebView2).
  À LA PLACE : un dégradé teinte/saturation/valeur maison, EN PAGE (voir
  gradientPicker) — équivalent du color_edit_button_rgb d'egui qu'avait
  l'ancien win32::settings_dash, perdu par erreur à la réécriture CEF et
  demandé à nouveau explicitement depuis. Présent dans CHAQUE colorPicker(),
  donc dans toutes les sections de choix de couleur du panneau.

  PAS de `background` sur `<html>`/`<body>` : transparent par défaut en
  rendu hors-écran CEF.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<script src="menu_contextuel.js"></script>
<style>
  html {
    /* Réglable en direct par window.setState (voir push_state côté Rust,
       curseur "Contenu" — sous-section "Réglages (ce panneau)" de "Taille
       du contenu des dashs") — voir `.scroll` ci-dessous. `zoom` (PAS un
       `calc()` sur chaque taille comme dash.html/clipboard.html) :
       contrairement au Dash (tuiles icône+étiquette) ou au Presse-papiers
       (miniature+texte), ce panneau n'a pas une poignée de tailles bien
       identifiées à multiplier une par une — des dizaines de sections avec
       titres/curseurs/cases à cocher/nuanciers de couleur, un `zoom` sur
       tout le contenu défilant évite de lister chaque règle une par une ET
       reste net à toute échelle (contrairement à un `transform: scale`, qui
       flouterait le texte et ne recalculerait pas la mise en page pour
       `overflow-y: auto`). Propriété non standard mais bien supportée par
       Chromium/Blink (voir win32::cef_app, doc de module : ce panneau
       tourne dans un moteur CEF, donc Chromium, pas un navigateur
       générique) — les coordonnées de clic sont automatiquement corrigées
       par le moteur, rien à faire côté win32::cef_popup::dispatch_input. */
    --content-scale: 1;
    /* Palette du CONTENU, dérivée de l'accent de CETTE fenêtre — poussée par
       win32::cef_popup::push_window_palette. Voir la doc de cette fonction pour
       le pourquoi des DEUX familles, et `dash.html` pour la même déclaration
       commentée en détail. Défauts = exactement les littéraux remplacés.
       ATTENTION, page sensible : le chrome du SÉLECTEUR DE COULEUR (roue
       chromatique, carré saturation/valeur, curseurs, pastilles « ✕ ») garde
       ses blancs et ses noirs EN DUR, et ne doit JAMAIS être converti — ce sont
       les couleurs MONTRÉES, pas des rôles d'interface. Teinter la roue ou le
       carré les rendrait faux à l'écran, et un curseur blanc sur un accent
       clair deviendrait invisible. Voir les règles `.sv-square`/`.hue-strip`
       plus bas : elles n'utilisent délibérément aucune de ces variables. */
    --popup-fg-rgb: 255, 255, 255;
    --popup-accent-rgb: 255, 255, 255;
    --popup-accent-solid-rgb: 255, 255, 255;
    --popup-on-accent-rgb: 0, 0, 0;
    /* Multiplicateur de TRANSPARENCE des éléments — un SEUL réglage pour les
       quatre panneaux (curseur "Opacité des éléments" de la section
       "Transparence et flou" des Réglages, voir
       win32::cef_popup::set_popup_alpha). Chaque alpha de ce fichier s'écrit
       `calc(<valeur> * var(--popup-alpha))`, donc 1 = tel que conçu, et la
       hiérarchie entre les éléments (un survol plus marqué qu'un repos) est
       PRÉSERVÉE quel que soit le réglage. */
    --popup-alpha: 1;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: var(--nd-police);
    /* ⛔ LE TEXTE PLEIN SUIT AUSSI LE CURSEUR — BUG RÉEL SIGNALÉ (2026-10-23) :
       « opacité des éléments n'agit pas sur tous les niveaux de textes ». La
       couleur de base était un `rgb()` OPAQUE : titres, libellés et contenu
       restaient à 100 % quand on descendait, seuls les textes déjà atténués
       bougeaient. Elle porte maintenant `min(1, a)` ; et comme une `opacity`
       se MULTIPLIE avec la couleur héritée, les textes atténués s'écrivent
       `calc(k * max(1, a))` : sous 100 %, c'est la couleur qui apporte le
       facteur (k·a, pas k·a²) ; au-dessus, l'opacité monte seule (min(1, k·a)). */
    color: rgba(var(--popup-fg-rgb), min(1, var(--popup-alpha)));
  }
  .root {
    display: flex;
    flex-direction: column;
    /* ⭐ **TOUTE LA PAGE SUIT LE CURSEUR « CONTENU » ET LA TAILLE DES TEXTES**
       — DÉFAUT SIGNALÉ (2026-10-18) : « le dash réglages n'a pas tous ses textes
       qui suivent la taille réglée ». Le zoom ne portait que sur `.scroll` : le
       titre et le menu de gauche gardaient leur taille. `100vw`/`100vh` divisés,
       jamais `100%` (voir `cef_popup::tests_largeur_zoomee`). */
    --zoom-page: calc(var(--page-scale, 1) * var(--content-scale, 1));
    zoom: var(--zoom-page);
    width: calc(100vw / var(--zoom-page));
    height: calc(100vh / var(--zoom-page));
    box-sizing: border-box;
    padding: 16px;
    gap: 12px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .topbar h1 {
    font-size: 22px;
    margin: 0;
  }
  .close-btn {
    all: unset;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: var(--nd-rayon-controle);
    font-size: 16px;
  }
  .close-btn:hover {
    background: rgba(var(--popup-accent-rgb), calc(0.23 * var(--popup-fond-alpha, 1)));
  }
  .pinned {
    flex-shrink: 0;
  }
  /* Rangée contenant la colonne de catégories + le contenu défilant —
     DEMANDE EXPLICITE ("ajoute une colonne avec les catégories de
     réglages dans interface et dans écran 1") : `.category-nav` liste le
     titre de chaque `.section` visible (voir `section()`/
     `renderCategoryNav`), cliquer dessus fait défiler `.scroll` jusqu'à
     cette section (`scrollIntoView`) au lieu de chercher à tâtons parmi
     les dizaines de sections empilées. */
  .content-row {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 12px;
  }
  /* La colonne : le champ de RECHERCHE au-dessus, puis la liste qui défile
     seule — le champ reste visible quand on fait défiler les catégories. */
  .category-col {
    flex-shrink: 0;
    width: 180px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
  }
  .category-search {
    padding: 5px 8px;
    border: 1px solid rgba(var(--popup-fg-rgb), calc(0.35 * var(--popup-fond-alpha, 1)));
    border-radius: var(--nd-rayon-controle);
    background: rgba(var(--popup-fg-rgb), calc(0.08 * var(--popup-fond-alpha, 1)));
    color: inherit;
    font: inherit;
    font-size: 13px;
  }
  .category-search::placeholder {
    opacity: calc(0.55 * max(1, var(--popup-alpha, 1)));
  }
  .category-vide {
    font-size: 12px;
    opacity: calc(0.6 * max(1, var(--popup-alpha)));
    padding: 4px 2px;
  }
  .category-nav {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .category-nav button {
    all: unset;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: var(--nd-rayon-surface);
    font-size: 13px;
    background: rgba(var(--popup-accent-rgb), calc(0.22 * var(--popup-fond-alpha, 1)));
  }
  .category-nav button:hover {
    background: rgba(var(--popup-accent-rgb), calc(0.2 * var(--popup-fond-alpha, 1)));
  }
  /* LARGEUR DE LA COLONNE DES RÉGLAGES — curseur « Largeur de la zone des
     réglages » (`--zone-largeur`, fraction posée par `window.setState`).
     Le pourcentage porte sur la place de la colonne : la rangée moins la
     colonne des catégories (180 px) et l'écart (12 px). Les deux marges
     `auto` la CENTRENT dans cette place (demande explicite, 2026-11-09). Les
     grilles en `auto-fill` du contenu se réorganisent d'elles-mêmes. */
  .scroll {
    flex: none;
    width: calc((100% - 192px) * var(--zone-largeur, 1));
    margin-inline: auto;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .section {
    background: rgba(var(--popup-accent-rgb), calc(0.24 * var(--popup-fond-alpha, 1)));
    border-radius: calc(var(--nd-rayon-grand) + 4px);
    padding: 16px;
    box-sizing: border-box;
  }
  .section h2 {
    font-size: 18px;
    margin: 0 0 8px;
  }
  /* BUG RÉEL SIGNALÉ ("inversion de la mise en avant des textes") : le
     libellé d'un curseur individuel (ex. "Icônes"/"Texte", voir `slider()`,
     qui utilise un `<h2>` comme cet en-tête de section) héritait de
     `.section h2` ci-dessus — DONC AUSSI GRAND/GRAS que le vrai titre de
     section ("Taille du contenu des dashs") — alors que le sous-groupe
     auquel il appartient (`.small-label`, "Dash"/"Presse-papiers"/
     "Réglages (ce panneau)" ci-dessous) restait, lui, minuscule et fondu :
     la hiérarchie visuelle attendue (titre > sous-groupe > libellé de
     curseur) était donc inversée entre ces deux derniers niveaux. Plus
     spécifique que `.section h2` (deux classes contre une), s'applique
     SANS toucher au vrai titre de section (jamais dans un `.row`).
  */
  /* `:not(.heading-row)` — les lignes `.heading-row` (voir sa doc plus bas,
     ex. "Transparence"/"Couleur de mise en avant — Haut") sont de VRAIS
     sous-titres de section, pas de simples libellés de curseur : ils
     doivent, eux, garder la taille de `.section h2`. */
  .section .row:not(.heading-row) h2 {
    font-size: 15px;
    font-weight: 500;
    margin: 0;
  }
  /* Le champ de renommage d'une zone — indenté sous sa case, pour qu'on voie à
     quelle zone il appartient sans compter les lignes. */
  .zone-name {
    display: block;
    margin: 2px 0 10px 26px;
    padding: 5px 8px;
    max-width: 320px;
    border: 1px solid rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.35 * var(--popup-fond-alpha, 1)));
    border-radius: var(--nd-rayon-controle);
    background: rgba(var(--menu-zone-rgb, 255, 255, 255), calc(0.08 * var(--popup-fond-alpha, 1)));
    color: inherit;
    font: inherit;
  }
  .zone-name::placeholder {
    opacity: calc(0.55 * max(1, var(--popup-alpha, 1)));
  }
  /* LE CONTENU D'UNE ZONE — une ligne par élément, indentée comme le champ de
     renommage, pour qu'on lise la liste comme appartenant à SA zone. */
  .zone-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 2px 0 2px 26px;
    font-size: 13px;
  }
  .zone-row-label {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .zone-row .hint {
    margin: 0;
  }
  /* Le compte rendu d'un motif de l'utilisateur : une erreur tient sur
     plusieurs lignes (une par erreur du compilateur). */
  .section p.hint.shader-message {
    white-space: pre-wrap;
  }
  .section p.hint {
    font-size: 13px;
    opacity: calc(0.75 * max(1, var(--popup-alpha)));
    margin: 4px 0 0;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  /* La liste des sons d'une famille (voir la section « Sons des rappels ») —
     des BOUTONS et non un `<select>` : en rendu hors écran, un `<select>` n'a
     nulle part où dérouler sa liste (voir le commentaire de la section). */
  .son-liste {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 12px;
  }
  /* `align-items: center` : c'est ce qui aligne verticalement la pastille
     d'écoute et le nom, quelle que soit la longueur du nom. */
  .son-ligne {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .son-ecouter {
    flex: 0 0 auto;
  }
  /* ⚠️ **LE ROND QUI FAIT LIRE LA LISTE COMME UN SÉLECTEUR** — vide, ou plein
     quand c'est le son choisi. Sans lui, les noms nus ressemblaient à du texte et
     la section n'annonçait plus rien qui se choisisse (voir la section « Sons des
     rappels », qui porte le récit du défaut). */
  .son-pastille {
    flex: 0 0 auto;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid currentColor;
    opacity: calc(0.55 * max(1, var(--popup-alpha)));
  }
  .son-pastille.choisi {
    background: currentColor;
    opacity: 1;
  }
  .son-nom {
    flex: 1 1 auto;
    /* `display: flex` : c'est ce qui aligne la pastille et le nom sur la même
       ligne de base, quelle que soit la longueur du nom. */
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: left;
    background: none;
    border: none;
    color: inherit;
    border-radius: var(--nd-rayon-controle);
    padding: 4px 8px;
    font: inherit;
    cursor: pointer;
    opacity: calc(0.72 * max(1, var(--popup-alpha)));
  }
  .son-nom.choisi { opacity: 1; }
  .row.heading-row h2 {
    margin: 0;
  }
  label.check {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 15px;
  }
  input[type="range"] {
    accent-color: rgba(var(--popup-accent-rgb), calc(0.85 * var(--popup-fond-alpha, 1)));
    flex: 1;
    max-width: 260px;
  }
  .slider-value {
    min-width: 46px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    opacity: calc(0.9 * max(1, var(--popup-alpha)));
  }
  /* Une seule colonne — DEMANDE EXPLICITE ("que la liste des
     fonctionnalités... ne s'affiche que sur une colonne") : "Barre du
     haut" et "Dashs" (voir `renderScroll`, section "Fonctionnalités")
     s'empilent verticalement plutôt que côte à côte. */
  .feature-columns {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .feature-columns h3 {
    font-size: 14px;
    opacity: calc(0.85 * max(1, var(--popup-alpha)));
    margin: 0 0 6px;
  }
  button.action {
    all: unset;
    cursor: pointer;
    padding: 8px 14px;
    border-radius: var(--nd-rayon-surface);
    background: rgba(var(--popup-accent-rgb), calc(0.2 * var(--popup-fond-alpha, 1)));
  }
  button.action:hover {
    background: rgba(var(--popup-accent-rgb), calc(0.22 * var(--popup-fond-alpha, 1)));
  }
  .theme-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .theme-swatch {
    all: unset;
    cursor: pointer;
    width: 108px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    position: relative;
  }
  .theme-swatch .chip {
    width: 96px;
    height: 32px;
    border-radius: var(--nd-rayon-controle);
  }
  .theme-swatch .name {
    font-size: 12px;
    text-align: center;
    max-height: 30px;
    overflow: hidden;
  }
  .theme-swatch .del {
    all: unset;
    position: absolute;
    top: 2px;
    right: 8px;
    width: 16px;
    height: 16px;
    background: rgba(0, 0, 0, calc(0.6 * var(--popup-fond-alpha, 1)));
    border-radius: var(--nd-rayon-petit);
    cursor: pointer;
    font-size: 10px;
    line-height: 16px;
    text-align: center;
  }
  .theme-swatch .del:hover {
    background: rgb(220, 60, 60);
  }
  .picker .top-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .picker input[type="text"].hex {
    width: 80px;
    padding: 5px 7px;
    border-radius: var(--nd-rayon-controle);
    border: 1px solid rgba(var(--popup-accent-rgb), calc(0.3 * var(--popup-fond-alpha, 1)));
    background: rgba(var(--popup-accent-rgb), calc(0.17 * var(--popup-fond-alpha, 1)));
    color: rgba(var(--popup-fg-rgb), min(1, var(--popup-alpha)));
    font-family: Consolas, monospace;
  }
  .swatch-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
  }
  .swatch {
    all: unset;
    width: 22px;
    height: 22px;
    border-radius: var(--nd-rayon-controle);
    cursor: pointer;
    box-sizing: border-box;
    position: relative;
  }
  .swatch.current {
    box-shadow: 0 0 0 2px var(--highlight, white);
  }
  .custom-swatch-wrap {
    position: relative;
    display: inline-block;
  }
  .custom-del {
    all: unset;
    position: absolute;
    top: -6px;
    right: -6px;
    width: 14px;
    height: 14px;
    background: rgba(0, 0, 0, calc(0.7 * var(--popup-fond-alpha, 1)));
    border-radius: 50%;
    font-size: 9px;
    line-height: 14px;
    text-align: center;
    cursor: pointer;
  }
  /* Voir `.section .row:not(.heading-row) h2` ci-dessus, même correctif :
     un sous-groupe ("Dash"/"Presse-papiers"/"Réglages (ce panneau)", voir
     leurs usages) doit ressortir PLUS que les libellés de curseur qu'il
     regroupe, pas moins. DEMANDE EXPLICITE ("la catégorie devrait être
     mise en évidence") : le premier essai (13px/600/0.85) restait trop
     proche des libellés de curseur (15px, voir la règle ci-dessus) pour
     vraiment se distinguer — opacité PLEINE, majuscules + espacement des
     lettres (seul endroit du fichier à utiliser ce traitement, réservé à
     CETTE distinction de catégorie plutôt que généralisé) pour une
     silhouette de texte clairement différente d'un simple libellé, pas
     seulement un poids de police légèrement supérieur.
  */
  .small-label {
    font-size: 13px;
    font-weight: 700;
    opacity: 1;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin: 12px 0 2px;
  }
  .gradient-picker {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 8px;
  }
  .sv-square {
    position: relative;
    width: 100%;
    max-width: 260px;
    height: 130px;
    border-radius: var(--nd-rayon-surface);
    cursor: crosshair;
    touch-action: none;
  }
  .sv-cursor {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .hue-slider {
    position: relative;
    width: 100%;
    max-width: 260px;
    height: 14px;
    border-radius: 7px;
    background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
    cursor: pointer;
    touch-action: none;
  }
  .hue-cursor {
    position: absolute;
    top: -2px;
    width: 6px;
    height: 18px;
    border-radius: var(--nd-rayon-petit);
    background: white;
    border: 1px solid rgba(0, 0, 0, 0.5);
    transform: translateX(-50%);
    pointer-events: none;
  }
  .warn {
    color: rgb(255, 180, 60);
    font-size: 13px;
  }
  /* LA BANNIÈRE DE MIGRATION (voir la section « Zones ») — elle ANNONCE un
     changement de format de la configuration, donc elle doit se voir sans être
     cherchée : un cadre, pas une ligne de texte parmi les autres. */
  .migration-banner {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px;
    border-radius: var(--nd-rayon-surface);
    border: 1px solid rgba(255, 180, 60, calc(0.5 * var(--popup-fond-alpha, 1)));
    background: rgba(255, 180, 60, calc(0.12 * var(--popup-fond-alpha, 1)));
    font-size: 13px;
  }
  .migration-banner ul {
    margin: 0;
    padding-left: 18px;
  }
  .migration-banner button {
    all: unset;
    cursor: pointer;
    align-self: flex-start;
    padding: 5px 12px;
    border-radius: var(--nd-rayon-surface);
    background: rgba(var(--popup-accent-rgb), calc(0.28 * var(--popup-fond-alpha, 1)));
  }
  /* LES SAUVEGARDES DU DÉGRADÉ — une grille de cartes : le nom, le motif et
     l'aperçu des couleurs. DEMANDE EXPLICITE (2026-10-03) : « une meilleure
     présentation pour une centaine de sauvegardes ». Hauteur bornée et
     défilement propre : cent cartes ne repoussent pas la suite de la page. */
  .sauvegardes-grille {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));

    padding: 6px 6px 6px 8px; border-radius: 8px; cursor: pointer; text-align: left;

  .size-choices {

  /* Onglets de navigation de haut niveau — "Interface" / "Écran N" (voir

     Look identique à `.size-choices` (seul autre "sélecteur à boutons" du

  .tab-bar {
    display: flex;

  }
  .tab-bar button {
    all: unset;

  /* ⭐ SOUS-ONGLETS (groupes de l'onglet « Interface », voir `renderGroupTabs`) —

  /* ⭐ L'ASPECT D'APPLICATION WINDOWS — DEMANDE EXPLICITE (2026-10-24) :
     « lui donner un aspect d'application windows ». Les Paramètres de
     Windows 11 : une colonne de navigation SANS fond où l'entrée courante
     porte une pastille d'accent, des cartes d'un gris neutre bordées d'un

  .topbar h1 {

  /* L'ICÔNE DE CATÉGORIE — DEMANDE EXPLICITE (2026-11-06) : « organiser les
     réglages un peu dans le style du bureau Unity en utilisant des icônes ». Un
     glyphe Phosphor (voir `.ico` dans `style.css`, `iconeCategorie` plus bas)
     devant chaque entrée, comme un panneau de configuration GNOME/Unity. Il
     suit la couleur du texte (donc le thème) et pâlit un peu quand l'entrée
     n'est pas courante, pour laisser le libellé primer. */
  .category-nav button .ico {

  /* La pastille verticale de l'entrée courante — 3 × 16 px, comme Windows. */

    position: absolute;
    left: 4px;
    top: 50%;
    width: 3px;

  }
  .scroll {

    padding-right: 4px;
  }
  .section {
    background: rgba(var(--popup-fg-rgb), calc(0.16 * var(--popup-fond-alpha, 1)));
    border: 1px solid rgba(var(--popup-fg-rgb), calc(0.22 * var(--popup-fond-alpha, 1)));

  }
  /* Onglets façon « pivot » : du texte, et un trait d'accent sous le choisi. */
  .tab-bar {
    gap: 4px;
    margin: 0;
  }
  .tab-bar button {
    padding: 6px 12px 8px;
    border-radius: var(--nd-rayon-controle);
    background: transparent;
    border-bottom: 3px solid transparent;

  /* Bouton standard Fluent : un voile du texte et un filet. */

  .size-choices button {

  /* Les horloges du monde : alignées sur le titre, champ pleine largeur. */
  .zone-row.horloge-monde { margin-left: 0; }

  button.action:disabled {

  /* ⭐ SÉLECTEUR DE PANNEAU de la section « Couleur de mise en avant » (voir
     `rendreAccent`) — DEMANDE EXPLICITE (2026-11-06). Une grille de puces qui
     s'enroulent ; comme il y en a ~23, la zone défile au-delà de quelques rangs
     pour ne pas repousser les contrôles de couleur hors de vue. Même langage que
     les autres sélecteurs à boutons : filet neutre, accent plein pour le choisi. */
  .panel-choices {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
    max-height: 168px;
    overflow-y: auto;
  }
  .panel-choices button {
    all: unset;
    cursor: pointer;
    padding: 5px 11px;
    border-radius: var(--nd-rayon-controle);
    font-size: 13px;
    background: rgba(var(--popup-fg-rgb), calc(0.13 * var(--popup-fond-alpha, 1)));
    border: 1px solid rgba(var(--popup-fg-rgb), calc(0.18 * var(--popup-fond-alpha, 1)));
  }
  .panel-choices button:hover {
    background: rgba(var(--popup-fg-rgb), calc(0.2 * var(--popup-fond-alpha, 1)));
  }
  .panel-choices button.selected {

    color: rgb(var(--popup-on-accent-rgb));
    border-color: transparent;
    font-weight: 600;
  }
  /* LES CASES DEVIENNENT DES INTERRUPTEURS, À DROITE DE LEUR LIBELLÉ.
     `row-reverse` suffit : `checkboxRow` pose la case AVANT le texte. La case
     reste une vraie `<input type="checkbox">` (clic, `change`, `checked`) :
     seul son dessin change. Deux cases qui se suivent sont séparées d'un filet,
     comme les lignes d'une carte des Paramètres. */
  label.check {
    flex-direction: row-reverse;
    justify-content: space-between;
    gap: 16px;
    padding: 9px 0;
    font-size: 14px;
  }
  label.check + label.check {
    border-top: 1px solid rgba(var(--popup-fg-rgb), calc(0.2 * var(--popup-fond-alpha, 1)));
  }
  label.check input[type="checkbox"] {
    appearance: none;
    flex: none;
    position: relative;
    width: 40px;
    height: 20px;
    margin: 0;
    box-sizing: border-box;
    border-radius: 10px;
    border: 1px solid rgba(var(--popup-fg-rgb), calc(0.6 * max(1, var(--popup-alpha))));
    background: transparent;
    cursor: pointer;
    transition: background 0.12s;
  }
  label.check input[type="checkbox"]::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 4px;
    width: 12px;
    height: 12px;
    transform: translateY(-50%);
    border-radius: 50%;
    background: rgba(var(--popup-fg-rgb), calc(0.8 * max(1, var(--popup-alpha))));
    transition: left 0.12s;
  }
  label.check input[type="checkbox"]:checked {
    background: rgb(var(--popup-accent-solid-rgb));
    border-color: transparent;
  }
  label.check input[type="checkbox"]:checked::after {
    left: 23px;
    background: rgb(var(--popup-on-accent-rgb));
  }
  label.check:hover input[type="checkbox"]:not(:checked) {
    background: rgba(var(--popup-fg-rgb), calc(0.13 * var(--popup-fond-alpha, 1)));
  }
  /* Le curseur Fluent : un rail fin et une poignée ronde cerclée. Ne touche
     PAS au dégradé du sélecteur de couleur (`.hue-slider` n'est pas un
     `input[type=range]`). */
  input[type="range"] {
    appearance: none;
    height: 20px;
    background: transparent;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: rgba(var(--popup-fg-rgb), calc(0.5 * var(--popup-fond-alpha, 1)));
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 20px;
    height: 20px;
    margin-top: -8px;
    border-radius: 50%;
    background: rgb(var(--popup-accent-solid-rgb));
    border: 5px solid rgb(var(--popup-on-accent-rgb));
    box-shadow: 0 0 0 1px rgba(var(--popup-fg-rgb), 0.25);
    box-sizing: border-box;
  }
  input[type="range"]:hover::-webkit-slider-thumb {
    border-width: 4px;
  }
</style>

<body>
  <div class="root">
    <div class="topbar">
      <h1>Réglages</h1>
      <button class="close-btn" onclick="go('close')" title="Fermer"><span class="ico ico-x"></span></button>
    </div>
    <div class="tab-bar" id="main-tabs"></div>
    <div class="tab-bar sub-tabs" id="group-tabs"></div>
    <div class="content-row">
      <div class="category-col">
        <input type="search" class="category-search" id="category-search" placeholder="Rechercher un réglage" autocomplete="off" spellcheck="false">
        <div class="category-nav" id="category-nav"></div>
      </div>
      <div class="scroll" id="scroll"></div>
    </div>
  </div>
  <script>
    function go(...segments) {
      location.href = "neuradesk://settings/" + segments.map(encodeURIComponent).join("/");
    }
    // ⛔ **TOUT `on…` PASSE PAR `addEventListener`, PAS PAR `setAttribute`.**
    // Ce helper ne traitait que `onclick` et `oncontextmenu`, et renvoyait tout le
    // reste à `setAttribute` — donc `onchange: (e) => …` devenait l'ATTRIBUT
    // `onchange="(e) => …"`, c'est-à-dire une CHAÎNE DE CARACTÈRES que le
    // navigateur n'exécute jamais.
    //
    // ⚠️ **C'EST LA DEUXIÈME FOIS QUE CE DÉFAUT FRAPPE, ET LA PREMIÈRE AURAIT DÛ
    // SUFFIRE.** Il a été trouvé et corrigé dans `notes.html` le 2026-09-24 (trois
    // handlers morts : le sélecteur de son et les deux champs de l'alarme) — mais
    // corrigé LÀ OÙ IL S'ÉTAIT MANIFESTÉ, pas dans la classe. Ici, il a tué les
    // deux sélecteurs de son des rappels dès leur écriture : l'utilisateur a
    // rapporté « je n'arrive pas à changer le son des rappels dans le dash
    // réglage ». **Un défaut corrigé sur son occurrence revient sur la suivante.**
    function el(tag, attrs, children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs || {})) {
        if (key === "class") node.className = value;
        // `onclick` → `click`, `onchange` → `change`, `oninput` → `input`…
        else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
        else node.setAttribute(key, value);
      }
      for (const child of children || []) {
        node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
      }
      return node;
    }
    function toU8(c) { return Math.round(Math.max(0, Math.min(1, c)) * 255); }
    function rgbToHex([r, g, b]) {
      return [r, g, b].map((c) => toU8(c).toString(16).padStart(2, "0").toUpperCase()).join("");
    }
    function hexToRgb01(hex) {
      return [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
    }
    function rgbToHsv(r, g, b) {
      const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
      let h = 0;
      if (d !== 0) {
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
        if (h < 0) h += 360;
      }
      return [h, max === 0 ? 0 : d / max, max];
    }
    function hsvToRgb(h, s, v) {
      const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
      const [r, g, b] =
        h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
      return [r + m, g + m, b + m];
    }

    let catalog = { themes: [], presets: [] };
    let state = null;
    let structureKey = null;
    // Onglet PRINCIPAL actuellement affiché (voir `renderMainTabs`) —
    // DEMANDE EXPLICITE : "je veux un onglet [...] intitulé Interface avec
    // les réglages de l'interface principale, d'autres onglets à côté en
    // fonction du nombre d'écrans secondaires intitulé Écran + numéro [...]
    // où apparaissent les réglages de l'écran concerné". État PUREMENT
    // local à ce panneau (jamais envoyé/reçu de Rust, contrairement à tout
    // `state.*`) : soit la chaîne `"interface"`, soit le `deviceName` d'un
    // écran secondaire. Persiste tant que ce dash reste ouvert ; retombe
    // sur "interface" si l'écran actuellement sélectionné a disparu
    // (débranché, voir `renderMainTabs`).
    let activeMainTab = "interface";

    // ⭐ GROUPES THÉMATIQUES de l'onglet « Interface » — DEMANDE EXPLICITE
    // (2026-11-06) : « regrouper des catégories et utiliser des sous-catégories
    // […] avec des onglets à sous-niveaux ». Deux niveaux d'onglets : l'onglet
    // de haut niveau (« Interface » / « Écran(s) ») porte, SOUS lui, une rangée
    // de SOUS-ONGLETS = ces groupes ; la colonne de gauche liste alors les
    // SOUS-CATÉGORIES du groupe choisi, et chaque section garde ses propres
    // sous-titres (`<h3>`, `.small-label`). Un groupe est un simple FILTRE posé
    // par-dessus la visibilité existante (voir `filtrerLesReglages`) : toutes les
    // sections restent rendues, donc la RECHERCHE reste GLOBALE (elle traverse
    // tous les groupes, voir le prédicat de groupe qui s'efface dès qu'on cherche).
    const GROUPES = [
      { id: "apparence", nom: "Apparence", ico: "palette" },
      { id: "barres", nom: "Barres & dock", ico: "squares-four" },
      { id: "fenetres", nom: "Fenêtres & bureaux", ico: "app-window" },
      { id: "horloge", nom: "Horloge & infos", ico: "clock" },
      { id: "terminaux", nom: "Terminaux", ico: "terminal-window" },
      { id: "systeme", nom: "Système", ico: "gear" },
    ];
    // Le groupe d'une catégorie d'après son libellé — règles ORDONNÉES, première
    // correspondance gagne, libellé sans accents/casse. L'ordre encode le CONTENU
    // réel, pas juste le mot : « Horloge plein écran » est un widget d'HORLOGE (sa
    // règle passe avant « plein écran » des fenêtres) ; la « Sphère des programmes »
    // pose les FENÊTRES ouvertes (≠ « sphère des terminaux ») ; « Défilement à la
    // molette » et « Verrous » agissent sur les BARRES ; « Infobulles » et « Dash
    // dossier » sont des réglages SYSTÈME, pas des widgets ni des fenêtres.
    const REGLES_GROUPES = [
      // Terminaux : ce qui nomme le terminal (la sphère DES PROGRAMMES n'en est pas).
      [/terminal|terminaux/, "terminaux"],
      // Horloge & infos : l'horloge et les widgets d'info de la barre du haut.
      // AVANT « fenêtres » pour que « Horloge plein écran » reste une horloge.
      [/horloge|heure|calendrier|monde|fuseau|meteo|reseau|debit|num et| maj\b|notification|rappel|\bson\b|sonore|audio/, "horloge"],
      // Fenêtres & bureaux : aperçus, ouverture/fondu, plein écran, bureaux
      // virtuels, et la sphère des FENÊTRES ouvertes.
      [/apercu|ouverture|fondu|plein ecran|bureaux virtuels|sphere/, "fenetres"],
      // Système : fonctionnalités, captures, sauvegarde, éditeur, infobulles,
      // et le dash du dossier personnel.
      [/fonctionnalite|capture|sauvegarde|configuration|editeur|infobulle|dossier personnel|dash dossier/, "systeme"],
      // Barres & dock : barres, séparateurs, logo, indicateur, épingles, zones,
      // empilement, écartement, défilement molette, verrous des barres, masquage.
      [/barre|separateur|logo|indicateur|epingl|\bzone|empilement|ecartement|pastille|molette|defilement|verrou|masquage/, "barres"],
    ];
    function groupeCategorie(label) {
      const t = label.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
      for (const [re, id] of REGLES_GROUPES) if (re.test(t)) return id;
      return "apparence";
    }
    let activeGroup = GROUPES[0].id;

    // Le panneau choisi dans la section unique « Couleur de mise en avant » (voir
    // la boucle `ACCENT_TARGETS` fusionnée) — DEMANDE EXPLICITE (2026-11-06) :
    // « fusionner en une seule catégorie avec un sélecteur de panneau ». Au niveau
    // module comme les onglets : il SURVIT aux reconstructions (changer une couleur
    // repasse par Rust puis rebâtit la page ; sans ça on reviendrait au premier
    // panneau à chaque réglage).
    let activeAccentPanel = "dash";
    // Même rôle que `activeAccentPanel`, mais pour la section « Couleur des
    // menus » (voir `MENU_TARGETS`) — survit aux reconstructions de la page.
    let activeMenuTarget = "context";

    // ⭐ L'ORDRE CARTÉSIEN à l'INTÉRIEUR de chaque groupe — DEMANDE EXPLICITE
    // (2026-11-06) : « organiser tout ça de façon cartésienne ». Les sections sont
    // BÂTIES dans l'ordre historique du code ; ici on les RÉORDONNE à l'affichage
    // (voir `ordonnerCartesien`), sans toucher au constructeur. Chaque entrée est
    // un PRÉFIXE de libellé (comparé sans accents/casse), ce qui range d'un coup les
    // familles à suffixe variable (« Couleur de la barre du haut/gauche/… », « Couleur
    // de mise en avant — Dash/Réglages/… ») et garde leur sous-ordre d'origine (tri
    // stable). Un libellé absent de sa liste passe en fin de groupe (rang 999).
    // L'ordre va du GÉNÉRAL au PARTICULIER, et regroupe les sous-thèmes voisins.
    const ORDRE_GROUPES = {
      apparence: [
        "Thèmes", "Style", "Icônes", "Texture de l'interface", "Ombres",
        "Transparence et flou", "Apparence des menus", "Animation au survol",
        "Taille des textes", "Taille du contenu des dashs", "Couleur de mise en avant",
      ],
      barres: [
        "Couleur de la barre", "Couleur du texte de la barre du haut",
        "Taille du texte de la barre du haut", "Écartement des icônes",
        "Couleur des séparateurs", "Taille des séparateurs", "Logo",
        "Indicateur d'application ouverte", "Empilement des icônes",
        "Défilement à la molette", "Zones de la barre de droite",
        "Barre du bas — dossiers épinglés", "Visibilité des barres",
        "Masquage automatique", "Verrous",
      ],
      fenetres: [
        "Aperçus de fenêtres", "Aperçu des bureaux virtuels",
        "Ouverture des fenêtres", "Fondu des fenêtres", "Plein écran",
        "Sphère des programmes",
      ],
      horloge: [
        "Horloge plein écran", "Calendrier", "Horloges du monde",
        "Météo du calendrier", "Débit réseau", "Verr. num et Verr. maj",
        "Notifications de Windows", "Sons des rappels",
      ],
      terminaux: ["Texture des terminaux", "Vue sphère des terminaux"],
      systeme: [
        "Fonctionnalités", "Sauvegarde de la configuration",
        "Visibilité dans les captures d'écran", "Infobulles",
        "Dash dossier", "Éditeur d'image",
      ],
    };
    function rangDansGroupe(label, groupe) {
      const t = sansAccents(label);
      const ordre = ORDRE_GROUPES[groupe] || [];
      for (let i = 0; i < ordre.length; i++) if (t.startsWith(sansAccents(ordre[i]))) return i;
      return 999;
    }
    // Réordonne les sections de `#scroll` par (rang du groupe, rang dans le groupe).
    // Déplacer un nœud par `appendChild` préserve son état et ses écouteurs (les
    // curseurs gardent leur valeur). Le tri est STABLE : deux entrées de même rang
    // (ex. les quatre « Couleur de la barre ») gardent leur ordre d'origine. Rebâtit
    // `sectionCategories` dans le nouvel ordre pour que la colonne suive le défilement.
    function ordonnerCartesien(scroll) {
      const rangGroupe = (g) => { const i = GROUPES.findIndex((x) => x.id === g); return i < 0 ? GROUPES.length : i; };
      const sections = [...scroll.querySelectorAll(":scope > .section")];
      sections
        .map((box) => {
          const g = box.dataset.groupe || "apparence";
          const h2 = box.querySelector("h2");
          return { box, a: rangGroupe(g), b: rangDansGroupe(h2 ? h2.textContent : "", g) };
        })
        .sort((x, y) => x.a - y.a || x.b - y.b)
        .forEach(({ box }) => scroll.appendChild(box));
      sectionCategories = [...scroll.querySelectorAll(":scope > .section[id]")].map((box) => ({
        id: box.id,
        label: box.querySelector("h2").textContent,
        groupe: box.dataset.groupe,
      }));
    }

    // --- curseur générique (voir voicemeeter.html pour la même technique) ---
    // `onChange` (optionnel) : rappelé une seule fois, au RELÂCHEMENT du
    // curseur (événement DOM natif `change`, contrairement à `input` ci-
    // dessous qui tourne en continu pendant le glissement) — voir
    // `win32::cef_settings::SettingsRefs::bar_size_dragging`, seul
    // consommateur actuel (curseurs "Tailles des barres"), pour geler le
    // redimensionnement du panneau Réglages lui-même tant qu'on glisse.
    // `curve` (optionnel, défaut 1 = linéaire) : exposant appliqué au
    // déplacement brut du curseur avant de le convertir en valeur —
    // DEMANDE EXPLICITE ("plus d'amplitude dans les faibles valeurs pour
    // régler la taille des barres sur les écrans secondaires"). Avec
    // `curve > 1`, `valeur = min + (max-min) * (déplacement/max_brut)^curve`
    // : une même distance de glissement couvre une plage de valeurs bien
    // plus étroite près de `min` que près de `max` (ex. curve=2.2 : la
    // moitié du glissement suffit à peine à dépasser 20% de la plage), donc
    // plus de précision physique pour les petites valeurs sans rien perdre
    // en haut — voir `secondaryScreenThickness` ci-dessous, seul appelant
    // actuel. Le curseur natif brut va toujours de 0 à `CURVE_RAW_STEPS`
    // (résolution fine indépendante du nombre de px couverts par `min..
    // max`) ; seule la conversion affichée/envoyée est nonlinéaire.
    const CURVE_RAW_STEPS = 1000;

    function curveValueFromRaw(raw, min, max, curve) {
      const t = Math.max(0, Math.min(1, raw / CURVE_RAW_STEPS));
      return min + (max - min) * Math.pow(t, curve);
    }
    function curveRawFromValue(value, min, max, curve) {
      const t = max > min ? Math.max(0, Math.min(1, (value - min) / (max - min))) : 0;
      return Math.round(Math.pow(t, 1 / curve) * CURVE_RAW_STEPS);
    }

    function slider(container, { label, valueLabel, min, max, step, value, onInput, onChange, dataKey, curve }) {
      const row = el("div", { class: "row" }, [el("h2", {}, [label])]);
      const wrap = el("div", { class: "row" });
      const inputEl = curve && curve !== 1
        ? el("input", {
            type: "range", min: "0", max: String(CURVE_RAW_STEPS), step: "1",
            value: String(curveRawFromValue(value, min, max, curve)),
            "data-key": dataKey,
          })
        : el("input", {
            type: "range", min: String(min), max: String(max), step: String(step ?? 1), value: String(value),
            "data-key": dataKey,
          });
      const toValue = curve && curve !== 1
        ? (raw) => Math.round(curveValueFromRaw(parseFloat(raw), min, max, curve))
        : (raw) => parseFloat(raw);
      const valueEl = el("span", { class: "slider-value", "data-key": dataKey + "-value" }, [valueLabel(value)]);
      inputEl.addEventListener("input", () => {
        const v = toValue(inputEl.value);
        valueEl.textContent = valueLabel(v);
        if (onInput) onInput(v);
      });
      if (onChange) inputEl.addEventListener("change", () => onChange(toValue(inputEl.value)));
      wrap.appendChild(inputEl);
      wrap.appendChild(valueEl);
      row.appendChild(wrap);
      container.appendChild(row);
    }

    // Les barres dont l'écartement se règle à part, dans l'ordre de
    // `ui::dock::BARRES_ECARTEMENT` (et de `state.iconGapsBarres`).
    const ICON_GAP_BARRES = [["haut", "Barre du haut"], ["gauche", "Barre de gauche"], ["droite", "Barre de droite"], ["bas", "Barre du bas"]];

    function updateSlider(dataKey, value, valueLabel) {
      const inputEl = document.querySelector(`input[data-key="${dataKey}"]`);
      // L'ÉTIQUETTE est protégée par la MÊME condition que la poignée — BUG
      // RÉEL SIGNALÉ (« dans Taille du contenu des dashs, le curseur Contenu a
      // un fonctionnement erratique », précisé ensuite : « le chiffre ne suit
      // pas le déplacement du curseur de façon régulière »). La garde
      // n'existait QUE pour la poignée : pendant un glissement, l'évènement
      // `input` met l'étiquette à la valeur glissée, puis la frame suivante la
      // RÉÉCRIVAIT avec la dernière valeur poussée par Rust — laquelle n'arrive
      // qu'au RELÂCHEMENT pour un curseur en `onChange` (voir "Contenu", le seul
      // du panneau dans ce cas : les autres passent par `onInput` et poussent à
      // chaque pixel, donc leur valeur renvoyée coïncide avec celle qu'on
      // glisse, et ils n'ont jamais eu le défaut). D'où une étiquette qui
      // oscille entre l'ancienne et la nouvelle valeur tant que le bouton est
      // maintenu, de façon irrégulière puisque les évènements `input` et les
      // frames ne s'entrelacent pas régulièrement.
      //
      // Règle générale, celle qui gouvernait déjà la poignée : ne jamais
      // réécrire ce que l'utilisateur est en train de régler à la main.
      const held = !!inputEl && document.activeElement === inputEl;
      if (inputEl && !held) inputEl.value = String(value);
      const valueEl = document.querySelector(`[data-key="${dataKey}-value"]`);
      if (valueEl && !held) valueEl.textContent = valueLabel(value);
    }

    // Reflete l'état d'une CASE dans son `data-key`, sans reconstruire le DOM.
    // Même règle que pour un curseur : ne pas réécrire ce que l'utilisateur
    // vient de cliquer (la poussée d'état arrive une frame plus tard).
    function updateCheckbox(dataKey, checked) {
      const inputEl = document.querySelector(`input[data-key="${dataKey}"]`);
      if (!inputEl || inputEl === document.activeElement) return;
      if (inputEl.checked !== Boolean(checked)) inputEl.checked = Boolean(checked);
    }

    // --- sélecteur de couleur générique (voir win32::cef_settings, doc de
    // module : pas de <input type="color">) ---
    // Dégradé teinte/saturation/valeur interactif + glissière de teinte —
    // la "zone de couleur" qu'avait `egui::color_picker::
    // color_edit_button_rgb` côté ancien panneau `win32::settings_dash`
    // (retiré par erreur à la réécriture CEF : `colorPicker` ne gardait que
    // champ hex + préréglages + pipette). Volontairement EN PAGE (pas de
    // popup ni de fenêtre séparée) — voir `win32::cef_settings`, doc de
    // module, sur la raison de l'absence d'`<input type="color">` natif :
    // même risque de focus avec une fenêtre séparée, aucun avec un simple
    // `<div>` qui capture le pointeur sur lui-même.
    //
    // `draggingGradientTarget`/`gradientSyncers` : mêmes garanties que le
    // champ hex ci-dessous (jamais écrasé par un `updateValues()` pendant
    // qu'on glisse, voir la doc d'en-tête) — mais un `<div>` n'a pas de
    // `document.activeElement` à consulter, donc on suit nous-mêmes QUEL
    // sélecteur est en cours de glissement.
    let draggingGradientTarget = null;
    // Zone dont le bouton « Supprimer » a été armé mais pas confirmé (voir la section
    // « Zones de la barre de droite »). Remis à zéro à chaque reconstruction de la
    // section : les boutons sont recréés, donc un « en attente » survivant désignerait
    // une zone dont le bouton n'existe plus.
    let zoneRemovePending = null;
    // Même chose POUR LE CONTENU DES ZONES (voir « － Retirer » dans la liste) : le
    // bouton est recréé à chaque reconstruction, donc un « en attente » survivant
    // désignerait un raccourci dont le bouton n'existe plus. Le NOM du raccourci,
    // jamais un index — c'est ce que l'action Rust attend (voir `ZoneRow::arg`).
    let retraitEnAttente = null;
    const gradientSyncers = {};

    function gradientPicker(container, target, currentHex) {
      const [r0, g0, b0] = hexToRgb01(currentHex);
      let [hue, sat, val] = rgbToHsv(r0, g0, b0);

      const wrap = el("div", { class: "gradient-picker" });
      const sv = el("div", { class: "sv-square" });
      const svCursor = el("div", { class: "sv-cursor" });
      sv.appendChild(svCursor);
      const hueSlider = el("div", { class: "hue-slider" });
      const hueCursor = el("div", { class: "hue-cursor" });
      hueSlider.appendChild(hueCursor);

      function paint() {
        sv.style.background = `linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, hsl(${hue}, 100%, 50%))`;
        svCursor.style.left = sat * 100 + "%";
        svCursor.style.top = (1 - val) * 100 + "%";
        hueCursor.style.left = (hue / 360) * 100 + "%";
      }
      paint();
      // Rappelé par `updateValues()` (voir plus bas) quand LA COULEUR
      // change par un autre biais (champ hex, préréglage, pipette...) —
      // jamais pendant qu'on glisse CE widget précis (voir
      // `draggingGradientTarget`), sans quoi la propre main de l'utilisateur
      // se ferait contredire par le prochain aller-retour Rust.
      gradientSyncers[target] = (hex) => {
        [hue, sat, val] = rgbToHsv(...hexToRgb01(hex));
        paint();
      };

      function commit() {
        go("color", target, rgbToHex(hsvToRgb(hue, sat, val)));
      }
      function dragSv(e) {
        const rect = sv.getBoundingClientRect();
        sat = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        val = Math.max(0, Math.min(1, 1 - (e.clientY - rect.top) / rect.height));
        paint();
        commit();
      }
      sv.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        sv.setPointerCapture(e.pointerId);
        draggingGradientTarget = target;
        dragSv(e);
      });
      sv.addEventListener("pointermove", (e) => { if (e.buttons & 1) dragSv(e); });
      sv.addEventListener("pointerup", () => { draggingGradientTarget = null; });

      function dragHue(e) {
        const rect = hueSlider.getBoundingClientRect();
        hue = Math.max(0, Math.min(359.999, ((e.clientX - rect.left) / rect.width) * 360));
        paint();
        commit();
      }
      hueSlider.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        hueSlider.setPointerCapture(e.pointerId);
        draggingGradientTarget = target;
        dragHue(e);
      });
      hueSlider.addEventListener("pointermove", (e) => { if (e.buttons & 1) dragHue(e); });
      hueSlider.addEventListener("pointerup", () => { draggingGradientTarget = null; });

      wrap.appendChild(sv);
      wrap.appendChild(hueSlider);
      container.appendChild(wrap);
    }

    function colorPicker(container, target, currentHex) {
      const wrap = el("div", { class: "picker" });
      gradientPicker(wrap, target, currentHex);
      const topRow = el("div", { class: "top-row" });
      topRow.appendChild(el("button", { class: "action", onclick: () => go("windows-accent", target) }, ["Couleur d'accentuation Windows"]));
      const hexInput = el("input", { type: "text", class: "hex", "data-hex-target": target, maxlength: "6" });
      hexInput.value = currentHex;
      hexInput.addEventListener("input", () => {
        const v = hexInput.value.replace(/[^0-9a-fA-F]/g, "").slice(0, 6);
        if (v !== hexInput.value) hexInput.value = v;
        if (v.length === 6) go("color", target, v);
      });
      topRow.appendChild(hexInput);
      const isPicking = state && state.eyedropperTarget === target;
      topRow.appendChild(
        el("button", { class: "action", onclick: () => go("eyedropper", isPicking ? "stop" : "start", target) }, [
          isPicking ? "Clique à l'écran…" : "Pipette",
        ]),
      );
      topRow.appendChild(
        el("button", { class: "action", onclick: () => go("custom-color", "add", hexInput.value) }, ["+ Mes couleurs"]),
      );
      // 🎲 Couleur au hasard POUR CET élément (demande explicite : « mettre la
      // couleur en aléatoire pour chaque élément »). `go("color-random", target)`
      // réutilise le routage de `apply_color_to_target` (préfixe `menu:` compris),
      // donc le même bouton marche pour un panneau, un menu ou une barre.
      topRow.appendChild(
        el("button", { class: "action", title: "Couleur au hasard", onclick: () => go("color-random", target) }, [
          el("span", { class: "ico ico-dice-five" }), "Aléatoire",
        ]),
      );
      wrap.appendChild(topRow);

      const presetGrid = el("div", { class: "swatch-grid" });
      for (const rgb of catalog.presets) {
        const hex = rgbToHex(rgb);
        presetGrid.appendChild(colorSwatch(hex, hex === currentHex, () => go("color", target, hex)));
      }
      wrap.appendChild(presetGrid);

      wrap.appendChild(el("div", { class: "small-label" }, ["Mes couleurs"]));
      const customGrid = el("div", { class: "swatch-grid" });
      (state ? state.customColors : []).forEach((hex, index) => {
        const swatchWrap = el("div", { class: "custom-swatch-wrap" });
        swatchWrap.appendChild(colorSwatch(hex, hex === currentHex, () => go("color", target, hex)));
        swatchWrap.appendChild(el("button", { class: "custom-del cible-24", title: "Retirer", onclick: (e) => { e.stopPropagation(); go("custom-color", "remove", index); } }, [el("span", { class: "ico ico-x" })]));
        customGrid.appendChild(swatchWrap);
      });
      wrap.appendChild(customGrid);

      container.appendChild(wrap);
    }

    function colorSwatch(hex, isCurrent, onClick) {
      const btn = el("button", {
        class: "swatch" + (isCurrent ? " current" : ""),
        title: "#" + hex,
        onclick: onClick,
        oncontextmenu: (e) => { e.preventDefault(); go("copy-hex", hex); },
      });
      btn.style.background = "#" + hex;
      return btn;
    }

    function checkboxRow(container, checked, label, onChange, dataKey) {
      const row = el("label", { class: "check" });
      // ⭐ Une case peut être ALLUMÉE par un autre contrôle (choisir une forme
      // allume l'effet, voir `effet-<moment>-style`). Sans `data-key`, la page
      // ne saurait pas la rafraîchir et la case resterait décochée à l'écran
      // alors que le réglage est actif.
      const box = dataKey ? el("input", { type: "checkbox", "data-key": dataKey }) : el("input", { type: "checkbox" });
      box.checked = checked;
      box.addEventListener("change", () => onChange(box.checked));
      row.appendChild(box);
      row.appendChild(document.createTextNode(label));
      container.appendChild(row);
      return row;
    }

    // Rangee de boutons EXCLUSIFS — pour choisir parmi quelques valeurs courtes
    // (voir « Forme de l'indicateur »). La page n'avait que curseur, case a
    // cocher et selecteur de couleur : ce controle manquait.
    function segmented(container, { label, options, value, onSelect, dataKey }) {
      if (label) {
        const title = el("div", { class: "label" }, [label]);
        title.style.margin = "6px 0 4px";
        container.appendChild(title);
      }
      const row = el("div", {});
      row.style.display = "flex";
      row.style.gap = "6px";
      // DIX-HUIT formes : la rangée doit pouvoir passer à la ligne, sinon elle
      // déborde du panneau — les libellés français sont longs.
      row.style.flexWrap = "wrap";
      options.forEach((option) => {
        const button = el("button", {
          type: "button",
          "data-key": dataKey + "-" + option.value,
          onclick: () => onSelect(option.value),
        }, [option.label]);
        button.style.flex = "1";
        button.style.padding = "6px 8px";
        button.style.borderRadius = "var(--nd-rayon-controle)";
        button.style.cursor = "pointer";
        const active = option.value === value;
        // L'ACCENT BRUT et son texte lisible — la PAIRE de libadwaita, jamais
        // l'un sans l'autre (voir `push_window_palette`). C'était
        // `var(--menu-accent-rgb, #3b82f6)` : Réglages n'étant PAS un popup
        // "menu", cette variable n'y est jamais posée et le repli BLEU
        // s'appliquait donc toujours — ces boutons ignoraient l'accent.
        button.style.background = active ? "rgb(var(--popup-accent-solid-rgb))" : "transparent";
        button.style.color = active ? "rgb(var(--popup-on-accent-rgb))" : "inherit";
        button.style.border = active ? "none" : "1px solid rgba(var(--popup-accent-rgb), calc(0.25 * var(--popup-fond-alpha, 1)))";
        row.appendChild(button);
      });
      container.appendChild(row);
    }

    // Reflete une valeur dans un controle `segmented` SANS reconstruire le DOM
    // (voir `updateValues`) — meme role que `updateSlider` pour un curseur.
    // ⭐ **LA POLICE** — DEMANDE EXPLICITE (2026-10-12) : « serait-il possible de
    // choisir la police de caractère à utiliser dans les réglages ». Elle
    // REMPLACE celle du style (voir `ui::style::choisir_police`) ; le premier
    // bouton y revient, et choisir un style aussi (voir `ui::style::choisir`).
    //
    // ⛔ **PAS DE `<select>`** dans une page CEF : des BOUTONS, chacun écrit dans
    // SA police, et un champ qui FILTRE la liste. Le filtre vit dans la page
    // (`policeFiltre`) : il survit aux reconstructions, et il cache des boutons
    // plutôt que d'en refaire — taper ne coûte aucun aller-retour avec Rust.
    let policeFiltre = "";
    function filtrerPolices() {
      const f = policeFiltre.trim().toLowerCase();
      document.querySelectorAll("[data-police-nom]").forEach((b) => {
        b.style.display = !f || b.getAttribute("data-police-nom").toLowerCase().includes(f) ? "" : "none";
      });
    }
    // ⭐ « CHARIS SIL » CONTRE « CHARIS » — le nom qu'on connaît n'est pas
    // toujours le nom de FAMILLE du fichier : la Charis SIL de 2025 s'installe
    // en famille « Charis » (mesuré le 2026-11-04 dans la table `name` du TTF,
    // et GDI ne nomme qu'elle). Le test d'installation doit donc accepter qu'un
    // nom installé soit le DÉBUT, mot pour mot, du nom demandé — jamais
    // l'inverse : « Noto Sans Mono » n'est PAS installé parce que « Noto Sans
    // Mono CJK SC » l'est. `installees` est déjà en minuscules (voir les deux
    // appelants).
    function policeInstallee(active, installees) {
      const a = active.trim().toLowerCase();
      return installees.some((n) => n === a || (a.startsWith(n) && !/[a-z0-9]/.test(a.charAt(n.length))));
    }
    function policeChooser(box) {
      const titre = el("div", { class: "label" }, ["Police"]);
      titre.style.margin = "12px 0 4px";
      box.appendChild(titre);
      box.appendChild(el("p", { class: "hint" }, ["Remplace la police du style dans toute l'interface — les pages, l'infobulle et les titres des zones. Changer de style reprend la police du nouveau style."]));
      // ⭐ **LA POLICE MANQUE ?** — DEMANDE EXPLICITE (2026-10-18) : « un message
      // dans les réglages du style renvoyant vers l'aide s'il manque une police ».
      // Windows la remplace sans rien dire ; l'aide dit où la prendre.
      const active = state.police || state.policeDuStyle;
      const installees = (catalog.polices || []).map((n) => n.toLowerCase());
      if (active && installees.length && !policeInstallee(active, installees)) {
        const note = el("p", { class: "hint", id: "police-manquante" }, [
          "⚠ La police « " + active + " » n'est pas installée sur ce PC : Windows la remplace par Segoe UI. ",
        ]);
        const lien = el("button", { type: "button", onclick: () => go("ouvrir-aide", "polices") }, ["Où la trouver (Aide)"]);

    // ⭐ **LA POLICE DES TERMINAUX** — DEMANDE EXPLICITE (2026-10-28) : « ajoute le
    // réglage de police des terminaux ». Elle ne REMPLACE pas la pile de la page,
    // elle la PRÉCÈDE (voir `pileDesPolicesDesTerminaux` dans `terminal_theme.js`) :
    // une police qui ne dessine pas les boîtes et les blocs emprunte ces glyphes
    // aux suivants de la pile au lieu de les laisser à `monospace` (mesuré le
    // 2026-10-28 sur Nordwand Mono, `U+250F`/`U+2588` absents de son cmap). Le
    // Terminal ET les Serveurs SSH la partagent — le réglage se dit « des
    // terminaux », il couvre les deux pages.
    //
    // ⛔ **PAS DE `<select>`**, des BOUTONS (même règle que `policeChooser`).
    // ⛔ **Et un préfixe de `data-key` propre** : `updateSegmented("police", …)`
    // sélectionne `[data-key^="police-"]`, qui avalerait `police-terminal-…` et
    // éteindrait la surbrillance de cette liste à chaque rafraîchissement de
    // l'autre. Le préfixe est donc `terminal-police-`, et le filtre a son propre
    // attribut et sa propre variable pour la même raison.
    let policeTerminaleFiltre = "";
    function filtrerPolicesTerminales() {
      const f = policeTerminaleFiltre.trim().toLowerCase();
      document.querySelectorAll("[data-terminal-police-nom]").forEach((b) => {
        b.style.display = !f || b.getAttribute("data-terminal-police-nom").toLowerCase().includes(f) ? "" : "none";
      });

    function policeTerminaleChooser(box) {
      const titre = el("div", { class: "label" }, ["Police des terminaux"]);
      titre.style.margin = "12px 0 4px";
      box.appendChild(titre);
      box.appendChild(el("p", { class: "hint" }, ["Le texte des terminaux : les onglets du Terminal et les sessions SSH. La police choisie s'ajoute DEVANT la pile par défaut, donc les boîtes et les blocs d'une police qui ne les dessine pas restent dessinés par la suite de la pile. Cela ne change rien à l'interface."]));
      const active = state.policeTerminal || "";
      const installees = (catalog.polices || []).map((n) => n.toLowerCase());
      if (active && installees.length && !policeInstallee(active, installees)) {
        const note = el("p", { class: "hint", id: "police-terminale-manquante" }, [
          "⚠ La police « " + active + " » n'est pas installée sur ce PC : les terminaux passent à la suivante de la pile. ",

        const lien = el("button", { type: "button", onclick: () => go("ouvrir-aide", "polices-terminaux") }, ["Où les télécharger (Aide)"]);
        lien.style.padding = "3px 8px";
        lien.style.borderRadius = "var(--nd-rayon-controle)";
        lien.style.cursor = "pointer";
        note.appendChild(lien);
        box.appendChild(note);
      }
      const retour = el("button", { type: "button", id: "police-terminale-defaut", "data-key": "terminal-police-", onclick: () => go("police-terminal", "") }, [
        "Pile par défaut (Nordwand Mono embarquée, DejaVu Sans Mono, Consolas)",
      ]);
      retour.style.padding = "6px 10px";
      retour.style.borderRadius = "var(--nd-rayon-controle)";
      retour.style.cursor = "pointer";
      retour.style.width = "100%";
      retour.style.textAlign = "left";
      box.appendChild(retour);
      const filtre = el("input", { type: "text", class: "zone-name", autocomplete: "off", spellcheck: "false", placeholder: "Filtrer les polices…", value: policeTerminaleFiltre });
      // `.zone-name` est indenté et borné à 320 px : ici il prend la ligne.
      filtre.style.maxWidth = "none";
      filtre.style.margin = "6px 0 0";
      filtre.addEventListener("input", () => {
        policeTerminaleFiltre = filtre.value;
        filtrerPolicesTerminales();
      });
      box.appendChild(filtre);
      const liste = el("div", {});
      liste.style.display = "grid";
      liste.style.gridTemplateColumns = "repeat(auto-fill, minmax(180px, 1fr))";
      liste.style.gap = "4px";
      liste.style.maxHeight = "220px";
      liste.style.overflowY = "auto";
      liste.style.marginTop = "6px";
      for (const nom of catalog.polices || []) {
        const b = el("button", { type: "button", "data-key": "terminal-police-" + nom, "data-terminal-police-nom": nom, title: nom, onclick: () => go("police-terminal", nom) }, [nom]);
        // Aperçu : chaque nom écrit DANS SA police, comme dans le sélecteur de
        // l'interface. Nordwand Mono n'est PAS de cette liste : elle n'est pas
        // installée sur le PC, elle est embarquée, et la pile par défaut commence
        // déjà par elle.
        b.style.fontFamily = '"' + nom + '", "Segoe UI", sans-serif';
        b.style.fontSize = "14px";
        b.style.padding = "5px 8px";
        b.style.textAlign = "left";
        b.style.overflow = "hidden";
        b.style.textOverflow = "ellipsis";
        b.style.whiteSpace = "nowrap";
        b.style.borderRadius = "var(--nd-rayon-controle)";
        b.style.cursor = "pointer";
        liste.appendChild(b);
      }
      box.appendChild(liste);
      updateSegmented("terminal-police", active);
      filtrerPolicesTerminales();

    function updateSegmented(dataKey, value) {
      document.querySelectorAll('[data-key^="' + dataKey + '-"]').forEach((button) => {
        const active = button.getAttribute("data-key") === dataKey + "-" + value;
        // L'ACCENT BRUT et son texte lisible — la PAIRE de libadwaita, jamais
        // l'un sans l'autre (voir `push_window_palette`). C'était
        // `var(--menu-accent-rgb, #3b82f6)` : Réglages n'étant PAS un popup
        // "menu", cette variable n'y est jamais posée et le repli BLEU
        // s'appliquait donc toujours — ces boutons ignoraient l'accent.
        button.style.background = active ? "rgb(var(--popup-accent-solid-rgb))" : "transparent";
        button.style.color = active ? "rgb(var(--popup-on-accent-rgb))" : "inherit";
        button.style.border = active ? "none" : "1px solid rgba(var(--popup-accent-rgb), calc(0.25 * var(--popup-fond-alpha, 1)))";
      });
    }
