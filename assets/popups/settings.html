            type: "text", class: "zone-name", value: zone.name || "", placeholder: `Zone ${zone.number}`,
          });
          champ.addEventListener("change", () => go("zone-name", String(zone.key), champ.value));
          box.appendChild(champ);
          // ...et de quoi AFFICHER ce nom (ou le numéro) EN HAUT de la zone, dans
          // la barre — DEMANDE EXPLICITE. Séparé du renommage : on peut vouloir
          // nommer sans afficher, ou afficher le simple numéro.
          checkboxRow(box, zone.showsLabel === true, "Afficher en haut de la zone", (checked) => {
            go("zone-label", String(zone.key), checked ? "1" : "0");
          });
          // **CACHER LA ZONE — DEMANDE EXPLICITE (2026-09-23) : « ne puissent pas être
          // supprimées mais seulement cachées ».** TOUTE sa plage disparaît (séparateur
          // ET contenu), et elle revient au même endroit quand on la réaffiche : rien ne
          // se renumérote, parce qu'une zone cachée RESTE une zone.
          checkboxRow(box, zone.hidden === true, "Cacher cette zone", (checked) => {
            go("zone-hidden", String(zone.key), checked ? "1" : "0");
          });
          // **AJOUTER UNE ZONE JUSTE APRÈS CELLE-CI** — DEMANDE EXPLICITE. Elle naît
          // APRÈS LE CONTENU de cette zone, pas collée à son séparateur : c'est ce qui
          // fait que la zone d'aujourd'hui GARDE ses icônes (voir
          // `Dock::add_zone_separator_after`, qui insère par `add_spacer_after`).
          box.appendChild(el("button", { class: "action", onclick: () => go("zone-add-after", String(zone.key)) }, ["＋ Ajouter une zone après celle-ci"]));
          // **SUPPRIMER CETTE ZONE** — l'ESPACE DISPARAÎT (décision explicite) : le
          // séparateur est retiré, et ses icônes rejoignent la zone précédente, puisque
          // la frontière qui les séparait n'est plus là.
          //
          // ⚠️ Confirmé EN DEUX TEMPS, dans la page : le premier clic arme, le second
          // exécute. C'est le motif de `dash.html` pour l'ajout à une zone, et il évite
          // de câbler le dialogue natif (`win32::cef_confirm`) jusqu'ici — celui-ci
          // demande une fenêtre et un `GfxDevice` que ce panneau n'a pas.
          if (zone.permanent) {
            // **CETTE ZONE NE PEUT PAS ÊTRE SUPPRIMÉE — DEMANDE EXPLICITE (2026-09-23).**
            // Le bouton DISPARAÎT plutôt que d'être grisé, et la raison est écrite à sa
            // place : un bouton grisé laisserait chercher pourquoi. La cacher reste
            // possible (la case ci-dessus), et c'est désormais le seul moyen de la
            // mettre de côté.
            box.appendChild(el("p", { class: "hint" }, ["Zone permanente : elle ne peut pas être supprimée, seulement cachée."]));
          } else {
            const boutonSupprimer = el("button", { class: "action" }, ["－ Supprimer cette zone"]);
            boutonSupprimer.addEventListener("click", () => {
              if (zoneRemovePending !== zone.key) {
                zoneRemovePending = zone.key;
                boutonSupprimer.textContent = "Confirmer la suppression ?";
                return;
              }
              go("zone-remove", String(zone.key));
            });
            box.appendChild(boutonSupprimer);
          }
        });
      });

      // Visibilité des barres — DEMANDE EXPLICITE ("donnes la possibilité
      // à l'utilisateur de masquer les barres droite et gauche ou de
      // rendre les barres de l'interface secondaire masquable
      // automatiquement ainsi que les barres de l'interface principale",
      // PUIS "activer le masquage automatique de chaque élément de
      // l'interface principale individuellement" — remplace l'ancien
      // réglage unique "interface principale" par un réglage par barre).
      // Voir win32::cef_settings::SettingsRefs::left_bar_hidden/
      // right_bar_hidden/top_auto_hide/left_auto_hide/right_auto_hide/
      // secondary_auto_hide, appliqué en continu par app::run (pas de
      // rechargement/redémarrage requis).
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Visibilité des barres"]));
        checkboxRow(box, state.leftBarHidden, "Masquer la barre gauche", (checked) => go("bar-hidden", "left", checked ? "1" : "0"));
        checkboxRow(box, state.rightBarHidden, "Masquer la barre droite", (checked) => go("bar-hidden", "right", checked ? "1" : "0"));
        checkboxRow(box, state.bottomBarHidden, "Masquer la barre du bas", (checked) => go("bar-hidden", "bottom", checked ? "1" : "0"));
        checkboxRow(box, state.topAutoHide, "Masquage automatique — barre du haut", (checked) => go("auto-hide", "top", checked ? "1" : "0"));
        checkboxRow(box, state.leftAutoHide, "Masquage automatique — barre gauche", (checked) => go("auto-hide", "left", checked ? "1" : "0"));
        checkboxRow(box, state.rightAutoHide, "Masquage automatique — barre droite", (checked) => go("auto-hide", "right", checked ? "1" : "0"));
        checkboxRow(box, state.bottomAutoHide, "Masquage automatique — barre du bas", (checked) => go("auto-hide", "bottom", checked ? "1" : "0"));
        checkboxRow(box, state.secondaryAutoHide, "Masquage automatique (interfaces secondaires)", (checked) => go("auto-hide", "secondary", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, ["Le masquage automatique réaffiche une barre dès que le curseur s'approche du bord d'écran concerné (comme la barre des tâches Windows)."]));
      });

      // Masquage automatique de la VRAIE barre des tâches Windows — DEMANDE
      // EXPLICITE ("depuis le dash réglage [...] activer le masquage
      // automatique de la barre des tâches de windows"). Voir win32::
      // taskbar_autohide, doc de module : réglage NATIF de Windows (même API
      // que sa propre case à cocher), pas une fonctionnalité NeuraDesk — à
      // ne pas confondre avec la section "Visibilité des barres" plus haut
      // (masquage des barres de NeuraDesk lui-même).
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Masquage automatique de la barre des tâches Windows"]));
        checkboxRow(box, state.windowsTaskbarAutoHide, "Masquer automatiquement la barre des tâches Windows", (checked) => go("taskbar-autohide", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, ["Réglage natif de Windows (identique à Paramètres > Personnalisation > Barre des tâches > Comportements de la barre des tâches) — s'applique immédiatement, sans redémarrer l'explorateur."]));
      });

      // "Visible dans les captures d'écran" — DEMANDE EXPLICITE ("j'aimerais
      // avoir une option dans les réglages qui permette de rendre
      // l'interface visible sur les captures d'écran et qui mettent les
      // transparences à 0% pour éviter les bugs visuels dus à la
      // transparence"). Voir gfx::capture_visibility, doc de module :
      // par défaut, l'interface s'exclut de toute capture d'écran/
      // enregistrement ; cette case l'y rend visible et force en même temps
      // toutes les transparences (flou, teintes des barres/du dash/des
      // menus) à 0% le temps qu'elle est cochée, sans toucher aux réglages
      // enregistrés (les curseurs gardent leur valeur, elle est juste
      // court-circuitée pendant le rendu).
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Visibilité dans les captures d'écran"]));
        checkboxRow(box, state.captureVisible, "Rendre l'interface visible sur les captures d'écran", (checked) => go("capture-visible", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, [
          "Par défaut, NeuraDesk est invisible dans les captures/enregistrements d'écran. Coche pour l'y rendre visible — les transparences (flou, barres, dash, menus) sont alors forcées à 0% pour éviter les artefacts visuels que certains outils de capture produisent sur les fenêtres translucides.",
        ]));
        // Dégradé animé (voir gfx::degrade) — DEMANDE EXPLICITE (2026-09-26) :
        // « commun comme si tous les panneaux ne faisaient qu'un », seulement
        // en mode capturable. Préréglages en BOUTONS (pas de <select> en CEF).
        // ⭐ LA LUEUR — DEMANDE EXPLICITE (2026-10-14) : un dégradé radial blanc →
        // couleur des barres → sombre, centre placé où l'on veut (voir
        // gfx::lueur). En % de l'écran PRINCIPAL ; bornes POUSSÉES par Rust.
        checkboxRow(box, state.lueur, "Lueurs : dégradés radiaux clairs sur les barres et les panneaux (mode capturable seulement)", (checked) => go("lueur", checked ? "1" : "0"));
        if (state.lueur && !state.captureVisible) {
          box.appendChild(el("p", { class: "hint" }, ["Sans effet tant que l'interface n'est pas visible sur les captures d'écran (case ci-dessus)."]));
        }
        // L'ÉDITEUR (DEMANDE EXPLICITE, 2026-10-14) : ajouter des lueurs, les
        // placer, régler leur flou — un dash à part, aussi ouvert par son applet.
        // LES EFFETS ENREGISTRÉS (DEMANDE EXPLICITE, 2026-10-14) : en choisir un
        // l'allume — en fondu enchaîné (voir `gfx::lueur::remplacer_la_scene`).
        if ((state.lueursEffets || []).length) {
          segmented(box, {
            label: "Effet de lueurs",
            options: state.lueursEffets.map((nom) => ({ value: nom, label: nom })),
            value: state.lueur ? state.lueursEffet : null,
            dataKey: "lueurs-effet",
            onSelect: (nom) => go("lueurs-effet", nom),
          });
        }
        box.appendChild(el("button", { class: "action", onclick: () => go("lueurs-editeur") }, ["Éditer les lueurs…"]));
        checkboxRow(box, state.degradeEnabled, "Dégradé animé à la place des couleurs (mode capturable seulement)", (checked) => go("degrade", checked ? "1" : "0"));
        if (state.degradeEnabled) {
          if (!state.captureVisible) {
            box.appendChild(el("p", { class: "hint" }, ["Sans effet tant que l'interface n'est pas visible sur les captures d'écran (case ci-dessus)."]));
          }
          checkboxRow(box, state.degradeAccent, "Mise en avant des panneaux tirée du dégradé", (checked) => go("degrade-accent", checked ? "1" : "0"));
          box.appendChild(el("div", { class: "small-label" }, ["Motif"]));
          const modes = el("div", { class: "size-choices" });
          for (const nom of state.degradeModes) {
            modes.appendChild(el("button", { class: nom === state.degradeMode ? "selected" : "", onclick: () => go("degrade-mode", nom) }, [nom]));
          }
          box.appendChild(modes);
          // **MES SHADERS** — voir `gfx::shader_utilisateur`. Un fichier .hlsl
          // du dossier = un bouton ; la compilation se fait à part, et un motif
          // trop lent est retiré tout seul.
          box.appendChild(el("div", { class: "small-label" }, ["Mes shaders"]));
          const shaders = el("div", { class: "size-choices" });
          for (const nom of state.degradeShaders || []) {
            const choisi = nom === state.degradeShader;
            const libelle = nom === state.degradeShaderCompile ? nom + " …" : nom;
            shaders.appendChild(el("button", { class: choisi ? "selected" : "", onclick: () => go("degrade-shader", nom) }, [libelle]));
          }
          shaders.appendChild(el("button", { onclick: () => go("degrade-shaders-dossier") }, ["Ouvrir le dossier"]));
          box.appendChild(shaders);
          if (state.degradeShaderMessage) {
            box.appendChild(el("p", { class: "hint shader-message" }, [state.degradeShaderMessage]));
          }
          box.appendChild(el("div", { class: "small-label" }, ["Couleurs"]));
          const presets = el("div", { class: "size-choices" });
          for (const nom of state.degradePresets) {
            presets.appendChild(el("button", { class: nom === state.degradePreset ? "selected" : "", onclick: () => go("degrade-preset", nom) }, [nom]));
          }
          if (state.degradePreset === "Personnalisé") presets.appendChild(el("button", { class: "selected" }, ["Personnalisé"]));
          presets.appendChild(el("button", { onclick: () => { degradeHasard++; go("degrade-hasard"); } }, ["Au hasard"]));
          box.appendChild(presets);
          // Couleurs actives : les N premières, étalées sur les cinq (voir
          // `gfx::degrade::couleurs_actives`). Le réglage est en centièmes.
          const actives = Math.round(state.degradeReglages.couleurs / 100);
          if (degradeEditIndex >= actives) degradeEditIndex = actives - 1;
          box.appendChild(el("div", { class: "small-label" }, ["Couleurs actives"]));
          const nombres = el("div", { class: "size-choices" });
          for (const n of [2, 3, 4, 5]) {
            nombres.appendChild(el("button", { class: n === actives ? "selected" : "", onclick: () => { degradeEditIndex = Math.min(degradeEditIndex, n - 1); go("degrade-reglage", "couleurs", String(n * 100)); } }, [String(n)]));
          }
          box.appendChild(nombres);
          // Les cinq couleurs : une pastille par couleur, celle qu'on édite
          // est encadrée ; le sélecteur partagé en dessous l'édite (cible
          // `degrade:<i>`, voir `apply_color_to_target`).
          box.appendChild(el("div", { class: "small-label" }, ["Clique une couleur pour la modifier"]));
          const pastilles = el("div", { class: "swatch-grid" });
          state.degradeCouleurs.slice(0, actives).forEach((hex, i) => {
            const b = el("button", { class: "swatch" + (i === degradeEditIndex ? " current" : ""), "data-degrade-couleur": String(i), onclick: () => { degradeEditIndex = i; render(); } });
            b.style.background = "#" + hex;
            pastilles.appendChild(b);
          });
          box.appendChild(pastilles);
          colorPicker(box, "degrade:" + degradeEditIndex, state.degradeCouleurs[degradeEditIndex]);
          for (const entree of DEGRADE_REGLAGES) {
            const [nom, label, min, max, step] = entree;
            slider(box, { label, min, max, step, value: state.degradeReglages[nom], valueLabel: degradeValeur(entree), dataKey: "degrade-" + nom, onInput: (v) => go("degrade-reglage", nom, v) });
          }
          const actions = el("div", { class: "size-choices" });
          actions.appendChild(el("button", { onclick: () => go("degrade-reglages-defaut") }, ["Réglages par défaut"]));
          actions.appendChild(el("button", { onclick: () => { degradeHasard++; go("degrade-tirer", "curseurs"); } }, ["Curseurs au hasard"]));
          actions.appendChild(el("button", { onclick: () => { degradeHasard++; go("degrade-tirer", "tout"); } }, ["Tout au hasard"]));
          actions.appendChild(el("button", { onclick: () => go("degrade-tirer", "origine") }, ["Origine au hasard"]));
          box.appendChild(actions);
          // Sauvegardes nommées (voir gfx::degrade_sauvegardes) : un nom déjà
          // pris est remplacé ; un clic sur un nom recharge, la croix supprime
          // (au second clic).
          box.appendChild(el("div", { class: "small-label" }, ["Sauvegardes"]));
          const ligne = el("div", { class: "row" });
          const champ = el("input", { type: "text", class: "zone-name", autocomplete: "off", spellcheck: "false", maxlength: "60", placeholder: "Nom de la sauvegarde" });
          champ.value = degradeNomSauvegarde;
          champ.addEventListener("input", () => { degradeNomSauvegarde = champ.value; });
          const sauver = () => {
            const nom = champ.value.trim();
            if (!nom) return;
            degradeNomSauvegarde = "";
            go("degrade-sauver", nom);
          };
          champ.addEventListener("keydown", (e) => { if (e.key === "Enter") sauver(); });
          ligne.appendChild(champ);
          ligne.appendChild(el("button", { class: "action", onclick: sauver }, ["Sauvegarder"]));
          box.appendChild(ligne);
          // Chaque sauvegarde arrive avec son NOM, son MOTIF et ses couleurs
          // telles qu'elles s'affichent (voir `degrade_sauvegardes::apercus`).
          const sauvegardes = state.degradeSauvegardes || [];
          if (!sauvegardes.some((s) => s.nom === degradeSupprimer)) degradeSupprimer = null;
          if (sauvegardes.length === 0) {
            box.appendChild(el("p", { class: "hint" }, ["Aucune sauvegarde pour l'instant."]));
          } else {
            // LA RECHERCHE : filtre sur le nom ET le motif, sans reconstruire la
            // section — seules les cartes sont masquées, donc le champ garde son
            // focus et son curseur pendant la frappe.
            const recherche = el("input", { type: "search", class: "zone-name", autocomplete: "off", spellcheck: "false", placeholder: `Rechercher parmi ${sauvegardes.length} sauvegarde${sauvegardes.length > 1 ? "s" : ""}` });
            recherche.value = degradeFiltre;
            box.appendChild(recherche);
            const grille = el("div", { class: "sauvegardes-grille" });
            const cartes = [];
            for (const s of sauvegardes) {
              const confirmer = degradeSupprimer === s.nom;
              const suppr = el("button", {
                class: "sauvegarde-suppr" + (confirmer ? " confirmer" : ""),
                title: confirmer ? "Cliquer encore pour supprimer" : "Supprimer",
                onclick: (e) => {
                  e.stopPropagation();
                  if (confirmer) { degradeSupprimer = null; go("degrade-supprimer", s.nom); }
                  else { degradeSupprimer = s.nom; render(); }
                },
              }, [confirmer ? "Supprimer ?" : "✕"]);
              const apercu = el("div", { class: "sauvegarde-apercu" }, (s.couleurs || []).map((hex) => {
                const pastille = el("span");
                pastille.style.background = "#" + hex;
                return pastille;
              }));
              const carte = el("div", {
                class: "sauvegarde-carte",
                title: "Recharger « " + s.nom + " »",
                onclick: () => { degradeHasard++; degradeSupprimer = null; go("degrade-charger", s.nom); },
              }, [
                el("div", { class: "sauvegarde-nom" }, [s.nom]),
                el("div", { class: "sauvegarde-motif" }, [s.mode]),
                apercu,
                suppr,
              ]);
              cartes.push([carte, (s.nom + " " + s.mode).toLowerCase()]);
              grille.appendChild(carte);
            }
            const filtrer = () => {
              const q = degradeFiltre.trim().toLowerCase();
              for (const [carte, texte] of cartes) carte.style.display = !q || texte.includes(q) ? "" : "none";
            };
            recherche.addEventListener("input", () => { degradeFiltre = recherche.value; filtrer(); });
            filtrer();
            box.appendChild(grille);
          }
        }
      });

      // Taille du contenu du Dash, du Presse-papiers, des Notes ET des
      // Réglages eux-mêmes (voir win32::cef_dash::set_icon_scale/
      // set_label_scale, win32::cef_clipboard::set_thumb_scale/
      // set_text_scale, win32::cef_notes::set_text_scale/set_image_scale,
      // win32::cef_settings::set_content_scale) — SEPT curseurs séparés, un
      // par ÉLÉMENT (icône/texte pour le Dash, miniature/texte pour le
      // Presse-papiers, texte/images pour les Notes — DEMANDE EXPLICITE
      // ajoutée ensuite, "ajoutes la possibilité de modification des
      // réglages du dash notes dans taille du contenu des dashs" —, un seul
      // contenu global pour les Réglages faute d'équivalent icône/texte),
      // DEMANDE EXPLICITE de pouvoir régler chaque élément individuellement
      // plutôt qu'un seul facteur commun par fenêtre (voir l'historique de
      // ce panneau : `dash-tile-scale`/`clipboard-tile-scale`, chacun
      // remplacé par deux réglages plus fins). `min: 25` (au lieu de 50
      // initialement) sur les sept — DEMANDE EXPLICITE de pouvoir réduire
      // encore plus. Dash/Presse-papiers/Notes/Réglages ne partagent aucun
      // réglage entre eux (ils ne sont d'ailleurs jamais ouverts en même
      // temps, voir win32::cef_dash, doc de module — même "zone libre"
      // partagée par les quatre).
      // ⭐ **TOUS EN `onChange`** — DEMANDE EXPLICITE (2026-10-14) : « que le dash
      // ne se redimensionne pas tout de suite [...] mais seulement après avoir
      // relâché le clic gauche ». L'étiquette suit toujours le curseur en direct
      // (voir `slider()`) ; la valeur ne part vers Rust qu'au relâchement. Même
      // règle pour les tailles PAR ÉCRAN secondaire (`secondaryScreenScales`).
      // ⭐ La taille des textes GLOBALE et celle des notifications — DEMANDE
      // EXPLICITE (2026-10-18). Voir `win32::taille_panneaux::TEXTES`.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Taille des textes"]));
        slider(box, { label: "Menus et fenêtres d'applis", min: 50, max: 200, value: state.tailleTextesPercent, valueLabel: (v) => v + "%", dataKey: "taille-textes", onChange: (v) => go("taille-globale", "textes", v) });
        slider(box, { label: "Notifications", min: 50, max: 200, value: state.tailleNotificationsPercent, valueLabel: (v) => v + "%", dataKey: "taille-notifications", onChange: (v) => go("taille-globale", "notifications", v) });
        box.appendChild(el("p", { class: "hint" }, ["Agrandit toute la fenêtre — texte, icônes et marges. Le premier vaut aussi pour les kaomojis, les caractères spéciaux, la phonétique et les maths, et s'ajoute à « Taille des menus » et aux curseurs « Contenu » de chaque panneau. S'applique à la prochaine ouverture, ou à la prochaine notification."]));
      });

      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Taille du contenu des dashs"]));
        box.appendChild(el("div", { class: "small-label" }, ["Dash"]));
        slider(box, { label: "Icônes", min: 25, max: 200, value: state.dashIconScalePercent, valueLabel: (v) => v + "%", dataKey: "dash-icon-scale", onChange: (v) => go("dash-icon-scale", v) });
        slider(box, { label: "Texte", min: 25, max: 200, value: state.dashLabelScalePercent, valueLabel: (v) => v + "%", dataKey: "dash-label-scale", onChange: (v) => go("dash-label-scale", v) });
        // BUG RÉEL SIGNALÉ : le panneau de catégories (colonne de droite du
        // Dash + en-têtes de groupe dans la grille) n'avait aucun curseur,
        // contrairement aux tuiles (Icônes/Texte ci-dessus).
        slider(box, { label: "Catégories", min: 25, max: 200, value: state.dashCategoryScalePercent, valueLabel: (v) => v + "%", dataKey: "dash-category-scale", onChange: (v) => go("dash-category-scale", v) });
        box.appendChild(el("div", { class: "small-label" }, ["Presse-papiers"]));
        slider(box, { label: "Miniatures", min: 25, max: 200, value: state.clipboardThumbScalePercent, valueLabel: (v) => v + "%", dataKey: "clipboard-thumb-scale", onChange: (v) => go("clipboard-thumb-scale", v) });
        slider(box, { label: "Texte", min: 25, max: 200, value: state.clipboardTextScalePercent, valueLabel: (v) => v + "%", dataKey: "clipboard-text-scale", onChange: (v) => go("clipboard-text-scale", v) });
        // Notes — DEMANDE EXPLICITE ("ajoutes la possibilité de modification
        // des réglages du dash notes dans taille du contenu des dashs") :
        // même schéma Miniatures/Texte que le Presse-papiers ci-dessus
        // (voir win32::cef_notes::set_text_scale/set_image_scale), "Images"
        // plutôt que "Miniatures" (les notes ne sont pas QUE des images,
        // contrairement au presse-papiers où chaque entrée EST une
        // miniature ou un aperçu texte).
        box.appendChild(el("div", { class: "small-label" }, ["Notes"]));
        // Plafond à 400 % pour les DEUX — DEMANDE EXPLICITE (« j'ai modifié les
        // curseurs jusqu'à 200 % mais c'est toujours trop petit »), alors que
        // les quatre curseurs Dash/Presse-papiers au-dessus restent à 200 %.
        // Voir `win32::cef_notes::MAX_SCALE`, qui porte la borne côté Rust ET la
        // mise en garde : ce symptôme a été pris une fois pour une PERTE de
        // réglages alors que l'échelle s'appliquait très bien.
        //
        // « Texte » zoome TOUT le panneau (`--text-scale`, appliqué en `zoom` sur
        // `.root` de notes.html, avec `width: calc(100vw / var(--text-scale))`
        // pour qu'il continue de remplir sa fenêtre) ; « Images » est RELATIVE à
        // ce zoom. Poussés ensemble à 400 %, les deux se composent : c'est
        // voulu, mais c'est ce qui rend la mise en page très différente en haut
        // de course.
        slider(box, { label: "Texte", min: 25, max: 400, value: state.notesTextScalePercent, valueLabel: (v) => v + "%", dataKey: "notes-text-scale", onChange: (v) => go("notes-text-scale", v) });
        slider(box, { label: "Images", min: 25, max: 400, value: state.notesImageScalePercent, valueLabel: (v) => v + "%", dataKey: "notes-image-scale", onChange: (v) => go("notes-image-scale", v) });
        // Calendrier, Minuteur, Surveillance, Calculatrice, Serveurs SSH — un
        // seul curseur chacun, qui zoome tout le panneau (voir
        // win32::taille_panneaux). DEMANDE EXPLICITE (2026-09-26) : « on a
        // ajouté des choses mais les possibilités de réglages n'ont pas été
        // mises à jour ».
        for (const [label, panneau] of PANEL_SCALE_TARGETS) {
          box.appendChild(el("div", { class: "small-label" }, [label]));
          slider(box, { label: "Contenu", min: 25, max: 200, value: state.panelContentScalePercents[panneau], valueLabel: (v) => v + "%", dataKey: "panel-content-scale-" + panneau, onChange: (v) => go("panel-content-scale", panneau, v) });
        }
        // ⭐ **LE FORÇAGE GLOBAL DU RATIO DE DPI** — voir `config::load_ratio_dpi_force`.
        // Celui-ci vaut pour TOUS les écrans, PRIMAIRE comprise — et c'est
        // précisément pourquoi il existe : la page ne liste que les écrans
        // SECONDAIRES, donc sans lui la correction automatique de la taille perçue
        // ne se vérifierait qu'en changeant de résolution.
        // ⚠️ Cocher propose **100 %** (« ne rien corriger ») et non l'automatique :
        // le forçage vaut partout, et l'automatique diffère d'un écran à l'autre
        // (1.0 sur la primaire, 0.67 sur un écran à 100 %). Le curseur fait le reste.
        box.appendChild(el("div", { class: "small-label" }, ["Ratio de DPI (tous les écrans)"]));
        const forceDpiRatio = (state.ratioDpiForce || 0) > 0;
        checkboxRow(box, forceDpiRatio, "Forcer le ratio — pour corriger un DPI que Windows annonce mal", (checked) => {
          go("ratio-dpi-force", checked ? 100 : 0);
        });
        if (forceDpiRatio) {
          slider(box, { label: "Ratio forcé", min: 25, max: 200, value: state.ratioDpiForce, valueLabel: (v) => v + "%", dataKey: "ratio-dpi-force", onChange: (v) => go("ratio-dpi-force", v) });
        }
        box.appendChild(el("div", { class: "small-label" }, ["Réglages (ce panneau)"]));
        // `onChange` (PAS `onInput`) — DEMANDE EXPLICITE : contrairement aux
        // curseurs Dash/Presse-papiers ci-dessus (qui ne prennent effet qu'à
        // la prochaine ouverture de toute façon, donc le distinguo ne change
        // rien pour eux), ce panneau se redessine lui-même en direct à
        // `--content-scale` (voir `window.setState` plus bas) — appliquer ce
        // `zoom` à CHAQUE évènement `input` pendant le glissement (donc à
        // chaque pixel) rezoome tout le panneau en continu, ce qui est
        // saccadé. `onChange` ne se déclenche qu'au relâchement du clic
        // (voir la doc de `slider()` ci-dessus), donc un seul `zoom` appliqué
        // une fois le curseur lâché. L'étiquette "XX%" continue elle de
        // suivre le curseur en direct (mise à jour inconditionnelle dans
        // `slider()`, indépendante de `onInput`/`onChange`).
        slider(box, { label: "Contenu", min: 25, max: 200, value: state.settingsContentScalePercent, valueLabel: (v) => v + "%", dataKey: "settings-content-scale", onChange: (v) => go("settings-content-scale", v) });
        // Largeur de la colonne des réglages, centrée — appliquée au relâchement,
        // comme « Contenu » juste au-dessus : la page se réorganise à chaque pas.
        slider(box, { label: "Largeur de la zone des réglages", min: 30, max: 100, value: state.settingsContentWidthPercent ?? 100, valueLabel: (v) => v + "%", dataKey: "settings-content-width", onChange: (v) => go("settings-content-width", v) });
        box.appendChild(el("p", { class: "hint" }, ["Icônes/miniatures et texte réglables séparément. Chaque réglage s'applique au relâchement du curseur."]));
      });

      // Apparence des menus
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Apparence des menus"]));
        slider(box, { label: "Taille des menus", min: 50, max: 200, value: state.menuScalePercent, valueLabel: (v) => v + "%", dataKey: "menu-scale", onInput: (v) => go("menu-scale", v) });
        // max 24 → 40 — voir win32::menu::set_menu_corner_radius, doc de
        // fonction (DEMANDE EXPLICITE, même valeur des deux côtés).
        slider(box, { label: "Arrondi des menus", min: 0, max: 40, value: state.menuCornerRadius, valueLabel: (v) => v + "px", dataKey: "menu-corner-radius", onInput: (v) => go("menu-corner-radius", v) });
        // Durée du fondu d'apparition et de disparition des MENUS (voir
        // `state.menuFadeMs`, `win32::fade::menu_fade_ms`) — DEMANDE EXPLICITE :
        // « le fondu des infobulles et des menus ». Les bornes (0 à 1200)
        // reprennent MIN/MAX_FADE_MS côté Rust, et le zéro est une valeur
        // LÉGITIME : c'est l'arrêt du fondu (apparition et disparition d'un
        // coup), pas un cas dégénéré.
        slider(box, { label: "Durée du fondu", min: 0, max: 1200, step: 20, value: state.menuFadeMs, valueLabel: (v) => v + " ms", dataKey: "menu-fade-ms", onInput: (v) => go("menu-fade-ms", v) });
        colorPicker(box, "popup", state.menuColor);
        box.appendChild(el("p", { class: "hint" }, ["S'applique au clic droit sur l'icône NeuraDesk et aux volets son/réseau/alimentation/presse-papiers/calendrier, dès la prochaine ouverture."]));
      });

      // Magnification des icônes au survol — DEMANDE EXPLICITE ("magnification
      // au survol réglable par curseur"). Section À PART plutôt que rangée dans
      // "Apparence des menus" ci-dessus : l'indice de celle-ci se limite aux
      // popups de clic droit et aux volets son/réseau, alors qu'il s'agit ici
      // des icônes du dock ET des trois boutons média de la barre du haut (voir
      // ui::dock::hover_scale, réglage global).
      //
      // Les curseurs sont en `onInput` (et non `onChange` comme "Contenu"
      // tout en haut) : les valeurs sont relues à CHAQUE image par
      // `HoverAnimator::update`, donc rien ici ne rezoome le panneau — le
      // retour visuel se fait pendant le glissement, directement sur les icônes
      // survolées.
      //
      // Le titre est "Animation au survol" et non "Animation des icônes" depuis
      // que la section porte AUSSI le facteur des horloges : c'est un réglage à
      // part (voir ui::dock::clock_hover_scale), avec son propre plafond — 350 %
      // contre 250 %, la place d'un texte n'étant pas celle d'une icône dans une
      // barre de 72px.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Animation au survol"]));
        slider(box, { label: "Magnification au survol", min: 100, max: 250, value: state.hoverScalePercent, valueLabel: (v) => v + "%", dataKey: "hover-scale", onInput: (v) => go("hover-scale", v) });
        slider(box, { label: "Vitesse d'approche", min: 2, max: 60, value: state.hoverEaseSpeed, valueLabel: (v) => String(v), dataKey: "hover-ease-speed", onInput: (v) => go("hover-ease-speed", v) });
        // LE DÉCALAGE DES ICÔNES AGRANDIES — **UN RÉGLAGE PAR BARRE.** DEMANDE
        // EXPLICITE, en trois temps : « je veux que le décalage ... se décalent et
        // que ce soit réglable », puis « le décalage classique soit réglable pour le
        // dock et les autres barres individuellement ».
        //
        // 0 % : l'icône grossie reste CENTRÉE sur sa case, quitte à être coupée par le
        // bord. 100 % : elle est ramenée entièrement, donc décalée vers le centre.
        // Entre les deux, à proportion.
        //
        // ⚠️ **TROIS CURSEURS ET NON UN** : les barres n'ont pas les mêmes
        // contraintes — celle du haut part de `y = 0`, où rien ne rattrape une icône
        // sortie par le haut, alors qu'une barre latérale a de la place au-dessus et
        // en dessous. C'est ce qui justifie de pouvoir les régler séparément.
        // ⚠️ **LE MODE D'EMPLOI EST ICI, ET IL A FALLU UNE MESURE POUR SAVOIR QU'IL
        // MANQUAIT.** L'utilisateur a cherché l'applet d'alimentation dans le curseur
        // de DROITE parce qu'elle s'affiche à l'extrémité droite de sa barre — or
        // elle vit dans la BARRE DU HAUT (mesuré : `icon_side` la déclare `TopRight`,
        // à 64 px du bord de l'écran), donc c'est le curseur du HAUT qui la gouverne,
        // et il était resté à 100 %. Un réglage par barre oblige à savoir à quelle
        // barre appartient chaque icône, et rien ne le disait.
        box.appendChild(
          el("p", { class: "hint" }, [
            "Chaque curseur suit la BARRE où vit son icône, pas le côté où elle s'affiche : une applet posée dans la barre du haut reste gouvernée par le premier curseur, même si elle se trouve à son extrémité droite. À 0 %, l'icône agrandie reste centrée sur sa place et peut être coupée par le bord de l'écran ; à 100 %, elle est ramenée entièrement."
          ]),
        );
        TIRAGES.forEach(([cle, libelle], rang) => {
          slider(box, {
            label: "Décalage des icônes agrandies — " + libelle,
            min: 0,
            max: 100,
            value: (state.tiragesPercent || [100, 100, 100])[rang],
            valueLabel: (v) => v + "%",
            dataKey: "tirage-" + cle,
            onInput: (v) => go("tirage-magnification", cle, v),
          });
        });
        box.appendChild(el("p", { class: "hint" }, ["S'applique aux icônes du dock et aux trois boutons média de la barre du haut, dès la prochaine image. À 100 %, le survol ne change plus rien ; une vitesse basse rend l'agrandissement lent et élastique."]));
        // Magnification des HORLOGES — DEMANDE EXPLICITE ("pouvoir régler sa
        // taille agrandie"). Curseur distinct de celui des icônes, qui garde le
        // sien ; la VITESSE, elle, leur est commune (voir ui::dock::
        // CLOCK_HOVER_SCALE, doc de statique). Comme les deux précédents, il
        // n'entre PAS dans `computeStructureKey` : un curseur qui y figurerait
        // ferait reconstruire tout le panneau à chaque pixel de glissement (voir
        // le commentaire de `runningDotSize`).
        slider(box, { label: "Magnification des horloges", min: 100, max: 350, value: state.clockHoverScalePercent, valueLabel: (v) => v + "%", dataKey: "clock-hover-scale", onInput: (v) => go("clock-hover-scale", v) });
        box.appendChild(el("p", { class: "hint" }, ["Vaut pour le texte de l'horloge de la barre du haut et pour celui de la mini-barre plein écran. La vitesse d'approche ci-dessus leur est commune."]));
        // ⭐ **LE FOND AU SURVOL D'UNE ICÔNE FERMÉE** — DEMANDE EXPLICITE
        // (2026-11-11) : « ajouter un autre effet au survol d'une icône en
        // ajoutant un fond de couleur et de transparence paramétrable pour les
        // programmes et applets qui ne sont pas ouverts ». Coupé par défaut :
        // le survol ne dessine que l'icône grossie, comme avant.
        //
        // ⚠️ **LA CASE PILOTE L'APPARITION DU RESTE** (`survolFondActif` est
        // dans `computeStructureKey`) : sans cette clé, cocher la case ne
        // reconstruirait pas la section — la voie rapide `updateValues` ne crée
        // aucun contrôle — et le sélecteur n'apparaîtrait qu'au prochain
        // changement de structure sans rapport (défaut déjà payé avec
        // `separatorColorMode` et `runningDotColorMode`).
        //
        // ⚠️ **PAS DE `return` ICI** : contrairement à la section des verrous,
        // d'autres cases suivent dans CETTE section (clignotement, miroir) ;
        // un retour les effacerait aussi.
        checkboxRow(box, state.survolFondActif, "Fond de couleur au survol des icônes fermées", (checked) => go("survol-fond", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, ["Ne s'applique qu'aux programmes épinglés qui ne tournent pas et aux applets dont la page n'est pas ouverte : une icône ouverte garde le survol habituel. Le fond est le carré arrondi de l'icône agrandie et suit son balancement."]));
        if (state.survolFondActif) {
          box.appendChild(el("div", { class: "label" }, ["Couleur du fond"]));
          colorPicker(box, "survol", state.survolFondColor);
          slider(box, { label: "Opacité du fond", min: 0, max: 100, value: state.survolFondOpacitePercent, valueLabel: (v) => v + "%", dataKey: "survol-fond-opacite", onInput: (v) => go("survol-fond-opacite", v) });
          box.appendChild(el("p", { class: "hint" }, ["100 % est un aplat derrière l'icône ; 0 % le rend invisible, comme si la case était décochée. La couleur et l'opacité sont conservées quand on décoche."]));
        }
        // Clignotement à la notification — DEMANDE EXPLICITE ("il faudrait
        // aussi que l'indicateur clignote de plusieurs couleurs si l'app
        // envoit une notification"). Désactivé par défaut : le texte de
        // l'indice dit EXACTEMENT ce qui est lu, parce que la lecture porte
        // sur une base qui contient aussi le texte des messages — c'est la
        // contrepartie explicite du réglage (voir win32::notification, doc de
        // module).
        checkboxRow(box, state.notificationBlink, "Clignoter quand une application envoie une notification", (checked) => go("notification-blink", checked ? "1" : "0"));
        // ⚠️ **LA PHRASE ABSOLUE A ÉTÉ CORRIGÉE LE 2026-10-08.** Elle disait
        // « jamais le contenu des messages » — vrai du clignotement, et FAUX
        // depuis que le réglage ci-dessous existe. Une promesse à l'écran qui
        // cesse d'être vraie se corrige ; elle ne se contourne pas.
        box.appendChild(el("p", { class: "hint" }, ["NeuraDesk lit uniquement l'identifiant de l'application qui a envoyé la notification, jamais le contenu des messages — c'est le clignotement, et lui seul. Le clignotement s'arrête quand vous cliquez l'icône concernée."]));
        // ⛔ **LE RÉGLAGE DU BANDEAU N'EST PLUS ICI.** Il vivait dans cette
        // section — « Animation au survol » — où il n'avait rien à faire :
        // l'utilisateur l'a cherché et ne l'a pas trouvé. Il a désormais sa
        // PROPRE section, « Notifications de Windows », un peu plus bas. Le
        // titre est ce qui rend une option trouvable.
        // Miroir de la ZONE DE NOTIFICATION de Windows dans la zone « Système »
        // de la barre de droite — DEMANDE EXPLICITE. Le libellé dit ce que
        // l'utilisateur obtient, et l'indice dit franchement ce que le miroir
        // N'EST PAS : les icônes système sont dessinées par NeuraDesk (celles de
        // Windows ne sont pas lisibles — voir win32::tray_icons, doc de module),
        // et les icônes d'APPLICATION, elles, sont les vraies.
        checkboxRow(box, state.trayMirror, "Afficher les icônes de la zone de notification dans la barre de droite", (checked) => go("tray-mirror", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, ["Les icônes système sont dessinées par NeuraDesk (celles de Windows ne peuvent pas être lues) ; les icônes d'application sont les vraies. Le clic n'est pas encore transmis à Windows."]));
        // LE FLUX DES ICÔNES (voir `win32::tray_flux`) — éteint par défaut
        // depuis `f543e96` : sa fenêtre imposteur `Shell_TrayWnd` fausse la zone
        // de travail. L'indice le dit sans détour, et dit aussi qu'il n'agit
        // qu'au prochain lancement : la fenêtre n'est créée qu'au démarrage.
        checkboxRow(box, state.trayFlux, "Recevoir l'icône exacte envoyée par chaque application (expérimental)", (checked) => go("tray-flux", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, ["Déconseillé : NeuraDesk se fait alors passer pour la barre des tâches, ce qui fausse l'espace réservé aux fenêtres (une fenêtre agrandie passe sous les barres). Pris en compte au prochain lancement."]));
        checkboxRow(box, state.trayFluxDiffusion, "Au lancement, demander aux applications de renvoyer leur icône", (checked) => go("tray-flux-diffusion", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, ["N'agit que si l'option ci-dessus est cochée. Une application qui y répond mal peut perdre son icône dans la barre des tâches jusqu'à son redémarrage. Pris en compte au prochain lancement."]));
      });

      // ⭐ **LA PRESSION SUR LE PROCESSEUR ET LE GPU** — DEMANDE EXPLICITE
      // (2026-11-11) : « serait-il possible d'avoir un réglage pour gérer la
      // pression sur le processeur et le gpu ? ». Trois profils qui posent les
      // deux leviers d'un coup, puis le réglage fin : la CADENCE des images
      // présentées, et le MODE ÉCONOMIE.
      //
      // ⚠️ **LE PROFIL N'EST PAS UNE VALEUR MÉMORISÉE** : `performancesPreset`
      // est recalculé côté Rust en relisant les deux leviers
      // (`ui::performances::preset_courant`), et vaut "" dès qu'un curseur est
      // déplacé à la main — aucun bouton allumé dit alors la vérité.
      //
      // ⚠️ **LA VALEUR 0 (« suivre l'écran ») N'ENTRE PAS DANS UN CURSEUR** :
      // elle vient du profil Qualité, et le curseur montre alors son maximum
      // avec un indice qui le dit — plutôt qu'un second contrôle à tenir
      // cohérent avec le premier.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Performances"]));
        segmented(box, {
          label: "Profil",
          options: [
            { value: "economie", label: "Économie" },
            { value: "equilibre", label: "Équilibré" },
            { value: "qualite", label: "Qualité" },
          ],
          value: state.performancesPreset,
          dataKey: "performances-preset",
          onSelect: (v) => go("performances-preset", v),
        });
        box.appendChild(el("p", { class: "hint" }, ["Économie : 15 images par seconde et animations suspendues quand la souris n'est pas sur les barres. Équilibré : 30 images par seconde. Qualité : suit la fréquence de l'écran."]));
        slider(box, { label: "Images par seconde (maximum)", min: 10, max: 144, step: 5, value: state.performancesCadence || 144, valueLabel: (v) => v + " i/s", dataKey: "performances-cadence", onInput: (v) => go("performances-cadence", v) });
        box.appendChild(el("p", { class: "hint" }, ["Plafonne les images présentées quand une animation tourne (dégradé, logo, textures, magnification) : c'est là que le processeur et le GPU travaillent. Le survol et les clics gardent leur réactivité. Au maximum, NeuraDesk suit la fréquence de l'écran, comme avant ce réglage."]));
        checkboxRow(box, state.performancesEconomie, "Suspendre les animations quand la souris n'est pas sur les barres", (checked) => go("performances-economie", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, ["Les animations reprennent dès que la souris entre sur une barre, et restent actives tant qu'un panneau est ouvert. Une image est présentée dès que quelque chose change : seul le mouvement permanent s'arrête."]));
      });

      // ⭐ **LES NOTIFICATIONS DE WINDOWS SOUS L'HORLOGE** (voir
      // `win32::toast_veille`) — SECTION À PART, ET C'EST LE CORRECTIF DU
      // 2026-10-08 AU SOIR : la case vivait dans « Animation au survol », où
      // personne ne la chercherait. L'utilisateur a signalé « je n'ai pas
      // d'option dans les réglages pour la fenêtre de notification » — le
      // titre d'une section est ce qui rend une option trouvable.
      // ⭐ LA MÉTÉO DU MENU DE L'HORLOGE — DEMANDE EXPLICITE (2026-10-14) : « la
      // météo actuelle pour une ville paramétrable dans le dash réglages ».
      // Envoyée au `change` (Entrée ou sortie du champ), pas à chaque lettre :
      // chaque envoi lance un géocodage.
      // ⭐ VERR. NUM / VERR. MAJ — DEMANDE EXPLICITE (2026-10-14) : « un arrière
      // plan de couleur pour dire qu'elles sont activées, une couleur par touche,
      // paramétrable dans les réglages ». Les sélecteurs n'apparaissent que si
      // l'indicateur est affiché (`verrousAffiche` dans la clé de structure).
      // ⭐ LE DÉBIT RÉSEAU — DEMANDE EXPLICITE (2026-10-14) : « une applet
      // netspeed […] à la gauche de l'icône réseau de la barre du haut ».
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Débit réseau"]));
        checkboxRow(box, state.debitAffiche, "Afficher les vitesses d'envoi et de réception dans la barre du haut", (checked) => go("debit-affiche", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, ["À gauche de l'icône réseau : ↑ l'envoi, ↓ la réception, mis à jour chaque seconde. Seules les cartes réseau réelles comptent."]));
      });

      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Verr. num et Verr. maj"]));
        checkboxRow(box, state.verrous.affiche, "Afficher l'état de Verr. num et Verr. maj dans la barre du haut", (checked) => go("verrous-affiche", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, ["Deux pastilles, NUM et MAJ, à gauche de la fréquence d'affichage : une touche activée prend la couleur choisie ci-dessous."]));
        if (!state.verrous.affiche) return;
        box.appendChild(el("div", { class: "label" }, ["Couleur de Verr. num"]));
        colorPicker(box, "verr_num", state.verrous.num);
        box.appendChild(el("div", { class: "label" }, ["Couleur de Verr. maj"]));
        colorPicker(box, "verr_maj", state.verrous.maj);
      });

      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Météo du calendrier"]));
        box.appendChild(el("div", { class: "label" }, ["Ville"]));
        const champVille = el("input", { type: "text", class: "zone-name", autocomplete: "off", spellcheck: "false", maxlength: "80", placeholder: "Par exemple : Lyon" });
        champVille.value = state.meteoHorloge || "";
        champVille.addEventListener("change", () => go("meteo-horloge", champVille.value.trim()));
        box.appendChild(champVille);
        box.appendChild(el("p", { class: "hint" }, ["La météo actuelle de cette ville — son nom, la température et une icône — s'affiche sous le calendrier, dans le menu qui s'ouvre au clic sur l'horloge. Elle se met à jour tous les quarts d'heure. Laissez le champ vide pour ne rien afficher. Indépendante de la ville de l'applet Météo."]));
      });

      // ⭐ LES HORLOGES DU MONDE — DEMANDE EXPLICITE (2026-10-24). La liste vit
      // dans `win32::horloges_monde` ; les fuseaux proposés sont ceux que
      // Chromium connaît (`Intl.supportedValuesOf`), donc ceux que le menu de
      // l'horloge saura afficher. Des BOUTONS pour les résultats, jamais un
      // `<select>` (voir la fiche du dépôt).
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Horloges du monde"]));
        const horloges = state.horlogesMonde || [];
        horloges.forEach((h, rang) => {
          const ligne = el("div", { class: "zone-row horloge-monde" }, [
            el("span", { class: "zone-row-label" }, [h.nom + " — " + nomDuFuseau(h.zone)]),
            el("span", { class: "hint" }, [heureDuFuseau(h.zone)]),
          ]);
          const bouton = (ico, titre, action, actif) => {
            const b = el("button", { class: "action", title: titre, onclick: () => go(action, rang) }, [el("span", { class: "ico " + ico })]);
            if (!actif) b.disabled = true;
            return b;
          };
          ligne.appendChild(bouton("ico-arrow-up", "Monter", "horloge-monde-monter", rang > 0));
          ligne.appendChild(bouton("ico-arrow-down", "Descendre", "horloge-monde-descendre", rang < horloges.length - 1));
          ligne.appendChild(bouton("ico-x", "Retirer", "horloge-monde-retirer", true));
          box.appendChild(ligne);
        });
        const pleine = horloges.length >= (state.horlogesMondeMax || 8);
        const champ = el("input", { type: "search", class: "zone-name horloges-champ", autocomplete: "off", spellcheck: "false", maxlength: "60",
          placeholder: pleine ? "Liste complète" : "Ajouter une ville ou un pays : Tokyo, Japon, New York…" });
        if (pleine) champ.disabled = true;
        const resultats = el("div", { class: "size-choices horloges-resultats" });
        champ.addEventListener("input", () => {
          resultats.replaceChildren();
          const mots = sansAccents(champ.value).split(/\s+/).filter(Boolean);
          if (!mots.length) return;
          const deja = new Set(horloges.map((h) => h.zone));
          let n = 0;
          for (const zone of tousLesFuseaux()) {
            if (deja.has(zone)) continue;
            const texte = sansAccents(zone.replace(/_/g, " ") + " " + nomDuFuseau(zone));
            if (!mots.every((m) => texte.includes(m))) continue;
            resultats.appendChild(el("button", { onclick: () => go("horloge-monde-ajouter", zone) }, [
              zone.split("/").pop().replace(/_/g, " ") + " (" + nomDuFuseau(zone) + ")",
            ]));
            if (++n >= 12) break;
          }
          if (!n) resultats.appendChild(el("span", { class: "hint" }, ["Aucun fuseau trouvé."]));
        });
        box.appendChild(champ);
        box.appendChild(resultats);
        box.appendChild(el("p", { class: "hint" }, ["L'heure de ces villes s'affiche sous le calendrier, dans le menu qui s'ouvre au clic sur l'horloge, avec l'écart avec l'heure d'ici. Les changements d'heure de chaque pays sont suivis. " + (state.horlogesMondeMax || 8) + " horloges au plus."]));
      });

      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Notifications de Windows"]));
        // Désactivé par défaut, et l'indice dit EXACTEMENT ce qui est lu — comme
        // celui du clignotement, qui promet l'inverse : ce réglage-ci lit le
        // CONTENU des messages, et l'utilisateur doit le savoir AVANT de cocher.
        checkboxRow(box, state.toastsSousLHorloge, "Afficher les notifications de Windows sous l'horloge", (checked) => go("toasts-horloge", checked ? "1" : "0"));
        // ⛔ L'INDICE A CHANGÉ LE 2026-11-02 AVEC LE MÉCANISME (voir
        // `win32::toast_natif`) : plus rien n'est coupé, le vrai toast est DÉPLACÉ.
        // La lecture du contenu reste annoncée : elle nourrit l'historique.
        box.appendChild(el("p", { class: "hint" }, ["La vraie notification de Windows, avec ses boutons, est déplacée sous la barre du haut, à la position choisie ci-dessous. Rien n'est modifié dans Windows : NeuraDesk fermé, elle reste en bas à droite. ⚠️ NeuraDesk LIT LE CONTENU des messages pour les garder dans l'historique (clic droit sur l'horloge)."]));
        // ⭐ OÙ SE POSE LE BANDEAU — DEMANDE EXPLICITE : « avoir le choix entre en
        // haut à gauche, centré sous l'horloge, en haut à droite ». Des BOUTONS,
        // jamais un `<select>` : une page CEF n'en a pas (voir la fiche du dépôt).
        box.appendChild(el("p", { class: "hint" }, ["Position des notifications :"]));
        const positions = el("div", { class: "size-choices" });
        for (const [valeur, libelle] of POSITIONS_BANDEAU) {
          positions.appendChild(el("button", { class: valeur === state.positionBandeau ? "selected" : "", onclick: () => go("position-bandeau", valeur) }, [libelle]));
        }
        box.appendChild(positions);
        // ⭐ LA DURÉE — DEMANDE EXPLICITE (2026-11-02), avec le choix explicite
        // que NeuraDesk modifie AUSSI le réglage de Windows à partir de 5 s
        // (voir `win32::toast_duree`). L'indice le dit AVANT le clic, et dit la
        // valeur que Windows applique en ce moment.
        box.appendChild(el("p", { class: "hint" }, ["Durée d'affichage des notifications :"]));
        const durees = el("div", { class: "size-choices" });
        const dureeChoisie = state.dureeNotifications || 0;
        durees.appendChild(el("button", { class: dureeChoisie === 0 ? "selected" : "", onclick: () => go("toast-duree", "0") }, ["Comme Windows"]));
        for (const s of (state.dureesNotifications || [])) {
          const libelle = s >= 60 ? (s / 60) + " min" : s + " s";
          durees.appendChild(el("button", { class: s === dureeChoisie ? "selected" : "", onclick: () => go("toast-duree", String(s)) }, [libelle]));
        }
        box.appendChild(durees);
        const plancher = state.plancherDureeWindows || 5;
        const actuelle = (state.dureeWindows == null) ? "inconnue" : state.dureeWindows + " s";
        box.appendChild(el("p", { class: "hint" }, ["En dessous de " + plancher + " s, NeuraDesk ferme lui-même la notification (elle reste dans le centre de notifications). ⚠️ À partir de " + plancher + " s, NeuraDesk modifie AUSSI le réglage de Windows (Accessibilité > Effets visuels), qui reste appliqué NeuraDesk fermé. Le pointeur posé sur une notification la garde ouverte. Windows applique actuellement : " + actuelle + "."]));
      });

      // Infobulles d'icônes — DEMANDE EXPLICITE ("donnes la possibilité à
      // l'utilisateur de régler la taille de ces popup"). Réglage SÉPARÉ de
      // "Taille des menus" ci-dessus (voir win32::tooltip::TOOLTIP_SCALE,
      // doc de champ) : l'infobulle n'est pas un popup CEF comme les autres,
      // pas de raison de lier son échelle à un curseur sans rapport.
      //
      // L'ACTIVATION et le DÉLAI sont venus s'y ajouter — DEMANDE EXPLICITE :
      // « réduire le temps d'affichage des infobulles à 1 seconde par défaut et
      // laisser la possibilité à l'utilisateur de les activer et de choisir le
      // temps avant qu'elles apparaissent avec un curseur gradué de 1 à 5
      // secondes ». Les bornes du curseur (1 à 5) sont celles de
      // win32::tooltip (MIN/MAX_HOVER_DELAY_SECS) : deux commandes de la même
      // grandeur ne peuvent pas s'arrêter à des endroits différents.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Infobulles"]));
        checkboxRow(box, state.tooltipEnabled, "Afficher les infobulles", (checked) => go("tooltip-enabled", checked ? "1" : "0"));
        slider(box, { label: "Taille des infobulles", min: 50, max: 1000, step: 50, value: state.tooltipScalePercent, valueLabel: (v) => v + "%", dataKey: "tooltip-scale", onInput: (v) => go("tooltip-scale", v) });
        slider(box, { label: "Délai avant apparition", min: 1, max: 5, step: 1, value: state.tooltipDelaySecs, valueLabel: (v) => v + " s", dataKey: "tooltip-delay", onInput: (v) => go("tooltip-delay", v) });
        // Durée du fondu d'apparition et de disparition des infobulles (voir
        // `state.tooltipFadeMs`, `win32::fade::tooltip_fade_ms`) — SECOND
        // curseur, INDÉPENDANT de « Durée du fondu » de la section « Apparence
        // des menus », sur décision de l'utilisateur : l'infobulle a déjà ses
        // propres réglages (taille, délai) séparés de ceux des menus. Bornes
        // identiques (0 à 1200), zéro = pas de fondu.
        slider(box, { label: "Durée du fondu", min: 0, max: 1200, step: 20, value: state.tooltipFadeMs, valueLabel: (v) => v + " ms", dataKey: "tooltip-fade-ms", onInput: (v) => go("tooltip-fade-ms", v) });
        box.appendChild(el("p", { class: "hint" }, ["Survol continu d'une icône du dock ou d'un élément de la barre du haut (horloge, boutons média, pastilles de bureaux virtuels, afficher le bureau, moniteur système, fréquence d'écran). Décocher la case n'éteint PAS le chiffre affiché pendant le redimensionnement d'un espace ou d'une zone : c'est une mesure, pas une explication."]));
      });

      // Vitesse de défilement à la molette — DEMANDE EXPLICITE : « pouvoir
      // régler les vitesses de défilement à la molette dans les barres », UNE
      // PAR BARRE. Les bornes (16 à 160 px par cran) sont celles de
      // ui::dock (MIN/MAX_SCROLL_STEP_PX) : le curseur ne peut pas promettre une
      // vitesse que le défilement refuserait.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Défilement à la molette"]));
        slider(box, { label: "Barre de gauche", min: 16, max: 160, step: 8, value: state.scrollStepLeftPx, valueLabel: (v) => v + " px", dataKey: "scroll-step-left", onInput: (v) => go("scroll-step", "left", v) });
        slider(box, { label: "Barre de droite", min: 16, max: 160, step: 8, value: state.scrollStepRightPx, valueLabel: (v) => v + " px", dataKey: "scroll-step-right", onInput: (v) => go("scroll-step", "right", v) });
        box.appendChild(el("p", { class: "hint" }, ["Ce qu'un cran de molette déplace. Vaut aussi pour le défilement À L'INTÉRIEUR d'une zone, qui suit la vitesse de sa barre. La barre du haut ne défile pas."]));
      });

      // ⭐ L'empilement des icônes — DEMANDE EXPLICITE (2026-10-31) : « effet
      // empilement d'icônes […] comme le faisait Unity », dans les barres
      // latérales, en haut (voir `ui::empilement`).
      section(scroll, (box) => {
        const e = state.empilement;
        box.appendChild(el("h2", {}, ["Empilement des icônes"]));
        checkboxRow(box, e.actif, "Replier les icônes qui ne tiennent pas dans les barres latérales",
          (checked) => go("empilement", "actif", checked ? "1" : "0"));
        slider(box, { label: "Durée du dépliement au survol", min: e.dureeMin, max: e.dureeMax, step: 10, value: e.duree, valueLabel: (v) => v + " ms", dataKey: "empilement-duree", onInput: (v) => go("empilement", "duree", v) });
        box.appendChild(el("p", { class: "hint" }, ["Quand une barre latérale contient plus d'icônes que sa hauteur n'en tient, les dernières se replient en bas de la barre, basculées en arrière comme dans le lanceur de Unity. Toutes comptent : épinglées, applications ouvertes, applets et espaces. Au survol de la barre, tout se déplie ; la molette la fait alors défiler. La souris partie, elle se replie. Une barre qui a des zones garde son défilement ordinaire."]));
      });

      // ⭐ L'effet d'ouverture des fenêtres — DEMANDE EXPLICITE (2026-10-16) :
      // « une fenêtre volante qui tourbillonne en s'agrandissant depuis la zone
      // de l'appli, un peu comme faisait Compiz ».
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Ouverture des fenêtres"]));
        checkboxRow(box, state.effetOuverture, "Animer les fenêtres qui s'ouvrent",
          (checked) => go("effet-ouverture", checked ? "1" : "0"), "effet-ouverture");
        slider(box, { label: "Durée de l'effet", min: state.effetOuvertureDureeMin, max: state.effetOuvertureDureeMax, step: 10, value: state.effetOuvertureDuree, valueLabel: (v) => v + " ms", dataKey: "effet-ouverture-duree", onInput: (v) => go("effet-ouverture-duree", v) });
        checkboxRow(box, state.effetFermeture, "Animer les fenêtres qui se ferment, se réduisent ou changent de taille",
          (checked) => go("effet-fermeture", checked ? "1" : "0"), "effet-fermeture");
        slider(box, { label: "Durée de la fermeture", min: state.effetOuvertureDureeMin, max: state.effetOuvertureDureeMax, step: 10, value: state.effetFermetureDuree, valueLabel: (v) => v + " ms", dataKey: "effet-fermeture-duree", onInput: (v) => go("effet-fermeture-duree", v) });
        // ⭐ DEMANDE EXPLICITE (2026-11-05) : « tout, Alt+Tab compris » — la
        // fenêtre choisie revient en grandissant de 94 % (voir `rappel_bascule`).
        checkboxRow(box, state.effetBascule, "Animer le changement de fenêtre (Alt+Tab)",
          (checked) => go("effet-bascule", checked ? "1" : "0"), "effet-bascule");
        // ⭐ DEMANDE EXPLICITE (2026-11-04) : « proposer ces effets » — la forme
        // du retour (voir `win32::ouverture_fenetres::effets`).
        // ⭐ DEMANDE EXPLICITE (2026-11-05) : « choisir n'importe quel effet pour
        // l'ouverture, la fermeture, la mise en avant et la réduction » et « la
        // possibilité de mettre les effets en aléatoire ».
        // Les codes sont NUMÉRIQUES et stables (ils vivent dans
        // `effet_<moment>_style.txt`) ; 255 = au hasard.
        // ⭐ DEMANDE EXPLICITE (2026-11-05) : « il semble manquer des effets par
        // rapport à ce que l'addon ajoute sur windhawk » — les dix formes du mod
        // qui manquaient (8 à 17) rejoignent les nôtres (0 à 7 ; le 5,
        // étirement, ne va qu'à l'agrandissement).
        const FORMES_DE_FENETRE = [
          { value: 0, label: "Vers l'icône" },
          { value: 1, label: "Extinction" },
          { value: 2, label: "Fondu" },
          { value: 3, label: "Chute" },
          { value: 4, label: "Zoom" },
          { value: 6, label: "Éclatement" },
          { value: 7, label: "Génie" },
          { value: 8, label: "Thanos" },
          { value: 9, label: "Dissolution" },
          { value: 10, label: "Glitch" },
          { value: 11, label: "Coulure" },
          { value: 12, label: "Encre" },
          { value: 13, label: "Brûlure" },
          { value: 14, label: "Fissure" },
          { value: 15, label: "Mirage" },
          { value: 16, label: "Pointillé" },
          { value: 17, label: "Gonflement" },
        ];
        const AU_HASARD = { value: 255, label: "Aléatoire" };
        segmented(box, {
          label: "Forme de l'ouverture",
          options: [...FORMES_DE_FENETRE, AU_HASARD],
          value: state.effetOuvertureStyle,
          dataKey: "effet-ouverture-style",
          onSelect: (v) => go("effet-ouverture-style", String(v)),
        });
        segmented(box, {
          label: "Forme de la fermeture",
          options: [...FORMES_DE_FENETRE, AU_HASARD],
          value: state.effetFermetureStyle,
          dataKey: "effet-fermeture-style",
          onSelect: (v) => go("effet-fermeture-style", String(v)),
        });
        segmented(box, {
          label: "Forme de la réduction",
          options: [...FORMES_DE_FENETRE, AU_HASARD],
          value: state.effetReductionStyle,
          dataKey: "effet-reduction-style",
          onSelect: (v) => go("effet-reduction-style", String(v)),
        });
        segmented(box, {
          // L'étirement est le défaut de ce geste : la fenêtre ne disparaît
          // pas, elle change de rectangle (voir `Moment::Agrandissement`).
          label: "Forme de l'agrandissement et de la restauration",
          options: [{ value: 5, label: "Étirement" }, ...FORMES_DE_FENETRE, AU_HASARD],
          value: state.effetAgrandissementStyle,
          dataKey: "effet-agrandissement-style",
          onSelect: (v) => go("effet-agrandissement-style", String(v)),
        });
        // ⭐ Animer AUSSI les fenêtres des AUTRES applications — DEMANDE
        // EXPLICITE (2026-11-04) : « injection automatique ». ⛔ Décochée par
        // défaut : c'est un module chargé dans les processus des applications
        // (voir `win32::injection`).
        checkboxRow(box, state.effetInjection, "Animer aussi les fenêtres des autres applications (charge un module dans chaque application)",
          (checked) => go("effet-injection", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, ["Sans cette case, les effets ne jouent que dans les applications où le module a été chargé à la main. Cochée, NeuraDesk le charge dans chaque application qui ouvre une fenêtre : fermer et réduire y sont alors retenus le temps de l'effet. Le module n'est jamais chargé dans Windows lui-même (Explorateur, barre des tâches, bureau). Décochez-la si une application se comporte anormalement."]));
        box.appendChild(el("p", { class: "hint" }, ["Choisir une forme ALLUME l'effet de ce moment — la case au-dessus reste l'interrupteur pour l'éteindre ; celle de l'ouverture vaut pour l'ouverture seule, celle de la fermeture vaut pour la fermeture, la réduction, l'agrandissement et la restauration. Une fenêtre d'application qui s'ouvre suit la forme choisie pour l'ouverture ; « vers l'icône » la fait s'envoler de son icône dans le dock en tournant et en grandissant jusqu'à sa place ; sans icône, elle grandit depuis son centre. Les applications du Store et les fenêtres d'une application lancée en administrateur s'ouvrent sans effet. À la fermeture, à la réduction, à l'agrandissement et à la restauration, chaque geste suit SA forme : retour au point d'apparition, extinction comme un tube cathodique, fondu sur place, chute en tournant, contraction vers le centre, éclatement, ou aspiration vers l'icône en bandes ; l'étirement, propre à l'agrandissement, fait passer la fenêtre d'un rectangle à l'autre sans la faire disparaître. « Aléatoire » tire une forme à chaque animation. Une fenêtre réduite, ou qui couvre tout l'écran, se ferme sans effet."]));
      });

      // ⭐ Le fondu des fenêtres de NeuraDesk — DEMANDE EXPLICITE (2026-10-25) :
      // « un effet de fondu paramétrable à l'ouverture et à la fermeture des
      // fenêtres neuradesk ».
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Fondu des fenêtres de NeuraDesk"]));
        checkboxRow(box, state.fonduNeuradesk, "Faire apparaître et disparaître les panneaux et fenêtres de NeuraDesk en fondu",
          (checked) => go("fondu-neuradesk", checked ? "1" : "0"));
        slider(box, { label: "Durée de l'apparition", min: state.fonduNeuradeskMin, max: state.fonduNeuradeskMax, step: 10, value: state.fonduNeuradeskOuverture, valueLabel: (v) => v + " ms", dataKey: "fondu-neuradesk-ouverture", onInput: (v) => go("fondu-neuradesk-duree", "ouverture", v) });
        slider(box, { label: "Durée de la disparition", min: state.fonduNeuradeskMin, max: state.fonduNeuradeskMax, step: 10, value: state.fonduNeuradeskFermeture, valueLabel: (v) => v + " ms", dataKey: "fondu-neuradesk-fermeture", onInput: (v) => go("fondu-neuradesk-duree", "fermeture", v) });
        box.appendChild(el("p", { class: "hint" }, ["Les panneaux (Réglages, calendrier, presse-papiers…) et les fenêtres de NeuraDesk apparaissent et disparaissent sur place, en fondu, au lieu de voler depuis leur icône. Les menus gardent leur propre fondu, réglé dans leur section."]));
      });

      // ⭐ Le plein écran dans la zone centrale — DEMANDE EXPLICITE (2026-10-16) :
      // « rediriger les jeux en plein écran dans la zone centrale de l'app ».
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Plein écran"]));
        checkboxRow(box, state.pleinEcranZone, "Placer les applications plein écran dans la zone centrale",
          (checked) => go("plein-ecran-zone", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, ["Un jeu ou une vidéo qui passe en plein écran est placé entre les barres, qui restent visibles. Un jeu en plein écran exclusif ne peut pas l'être : une notification propose alors de choisir le mode « fenêtré sans bordure » dans ses options. Les navigateurs refusent aussi d'être déplacés en plein écran vidéo : l'Aide donne l'extension qui les garde dans leur fenêtre. Décochée, les fenêtres déplacées reprennent tout l'écran."]));
        checkboxRow(box, state.jeuxEnFenetre, "Lancer les jeux en fenêtre dans la zone centrale",
          (checked) => go("jeux-en-fenetre", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, ["Pour les jeux en plein écran exclusif. Un jeu Unity, Unreal ou Source lancé depuis le dock démarre en fenêtre sans bordure, à la taille de la zone centrale, comme avec les options de lancement de Steam — sans toucher au jeu lui-même. Ne s'applique pas aux jeux lancés par Steam ou un autre lanceur, ni à ceux dont les options de lancement choisissent déjà un mode d'affichage."]));
      });

      // Horloge plein écran — DEMANDE EXPLICITE ("quand s'affiche une
      // fenêtre en plein écran il y ait la possibilité de n'afficher qu'une
      // petite barre centrée en haut ou en bas de l'écran avec l'horloge
      // uniquement [...] activer cette fonction, choisir l'emplacement et
      // régler la taille de cette barre et du texte de cette horloge").
      // Désactivée par défaut : voir win32::fullscreen_clock, doc de module.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Horloge plein écran"]));
        checkboxRow(box, state.fullscreenClockEnabled, "Afficher une mini-barre d'horloge par-dessus le plein écran",
          (checked) => go("fullscreen-clock", "enabled", checked ? "1" : "0"));
        box.appendChild(el("p", { class: "hint" }, ["Remplace le masquage total habituel du dock (jeu, vidéo en plein écran...) par une petite barre centrée n'affichant que l'heure."]));
        if (state.fullscreenClockEnabled) {
          box.appendChild(el("div", { class: "small-label" }, ["Emplacement"]));
          const choices = el("div", { class: "size-choices" });
          for (const [top, label] of [[true, "Haut"], [false, "Bas"]]) {
            choices.appendChild(el("button", {
              class: state.fullscreenClockPositionTop === top ? "selected" : "",
              onclick: () => go("fullscreen-clock", "position", top ? "top" : "bottom"),
            }, [label]));
          }
          box.appendChild(choices);
          slider(box, {
            label: "Taille de la barre", min: 50, max: 1000, step: 50, value: state.fullscreenClockBarScalePercent, valueLabel: (v) => v + "%",
            dataKey: "fullscreen-clock-bar-scale", onInput: (v) => go("fullscreen-clock", "bar-scale", v),
          });
          slider(box, {
            label: "Taille du texte", min: 50, max: 1000, step: 50, value: state.fullscreenClockTextScalePercent, valueLabel: (v) => v + "%",
            dataKey: "fullscreen-clock-text-scale", onInput: (v) => go("fullscreen-clock", "text-scale", v),
          });
          decalageHorloge(box, "principal", state.fullscreenClockDecalage, "fullscreen-clock-decalage");
        }
      });

      // Couleur de mise en avant des fenêtres — "Notes" ajoutée, DEMANDE
      // EXPLICITE ("ajoutes des possibilités de réglage pour le dash
      // notes"), même mécanisme que les trois autres (voir
      // win32::cef_settings, SettingsRefs::notes_accent).
      // « Calendrier » AJOUTÉ EN DERNIER — DEMANDE EXPLICITE (2026-09-23) :
      // « ajoutes les réglages pour le dash calendrier dans le dash réglages ».
      // Même famille que les quatre autres panneaux, donc même section générée.
      // Rappel automatique des JOURS FÉRIÉS — DEMANDE EXPLICITE (2026-09-23) :
      // « la possibilité de mettre un rappel automatique sur les dates des fêtes
      // ou des anniversaires ». C'est le pendant GLOBAL du rappel des
      // anniversaires, qui se pose lui DATE PAR DATE dans la fenêtre du
      // calendrier (voir assets/popups/calendar_applet.html) : on ne coche pas
      // onze fériés un par un.
      //
      // ⚠️ LA CASE EXIGE UNE CLÉ STRUCTURELLE (voir `computeStructureKey`) : il
      // n'existe pas d'`updateCheckbox`, donc la voie rapide ne la rafraîchit
      // jamais — c'est le piège déjà payé cinq fois dans cette page.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Calendrier"]));
        checkboxRow(box, state.rappelFeries, "Rappel automatique des jours fériés", (checked) => {
          go("rappel-feries", checked ? "1" : "0");
        });
        box.appendChild(el("p", { class: "hint" }, [
          "Les anniversaires se règlent date par date, dans la fenêtre du calendrier — la cloche de chaque ligne active ou coupe son rappel.",
        ]));

      // Minuteur, Surveillance, Calculatrice, Serveurs SSH AJOUTÉS — DEMANDE
      // EXPLICITE (2026-09-26) : « on a ajouté des choses mais les possibilités
      // de réglages n'ont pas été mises à jour ».
      const ACCENT_TARGETS = [["Dash", "dash"], ["Réglages", "settings"], ["Presse-papiers", "clipboard"], ["Notes", "notes"], ["Calendrier", "calendar"], ["Minuteur", "minuteur"], ["Surveillance", "surveillance"], ["Calculatrice", "calculatrice"], ["Serveurs SSH", "ssh"], ["Terminal", "terminal"], ["Dash dossier", "dossier"], ["Visionneuse", "visionneuse"], ["Sélecteur de couleurs", "couleurs"], ["Éditeur d'image", "editeur"], ["Scanner", "scanner"], ["Dégradé animé", "shaders"], ["Lueurs", "lueurs"], ["Textures", "textures"], ["Moniteur système", "moniteur"], ["Recherche", "recherche"], ["Automatisations", "automatisations"], ["Météo", "meteo"], ["Aide", "aide"]];
      // Seuls ces panneaux ont une icône de dock qui sait prendre leur fond
      // (voir `app::run`, `*_accent.icon_bg`) — ailleurs la case serait MORTE.
      const ICON_BG_TARGETS = ["dash", "settings", "clipboard", "notes"];
      // ⭐ UNE SEULE SECTION « Couleur de mise en avant » À SÉLECTEUR DE PANNEAU —
      // DEMANDE EXPLICITE (2026-11-06) : « fusionner en une seule catégorie avec un
      // sélecteur de panneau ». Les ~23 panneaux de `ACCENT_TARGETS` donnaient
      // autant de sections quasi identiques, qui noyaient le bas d'« Apparence ».
      // Ici : un choix segmenté (⛔ PAS de `<select>`, voir la doc des pages CEF) en
      // tête, puis les mêmes contrôles qu'avant pour le panneau choisi. Le panneau
      // courant (`activeAccentPanel`) survit aux reconstructions. ⛔ Le sélecteur
      // est LOCAL : il n'appelle pas `go()` (aucun aller-retour Rust), il ne fait
      // que ré-afficher le corps ; seuls les `colorPicker`/`checkboxRow` écrivent.
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Couleur de mise en avant"]));
        box.appendChild(el("p", { class: "hint" }, [
          "La couleur d'accent de chaque panneau, dash et applet. Choisis le panneau, puis sa couleur. Chaque sélecteur a un bouton « Aléatoire » pour tirer sa couleur au hasard.",
        ]));
        // 🎲 Un tirage INDÉPENDANT pour CHAQUE élément de l'app d'un coup
        // (panneaux, menus et barres) — demande explicite : « la possibilité de
        // mettre la couleur en aléatoire pour chaque élément de l'app ».
        box.appendChild(el("div", { class: "row" }, [
          el("button", { class: "action", onclick: () => go("color-random-all") }, [
            el("span", { class: "ico ico-dice-five" }), "Tout en aléatoire",
          ]),
        ]));
        if (!ACCENT_TARGETS.some(([, w]) => w === activeAccentPanel)) activeAccentPanel = ACCENT_TARGETS[0][1];
        const choix = el("div", { class: "panel-choices" });
        for (const [label, window_] of ACCENT_TARGETS) {
          choix.appendChild(
            el("button", {
              "data-window": window_,
              class: window_ === activeAccentPanel ? "selected" : "",
              onclick: () => { activeAccentPanel = window_; rendreAccent(); },
            }, [label]),
          );
        }
        box.appendChild(choix);
        const corps = el("div");
        box.appendChild(corps);
        function rendreAccent() {
          for (const b of choix.children) b.classList.toggle("selected", b.dataset.window === activeAccentPanel);
          corps.replaceChildren();
          const window_ = activeAccentPanel;
          const accent = state.accents[window_];
          // Fond de l'icône du dock : seuls dash/settings/clipboard/notes savent le
          // prendre (voir `ICON_BG_TARGETS`), ailleurs la case serait morte.
          if (ICON_BG_TARGETS.includes(window_)) {
            checkboxRow(corps, accent.iconBg, "Utiliser aussi comme fond de l'icône dans le dock", (checked) => go("accent-icon-bg", window_, checked ? "1" : "0"));
          }
          corps.appendChild(el("div", { class: "small-label" }, ["Fond"]));
          colorPicker(corps, window_, accent.background);
          checkboxRow(corps, accent.palette !== null, "Couleur différente pour la palette automatique des éléments", (checked) => go("accent-palette-enabled", window_, checked ? "1" : "0"));
          if (accent.palette !== null) {
            corps.appendChild(el("div", { class: "small-label" }, ["Palette des éléments"]));
            colorPicker(corps, `${window_}_palette`, accent.palette);
          }
        }
        rendreAccent();
      });
      // ⭐ SECTION « Couleur des menus » — DEMANDE EXPLICITE : « personnaliser les
      // menus individuellement au niveau de la couleur ». Même ergonomie que la
      // section d'accent ci-dessus (sélecteur segmenté + `colorPicker`), mais les
      // menus n'ont QUE le fond (leur contenu reste neutre, décision antérieure).
      // La cible passée à `colorPicker` est préfixée `menu:` pour router côté Rust
      // vers `menu::set_menu_color` (voir `apply_color_to_target`) sans collision
      // avec les panneaux de même nom (ex. le panneau `calendar`).
      const MENU_TARGETS = [["Menu clic droit", "context"], ["Horloge / calendrier", "calendar"], ["Menu dossier", "dossier_menu"], ["Réseau", "network"], ["Son", "sound"], ["Voicemeeter", "voicemeeter"], ["Taille d'espace", "spacer_size"], ["Taille de barre", "bar_size"], ["Confirmation", "confirm"]];
      section(scroll, (box) => {
        box.appendChild(el("h2", {}, ["Couleur des menus"]));
        box.appendChild(el("p", { class: "hint" }, [
          "La couleur de fond de chaque menu, individuellement. Le contenu des menus reste neutre : seule la teinte du fond change. Un menu jamais réglé suit la couleur partagée des menus (section « Apparence des menus »).",
        ]));
        if (!MENU_TARGETS.some(([, k]) => k === activeMenuTarget)) activeMenuTarget = MENU_TARGETS[0][1];
        const choix = el("div", { class: "panel-choices" });
        for (const [label, key] of MENU_TARGETS) {
          choix.appendChild(
            el("button", {
              "data-menu": key,
              class: key === activeMenuTarget ? "selected" : "",
              onclick: () => { activeMenuTarget = key; rendreMenu(); },
            }, [label]),
          );
        }
        box.appendChild(choix);
        const corps = el("div");
        box.appendChild(corps);
        function rendreMenu() {
          for (const b of choix.children) b.classList.toggle("selected", b.dataset.menu === activeMenuTarget);
          corps.replaceChildren();
          const key = activeMenuTarget;
          const menuColors = (state && state.menuColors) || {};
          const custom = (state && state.menuCustom) || [];
          corps.appendChild(el("div", { class: "small-label" }, ["Fond"]));
          // La cible `menu:<clé>` route côté Rust ; le sélecteur est amorcé avec
          // la couleur RÉELLEMENT affichée (propre si réglée, sinon partagée).
          colorPicker(corps, `menu:${key}`, menuColors[key] || "000000");
          if (custom.includes(key)) {
            corps.appendChild(el("p", { class: "hint" }, ["Ce menu a sa propre couleur."]));
            corps.appendChild(el("div", { class: "row" }, [
              el("button", { class: "action", onclick: () => go("menu-color-reset", key) }, ["Revenir à la couleur partagée"]),

          }
