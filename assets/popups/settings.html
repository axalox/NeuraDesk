    // `app::SECONDARY_DEFAULT_DISABLED_FEATURES`).
    const SECONDARY_TOPBAR_FEATURES =
      TOPBAR_FEATURES.filter(([name]) => !["terminal", "theme_toggle", "night_light", "printer", "calendar", "image_editor", "screen_capture", "minuteur", "surveillance", "windows_update", "device_manager", "observateur_evenements", "display_settings", "calculatrice", "ssh", "couleurs", "optional_features", "notifications", "recherche", "automatisations", "meteo", "verrouillage", "caracteres", "kaomoji", "aide", "proprietes_systeme", "scanner", "shaders", "phonetique", "maths", "lueurs", "textures", "narrateur", "loupe", "moniteur", "enregistrer", "clavier", "jeu2048", "cinq_ou_plus", "quadrapassel", "lightsoff", "reversi", "bovo", "patience"].includes(name));
    // Noms de `SECONDARY_TOPBAR_FEATURES` dont l'état par défaut (avant tout
    // réglage propre à cet écran) est désactivé, indépendamment du réglage
    // PRIMAIRE — même liste que `app::SECONDARY_DEFAULT_DISABLED_FEATURES`
    // côté Rust (seul `network` en fait encore partie ICI : `terminal`/
    // `dash`/`clipboard_viewer`/`notes`/`theme_toggle`/`night_light`,
    // également dans cette liste côté Rust, ne sont de toute façon plus
    // proposés ci-dessus). Sert UNIQUEMENT
    // à afficher la bonne case cochée/décochée (voir `secondaryScreenFeatures`
    // ci-dessous) — la valeur EFFECTIVE reste calculée côté Rust (voir
    // `app::resolve_secondary_features`), cette liste n'a besoin de rester
    // synchronisée avec elle QUE pour ces éléments encore proposés ici.
    const SECONDARY_FORCED_OFF_BY_DEFAULT = ["network"];

    function secondaryScreenThickness(container, screen) {
      const auto = screen.thickness === null;
      checkboxRow(container, auto, "Épaisseur automatique (comme la taskbar Windows de cet écran)", (checked) => {
        if (checked) go("secondary-screen-thickness", screen.deviceName, "auto");
        // Décoché : BUG RÉEL CORRIGÉ ("je n'ai pas de réglages qui
        // apparaissent") — rien n'était envoyé ici, donc `screen.thickness`
        // restait `null` et les curseurs ci-dessous (conditionnés par
        // `!auto`, qui dépend de l'état SERVEUR pas de la case cochée)
        // n'apparaissaient jamais. Fixe les trois barres à l'épaisseur
        // ACTUELLE de la barre PRIMAIRE (pas de "vraie" valeur dérivée pour
        // cet écran encore connue côté JS) — l'utilisateur ajuste ensuite
        // via les curseurs, même principe que `secondaryScreenTint`.
        else {
          for (const [i, [bar]] of BAR_LABELS.entries()) {
            go("secondary-screen-thickness", screen.deviceName, bar, state.barSizes[i]);
          }
        }
      });
      if (!auto) {
        const [top, left, right] = screen.thickness;
        for (const [i, [bar, label]] of BAR_LABELS.entries()) {
          slider(container, {
            // `min` : 16 pour la barre du HAUT uniquement, même règle que
            // le curseur des barres primaires — DEMANDE EXPLICITE ("la
            // valeur minimale pour l'épaisseur de la barre supérieure soit
            // de 16 pixels... dans les menus", pluriel : ce curseur aussi).
            label: label, min: bar === "top" ? 16 : 0, max: 120, value: [top, left, right][i],
            valueLabel: (v) => Math.round(v) + "px",
            dataKey: `secondary-thickness-${screen.deviceName}-${bar}`,
            // Voir `slider`, doc du paramètre `curve` — plus de précision
            // sur les petites épaisseurs, qui sont la plage la plus
            // fréquemment ajustée pour un écran secondaire.
            curve: 2.2,
            onInput: (v) => go("secondary-screen-thickness", screen.deviceName, bar, v),
          });
        }
      }
    }

    function secondaryScreenTint(container, screen) {
      const auto = screen.tintPercent === null;
      checkboxRow(container, auto, "Transparence automatique (suit la barre principale)", (checked) => {
        if (checked) go("secondary-screen-tint", screen.deviceName, "auto");
        // Décoché : BUG RÉEL CORRIGÉ ("je n'ai pas de réglages qui
        // apparaissent") — jusqu'ici rien n'était envoyé ici, donc
        // `screen.tintPercent` restait `null` et les curseurs (juste en
        // dessous, conditionnés par `!auto`) n'apparaissaient jamais.
        // Fixe explicitement les TROIS barres à la valeur ACTUELLE de la
        // barre principale pour cet écran (pas de défaut inventé), comme
        // `secondaryScreenColors` le fait déjà pour la couleur — l'utilisateur
        // peut ensuite les régler indépendamment via les curseurs.
        else {
          for (const [i, [bar]] of BAR_LABELS.entries()) {
            go("secondary-screen-tint", screen.deviceName, bar, state.barTintPercent[i]);
          }
        }
      });
      if (!auto) {
        const [top, left, right] = screen.tintPercent;
        for (const [i, [bar, label]] of BAR_LABELS.entries()) {
          slider(container, {
            label: label, min: 0, max: 100, step: 5, value: [top, left, right][i],
            valueLabel: (v) => Math.round(v) + "%",
            dataKey: `secondary-tint-${screen.deviceName}-${bar}`,
            onInput: (v) => go("secondary-screen-tint", screen.deviceName, bar, v),
          });
        }
      }
    }

    // Couleur des trois barres PAR ÉCRAN secondaire — DEMANDE EXPLICITE
    // ("mêmes possibilités de réglages... choix des couleurs... palettes de
    // couleurs, sélecteur de couleur" pour les écrans secondaires) : chaque
    // barre en mode manuel utilise désormais le même `colorPicker` riche
    // (dégradé teinte/saturation, glissière de teinte, bouton "Couleur
    // d'accentuation Windows", pipette, "+ Mes couleurs", préréglages et
    // couleurs personnalisées) que les barres de l'interface PRIMAIRE,
    // au lieu d'un simple champ hex — voir `apply_secondary_color_target`
    // côté Rust pour la cible dynamique `secondary:<device_name>:bar_<bar>`
    // que ce sélecteur envoie via `go("color", target, hex)`.
    function secondaryScreenColors(container, screen) {
      // Plus de `<div class="small-label">` de titre ici : le `<h2>` posé
      // par l'appelant (voir `renderSecondaryScreenSection`) fait déjà
      // office de titre de section, désormais aussi celui affiché dans la
      // colonne de catégories.
      const colors = screen.colors; // null (aucune barre personnalisée) ou [hex|null, hex|null, hex|null]
      for (const [i, [bar, label]] of BAR_LABELS.entries()) {
        const current = colors ? colors[i] : null;
        const auto = current === null;
        checkboxRow(container, auto, `${label} : suit la barre principale`, (checked) => {
          if (checked) go("secondary-screen-color", screen.deviceName, bar, "auto");
          else go("secondary-screen-color", screen.deviceName, bar, state.barColors[i]);
        });
        if (!auto) {
          colorPicker(container, `secondary:${screen.deviceName}:bar_${bar}`, current);
        }
      }
    }

    // Taille du menu/dash/presse-papiers/réglages PAR ÉCRAN secondaire (voir
    // `win32::cef_settings::SettingsRefs::secondary_screen_scales`) —
    // DEMANDE EXPLICITE ("régler les tailles du dash et des menus et de
    // leurs éléments pour les différentes interfaces secondaires comme il
    // est possible de le faire pour l'interface principale"). Contrairement
    // à `secondaryScreenTint`/`secondaryScreenColors` (chaque barre peut
    // suivre ou non le principal indépendamment), ici une SEULE case
    // "Automatique" couvre les SEPT curseurs à la fois — voir la doc de
    // `secondary_screen_scales.txt` côté Rust : une entrée dans la table
    // veut dire que TOUT est en réglage manuel pour cet écran, il n'y a pas
    // de sens à ne fixer que la taille des menus sans celle du Dash par ex.
    // Décoché : seedé avec les valeurs ACTUELLES de l'interface PRIMAIRE
    // (comme `secondaryScreenTint`/`secondaryScreenColors`), ajustable
    // ensuite indépendamment.
    function secondaryScreenScales(container, screen) {
      const auto = screen.scales === null;
      checkboxRow(container, auto, "Tailles automatiques (suivent l'interface principale)", (checked) => {
        if (checked) go("secondary-screen-scale", screen.deviceName, "auto");
        else go("secondary-screen-scale", screen.deviceName, "init");
      });
      if (!auto) {
        const fields = [
          ["menu", "Taille des menus", screen.scales.menu],
          ["dash-icon", "Dash — Icônes", screen.scales.dashIcon],
          ["dash-label", "Dash — Texte", screen.scales.dashLabel],
          ["dash-category", "Dash — Catégories", screen.scales.dashCategory],
          ["clipboard-thumb", "Presse-papiers — Miniatures", screen.scales.clipboardThumb],
          ["clipboard-text", "Presse-papiers — Texte", screen.scales.clipboardText],
          ["settings-content", "Réglages — Contenu", screen.scales.settingsContent],
          // ⭐ **LE RATIO DE DPI, AMORCÉ AVEC L'AUTOMATIQUE DE CET ÉCRAN** (voir le
          // bras `init` côté Rust) : il affiche donc 67 % sur un écran à 100 %
          // derrière une primaire à 150 %, au lieu de laisser croire que rien n'est
          // appliqué. 100 % neutralise la correction, une autre valeur la corrige.
          // ⚠️ Pas de « 0 % » ici : décocher la case ci-dessus rend TOUT à
          // l'automatique, ce qui est le seul « désactiver » qui ait un sens.
          ["dpi", "Ratio de DPI", screen.scales.dpi],
        ];
        for (const [field, label, value] of fields) {
          slider(container, {
            label, min: 25, max: 200, value,
            valueLabel: (v) => v + "%",
            dataKey: `secondary-scale-${screen.deviceName}-${field}`,
            onChange: (v) => go("secondary-screen-scale", screen.deviceName, field, v),
          });
        }
      }
    }

    // Couleur du texte de la barre du haut PAR ÉCRAN secondaire (voir la doc
    // de `SettingsRefs::secondary_screen_auto_color_scheme`/
    // `_topbar_text_color`) — DEMANDE EXPLICITE ("les mêmes possibilités de
    // réglages pour l'interface secondaire que pour l'interface
    // principale") : même structure à deux niveaux que la section
    // "Colorisation automatique"/"Couleur du texte de la barre du haut"
    // primaire plus haut, mais localisée à CET écran. `screen.
    // autoColorScheme` : `null` = pas de réglage manuel, suit entièrement
    // la barre principale ; sinon un booléen propre à cet écran.
    function secondaryScreenTopbarText(container, screen) {
      // Idem `secondaryScreenColors` ci-dessus — titre porté par le `<h2>`
      // de l'appelant, plus de doublon en `small-label` ici.
      const auto = screen.autoColorScheme === null;
      checkboxRow(container, auto, "Suit la barre principale", (checked) => {
        if (checked) go("secondary-screen-auto-color-scheme", screen.deviceName, "auto");
        // Décoché : fixe explicitement la valeur ACTUELLE de la barre
        // principale pour cet écran (pas de défaut inventé, même principe
        // que `secondaryScreenThickness`) — l'utilisateur peut ensuite la
        // changer via la case ci-dessous.
        else go("secondary-screen-auto-color-scheme", screen.deviceName, state.autoColorScheme ? "1" : "0");
      });
      if (!auto) {
        checkboxRow(container, screen.autoColorScheme, "Colorisation automatique (suit la couleur de la barre du haut de cet écran)", (checked) => {
          go("secondary-screen-auto-color-scheme", screen.deviceName, checked ? "1" : "0");
        });
        if (!screen.autoColorScheme) {
          // hex ou null (suit alors la couleur manuelle de la barre
          // principale) — `null` : pas de couleur de départ connue pour le
          // `colorPicker`, on affiche d'abord un simple bouton qui fixe la
          // couleur ACTUELLE de la barre principale (pas de défaut
          // inventé), après quoi le `colorPicker` riche prend le relais —
          // même principe que `secondaryScreenColors` ci-dessus.
          const current = screen.topbarTextColor;
          if (current === null) {
            const row = el("div", { class: "row" });
            row.appendChild(el("span", { class: "hint" }, ["Couleur : barre principale — "]));
            row.appendChild(el("button", { class: "action", onclick: () => go("secondary-screen-topbar-text-color", screen.deviceName, state.topbarTextColor) }, ["Régler séparément"]));
            container.appendChild(row);
          } else {
            checkboxRow(container, false, "Suit la barre principale", (checked) => {
              if (checked) go("secondary-screen-topbar-text-color", screen.deviceName, "auto");
            });
            colorPicker(container, `secondary:${screen.deviceName}:topbar_text`, current);
          }
        }
      }
    }

    // Mini-barre d'horloge plein écran PAR ÉCRAN secondaire (voir la doc de
    // `SettingsRefs::secondary_screen_fullscreen_clock_*`) — DEMANDE
    // EXPLICITE ("pouvoir régler individuellement les horloges en plein
    // écran en fonction de l'écran où elles s'affichent, je ne veux pas un
    // réglage unique pour toutes les horloges en mode plein écran"). Même
    // gabarit "Automatique" TOUT-ou-RIEN que `secondaryScreenTopbarText`
    // ci-dessus : décochée, elle fixe les 3 sous-réglages à la valeur
    // ACTUELLE de la barre principale (pas de défaut inventé) avant de
    // laisser l'utilisateur les ajuster séparément.
    // ⭐ LE DÉCALAGE DE L'HORLOGE PLEIN ÉCRAN — DEMANDE (2026-10-24) : depuis son
    // emplacement (centrée en haut ou en bas), vers la droite et vers le centre.
    function decalageHorloge(container, ecran, [x, y], dataKey) {
      const [maxX, maxY] = state.fullscreenClockDecalageMax;
      slider(container, {
        label: "Décalage horizontal", min: -maxX, max: maxX, step: 2, value: x,
        valueLabel: (v) => (v > 0 ? "+" : "") + v + " px",
        dataKey: dataKey + "-x", onInput: (v) => go("fullscreen-clock-decalage", ecran, "x", v),
      });
      slider(container, {
        label: "Décalage vertical (vers le centre)", min: 0, max: maxY, step: 2, value: y,
        valueLabel: (v) => v + " px",
        dataKey: dataKey + "-y", onInput: (v) => go("fullscreen-clock-decalage", ecran, "y", v),
      });
    }

    function secondaryScreenFullscreenClock(container, screen) {
      const auto = screen.fullscreenClockEnabled === null;
      checkboxRow(container, auto, "Suit la barre principale", (checked) => {
        if (checked) go("secondary-screen-fullscreen-clock-enabled", screen.deviceName, "auto");
        else go("secondary-screen-fullscreen-clock-enabled", screen.deviceName, state.fullscreenClockEnabled ? "1" : "0");
      });
      if (auto) return;
      checkboxRow(container, screen.fullscreenClockEnabled, "Afficher une mini-barre d'horloge par-dessus le plein écran sur cet écran",
        (checked) => go("secondary-screen-fullscreen-clock-enabled", screen.deviceName, checked ? "1" : "0"));
      if (!screen.fullscreenClockEnabled) return;
      container.appendChild(el("div", { class: "small-label" }, ["Emplacement"]));
      const positionChoices = el("div", { class: "size-choices" });
      for (const [top, label] of [[true, "Haut"], [false, "Bas"]]) {
        positionChoices.appendChild(el("button", {
          class: screen.fullscreenClockPositionTop === top ? "selected" : "",
          onclick: () => go("secondary-screen-fullscreen-clock-position", screen.deviceName, top ? "top" : "bottom"),
        }, [label]));
      }
      container.appendChild(positionChoices);
      slider(container, {
        label: "Taille de la barre", min: 50, max: 1000, step: 50,
        value: screen.fullscreenClockBarScalePercent ?? state.fullscreenClockBarScalePercent,
        valueLabel: (v) => v + "%",
        dataKey: `secondary-screen-fullscreen-clock-bar-scale-${screen.deviceName}`,
        onInput: (v) => go("secondary-screen-fullscreen-clock-bar-scale", screen.deviceName, v),
      });
      slider(container, {
        label: "Taille du texte", min: 50, max: 1000, step: 50,
        value: screen.fullscreenClockTextScalePercent ?? state.fullscreenClockTextScalePercent,
        valueLabel: (v) => v + "%",
        dataKey: `secondary-screen-fullscreen-clock-text-scale-${screen.deviceName}`,
        onInput: (v) => go("secondary-screen-fullscreen-clock-text-scale", screen.deviceName, v),
      });
      decalageHorloge(container, screen.deviceName, screen.fullscreenClockDecalage ?? state.fullscreenClockDecalage,
        `secondary-screen-fullscreen-clock-decalage-${screen.deviceName}`);
    }

    // Taille des pastilles de bureaux virtuels PAR ÉCRAN secondaire (voir la
    // doc de `SettingsRefs::secondary_screen_desktop_dot_sizes`) — DEMANDE
    // EXPLICITE ("je voudrais que les pastilles des bureaux virtuels soient
    // redimensionnables dans le dash réglage, en ayant chacune leur propre
    // réglage dans la barre correspondante"). `screen.desktopDotSize` :
    // `null` = pas de réglage manuel, suit la taille PRIMAIRE.
    function secondaryScreenDesktopDotSize(container, screen) {
      const auto = screen.desktopDotSize === null;
      checkboxRow(container, auto, "Suit la barre principale", (checked) => {
        if (checked) go("secondary-screen-desktop-dot-size", screen.deviceName, "auto");
        else go("secondary-screen-desktop-dot-size", screen.deviceName, String(state.desktopDotSize));
      });
      if (auto) return;
      slider(container, {
        // PLAFOND TRIPLÉ (36 -> 108), comme la barre primaire (DEMANDE
        // EXPLICITE, 2026-09-23).
        label: "Taille des pastilles", min: 8, max: 108,
        value: screen.desktopDotSize,
        valueLabel: (v) => v + "px",
        dataKey: `secondary-screen-desktop-dot-size-${screen.deviceName}`,
        onInput: (v) => go("secondary-screen-desktop-dot-size", screen.deviceName, v),
      });
    }

    // Taille du texte de la barre du haut PAR ÉCRAN secondaire — même structure
    // que `secondaryScreenDesktopDotSize` ci-dessus, avec UNE différence de
    // fond : ce réglage-ci a un mode AUTOMATIQUE, y compris HÉRITÉ. Un écran
    // sans réglage propre suit celui de la barre PRINCIPALE, laquelle peut
    // elle-même être en automatique — auquel cas c'est l'épaisseur de CETTE
    // barre-ci qui décide (voir app::rebuild_secondary_docks). D'où la valeur
    // de départ du curseur : ce que l'écran affiche DÉJÀ, pour que décocher la
    // case ne fasse rien bouger à l'écran.
    function secondaryScreenTopbarTextSize(container, screen) {
      const auto = screen.topbarTextSize === null;
      checkboxRow(container, auto, "Suit la barre principale", (checked) => {
        if (checked) {
          go("secondary-screen-topbar-text-size", screen.deviceName, "auto");
        } else {
          const dejaAffiche = state.topbarTextSize !== null ? state.topbarTextSize : screen.topbarTextAutoPx;
          go("secondary-screen-topbar-text-size", screen.deviceName, String(dejaAffiche));
        }
      });
      if (auto) return;
      slider(container, {
        label: "Taille du texte",
        // Le maximum suit l'épaisseur de CETTE barre-ci (voir
        // ui::topbar::topbar_text_font_px_max), d'où `screen.` et non `state.`.
        min: 8, max: screen.topbarTextMaxPx,
        value: screen.topbarTextSize,
        valueLabel: (v) => v + "px",
        dataKey: `secondary-screen-topbar-text-size-${screen.deviceName}`,
        onInput: (v) => go("secondary-screen-topbar-text-size", screen.deviceName, v),
      });
    }

    // ⭐ LES OMBRES DE CET ÉCRAN — DEMANDE EXPLICITE (2026-10-19) : « il faudrait
    // que l'effet d'ombre des écrans secondaires soit réglable » (voir
    // `win32::ombre_barre::ReglagesEcran`). `screen.ombre` : `null` = suit
    // l'écran principal. Seule la barre du haut existe ici : son ombre noire et
    // son ombre de couleur ; les intensités restent celles de l'écran principal.
    // ⭐ LES COINS ARRONDIS SOUS LA BARRE DU HAUT DE CET ÉCRAN — DEMANDE (2026-10-24),
    // réglés dans l'onglet de l'écran (voir `win32::coins_secondaires`).
    function secondaryScreenCoins(container, screen) {
      checkboxRow(container, screen.coins, "Arrondir les coins sous la barre du haut", (checked) => go("coins-secondaires", screen.deviceName, checked ? "1" : "0"));
      container.appendChild(el("p", { class: "hint" }, ["De la couleur de la barre de cet écran, telle qu'elle est affichée."]));
      if (!screen.coins) return;
      // Le RAYON de ces coins (demande du 2026-11-01) : 0 = celui de la zone
      // principale (Style), sinon une valeur propre à cet écran.
      slider(container, {
        label: "Rayon des coins",
        min: 0, max: screen.coinsRayonMax, step: 1,
        value: screen.coinsRayon,
        valueLabel: (v) => (v === 0 ? "comme le style" : v + " px"),
        dataKey: `coins-secondaires-rayon-${screen.deviceName}`,
        onChange: (v) => go("coins-secondaires-rayon", screen.deviceName, v),
      });
    }

    function secondaryScreenOmbre(container, screen) {
      const o = screen.ombre;
      const route = (...s) => go("ombre-ecran", screen.deviceName, ...s);
      checkboxRow(container, o === null, "Suit l'écran principal", (checked) => route(checked ? "suit" : "perso"));
      if (o === null) return;
      // La largeur de la colorée va jusqu'à 2000 px, par 10 (voir `primaryOmbreCouleur`).
      const curseur = (label, reglage, max, valeur, rendu) => slider(container, {
        label, min: 0, max, step: reglage === "couleur-largeur" ? 10 : reglage.endsWith("largeur") ? 2 : 5,
        value: valeur,
        valueLabel: rendu,
        dataKey: `ombre-ecran-${reglage}-${screen.deviceName}`,
        onInput: (v) => route(reglage, v),
      });
      container.appendChild(el("div", { class: "small-label" }, ["Ombre noire"]));
      curseur("Sous la barre du haut — largeur", "noire-largeur", state.ombreBarreHautMax, o.noireLargeur, pixelsOuAucune);
      curseur("Sous la barre du haut — force", "noire-force", 100, o.noireForce, pourcent);
      checkboxRow(container, o.zone, "Sur la zone centrale : aussi sur les dashs, les menus et les fenêtres", (checked) => route("zone", checked ? "1" : "0"));
      container.appendChild(el("div", { class: "small-label" }, ["Ombre de couleur"]));
      curseur("Sous la barre du haut — largeur", "couleur-largeur", state.ombreCouleur.largeurMax, o.couleurLargeur, pixelsOuAucune);
      curseur("Sous la barre du haut — force", "couleur-force", 100, o.couleurForce, pourcent);
      container.appendChild(el("p", { class: "hint" }, ["Les intensités, la couleur et la texture des ombres restent celles de l'écran principal (section Ombres). L'ombre de couleur ne paraît que si elle y est activée."]));
    }

    // Écartement entre icônes PAR ÉCRAN secondaire (voir la doc de
    // `SettingsRefs::secondary_screen_icon_gaps`) — DEMANDE EXPLICITE ("je
    // voudrais pouvoir choisir l'espace par defaut entre les icones sur les
    // barres secondaires comme sur l'interface principale"). `screen.iconGap` :
    // `null` = pas de réglage manuel, suit l'écartement PRIMAIRE. Même
    // structure que `secondaryScreenDesktopDotSize` juste au-dessus.
    function secondaryScreenIconGap(container, screen) {
      const auto = screen.iconGap === null;
      checkboxRow(container, auto, "Suit la barre principale", (checked) => {
        if (checked) go("secondary-screen-icon-gap", screen.deviceName, "auto");
        else go("secondary-screen-icon-gap", screen.deviceName, String(state.iconGap));
      });
      if (auto) return;
      slider(container, {
        label: "Écartement des icônes", min: 0, max: 40,
        value: screen.iconGap,
        valueLabel: (v) => v + "px",
        dataKey: `secondary-screen-icon-gap-${screen.deviceName}`,
        onInput: (v) => go("secondary-screen-icon-gap", screen.deviceName, v),
      });
    }

    // Couleur des séparateurs (voir `state.separatorColor`, `ui::dock::Dock::
    // separator_color`) — DEMANDE EXPLICITE ("fais en sorte que les
    // séparateurs d'icones soit de la couleur principale du texte de la
    // barre à laquelle ils sont ratachés et donnes la possibilité de
    // choisir leur couleur ou de les rendre transparent"). Trois états :
    // "auto" (suit la couleur du texte), "transparent" (invisible),
    // "custom" (colorPicker riche, cible `"separator"`, voir
    // `apply_color_to_target` côté Rust).
    function primarySeparatorColor(container) {
      const mode = state.separatorColor.mode;
      checkboxRow(container, mode === "auto", "Suit la couleur du texte de la barre", (checked) => {
        go("separator-color", checked ? "auto" : "transparent");
      });
      if (mode === "auto") return;
      checkboxRow(container, mode === "transparent", "Transparent (masquer les séparateurs)", (checked) => {
        if (checked) go("separator-color", "transparent");
        else go("color", "separator", "FFFFFF");
      });
      if (mode === "transparent") return;
      colorPicker(container, "separator", state.separatorColor.hex);
    }

    // Indicateur « en cours d'execution » (voir `ui::dock::Dock::
    // running_dot_instance`) — DEMANDE EXPLICITE : « donnes moi la possibilite
    // d'agrandir la taille de l'indicateur, de changer sa forme et sa couleur
    // dans le dash de reglages ». Les formes proposees viennent du RUST
    // (`state.runningDotShapes`, voir `RunningDotShape::ALL`) : une seule
    // liste, donc ajouter une forme ne demande rien ici.
    function primaryRunningDotSize(container) {
      slider(container, {
        label: "Taille de l'indicateur", min: 4, max: 200,
        value: state.runningDotSize,
        valueLabel: (v) => v + "px",
        dataKey: "running-dot-size",
        onInput: (v) => go("running-dot-size", v),
      });
    }

    // Décalage de l'indicateur et marge autour des icônes — DEMANDE EXPLICITE
    // (2026-10-14). Bornes POUSSÉES par Rust, jamais recopiées ici. Hors de la
    // clé de structure, comme `runningDotSize` : voie rapide `updateSlider`.
    function primaryRunningDotOffset(container) {
      slider(container, {
        label: "Décalage horizontal de l'indicateur", min: -state.runningDotOffsetMax, max: state.runningDotOffsetMax,
        value: state.runningDotOffset,
        valueLabel: (v) => (v > 0 ? "+" : "") + v + "px",
        dataKey: "running-dot-offset",
        onInput: (v) => go("running-dot-offset", v),
      });
    }

    function primaryIconMargin(container) {
      slider(container, {
        label: "Marge autour des icônes", min: state.iconMarginBounds.min, max: state.iconMarginBounds.max,
        value: state.iconMargin,
        valueLabel: (v) => v + "px",
        dataKey: "icon-margin",
        onInput: (v) => go("icon-margin", v),
      });
    }

    // Le fondu en haut de la barre de gauche — DEMANDE EXPLICITE (2026-10-14) :
    // les icônes s'y floutent et s'effacent contre la barre du haut. Hors de la
    // clé de structure : voie rapide `updateSlider`.
    const fonduLibelle = (v) => (Number(v) === 0 ? "aucun" : v + "px");
    function primaryFonduHautGauche(container) {
      slider(container, {
        label: "Fondu des icônes sous la barre du haut", min: 0, max: state.fonduHautGaucheMax, step: 2,
        value: state.fonduHautGauche,
        valueLabel: fonduLibelle,
        dataKey: "fondu-haut-gauche",
        onInput: (v) => go("fondu-haut-gauche", v),
      });
    }
    function primaryFonduHautDroite(container) {
      slider(container, {
        label: "Fondu des icônes sous la barre du haut", min: 0, max: state.fonduHautGaucheMax, step: 2,
        value: state.fonduHautDroite,
        valueLabel: fonduLibelle,
        dataKey: "fondu-haut-droite",
        onInput: (v) => go("fondu-haut-droite", v),
      });
    }

    // L'ombre sous la barre du haut — DEMANDE EXPLICITE (2026-10-15) : un dégradé
    // noir en haut des colonnes et des congés, la barre du haut paraît plus haute.
    //
    // ⭐ DEUX OMBRES, DEUX JEUX DE RÉGLAGES COMPLETS — DEMANDE EXPLICITE
    // (2026-10-19) : « je veux des réglages complets pour chaque type d'ombre,
    // noire et couleur ». La noire et la colorée ont chacune leur intensité, leur
    // ombre du haut et celles des autres barres (voir `win32::ombre_barre`,
    // `ReglagesCouleur`) ; la noire est posée PAR-DESSUS la colorée.
    const pixelsOuAucune = (v) => (Number(v) === 0 ? "aucune" : v + "px");
    const pourcent = (v) => v + " %";

    // Les curseurs de largeur : la noire jusqu'à `ombreBarreHautMax` par 2, la
    // colorée jusqu'à 2000 px par 10 — DEMANDE EXPLICITE (2026-10-20) : « la
    // largeur des ombres colorées devrait aller jusqu'à 2000 par palier de 10 ».
    const largeurNoire = () => ({ max: state.ombreBarreHautMax, pas: 2 });
    const largeurCouleur = () => ({ max: state.ombreCouleur.largeurMax, pas: 10 });

    // L'intensité, puis l'ombre sous la barre du haut (`haut` : largeur, force).
    function ombreIntensiteEtHaut(container, { cle, intensite, haut, poserHaut, largeur }) {
      slider(container, {
        label: "Intensité", min: 0, max: state.ombreCouleurIntensiteMax, step: 5,
        value: intensite,
        valueLabel: pourcent,
        dataKey: cle + "-intensite",
        onInput: (v) => go(cle + "-intensite", v),
      });
      slider(container, {
        label: "Sous la barre du haut — largeur", min: 0, max: largeur.max, step: largeur.pas,
        value: haut.largeur,
        valueLabel: pixelsOuAucune,
        dataKey: haut.cle,
        onInput: poserHaut("largeur"),
      });
      slider(container, {
        label: "Sous la barre du haut — force", min: 0, max: 100, step: 5,
        value: haut.force,
        valueLabel: pourcent,
        dataKey: haut.cle + "-force",
        onInput: poserHaut("force"),
      });
    }

    function primaryOmbreNoire(container) {
      ombreIntensiteEtHaut(container, {
        cle: "ombre-noire",
        intensite: state.ombreNoireIntensite,
        // Les routes historiques de l'ombre du haut (la noire).
        haut: { cle: "ombre-barre-haut", largeur: state.ombreBarreHaut, force: state.ombreBarreHautForce },
        poserHaut: (reglage) => (v) => go(reglage === "largeur" ? "ombre-barre-haut" : "ombre-barre-haut-force", v),
        largeur: largeurNoire(),
      });
      // ⭐ Les cases de la barre du haut SOUS SES CURSEURS — DEMANDE EXPLICITE
      // (2026-10-23) : « pour l'ombrage de la barre du haut je voudrais les mêmes
      // réglages que pour les autres barres, cocher ou décocher pour la barre du
      // dessous et pour la zone centrale ». Elles vivaient dans la grille du bas.
      ombreNoirePorteeCases(container, 0, "Sur les barres du dessous");
      primaryOmbreCotes(container, state.ombreCotes, "ombre-cotes", largeurNoire());
      primaryOmbreNoirePortee(container);
      // ⭐ DEMANDE EXPLICITE (2026-10-23) : « remplacer les ombres noires de la
      // zone centrale par la couleur de la barre adjacente, en tenant compte des
      // ombrages de couleur s'ils sont activés » (voir
      // `win32::ombre_barre::zone_en_couleur`).
      checkboxRow(container, state.ombreZoneEnCouleur, "Sur la zone centrale : la couleur de la barre au lieu du noir", (checked) => go("ombre-zone-en-couleur", checked ? "1" : "0"));
      container.appendChild(el("p", { class: "hint" }, ["Avec l'ombre de couleur, c'est sa couleur (affichée ou réglée) ; sinon, la couleur de chaque barre. Sur les barres, l'ombre reste noire."]));
    }

    // ⭐ OÙ TOMBE L'OMBRE NOIRE, BARRE PAR BARRE — DEMANDE EXPLICITE (2026-10-19) :
    // « gérer où les ombres noires s'appliquent, sur les autres barres, sur la
    // zone centrale pour chaque barre » (voir `win32::ombre_barre::Portee`). Une
    // ligne par barre, deux cases ; la barre du haut a les siennes sous ses
    // curseurs (`primaryOmbreNoire`).
    function ombreNoirePorteeCases(container, i, libelleBarres) {
      const p = state.ombreNoirePortee;
      checkboxRow(container, p.barres[i], libelleBarres, (checked) => go("ombre-noire-portee", "barres", String(i), checked ? "1" : "0"));
      checkboxRow(container, p.zone[i], "Sur la zone centrale", (checked) => go("ombre-noire-portee", "zone", String(i), checked ? "1" : "0"));
    }
    function primaryOmbreNoirePortee(container) {
      container.appendChild(el("div", { class: "small-label" }, ["Où tombe l'ombre noire des autres barres"]));
      const grille = el("div", {});
      grille.style.display = "grid";
      grille.style.gridTemplateColumns = "auto auto auto";
      grille.style.columnGap = "12px";
      grille.style.alignItems = "center";
      [["Barre de gauche", 1], ["Barre de droite", 2], ["Barre du bas", 3]].forEach(([nom, i]) => {
        grille.appendChild(el("div", {}, [nom]));
        ombreNoirePorteeCases(grille, i, "Sur les autres barres");
      });
      container.appendChild(grille);
      container.appendChild(el("p", { class: "hint" }, ["Les autres barres : les barres voisines et les coins arrondis. La zone centrale : le bureau et ce qui s'y ouvre — dashs, menus, fenêtres —, sans gêner les clics. Dans un coin, l'ombre suit la barre qui l'ombre le plus."]));
    }

    // ⭐ DEMANDE EXPLICITE (2026-10-18) : l'ombre des barres et des coins arrondis
    // intérieurs à la couleur de la barre d'où elle part (voir
    // `win32::ombre_barre::couleur_des_barres`).
    function primaryOmbreCouleur(container) {
      checkboxRow(container, state.ombreCouleurDesBarres, "Ombre de couleur (la couleur de chaque barre)", (checked) => go("ombre-couleur-des-barres", checked ? "1" : "0"));
      if (!state.ombreCouleurDesBarres) return;
      // Couleur affichée (relue dans le rendu) ou réglée — DEMANDE EXPLICITE
      // (2026-10-19, voir `win32::ombre_barre::couleur_affichee`).
      segmented(container, {
        label: "Couleur de l'ombre",
        options: [
          { value: "affichee", label: "Couleur affichée" },
          { value: "reglee", label: "Couleur réglée" },
        ],
        value: state.ombreCouleurAffichee ? "affichee" : "reglee",
        dataKey: "ombre-couleur-affichee",
        onSelect: (v) => go("ombre-couleur-affichee", v === "affichee" ? "1" : "0"),
      });
      const c = state.ombreCouleur;
      ombreIntensiteEtHaut(container, {
        cle: "ombre-couleur",
        intensite: state.ombreCouleurIntensite,
        haut: { cle: "ombre-couleur-haut", largeur: c.largeurHaut, force: c.forceHaut },
        poserHaut: (reglage) => (v) => go("ombre-couleur-haut", reglage, v),
        largeur: largeurCouleur(),
      });
      primaryOmbreCotes(container, c.cotes, "ombre-couleur-cotes", largeurCouleur());
    }

    // ⭐ L'OMBRE DES AUTRES BARRES — DEMANDE EXPLICITE (2026-10-16) : « un effet
    // d'ombrage paramétrable pour tout le reste de la zone intérieure,
    // désactivable dans les réglages ». Gauche, droite et bas jettent la même
    // ombre que la barre du haut, vers l'intérieur (voir `win32::ombre_barre`).
    // `o` : les réglages d'une ombre (noire ou colorée), `route` les siens,
    // `largeur` la borne et le pas de ses curseurs de largeur.
    function primaryOmbreCotes(container, o, route, largeur) {
      const poser = (reglage) => (v) => go(route, reglage, v);
      const caseA = (reglage) => (checked) => go(route, reglage, checked ? "1" : "0");
      checkboxRow(container, o.active, "Le long des autres barres", caseA("active"));
      if (!o.active) return;
      slider(container, {
        label: "Largeur — barres latérales", min: 0, max: largeur.max, step: largeur.pas,
        value: o.largeur,
        valueLabel: pixelsOuAucune,
        dataKey: route + "-largeur",
        onInput: poser("largeur"),
      });
      slider(container, {
        label: "Force — barres latérales", min: 0, max: 100, step: 5,
        value: o.force,
        valueLabel: pourcent,
        dataKey: route + "-force",
        onInput: poser("force"),
      });
      checkboxRow(container, o.gauche, "Barre de gauche", caseA("gauche"));
      checkboxRow(container, o.droite, "Barre de droite", caseA("droite"));
      checkboxRow(container, o.bas, "Barre du bas", caseA("bas"));
      // ⭐ L'ombre du bas, réglable À PART — DEMANDE EXPLICITE (2026-10-16).
      slider(container, {
        label: "Largeur — barre du bas", min: 0, max: largeur.max, step: largeur.pas,
        value: o.largeurBas,
        valueLabel: pixelsOuAucune,
        dataKey: route + "-largeur-bas",
        onInput: poser("largeur-bas"),
      });
      slider(container, {
        label: "Force — barre du bas", min: 0, max: 100, step: 5,
        value: o.forceBas,
        valueLabel: pourcent,
        dataKey: route + "-force-bas",
        onInput: poser("force-bas"),
      });
      checkboxRow(container, o.surLeBas, "Les barres latérales ombrent aussi la barre du bas", caseA("sur-le-bas"));
    }

    // ⭐ LE CENTRE DE LA BARRE DU HAUT — DEMANDE EXPLICITE (2026-10-31) : « une
    // couleur de fond au centre de la barre du haut avec des ombrages noirs ou de
    // couleur qui s'étendent en fondu sur le reste de la barre » (voir
    // `win32::centre_haut`). Largeur en % de la barre, couleur du sélecteur et
    // transparence, coins au choix, deux fondus réglés chacun à part.
    function primaryOmbreCentreHaut(container) {
      const c = state.ombreCentreHaut;
      const poser = (reglage) => (v) => go("ombre-centre-haut", reglage, v);
      const caseA = (reglage) => (checked) => go("ombre-centre-haut", reglage, checked ? "1" : "0");
      checkboxRow(container, c.actif, "Une couleur au centre de la barre du haut", caseA("actif"));
      if (!c.actif) return;
      slider(container, {
        label: "Largeur du bloc", min: 1, max: 100, step: 1,
        value: c.largeur, valueLabel: pourcent,
        dataKey: "ombre-centre-haut-largeur",
        onInput: poser("largeur"),
      });
      colorPicker(container, "centre_haut", c.hex);
      slider(container, {
        label: "Transparence du bloc", min: 0, max: 100, step: 5,
        value: c.transparence, valueLabel: pourcent,
        dataKey: "ombre-centre-haut-transparence",
        onInput: poser("transparence"),
      });
      segmented(container, {
        label: "Coins du bloc",
        options: [
          { value: "1", label: "Arrondis" },
          { value: "0", label: "Carrés" },
        ],
        value: c.arrondi ? "1" : "0",
        dataKey: "ombre-centre-haut-arrondi",
        onSelect: (v) => go("ombre-centre-haut", "arrondi", v),
      });
      for (const [quel, titre] of [["coloree", "Fondu de couleur (la couleur du bloc)"], ["noire", "Fondu noir (posé par-dessus)"]]) {
        const f = c[quel];
        container.appendChild(el("div", { class: "small-label" }, [titre]));
        slider(container, {
          label: "Largeur — jusqu'au bout de la barre à 100 %", min: 0, max: 100, step: 5,
          value: f.largeur, valueLabel: pourcent,
          dataKey: "ombre-centre-haut-" + quel + "-largeur",
          onInput: poser(quel + "-largeur"),
        });
        slider(container, {
          label: "Force", min: 0, max: 100, step: 5,
          value: f.force, valueLabel: pourcent,
          dataKey: "ombre-centre-haut-" + quel + "-force",
          onInput: poser(quel + "-force"),
        });
        checkboxRow(container, f.gauche, "Vers la gauche", caseA(quel + "-gauche"));
        checkboxRow(container, f.droite, "Vers la droite", caseA(quel + "-droite"));
      }
      container.appendChild(el("p", { class: "hint" }, ["Le bloc et ses fondus sont posés sur le fond de la barre, sous les icônes et le texte. Largeur 0 ou force 0 % : pas de fondu."]));
    }

    function primaryRunningDotShape(container) {
      segmented(container, {
        label: "Forme de l'indicateur",
        options: state.runningDotShapes,
        value: state.runningDotShape,
        dataKey: "running-dot-shape",
        onSelect: (v) => go("running-dot-shape", v),
      });
    }

    // ⭐ TROIS MODES — DEMANDE EXPLICITE (2026-10-14) : « couleur auto ou dégradé
    // ou couleur perso, saturation, luminosité, transparence ». Des BOUTONS (pas
    // de `<select>` dans une page CEF). « transparent » (un ancien réglage) se
    // range sous « Personnalisée ».
    function primaryRunningDotColor(container) {
      const mode = state.runningDotColor.mode;
      const choisi = mode === "auto" || mode === "degrade" ? mode : "perso";
      segmented(container, {
        label: "Couleur de l'indicateur",
        options: [
          { value: "auto", label: "Automatique" },
          { value: "degrade", label: "Dégradé" },
          { value: "perso", label: "Personnalisée" },
        ],
        value: choisi,
        dataKey: "running-dot-color-mode",
        onSelect: (v) => go("running-dot-color", v),
      });
      // Le selecteur n'apparait QU'EN MODE PERSONNALISE — DEMANDE EXPLICITE :
      // « il faudrait que le selecteur de couleur n'apparaisse que si "Suit la
      // couleur d'accentuation du dock" n'est pas coche ».
      if (choisi === "perso") colorPicker(container, "running_dot", state.runningDotColor.hex);
      // Hors de la clé de structure : voie rapide `updateSlider`.
      for (const [quel, label, max] of [["saturation", "Saturation de l'indicateur", 200], ["luminosite", "Luminosité de l'indicateur", 200], ["transparence", "Transparence de l'indicateur", 100]]) {
        slider(container, {
          label, min: 0, max, value: state.runningDotReglages[quel],
          valueLabel: (v) => v + " %",
          dataKey: "running-dot-" + quel,
          onInput: (v) => go("running-dot-reglage", quel, v),
        });
      }
    }

    // Même principe que `primarySeparatorColor` ci-dessus, PERSONNALISÉ par
    // écran secondaire (voir la doc de `SettingsRefs::
    // secondary_screen_separator_colors`). `screen.separatorColor` :
    // `null` = pas de réglage manuel, suit la couleur (elle-même
    // potentiellement automatique) de la barre PRIMAIRE.
    function secondaryScreenSeparatorColor(container, screen) {
      const auto = screen.separatorColor === null;
      checkboxRow(container, auto, "Suit la barre principale", (checked) => {
        if (checked) go("secondary-screen-separator-color", screen.deviceName, "auto");
        // Décoché : seedé avec la couleur ACTUELLE de la barre PRIMAIRE si
        // elle en a une propre (pas de défaut inventé, même principe que
        // `secondaryScreenTopbarText`), sinon (barre principale en mode
        // "auto"/couleur du texte, sans hex propre) blanc par défaut.
        else if (state.separatorColor.mode === "custom") go("color", `secondary:${screen.deviceName}:separator`, state.separatorColor.hex);
        else go("color", `secondary:${screen.deviceName}:separator`, "FFFFFF");
      });
      if (auto) return;
      const mode = screen.separatorColor.mode;
      checkboxRow(container, mode === "transparent", "Transparent (masquer les séparateurs)", (checked) => {
        if (checked) go("secondary-screen-separator-color", screen.deviceName, "transparent");
        else go("color", `secondary:${screen.deviceName}:separator`, "FFFFFF");
      });
      if (mode === "transparent") return;
      colorPicker(container, `secondary:${screen.deviceName}:separator`, screen.separatorColor.hex);
    }

    // modifier la taille des séparateurs par interface"). Même structure
    // que `primaryIconGap`/`primaryDesktopDotSize` : un simple curseur, pas
    // de bascule "auto" (contrairement à `primarySeparatorColor`, une
    // taille n'a pas d'équivalent "suit le texte").
    function primarySeparatorSize(container) {
      slider(container, {
        label: "Taille des séparateurs", min: 4, max: 18,
        value: state.separatorSize,
        valueLabel: (v) => v + "px",
        dataKey: "separator-size",
        onInput: (v) => go("separator-size", v),
      });
    }

    // Taille des vignettes du panneau d'aperçus de fenêtres (voir
    // `state.previewThumbWidth`, `win32::window_previews`) — DEMANDE
    // EXPLICITE : « une taille ajustable dans les réglages ». Les bornes
    // reprennent `MIN_THUMB_WIDTH`/`MAX_THUMB_WIDTH` cote Rust.
    function primaryPreviewThumbWidth(container) {
      slider(container, {
        label: "Taille des aperçus", min: 120, max: 1440,
        value: state.previewThumbWidth,
        valueLabel: (v) => v + "px",
        dataKey: "preview-thumb-width",
        onInput: (v) => go("preview-thumb-width", v),
      });
    }

    // Durée du fondu d'apparition et de disparition du panneau d'aperçus (voir
    // `state.previewFadeMs`, `win32::window_previews::fade_ms`) — DEMANDE
    // EXPLICITE : « l'effet de fondu est trop rapide, donnes moi la possibilité

    function primaryPreviewFade(container) {

        label: "Durée du fondu", min: 80, max: 1200, step: 20,
        value: state.previewFadeMs,
        valueLabel: (v) => v + " ms",
        dataKey: "preview-fade-ms",
        onInput: (v) => go("preview-fade-ms", v),
      });
    }

    // Réglages de l'APERÇU D'UN BUREAU VIRTUEL (voir `win32::desktop_previews`) —
    // DEMANDE EXPLICITE : « des réglages pour les fenêtres de prévisualisation
    // des bureaux comme pour les programmes ». TROIS curseurs SÉPARÉS de ceux des
    // aperçus de fenêtres ci-dessus (décision de l'utilisateur), et leurs bornes
    // sont POUSSÉES par Rust (`state.desktopPreview*Bounds`) : la page n'en
    // recopie aucune, contrairement aux deux ci-dessus qui portent encore leurs

    function primaryDesktopPreviewWidth(container) {
      slider(container, {
        label: "Taille de la miniature",
        min: state.desktopPreviewWidthBounds.min,
        max: state.desktopPreviewWidthBounds.max,
        step: 20,
        value: state.desktopPreviewWidth,
        valueLabel: (v) => v + "px",
        dataKey: "desktop-preview-width",
        onInput: (v) => go("desktop-preview-width", v),
      });
    }

    // La HAUTEUR n'est pas réglable, et c'est délibéré : elle découle du rapport
    // du moniteur. Deux dimensions indépendantes déformeraient la miniature, donc

    function primaryDesktopPreviewFade(container) {
      slider(container, {
        label: "Durée du fondu",
        min: state.desktopPreviewFadeBounds.min,
        max: state.desktopPreviewFadeBounds.max,
        step: 20,
        value: state.desktopPreviewFadeMs,
        valueLabel: (v) => v + " ms",
        dataKey: "desktop-preview-fade-ms",
        onInput: (v) => go("desktop-preview-fade-ms", v),
      });
    }

    function primaryDesktopPreviewHoverDelay(container) {

    // Visibilité des éléments de barre PAR ÉCRAN secondaire (voir la doc de
    // `SettingsRefs::secondary_screen_features`) — DEMANDE EXPLICITE
    // ("sélectionner ou déselectionner des éléments des barres secondaires
    // pour les rendre visibles ou invisibles"). `screen.disabledFeatures`
    // n'est PAS "la liste des éléments désactivés" mais "la liste des
    // éléments dont l'état diffère de leur valeur par défaut" (voir la doc
    // du dispatch `"secondary-screen-feature"` côté Rust,
    // `win32::cef_settings::dispatch_actions` — même correctif que là-bas,
    // BUG RÉEL CORRIGÉ : "le fait de décocher réseau ne permet pas de le
    // faire réapparaitre en le resélectionnant"). La case cochée/décochée
    // affichée ici doit donc combiner la valeur par défaut (`state.features`
    // moins `SECONDARY_FORCED_OFF_BY_DEFAULT`) ET cette liste, pas juste
    // l'absence/présence dans la liste comme avant (qui affichait "coché"
    // pour `network`, désactivé par défaut, alors qu'il restait bel et bien
    // désactivé tant qu'aucun réglage propre à cet écran n'existait).
    //
    // Plus qu'UN SEUL groupe désormais (contrairement à avant, "Barre du
    // haut" + "Dashs") — DEMANDE EXPLICITE ULTÉRIEURE ("les dashs ne
    // doivent pas être proposés sur les écrans secondaires ni le terminal
    // déroulant") qui revient sur le choix précédent ("les dashs soient
    // séparés dans la liste comme pour l'interface principale") : plus de
    // colonne "Dashs" (Dash/Presse-papiers/Notes) ici ni de terminal, voir
    // `SECONDARY_TOPBAR_FEATURES` — les deux restent proposés pour la barre
    // PRIMAIRE (voir `renderInterfaceSections`, `TOPBAR_FEATURES`/
    // `DASH_FEATURES` inchangées).
    function secondaryScreenFeatures(container, screen) {
      container.appendChild(el("div", { class: "small-label" }, ["Éléments affichés sur cet écran"]));
      for (const [name, label] of SECONDARY_TOPBAR_FEATURES) {
        const defaultEnabled = state.features[name] && !SECONDARY_FORCED_OFF_BY_DEFAULT.includes(name);
        const toggled = screen.disabledFeatures.includes(name);
        const enabled = toggled ? !defaultEnabled : defaultEnabled;
        checkboxRow(container, enabled, label, (checked) => {
          go("secondary-screen-feature", screen.deviceName, name, checked ? "1" : "0");
        });
      }
    }

    // --- structure (reconstruite seulement si elle change, voir la doc
    // d'en-tête) ---
    function computeStructureKey() {
      if (!state) return "none";
      return JSON.stringify({
        auto: state.autoColorScheme,
        verrousAffiche: state.verrous.affiche,
        // Les horloges du monde : ajouter, retirer ou déplacer redessine la liste.
        horlogesMonde: JSON.stringify(state.horlogesMonde || []),
        // `blurMaterial` : sans cette clé, `render()` prend la voie rapide
        // `updateValues()` (qui ne touche pas les classes `selected`) après
        // un clic sur le sélecteur de matériau — le flou changerait bien à
        // l'écran mais le bouton surligné resterait bloqué sur l'ancien.
        blurMaterial: state.blurMaterialIndex,
        // Dégradé animé : la case fait apparaître les préréglages, dont le
        // bouton surligné suit `degradePreset` ; `captureVisible` montre ou
        // cache la remarque « sans effet ».
        // `degradeEditIndex` : la pastille encadrée et la cible du sélecteur.
        // `degradeHasard` : un nouveau tirage garde « Personnalisé » mais
        // change les pastilles ; `couleurs` : le nombre de pastilles.
        degrade: [state.degradeEnabled, state.degradeMode, state.degradePreset, state.captureVisible, degradeEditIndex, degradeHasard, state.degradeReglages && state.degradeReglages.couleurs, JSON.stringify(state.degradeSauvegardes || []), degradeSupprimer,
          // Les motifs de l'utilisateur : la liste, le choisi, la compilation en
          // cours et son compte rendu redessinent la section.
          (state.degradeShaders || []).join("|"), state.degradeShader, state.degradeShaderCompile, state.degradeShaderMessage],
        // `fullscreenClockEnabled` fait apparaître/disparaître le
        // sélecteur d'emplacement et les deux curseurs de taille (voir la
        // section "Horloge plein écran") ; `fullscreenClockPositionTop`
        // fait changer la classe `selected` du bouton Haut/Bas — même
        // raison que `blurMaterial` ci-dessus.
        fullscreenClockEnabled: state.fullscreenClockEnabled,
        fullscreenClockPositionTop: state.fullscreenClockPositionTop,
        // Les boutons de la durée et de la position des notifications : sans ces
        // clés, le clic s'appliquait mais le bouton choisi ne s'allumait pas
        // (mesuré le 2026-11-02 sur « 7 s »).
        dureeNotifications: state.dureeNotifications,
        dureeWindows: state.dureeWindows,
        positionBandeau: state.positionBandeau,
        // `separatorColor.mode` (voir `primarySeparatorColor`) : sa case
        // "Transparent" fait/défait apparaître le `colorPicker` — MANQUAIT
        // ici (BUG RÉEL CORRIGÉ : "si je décoche la transparence des
        // séparateurs je n'ai rien pour choisir leur couleur") — sans
        // cette clé, décocher "Transparent" prenait la voie rapide
        // `updateValues()` (qui ne reconstruit aucune section), donc le
        // `colorPicker` — jamais construit tant qu'on était en mode
        // "transparent" — n'apparaissait qu'au prochain changement
        // structurel SANS RAPPORT (ou jamais) — même raison que
        // `fullscreenClockEnabled`/`blurMaterial` ci-dessus.
        separatorColorMode: state.separatorColor.mode,
        // Indicateur d'application ouverte : sa case « Suit la couleur
        // d'accentuation du dock » fait apparaître/disparaître le sélecteur de
        // couleur, et sa forme fait changer le bouton surligné — MÊME raison
        // que `separatorColorMode` juste au-dessus, et MÊME PIÈGE : ces clés
        // manquaient, donc cocher la case ne reconstruisait rien et le
        // sélecteur restait affiché (DÉFAUT RÉEL SIGNALÉ).
        runningDotColorMode: state.runningDotColor.mode,
        runningDotShape: state.runningDotShape,
        // Même piège que `runningDotShape` ci-dessus, et même remède : il
        // n'existe PAS d'`updateCheckbox` (voir `updateValues`), donc la voie
        // rapide ne rafraîchit jamais une case à cocher — sans cette entrée,
        // décocher la case du clignotement laisserait la case cochée à l'écran
        // jusqu'au prochain changement de structure.
        notificationBlink: state.notificationBlink,
        // La case du fond au survol des icônes fermées : elle fait apparaître
        // son sélecteur de couleur et son curseur d'opacité — même piège et
        // même remède que les cases précédentes.
        survolFondActif: state.survolFondActif,
        // Cinquième case à cocher, même piège et même remède (voir les quatre
        // ci-dessus) : sans cette entrée, décocher « Miroir de la zone de
        // notification » la laisserait cochée à l'écran jusqu'au prochain
        // changement de structure.
        trayMirror: state.trayMirror,
        // La case des coins arrondis de la zone principale, même piège.
        coinsZone: state.coinsZone,
        // La case des coins d'écran : même piège, et elle fait apparaître son curseur.
        coinsEcran: state.coinsEcran,
        // Les cases de la portée de l'ombre noire, même piège.
        ombreNoirePortee: state.ombreNoirePortee,
        // La case de la noire en couleur sur la zone centrale, même piège.
        ombreZoneEnCouleur: state.ombreZoneEnCouleur,
        // La case des ombres à la couleur de leur barre, même piège.
        ombreCouleurDesBarres: state.ombreCouleurDesBarres,
        // Le choix de sa couleur : un contrôle SEGMENTÉ (voir `runningDotShape`).
        ombreCouleurAffichee: state.ombreCouleurAffichee,
        // Les cases de l'ombre des autres barres, noire et colorée, même piège.
        ombreCotes: [state.ombreCotes, state.ombreCouleur.cotes].flatMap((o) => [o.active, o.gauche, o.droite, o.bas, o.surLeBas]),
        // Les cases du centre de la barre du haut, même piège (voir `primaryOmbreCentreHaut`).
        ombreCentreHaut: state.ombreCentreHaut
          ? [state.ombreCentreHaut.actif, ...["noire", "coloree"].flatMap((q) => [state.ombreCentreHaut[q].gauche, state.ombreCentreHaut[q].droite])]
          : null,
        // La case de l'empilement des icônes, même piège.
        empilementActif: state.empilement ? state.empilement.actif : null,
        // La case de la lueur : elle fait apparaître ses curseurs.
        lueur: state.lueur,
        // La liste des effets enregistrés : des BOUTONS, à refaire quand elle change.
        lueursEffets: (state.lueursEffets || []).join("\u0001"),
        // Les deux cases du flux, même piège et même remède.
        trayFlux: state.trayFlux,
        trayFluxDiffusion: state.trayFluxDiffusion,
        // **TROISIÈME FOIS QUE CE PIÈGE EST PAYÉ, ET TOUJOURS LA MÊME CAUSE** :
        // « Animer le fond du logo » est une case à cocher, et il n'existe pas
        // d'`updateCheckbox` — donc la voie rapide ne la rafraîchit JAMAIS.
        // Sans cette entrée, décocher la case la laisserait cochée à l'écran.
        logoAnimationEnabled: state.logoAnimationEnabled,
        // Et les deux cases de l'icône circulaire, MÊME PIÈGE ET MÊME REMÈDE —
        // quatre cases à cocher ajoutées ce jour, quatre entrées ici.
        logoIsCircle: state.logoIsCircle,
        logoSpinClockwise: state.logoSpinClockwise,
        // La case du zoom du logo, MÊME PIÈGE ET MÊME REMÈDE.
        logoZoomEnabled: state.logoZoomEnabled,
        // La case du zoom automatique de la sphère des programmes : même piège,
        // même remède (les deux curseurs de la section, eux, n'y ont pas droit).
        sphereFenetresZoomAuto: state.sphereFenetresZoomAuto,
        // Idem pour la sphère des TERMINAUX (voir `sphere_vue.js`).
        sphereTerminauxZoomAuto: state.sphereTerminauxZoomAuto,
        // Même piège que `notificationBlink` ci-dessus, et même remède :
        // « Afficher les infobulles » est une case à cocher, donc la voie rapide
        // ne la rafraîchit pas.
        tooltipEnabled: state.tooltipEnabled,
        // Même piège que `notificationBlink` ci-dessus : un VERROU de barre est
        // une case à cocher, donc la voie rapide ne la rafraîchit pas — sans
        // cette entrée, la case resterait dans son état d'ouverture.
        barLocks: (state.barLocks || []).join(","),
        zoneLabelFontPx: state.zoneLabelFontPx,
        // ...et les ZONES, pour la même raison : ce sont des cases à cocher, et
        // verrouiller une zone depuis le CLIC DROIT doit se voir ici.
        // ...avec le NUMÉRO et le NOM : le premier suit la POSITION (donc
        // déplacer une zone le change sans qu'aucun verrou ne bouge), le second
        // se saisit ici même.
        // ⚠️ `z.key` ET NON `z.index` — la zone est désignée par un RANG de barre
        // (`"D3"`), qui ne bouge pas quand une épingle est ajoutée (voir
        // `ui::zones`). L'index, lui, change sous les entrées.
        //
        // ⚠️ **ET LE CONTENU Y ENTRE AUSSI** : la liste du contenu est dessinée
        // une fois pour toutes à la reconstruction de la section, donc cacher une
        // applet ou retirer un raccourci ne la rafraîchirait PAS sans cette
        // signature — la ligne resterait à l'écran alors que l'icône a quitté la
        // barre. C'est le piège de `lastStateJson`, dans sa forme exacte.
        zones: (state.zones || []).map((z) => `${z.key}:${z.locked ? 1 : 0}:${z.number}:${z.showsLabel ? 1 : 0}:${z.name || ""}:${z.hidden ? 1 : 0}${z.permanent ? 1 : 0}:${(z.contents || []).map((l) => `${l.label}${l.action}${l.hidden ? "h" : ""}`).join("|")}`).join(","),
        // ...ET LA BANNIÈRE DE MIGRATION, POUR LA MÊME RAISON QUE LES ZONES
        // CI-DESSUS : elle se fait acquitter (elle DISPARAÎT), et la voie rapide
        // — qui ne fait que rafraîchir des valeurs — ne la retirerait jamais.
        // Sans cette entrée, le bouton « Compris » semblerait sans effet jusqu'au
        // prochain rechargement complet du panneau. C'est le piège déjà documenté
        // sur `barLocks` et `zones`, à la ligne au-dessus.
        zonesMigration: state.zonesMigration ? JSON.stringify(state.zonesMigration) : "",
        // L'hébergeur d'envoi : le choisir fait apparaître ou disparaître la durée
        // et le champ de clé — une PRÉSENCE, donc une reconstruction. Ne change
        // qu'au clic, jamais pendant un glissement.
        envoi: state.envoi ? JSON.stringify(state.envoi) : "",
        // La sauvegarde de la configuration : le compte rendu et l'import en
        // attente de confirmation apparaissent au clic — une reconstruction.
        sauvegarde: state.sauvegarde ? JSON.stringify(state.sauvegarde) : "",
        // `runningDotSize` N'EST PAS ICI, ET NE DOIT PAS Y ÊTRE — DÉFAUT RÉEL
        // SIGNALÉ : « le curseur de taille modifiée de l'indicateur
        // d'application n'est pas fluide à déplacer ». Tant qu'il y figurait,
        // chaque pixel de glissement changeait la clé, donc `render()` prenait
        // la voie LENTE et RECONSTRUISAIT tout le panneau — une vingtaine de
        // sections — au lieu du simple `updateSlider` de la voie rapide. C'est
        // la différence entre lui et les autres curseurs (écartement, taille des
        // séparateurs, magnification), qui ne sont pas dans la clé et se
        // déplacent sans saccade. `runningDotShape` ci-dessus, lui, DOIT y
        // rester : c'est un contrôle SEGMENTÉ dont la surbrillance dépend de
        // l'état, que `updateValues` ne rafraîchit pas.
        // `topbarTextSize` : sa case « Taille automatique » fait apparaître/
        // disparaître le curseur de taille de texte de la barre du haut — MÊME
        // piège que tous les `secondaryScreens.* !== null` ci-dessus, et même
        // remède (il n'existe pas d'`updateCheckbox` : la voie rapide ne
        // rafraîchit aucune case à cocher).
        topbarTextSizeIsAuto: state.topbarTextSize === null,
        // `rappelFeries` : case à cocher (voir la section « Calendrier »), donc
        // même piège et même remède que les cinq autres — sans cette entrée,
        // décocher la case la laisserait cochée à l'écran.
        rappelFeries: state.rappelFeries,
        // **LES DEUX CHOIX DE SON DES RAPPELS** — un sélecteur MULTI-BOUTONS, comme
        // `blurMaterial` tout en haut de cette clé : la voie rapide `updateValues()`
        // ne touche AUCUNE classe `choisi`, donc sans cette entrée un clic changeait
        // bien le fichier et **rien ne bougeait à l'écran**.
        //
        // DÉFAUT RÉEL SIGNALÉ le 2026-09-24 — « les sélecteurs de sons ne prennent
        // pas en compte mon clic et le lecteur de son non plus » — et DÉMENTI PAR LA
        // MESURE : `son_rappel_notes.txt` et `son_rappel_dates.txt` portaient bien
        // les deux choix, écrits à une minute d'intervalle. **Le clic marchait ;
        // c'est l'affichage qui ne suivait pas.** C'est la même confusion qui avait
        // fait condamner le `<select>` : un contrôle dont l'état change sans que
        // l'écran le montre est indistinguable d'un contrôle mort.
        //
        // ⚠️ La signature porte aussi le NOMBRE d'entrées : déposer un fichier dans
        // `son/` change la liste, donc doit la reconstruire.
        sonsChoisis: (state.sons || []).map((s) => `${s.notes ? 1 : 0}${s.dates ? 1 : 0}`).join(""),
        customColors: state.customColors.length,
        customThemes: state.customThemes.length,
        // TOUS les panneaux de `state.accents` — la liste écrite à la main
        // s'était arrêtée à quatre, et la case « palette » du Calendrier ne
        // reconstruisait donc pas sa section.
        palettes: Object.values(state.accents).map((a) => a.palette !== null),
        // Voir `secondaryScreenThickness`/`secondaryScreenTint`/
        // `secondaryScreenColors`/`secondaryScreenTopbarText` : leurs cases
        // "Automatique" font/défont apparaître des curseurs/champs entiers,
        // donc une RECONSTRUCTION complète (pas juste `updateValues()`) est
        // nécessaire quand le mode d'un écran OU la présence d'un réglage
        // manuel change — `screen.thickness`/`tintPercent`/`colors`/
        // `autoColorScheme`/`topbarTextColor` sont `null` en mode
        // automatique, une valeur sinon (voir `push_state` côté Rust).
        secondaryScreens: (state.secondaryScreens || []).map((s) => [
          s.mode, s.thickness !== null, s.tintPercent !== null,
          // Par-BARRE (pas juste "au moins une barre personnalisée") :
          // `colorPicker` (voir `secondaryScreenColors`) n'apparaît/
          // disparaît que pour LA barre dont l'état auto/manuel change,
          // les deux autres pouvant rester dans n'importe quel état sans
          // que `s.colors !== null` global ne bouge.
          s.colors ? s.colors.map((c) => c !== null) : [false, false, false],
          s.disabledFeatures.join(","), s.autoColorScheme, s.topbarTextColor !== null,
          // `secondaryScreenScales` : même raisonnement — sa case
          // "Automatique" fait/défait apparaître les sept curseurs d'un
          // coup (réglage TOUT-ou-RIEN, voir sa doc de fonction).
          s.scales !== null,
          // `secondaryScreenFullscreenClock` : mêmes cases "Automatique"
          // TOUT-ou-RIEN (voir sa doc de fonction) — `null` = suit la barre
          // principale, une valeur sinon (voir `push_state` côté Rust).
          s.fullscreenClockEnabled !== null, s.fullscreenClockEnabled, s.fullscreenClockPositionTop,
          // `secondaryScreenDesktopDotSize` : même case "Automatique"
          // TOUT-ou-RIEN (voir sa doc de fonction) — `null` = suit la
          // barre principale, une valeur sinon (voir `push_state` côté
          // Rust).
          s.desktopDotSize !== null,
          // `secondaryScreenTopbarTextSize` : même case « Automatique »
          // TOUT-ou-RIEN que `desktopDotSize` ci-dessus — `null` = suit la
          // barre principale (automatique comprise), une valeur sinon. Sans
          // cette entrée, cocher/décocher « Taille automatique » ne
          // reconstruirait rien : il n'existe pas d'`updateCheckbox`.
          s.topbarTextSize !== null,
          // `secondaryScreenOmbre` : sa case « Suit l'écran principal » fait
          // apparaître les curseurs, et celle de la zone centrale n'a pas
          // d'`updateCheckbox`.
          s.ombre !== null, s.ombre !== null && s.ombre.zone,
          // `secondaryScreenCoins` : une case, sans `updateCheckbox`.
          s.coins,
          // `secondaryScreenIconGap` : même case "Automatique" TOUT-ou-RIEN
          // (voir sa doc de fonction) — `null` = suit la barre principale,
          // une valeur sinon (voir `push_state` côté Rust).
          s.iconGap !== null,
          // `secondaryScreenSeparatorColor` : case "Automatique" TOUT-ou-
          // RIEN comme ci-dessus, PLUS une seconde case "Transparent" qui
          // fait/défait apparaître le `colorPicker` (voir sa doc de
          // fonction).
          s.separatorColor !== null, s.separatorColor && s.separatorColor.mode === "transparent",
          // `secondaryScreenSeparatorSize` : même case "Automatique"
          // TOUT-ou-RIEN que `secondaryScreenIconGap` ci-dessus.
          s.separatorSize !== null,
          // Taille des vignettes d'aperçu de fenêtres : meme convention.
        ]),
      });
    }

    function render() {
      if (!state) return;
      const key = computeStructureKey();
      if (key === structureKey) {
        updateValues();
        return;
      }
      structureKey = key;
      rebuild();
    }

    // Dégradé animé : la couleur éditée (0..4), locale à la page.
    let degradeEditIndex = 0;
    let degradeHasard = 0;
    // Sauvegardes du dégradé : le nom en cours de saisie, et la sauvegarde
    // dont la suppression attend confirmation (second clic).
    let degradeNomSauvegarde = "";
    let degradeSupprimer = null;
    // Le filtre des sauvegardes (voir la grille) — gardé hors du rendu, sinon
    // chaque frappe le viderait en reconstruisant la section.
    let degradeFiltre = "";
    // Curseurs du dégradé — [nom, libellé, min, max, pas?, libellé de valeur?]
    // en CENTIÈMES, mêmes noms et bornes que gfx::degrade::REGLAGES.
    const DEGRADE_REGLAGES = [
      ["echelle", "Taille des motifs", 30, 500],
      ["douceur", "Douceur", 0, 100],
      ["warp", "Ondulation", 0, 100],
      ["vitesse", "Vitesse", 0, 100],
      ["luminosite", "Luminosité", 30, 200],
      ["contraste", "Contraste", 30, 200],
      ["saturation", "Saturation", 0, 200],
      ["grain", "Grain", 0, 20],
      ["flou", "Flou", 0, 100],
      ["alea", "Aléa (les réglages dérivent au hasard)", 0, 100],
      ["graine", "Graine (disposition du motif)", 0, 10000, 100, (v) => String(Math.round(v / 100))],
      ["origine_x", "Origine de l'effet — horizontale", 0, 100],
      ["origine_y", "Origine de l'effet — verticale", 0, 100],
      ["errance", "Errance de l'origine (au hasard)", 0, 100],
      // ⛔ **CETTE LISTE DOIT CONTENIR TOUS LES `REGLAGES` DE RUST** (moins
      // `couleurs`, rendu en boutons juste au-dessus). Elle ne l'était plus :
      // elle s'était arrêtée à `errance`, donc les quatre réglages ajoutés
      // ensuite — relief, lumière, cosinus, perspective — étaient bien
      // POUSSÉS par Rust, bien présents dans `state.degradeReglages`, et
      // simplement JAMAIS RENDUS. Défaut signalé : « je ne vois pas les
      // nouveaux curseurs ». Un test le vérifie maintenant
      // (`cef_settings::tests::les_curseurs_du_degrage_sont_tous_dans_la_page`).
      ["relief", "Relief (modelé par la lumière)", 0, 100],
      ["lumiere", "Lumière — direction", 0, 100],
      ["cosinus", "Palette cosinus (0 = rampe du thème)", 0, 100],
      ["perspective", "Perspective — vraie 3D (coûteuse)", 0, 100],
      // DEMANDE EXPLICITE (2026-10-03) : « des remous paramétrables partout » —
      // ils tordent TOUS les motifs. À 0 % de force, rien ne change.
      ["remous", "Remous — force", 0, 100],
      ["remous_taille", "Remous — taille", 10, 100],
      ["remous_vitesse", "Remous — rotation", 0, 100],
      ["remous_densite", "Remous — nombre", 0, 100],
    ];
    const degradeValeur = (entree) => entree[5] || ((v) => v + "%");

    // Panneaux à un seul curseur « Contenu » dans « Taille du contenu des
    // dashs » — même liste que win32::taille_panneaux::PANNEAUX.
    const PANEL_SCALE_TARGETS = [["Calendrier", "calendar"], ["Minuteur", "minuteur"], ["Surveillance", "surveillance"], ["Calculatrice", "calculatrice"], ["Serveurs SSH", "ssh"], ["Terminal", "terminal"], ["Dash dossier", "dossier"], ["Visionneuse", "visionneuse"], ["Sélecteur de couleurs", "couleurs"], ["Aide", "aide"], ["Scanner", "scanner"], ["Recherche", "recherche"], ["Automatisations", "automatisations"], ["Météo", "meteo"], ["Éditeur de shaders", "shaders"], ["Éditeur de lueurs", "lueurs"], ["Éditeur de textures", "textures"], ["Éditeur d'image", "editeur_image"], ["Moniteur système", "moniteur"]];

    function rebuild() {
      renderMainTabs();
      renderGroupTabs();
      renderScroll();
    }

    // La rangée de SOUS-ONGLETS (groupes), sous l'onglet « Interface ». Cachée
    // pour les onglets d'écran — leurs sections ne sont pas groupées. Cliquer un
    // groupe POSE LE FILTRE sans tout reconstruire : il efface la recherche (pour
    // ne pas laisser l'utilisateur devant une liste vide d'un autre groupe), met
    // à jour la sélection, re-filtre et remonte en haut.
    function renderGroupTabs() {
      const container = document.getElementById("group-tabs");
      container.replaceChildren();
      if (activeMainTab !== "interface") {
        container.style.display = "none";
        return;
      }
      container.style.display = "";
      for (const { id, nom, ico } of GROUPES) {
        container.appendChild(
          el("button", {
            class: activeGroup === id ? "selected" : "",
            onclick: () => {
              if (activeGroup === id) return;
              activeGroup = id;
              const champ = document.getElementById("category-search");
              if (champ) champ.value = "";
              renderGroupTabs();
              renderCategoryNav();
              document.getElementById("scroll").scrollTop = 0;
            },
          }, [el("span", { class: `ico ico-${ico}` }), el("span", {}, [nom])]),
        );
      }
    }

    // Onglets de haut niveau — "Interface" (réglages de l'interface
    // PRINCIPALE, voir `renderInterfaceSections`) puis un "Écran N" par
    // écran secondaire détecté, dans l'ordre de `state.secondaryScreens`
    // (voir `renderSecondaryScreenSection`). Pas de barre du tout si aucun
    // écran secondaire n'est branché : un seul onglet possible ("Interface")
    // n'apporterait rien.
    function renderMainTabs() {
      const container = document.getElementById("main-tabs");
      container.replaceChildren();
      const screens = state.secondaryScreens || [];
      if (!screens.length) {
        container.style.display = "none";
        activeMainTab = "interface";
        return;
      }
      container.style.display = "";
      // Recale sur "Interface" si l'onglet actuellement sélectionné est un
      // écran qui a disparu depuis (débranché).
      if (activeMainTab !== "interface" && !screens.some((s) => s.deviceName === activeMainTab)) {
        activeMainTab = "interface";
      }
      const addTab = (key, label) => {
        container.appendChild(
          el("button", { class: activeMainTab === key ? "selected" : "", onclick: () => { activeMainTab = key; rebuild(); } }, [label]),
        );
      };
      addTab("interface", "Interface");
      // "Écran(s)" plutôt que "Écran 1" — DEMANDE EXPLICITE ("renomme
      // l'onglet écran 1 en Écran(s)") — au singulier UN écran secondaire
      // est de très loin le cas courant ; s'il devait y en avoir plusieurs
      // en même temps on revient à une numérotation ("Écran 1", "Écran 2",
      // ...) pour rester non ambigu entre onglets.
      screens.forEach((screen, i) => addTab(screen.deviceName, screens.length > 1 ? `Écran ${i + 1}` : "Écran(s)"));
    }

    // Une entrée par `.section` qui a un `<h2>` (titre de catégorie),
    // reconstruite à chaque `renderScroll()` — voir `renderCategoryNav`.
    let sectionCategories = [];
    let sectionIdCounter = 0;

    function section(scroll, build) {
      const box = el("div", { class: "section" });
      build(box);
      // Le titre de la catégorie est le `<h2>` que `build` a posé dans la
      // section (toutes les sections nommées en ont un) — pas besoin de le
      // répéter en paramètre séparé, DRY : une seule source de vérité pour
      // le libellé affiché dans la section ET dans la colonne de
      // catégories. Les rares sections sans `<h2>` (ex. curseur
      // "Écartement des icônes", isolé) n'apparaissent simplement pas dans
      // la colonne — un simple confort de navigation, pas une exigence
      // d'exhaustivité.
      const heading = box.querySelector("h2");
      if (heading) {
        box.id = `section-${sectionIdCounter++}`;
        const groupe = groupeCategorie(heading.textContent);
        box.dataset.groupe = groupe;
        sectionCategories.push({ id: box.id, label: heading.textContent, groupe });
      }
      scroll.appendChild(box);
    }

    // Colonne de catégories — DEMANDE EXPLICITE ("ajoute une colonne avec
    // les catégories de réglages dans interface et dans écran 1") : un
    // simple sommaire cliquable, `scrollIntoView` jusqu'à la section visée
    // dans `.scroll` plutôt qu'une vraie sous-page (tout reste dans le même
    // DOM, pas de perte de focus/état des curseurs).
    // L'ICÔNE d'une catégorie d'après son libellé — façon panneau de
    // configuration GNOME/Unity (DEMANDE EXPLICITE 2026-11-06). Règles testées
    // DANS L'ORDRE, la PREMIÈRE qui correspond gagne : le libellé est mis sans
    // accents ni casse, donc l'ordre place le sens le plus spécifique en premier
    // (« Horloges du monde » → globe avant que « horloge » ne donne une pendule ;
    // « Écartement des icônes » → règle → avant que « icône » ne donne une grille).
    // Toute catégorie sans correspondance retombe sur l'engrenage. Les noms
    // renvoyés sont des classes `ico-*` livrées par `tools/icones_phosphor.py`.
    const REGLES_ICONES = [
      [/sauvegarde|configuration/, "archive"],
      [/meteo/, "cloud-sun"],
      [/monde|fuseau/, "globe"],
      [/horloge|heure/, "clock"],
      [/calendrier/, "calendar-blank"],
      [/\bson|sonore|audio/, "speaker-high"],
      [/rappel|notification/, "bell"],
      [/verr\. |num et| maj\b|clavier|touche/, "keyboard"],
      [/verrou/, "lock"],
      [/reseau|debit|wifi/, "wifi-high"],
      [/molette|defilement|souris/, "mouse"],
      [/infobulle|\binfo\b/, "info"],
      [/sphere/, "sphere"],
      [/terminal|terminaux/, "terminal-window"],
      [/empilement/, "stack-simple"],
      [/couleur|teinte|mise en avant/, "palette"],
      [/survol|animation/, "cursor-click"],
      [/capture/, "eye"],
      [/visibilite|masquage/, "eye"],
      [/bureaux virtuels|pastille/, "monitor"],
      [/ecartement|taille|epaisseur|espacement/, "ruler"],
      [/apercu|indicateur|ouverture|fondu|fenetre/, "app-window"],
      [/ecran|moniteur/, "monitor"],
      [/fonctionnalite/, "sliders-horizontal"],
      [/zone/, "squares-four"],
      [/epingl/, "push-pin"],
      [/dossier/, "folder"],
      [/theme/, "palette"],
      [/texture/, "paint-brush"],
      [/\bstyle\b/, "swatches"],
      [/icone/, "squares-four"],
      [/menu/, "list"],
      [/transparence|flou|opacite/, "drop"],
      [/ombre|coins|arrondis/, "square"],
      [/editeur|image|logo/, "image"],
    ];
    function iconeCategorie(label) {
      const t = label.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
      for (const [re, ic] of REGLES_ICONES) if (re.test(t)) return ic;
      return "gear";
    }

    function renderCategoryNav() {
      const nav = document.getElementById("category-nav");
      nav.replaceChildren();
      for (const { id, label } of sectionCategories) {
        nav.appendChild(
          el("button", {
            "data-section": id,
            onclick: () => document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" }),
          }, [el("span", { class: `ico ico-${iconeCategorie(label)}` }), el("span", {}, [label])]),
        );
      }
      nav.appendChild(el("div", { class: "category-vide", id: "category-vide" }, ["Aucun réglage trouvé."]));
      filtrerLesReglages();
      marquerLaCategorieCourante();
    }

    // L'entrée de la colonne qui porte la pastille d'accent : la première
    // section visible dont le bas dépasse le haut de `.scroll`. Recalculée au
    // défilement — un clic dans la colonne fait défiler, donc la suit aussi.
    function marquerLaCategorieCourante() {
      const scroll = document.getElementById("scroll");
      const haut = scroll.getBoundingClientRect().top + 8;
      let courante = null;
      for (const box of scroll.querySelectorAll(":scope > .section[id]")) {
        if (box.style.display === "none") continue;
        if (box.getBoundingClientRect().bottom > haut) { courante = box.id; break; }
      }
      for (const bouton of document.querySelectorAll("#category-nav button")) {
        bouton.classList.toggle("current", bouton.dataset.section === courante);
      }
    }
    document.getElementById("scroll").addEventListener("scroll", marquerLaCategorieCourante, { passive: true });

    // ⭐ LA RECHERCHE DE LA COLONNE — DEMANDE EXPLICITE (2026-10-15) : « ajoute un
    // champ de recherche en tête de la colonne », après des réglages d'opacité et
    // de flou introuvables parmi la soixantaine de catégories. Elle lit TOUT le
    // texte d'une section (titre, curseurs, cases, aides), pas son seul titre :
    // « blur » trouve « Intensité du flou ». Sans accents ni casse ; chaque mot doit y être (ou un synonyme).
    // Les sections écartées sont MASQUÉES dans la page aussi, pas seulement dans
    // la colonne. Le champ vit HORS de `#category-nav`, que chaque `rebuild()`
    // vide : il garde sa saisie et son focus quand l'état change.
    const SYNONYMES = [["opacite", "transparence", "transparent", "alpha"], ["flou", "blur", "floute"], ["couleur", "teinte"], ["taille", "echelle"]];
    // LES FUSEAUX DES HORLOGES DU MONDE — la liste d'`Intl`, calculée une fois.
    let fuseauxConnus = null;
    function tousLesFuseaux() {
      if (!fuseauxConnus) {
        try { fuseauxConnus = Intl.supportedValuesOf("timeZone"); } catch (e) { fuseauxConnus = []; }
      }
      return fuseauxConnus;
    }
    // « heure du Japon », « heure de l'Est nord-américain » : ce que Chromium
    // sait dire d'un fuseau en français. C'est ce qui fait trouver « Japon ».
    function nomDuFuseau(zone) {
      try {
        const part = new Intl.DateTimeFormat("fr-FR", { timeZone: zone, timeZoneName: "longGeneric" })
