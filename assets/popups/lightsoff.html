<!doctype html>
<!--
  win32::cef_lightsoff — un fork web du jeu GNOME « Lights Off », en applet de la
  zone Intégrés.

  DEMANDE (2026-11-08) : « une applet dans Intégrés pour le jeu Lights Off de
  gnome ».

  LA RÈGLE : une grille 5×5 de lumières ; cliquer une case bascule CELLE-CI et ses
  quatre voisines (haut, bas, gauche, droite). Le but : TOUT éteindre. Comme dans
  GNOME, le niveau N est fabriqué en partant d'une grille éteinte et en y jouant
  des coups tirés d'un générateur pseudo-aléatoire semé par N — donc le niveau N
  est toujours le même, et toujours soluble.

  ⚠️ **LA FACTURE DE `quadrapassel.html`** — bande de titre qui DÉPLACE la
  fenêtre, punaise, croix, et les MÊMES trois verbes de fenêtre (`deplacer`,
  `epingler`, `fermer`). Le jeu vit ENTIÈREMENT dans cette page ; le niveau
  atteint tient dans `localStorage`.

  ⛔ **AUCUN `menu.js`** : c'est une FENÊTRE, sa taille ne se négocie pas.

  ⚠️ **AUCUN `background` sur `<html>`/`<body>`** : le fond est le BUREAU FLOUTÉ que
  Rust dessine SOUS la page ; les couleurs du thème viennent des variables CSS
  `--popup-*` posées par la composition.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    font-family: var(--nd-police);
    color: rgba(var(--popup-fg-rgb, 255, 255, 255), min(1, var(--popup-alpha, 1)));
    user-select: none;
  }
  #barre {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-bottom: 1px solid rgba(var(--popup-fg-rgb, 255, 255, 255), calc(.12 * var(--popup-fond-alpha, 1)));
    cursor: default;
  }
  #titre { flex: 1; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bouton {
    all: unset;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--nd-rayon-petit);
    font-family: "Segoe UI Symbol", "Segoe UI", sans-serif;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    opacity: calc(.85 * max(1, var(--popup-alpha, 1)));
  }
  .bouton:hover { background: rgba(var(--popup-fg-rgb, 255, 255, 255), calc(0.22 * var(--popup-fond-alpha, 1))); opacity: 1; }
  .bouton[aria-pressed="true"] {
    background: rgba(var(--popup-accent-rgb, 255, 255, 255), calc(0.45 * var(--popup-fond-alpha, 1)));
    opacity: 1;
  }
  .bouton:disabled { opacity: .35; cursor: default; background: none; }
  /* La ligne du niveau : ‹ Niveau N › et le compte de coups. */
  #tete {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 12px 0;
  }
  #niveau { min-width: 96px; text-align: center; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #scene {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    box-sizing: border-box;
  }
  /* Le plateau : 5×5 cases carrées, à la plus grande taille qui tient. */
  #plateau {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: 10px;
    box-sizing: border-box;
    border-radius: var(--nd-rayon-grand, 12px);
    background: rgba(var(--popup-fg-rgb, 255, 255, 255), calc(0.10 * var(--popup-fond-alpha, 1)));
  }
  .case {
    all: unset;
    aspect-ratio: 1;
    border-radius: 8px;
    cursor: pointer;
    background: rgba(var(--popup-fg-rgb, 255, 255, 255), calc(0.20 * var(--popup-fond-alpha, 1)));
    box-shadow: inset 0 0 0 1px rgba(var(--popup-fg-rgb, 255, 255, 255), calc(0.22 * var(--popup-fond-alpha, 1)));
    transition: background-color .15s ease, box-shadow .15s ease;
  }
  .case:hover { box-shadow: inset 0 0 0 2px rgba(var(--popup-fg-rgb, 255, 255, 255), calc(0.35 * var(--popup-fond-alpha, 1))); }
  /* Allumée : une lampe chaude, avec son halo. */
  .case.allumee {
    background: radial-gradient(circle at 50% 42%, #fffbe6 0%, #ffe680 38%, #f5b82e 100%);
    box-shadow: 0 0 14px 2px rgba(255, 200, 60, .55), inset 0 0 0 1px rgba(255, 255, 255, .5);
  }
  .case.allumee:hover { box-shadow: 0 0 18px 4px rgba(255, 200, 60, .7), inset 0 0 0 2px rgba(255, 255, 255, .8); }
  .case:focus-visible { outline: 2px solid rgba(var(--popup-accent-rgb, 255, 255, 255), .9); outline-offset: 2px; }
  #gagne {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(var(--popup-fond-rgb, 20, 20, 20), calc(0.72 * var(--popup-fond-alpha, 1)));
    z-index: 2;
  }
  #gagne.vu { display: flex; }
  #gagne .mot { font-size: 24px; font-weight: 800; }
  #gagne .detail { font-size: 13px; opacity: .8; }
  #gagne button, #recommencer {
    all: unset;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    border-radius: var(--nd-rayon-controle);
    cursor: pointer;
    background: rgba(var(--popup-accent-rgb, 255, 255, 255), calc(0.50 * var(--popup-fond-alpha, 1)));
  }
  #gagne button:hover, #recommencer:hover { background: rgba(var(--popup-accent-rgb, 255, 255, 255), calc(0.70 * var(--popup-fond-alpha, 1))); }
  #pied {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 14px 12px;
  }
  #coups { font-size: 12px; opacity: .75; font-variant-numeric: tabular-nums; }
  #recommencer { padding: 6px 12px; font-size: 12px; font-weight: 600; background: rgba(var(--popup-fg-rgb, 255, 255, 255), calc(0.14 * var(--popup-fond-alpha, 1))); }
  #recommencer:hover { background: rgba(var(--popup-fg-rgb, 255, 255, 255), calc(0.24 * var(--popup-fond-alpha, 1))); }
  #aide { flex: 0 0 auto; text-align: center; font-size: 11px; opacity: .6; padding: 0 12px 10px; }
</style>
</head>
<body>
  <div id="barre">
    <span id="titre">Lights Off</span>
    <button id="epingle" class="bouton" title="Rester au premier plan"><span class="ico ico-push-pin"></span></button>
    <button id="fermer" class="bouton" title="Fermer"><span class="ico ico-x"></span></button>
  </div>
  <div id="tete">
    <button id="precedent" class="bouton" title="Niveau précédent">‹</button>
    <span id="niveau">Niveau 1</span>
    <button id="suivant" class="bouton" title="Niveau suivant">›</button>
  </div>
  <div id="scene">
    <div id="plateau"></div>
    <div id="gagne">
      <span class="mot">Lumières éteintes !</span>
      <span class="detail" id="gagne-detail"></span>
      <button id="continuer">Niveau suivant</button>
    </div>
  </div>
  <div id="pied">
    <span id="coups">0 coup</span>
    <button id="recommencer">Recommencer</button>
  </div>
  <div id="aide">Un clic bascule la lumière et ses quatre voisines — éteignez tout.</div>
<script>
  "use strict";
  const TAILLE = 5;
  const CLE_NIVEAU = "neuradesk-lightsoff-niveau";
  const CLE_MAX = "neuradesk-lightsoff-niveau-max";

  function go(action) { location.href = "neuradesk://lightsoff/" + action; }
  document.getElementById("barre").addEventListener("mousedown", function (e) {
    if (e.target.closest("button")) return;
    go("deplacer");
  });
  document.getElementById("epingle").addEventListener("click", function () { go("epingler"); });
  document.getElementById("fermer").addEventListener("click", function () { go("fermer"); });

  // Générateur pseudo-aléatoire SEMÉ (mulberry32) : le niveau N est toujours le même.
  function generateur(graine) {
    let a = graine >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let grille, niveau, niveauMax, coups, gagne;
  const plateau = document.getElementById("plateau");
  const cases = [];

  // Bascule (r, c) et ses quatre voisines, sur la grille donnée.
  function basculer(g, r, c) {
    for (const [dr, dc] of [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1]]) {
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < TAILLE && cc >= 0 && cc < TAILLE) g[rr][cc] = !g[rr][cc];
    }
  }

  // Un niveau : des coups au hasard depuis une grille éteinte (donc soluble). Plus
  // le niveau est haut, plus il y a de coups — jusqu'à 18. Jamais une grille vide.
  function fabriquer(n) {
    const hasard = generateur(n * 7919 + 17);
    const nombre = Math.min(18, 3 + Math.floor(n / 2));
    const g = Array.from({ length: TAILLE }, () => Array(TAILLE).fill(false));
    for (let i = 0; i < nombre; i++) {
      basculer(g, Math.floor(hasard() * TAILLE), Math.floor(hasard() * TAILLE));
    }
    if (g.every((ligne) => ligne.every((x) => !x))) basculer(g, 2, 2);
    return g;
  }

  function construire() {
    for (let r = 0; r < TAILLE; r++) {
      for (let c = 0; c < TAILLE; c++) {
        const bouton = document.createElement("button");
        bouton.className = "case";
        bouton.addEventListener("click", function () { jouer(r, c); });
        plateau.appendChild(bouton);
        cases.push(bouton);
      }
    }
  }

  function afficher() {
    for (let r = 0; r < TAILLE; r++) {
      for (let c = 0; c < TAILLE; c++) cases[r * TAILLE + c].classList.toggle("allumee", grille[r][c]);
    }
    document.getElementById("niveau").textContent = "Niveau " + niveau;
    document.getElementById("coups").textContent = coups + (coups > 1 ? " coups" : " coup");
    document.getElementById("precedent").disabled = niveau <= 1;
    document.getElementById("suivant").disabled = niveau >= niveauMax;
  }

  function memoriser() {
    try {
      localStorage.setItem(CLE_NIVEAU, String(niveau));
      localStorage.setItem(CLE_MAX, String(niveauMax));
    } catch (e) {}
  }

  function charger(n) {
    niveau = Math.max(1, n);
    grille = fabriquer(niveau);
    coups = 0;
    gagne = false;
    document.getElementById("gagne").classList.remove("vu");
    memoriser();
    afficher();
  }

  function jouer(r, c) {
    if (gagne) return;
    basculer(grille, r, c);
    coups++;
    afficher();
    if (grille.every((ligne) => ligne.every((x) => !x))) {
      gagne = true;
      niveauMax = Math.max(niveauMax, niveau + 1);
      memoriser();
      document.getElementById("gagne-detail").textContent =
        "Niveau " + niveau + " résolu en " + coups + (coups > 1 ? " coups" : " coup");
      document.getElementById("gagne").classList.add("vu");
      afficher();
    }
  }

  // Le plateau prend la plus grande taille carrée qui tient dans la scène.
  function ajuster() {
    const scene = document.getElementById("scene");
    const cote = Math.max(120, Math.min(scene.clientWidth, scene.clientHeight) - 24);
    plateau.style.width = cote + "px";
    plateau.style.height = cote + "px";
  }

  document.getElementById("precedent").addEventListener("click", function () { if (niveau > 1) charger(niveau - 1); });
  document.getElementById("suivant").addEventListener("click", function () { if (niveau < niveauMax) charger(niveau + 1); });
  document.getElementById("continuer").addEventListener("click", function () { charger(niveau + 1); });
  document.getElementById("recommencer").addEventListener("click", function () { charger(niveau); });

  // Clavier : flèches pour se déplacer entre les cases, Entrée/Espace pour jouer
  // (natif des boutons), Page préc./suiv. pour changer de niveau.
  window.addEventListener("keydown", function (e) {
    const i = cases.indexOf(document.activeElement);
    const pas = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -TAILLE, ArrowDown: TAILLE }[e.key];
    if (pas !== undefined) {
      const suivant = i < 0 ? 12 : Math.min(cases.length - 1, Math.max(0, i + pas));
      cases[suivant].focus();
      e.preventDefault();
    } else if (e.key === "PageUp" && niveau > 1) {
      charger(niveau - 1);
    } else if (e.key === "PageDown" && niveau < niveauMax) {
      charger(niveau + 1);
    }
  });
  window.addEventListener("resize", ajuster);

  // L'état de fenêtre que Rust pousse : seulement la punaise.
  window.setState = function (state) {
    const epingle = document.getElementById("epingle");
    epingle.setAttribute("aria-pressed", String(!!state.epingle));
    epingle.innerHTML = state.epingle ? '<span class="ico ico-push-pin-fill"></span>' : '<span class="ico ico-push-pin"></span>';
    epingle.title = state.epingle ? "Ne plus rester au premier plan" : "Rester au premier plan";
  };

  construire();
  try {
    niveauMax = parseInt(localStorage.getItem(CLE_MAX), 10) || 1;
    niveau = parseInt(localStorage.getItem(CLE_NIVEAU), 10) || 1;
  } catch (e) { niveauMax = 1; niveau = 1; }
  niveau = Math.min(niveau, niveauMax);
  ajuster();
  charger(niveau);
</script>
</body>
</html>
